<style>

  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;

<body>
<div id="app">
  <div id="head">
    <h1>M30 · 东方意境</h1>
    <p>月夜江景，远山三层淡雾，右侧水榭亮着一盏灯，左侧竖排诗句一字一字浮出，一叶小舟从江心划过。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="东方意境 风格动画示例"></canvas></div>

    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">

    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 月夜江景，远山三层淡雾，右侧水榭亮着一盏灯，左侧竖排诗句一字一字浮出，一叶小舟从江心划过。
// M30 东方意境 · DeepSeek Harness 生成示例
const M30_SKY0 = '#0a1220', M30_SKY1 = '#1a2a30', M30_INK = '#08111a';
const M30_MOON = '#f4ecd2', M30_MIST = 'rgba(196,214,208,';
const M30_RIPPLE = (() => {
  const r = rng(3030);
  return Array.from({ length: 54 }, () => ({ x: r() * 760, y: 256 + r() * 100, w: 8 + r() * 34, a: 0.03 + r() * 0.07, sp: 0.3 + r() * 0.8 }));
})();
const M30_MOONS = (() => {
  const r = rng(303);
  return Array.from({ length: 22 }, () => ({ dx: (r() - 0.5), y: 258 + r() * 92, w: 6 + r() * 22, a: 0.06 + r() * 0.12, ph: r() * 6.28 }));
})();

function m30seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function m30e(t) { return 1 - Math.pow(1 - t, 3); }

function m30Sky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, 258);
  g.addColorStop(0, M30_SKY0);
  g.addColorStop(0.62, '#12202a');
  g.addColorStop(1, M30_SKY1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 262);
  // 月
  const mp = m30e(m30seg(t, 0, 1.1));
  const mx = 150, my = 92 - mp * 4;
  const halo = ctx.createRadialGradient(mx, my, 6, mx, my, 96);
  halo.addColorStop(0, `rgba(244,236,210,${0.34 * mp})`);
  halo.addColorStop(0.35, `rgba(214,224,214,${0.12 * mp})`);
  halo.addColorStop(1, 'rgba(214,224,214,0)');
  ctx.fillStyle = halo; ctx.fillRect(mx - 100, my - 100, 200, 200);
  ctx.save();
  ctx.globalAlpha = mp;
  ctx.fillStyle = M30_MOON;
  ctx.beginPath(); ctx.arc(mx, my, 25, 0, Math.PI * 2); ctx.fill();
  // 月面淡斑
  ctx.fillStyle = 'rgba(206,204,182,.30)';
  ctx.beginPath(); ctx.arc(mx - 7, my - 5, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 8, my + 7, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 星：稀疏几粒
  ctx.save();
  ctx.fillStyle = 'rgba(226,234,228,.5)';
  for (const s of [[300, 44, 1.1], [360, 70, 0.8], [520, 36, 1.2], [586, 84, 0.9], [252, 96, 0.7]]) {
    ctx.beginPath(); ctx.arc(s[0], s[1] + Math.sin(t * 1.2 + s[0]) * 0.8, s[2], 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function m30Mountains(t) {
  const layer = (baseY, amp, freq, color, ph) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-30, 262);
    for (let x = -30; x <= 680; x += 14) {
      const y = baseY + Math.sin((x + ph) / freq) * amp + Math.sin((x + ph) / (freq * 0.31)) * amp * 0.45;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(680, 262); ctx.closePath(); ctx.fill();
  };
  layer(196, 13, 96, 'rgba(28,48,54,.75)', 10);
  layer(214, 10, 66, 'rgba(18,34,40,.85)', 120);
  layer(236, 7, 48, 'rgba(10,22,28,.95)', 240);
  // 山间雾带
  ctx.save();
  for (let i = 0; i < 3; i++) {
    const y = 202 + i * 16;
    const mx = ((t * (6 + i * 4) + i * 200) % (W + 300)) - 150;
    const g = ctx.createLinearGradient(mx - 160, 0, mx + 160, 0);
    g.addColorStop(0, M30_MIST + '0)');
    g.addColorStop(0.5, M30_MIST + (0.10 - i * 0.02) + ')');
    g.addColorStop(1, M30_MIST + '0)');
    ctx.fillStyle = g;
    ctx.fillRect(mx - 160, y + Math.sin(t * 0.5 + i) * 3, 320, 10 + i * 3);
  }
  ctx.restore();
}

function m30Water(t) {
  const horizon = 258;
  const g = ctx.createLinearGradient(0, horizon, 0, H);
  g.addColorStop(0, '#16262c');
  g.addColorStop(0.45, '#0d1a20');
  g.addColorStop(1, '#060e14');
  ctx.fillStyle = g; ctx.fillRect(0, horizon, W, H - horizon);
  ctx.fillStyle = 'rgba(206,220,214,.30)';
  ctx.fillRect(0, horizon, W, 1);
  // 月影：先铺一层柔光柱，再叠碎光
  const mg = ctx.createLinearGradient(150 - 54, 0, 150 + 54, 0);
  mg.addColorStop(0, 'rgba(244,236,210,0)');
  mg.addColorStop(0.5, 'rgba(244,236,210,.11)');
  mg.addColorStop(1, 'rgba(244,236,210,0)');
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.moveTo(126, 258); ctx.lineTo(174, 258); ctx.lineTo(214, 360); ctx.lineTo(86, 360);
  ctx.closePath(); ctx.fill();
  for (const m of M30_MOONS) {
    const y = m.y;
    const p = (y - 258) / 100;
    const x = 150 + m.dx * (18 + p * 78) + Math.sin(t * 1.4 + m.ph) * (2 + p * 7);
    ctx.fillStyle = `rgba(244,236,210,${(m.a * 1.9) * (0.55 + 0.45 * Math.sin(t * 2 + m.ph)) * (1 - p * 0.45)})`;
    ctx.fillRect(x - m.w / 2, y, m.w, 1.5);
  }
  // 江面细波
  for (const r of M30_RIPPLE) {
    const x = ((r.x + t * 12 * r.sp) % (W + 100)) - 50;
    ctx.strokeStyle = `rgba(190,214,208,${r.a})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, r.y);
    ctx.quadraticCurveTo(x + r.w / 2, r.y - 1.5, x + r.w, r.y);
    ctx.stroke();
  }
}

// 水榭：两层翘檐，暖灯一盏
function m30Pavilion(t) {
  const baseY = 276;
  ctx.save();
  // 台基
  ctx.fillStyle = M30_INK;
  ctx.fillRect(428, baseY, 176, 12);
  // 下层柱与栏杆
  ctx.fillStyle = 'rgba(10,20,26,.96)';
  ctx.fillRect(448, 232, 136, 46);
  ctx.strokeStyle = 'rgba(150,176,168,.20)';
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 5; i++) {
    const x = 452 + i * 32;
    ctx.beginPath(); ctx.moveTo(x, 236); ctx.lineTo(x, 274); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(448, 258); ctx.lineTo(584, 258); ctx.stroke();
  // 窗格：暖光透出来
  ctx.save();
  const wg = ctx.createRadialGradient(516, 246, 2, 516, 246, 60);
  wg.addColorStop(0, 'rgba(255,198,132,.35)');
  wg.addColorStop(1, 'rgba(255,198,132,0)');
  ctx.fillStyle = wg;
  ctx.beginPath(); ctx.rect(486, 232, 60, 46); ctx.fill();
  ctx.strokeStyle = 'rgba(255,206,150,.5)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(496, 234); ctx.lineTo(496, 274); ctx.moveTo(536, 234); ctx.lineTo(536, 274); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(484, 244); ctx.lineTo(548, 244); ctx.moveTo(484, 264); ctx.lineTo(548, 264); ctx.stroke();
  ctx.restore();
  // 栏杆柱
  ctx.strokeStyle = 'rgba(150,176,168,.28)';
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 8; i++) {
    const x = 454 + i * 16;
    ctx.beginPath(); ctx.moveTo(x, 258); ctx.lineTo(x, 268); ctx.stroke();
  }
  // 下层翘檐
  ctx.fillStyle = '#0b1720';
  ctx.beginPath();
  ctx.moveTo(424, 238);
  ctx.quadraticCurveTo(452, 234, 478, 224);
  ctx.quadraticCurveTo(516, 210, 554, 224);
  ctx.quadraticCurveTo(580, 234, 608, 238);
  ctx.lineTo(600, 242);
  ctx.quadraticCurveTo(516, 226, 432, 242);
  ctx.closePath(); ctx.fill();
  // 檐口一道月光亮边
  ctx.strokeStyle = 'rgba(206,220,214,.30)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(426, 237);
  ctx.quadraticCurveTo(452, 233, 478, 223);
  ctx.quadraticCurveTo(516, 210, 554, 223);
  ctx.quadraticCurveTo(580, 233, 606, 237);
  ctx.stroke();
  // 上层柱身
  ctx.fillStyle = 'rgba(10,20,26,.98)';
  ctx.fillRect(478, 204, 76, 30);
  // 上层翘檐
  ctx.fillStyle = '#08131b';
  ctx.beginPath();
  ctx.moveTo(452, 210);
  ctx.quadraticCurveTo(482, 206, 500, 196);
  ctx.quadraticCurveTo(516, 188, 532, 196);
  ctx.quadraticCurveTo(550, 206, 580, 210);
  ctx.lineTo(574, 214);
  ctx.quadraticCurveTo(516, 198, 458, 214);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(206,220,214,.26)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(454, 209);
  ctx.quadraticCurveTo(482, 205, 500, 195);
  ctx.quadraticCurveTo(516, 188, 532, 195);
  ctx.quadraticCurveTo(550, 205, 578, 209);
  ctx.stroke();
  // 宝顶
  ctx.strokeStyle = 'rgba(150,176,168,.45)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(516, 190); ctx.lineTo(516, 178); ctx.stroke();
  ctx.beginPath(); ctx.arc(516, 176, 3, 0, Math.PI * 2); ctx.stroke();
  // 暖灯
  const flick = 0.85 + Math.sin(t * 5.4) * 0.08 + Math.sin(t * 2.1) * 0.05;
  const lg = ctx.createRadialGradient(516, 246, 1, 516, 246, 46);
  lg.addColorStop(0, `rgba(255,204,138,${0.55 * flick})`);
  lg.addColorStop(0.35, `rgba(255,180,110,${0.16 * flick})`);
  lg.addColorStop(1, 'rgba(255,170,100,0)');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.arc(516, 246, 46, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgba(255,214,152,${0.9 * flick})`;
  ctx.beginPath(); ctx.ellipse(516, 246, 6, 8, 0, 0, Math.PI * 2); ctx.fill();
  // 灯在江面的倒影
  ctx.fillStyle = `rgba(255,196,132,${0.18 * flick})`;
  for (let i = 0; i < 8; i++) {
    const y = 282 + i * 8;
    const w = 14 + i * 5;
    ctx.fillRect(516 - w / 2 + Math.sin(t * 1.6 + i) * 3, y, w, 1.4);
  }
  ctx.restore();
}

function m30Boat(t) {
  const p = m30seg(t, 2.5, 4.4);
  if (p <= 0) return;
  const bx = lerp(586, 128, m30e(p));
  const by = 306 + Math.sin(t * 1.2) * 1.6;
  ctx.save();
  ctx.globalAlpha = 0.95;
  // 船身
  ctx.fillStyle = '#070f14';
  ctx.beginPath();
  ctx.moveTo(bx - 26, by);
  ctx.quadraticCurveTo(bx, by + 9, bx + 26, by);
  ctx.quadraticCurveTo(bx + 10, by + 2, bx - 26, by);
  ctx.closePath(); ctx.fill();
  // 篷
  ctx.beginPath();
  ctx.moveTo(bx - 12, by);
  ctx.quadraticCurveTo(bx, by - 16, bx + 12, by);
  ctx.closePath(); ctx.fill();
  // 船头灯
  ctx.fillStyle = 'rgba(255,206,146,.95)';
  ctx.beginPath(); ctx.arc(bx + 22, by - 3, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,206,146,.35)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(bx + 22, by - 1); ctx.lineTo(bx + 22, by + 6); ctx.stroke();
  // 船尾涟漪
  ctx.strokeStyle = 'rgba(190,214,208,.16)';
  for (let i = 1; i <= 3; i++) {
    ctx.beginPath();
    ctx.ellipse(bx - 26 - i * 12, by + 2, 8 + i * 5, 1.6, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function m30Poem(t) {
  const chars = ['江', '天', '一', '色', '无', '纤', '尘'];
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `300 23px ${FONT}`;
  chars.forEach((ch, i) => {
    const p = m30e(m30seg(t, 1.15 + i * 0.12, 1.6 + i * 0.12));
    if (p <= 0.01) return;
    ctx.save();
    ctx.globalAlpha = p * 0.9;
    ctx.fillStyle = '#dfe6dd';
    ctx.translate(74, 92 + i * 26 + (1 - p) * 8);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  });
  // 左下小注
  const cp = m30e(m30seg(t, 2.4, 2.9));
  if (cp > 0) {
    ctx.save();
    ctx.globalAlpha = cp * 0.55;
    ctx.fillStyle = '#c8d4cc';
    ctx.font = `400 13px ${FONT}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('夜泊  ·  江上', 96, 342);
    ctx.restore();
  }
  ctx.restore();
}

function drawScene(t) {
  const pan = m30e(m30seg(t, 0, 6)) * 8;
  ctx.save();
  ctx.translate(-pan, 0);
  m30Sky(t);
  m30Mountains(t);
  m30Water(t);
  m30Pavilion(t);
  m30Boat(t);
  // 前景礁石
  ctx.fillStyle = '#050b10';
  ctx.beginPath();
  ctx.moveTo(0, 360); ctx.lineTo(0, 320);
  ctx.quadraticCurveTo(34, 300, 62, 316);
  ctx.quadraticCurveTo(84, 330, 96, 360);
  ctx.closePath(); ctx.fill();
  // 江上薄雾（前景，压住水面）
  ctx.save();
  for (let i = 0; i < 4; i++) {
    const y = 268 + i * 20;
    const mx = ((t * (9 + i * 3) + i * 260) % (W + 380)) - 190;
    const g = ctx.createLinearGradient(mx - 190, 0, mx + 190, 0);
    g.addColorStop(0, M30_MIST + '0)');
    g.addColorStop(0.5, M30_MIST + (0.055 - i * 0.008) + ')');
    g.addColorStop(1, M30_MIST + '0)');
    ctx.fillStyle = g;
    ctx.fillRect(mx - 190, y, 380, 16 + i * 4);
  }
  ctx.restore();
  m30Poem(t);
  ctx.restore();

  const vg = ctx.createRadialGradient(320, 190, 180, 320, 190, 420);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(2,8,12,.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

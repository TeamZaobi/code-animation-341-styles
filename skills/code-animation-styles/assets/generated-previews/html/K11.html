<title>K11 手账笔记 · DeepSeek Harness 生成示例</title>

  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>K11 · 手账笔记</h1>
    <p>方格本手账页上，和纸胶带压住标题，便利贴掉下来，待办一项项被勾掉。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="手账笔记 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 方格本手账页上，和纸胶带压住标题，便利贴掉下来，待办一项项被勾掉。
// K11 手账笔记 · DeepSeek Harness 生成示例
const K11_PAPER = '#fdfcf6', K11_GRID = '#d8e6ef', K11_INK = '#4a4038', K11_PINK = '#e58fa4';
const K11_MINT = '#9ecfb4', K11_MUSTARD = '#f0c96a', K11_HIGH = '#ffe08a', K11_BLUE = '#7aa7c7';

const K11_ITEMS = ['先列出来', '挑一件做', '做完再说'];

function k11seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function k11ease(p) { return 1 - Math.pow(1 - p, 3); }
function k11back(p) { const c = 1.7, q = clamp(p, 0, 1) - 1; return 1 + (c + 1) * q * q * q + c * q * q; }
function k11rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}

// 和纸胶带：半透明 + 斜条纹
function k11tape(x, y, w, h, rot, color, t, seed) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.globalAlpha = 0.82;
  ctx.fillStyle = color;
  ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
  for (let i = -6; i < 8; i++) {
    ctx.beginPath();
    ctx.moveTo(-w / 2 + i * 14, -h / 2);
    ctx.lineTo(-w / 2 + i * 14 + h * 0.7, h / 2);
    ctx.stroke();
  }
  // 两端锯齿
  ctx.globalAlpha = 0.9; ctx.fillStyle = color;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
      const yy = -h / 2 + (i / 8) * h;
      const xx = side * (w / 2 + (i % 2 ? 4 : 0));
      if (i) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function k11Doodle(cx, cy, s, t) {
  // 便利贴上的小涂鸦：豆豆眼 + 腮红 + 呆毛
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s);
  const bob = Math.sin(t * 2.6) * 1.6;
  ctx.translate(0, bob);
  ctx.strokeStyle = 'rgba(90,70,55,.9)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  // 脸
  ctx.fillStyle = '#fff3d2';
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 20, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // 头发
  ctx.fillStyle = '#6b5342';
  ctx.beginPath();
  ctx.arc(0, -4, 22, Math.PI * 1.04, Math.PI * 1.96);
  ctx.quadraticCurveTo(4, -18, 0, -14);
  ctx.quadraticCurveTo(-4, -18, -8, -14);
  ctx.closePath(); ctx.fill();
  // 呆毛
  ctx.strokeStyle = '#6b5342'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(2, -22); ctx.quadraticCurveTo(6, -32, 14, -30); ctx.stroke();
  // 眼睛
  ctx.fillStyle = '#4a4038';
  const blink = ((t + 1.2) % 3.0) < 0.12 ? 0.2 : 1;
  ctx.beginPath(); ctx.ellipse(-7, 2, 2.3, 2.9 * blink, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7, 2, 2.3, 2.9 * blink, 0, 0, Math.PI * 2); ctx.fill();
  // 嘴
  ctx.strokeStyle = '#4a4038'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(0, 7, 5, 0.3, Math.PI - 0.3); ctx.stroke();
  // 腮红
  ctx.save(); ctx.globalAlpha = 0.55; ctx.fillStyle = '#ef9fae';
  ctx.beginPath(); ctx.arc(-13, 6, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(13, 6, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawScene(t) {
  // 纸 + 方格
  ctx.fillStyle = K11_PAPER; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.strokeStyle = K11_GRID; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 16) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 16) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  // 页边红线
  ctx.save();
  ctx.strokeStyle = 'rgba(229,143,164,.55)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(52, 0); ctx.lineTo(52, H); ctx.stroke();
  ctx.restore();
  // 纸张阴影
  const vg = ctx.createRadialGradient(320, 180, 160, 320, 180, 420);
  vg.addColorStop(0, 'rgba(255,255,255,0)');
  vg.addColorStop(1, 'rgba(150,130,100,.10)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // 左上角胶带 + 标题
  k11tape(560, 26, 120, 24, 0.05, K11_MINT, t, 1);
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = K11_INK; ctx.font = `800 30px ${FONT}`;
  ctx.fillText('今日份的小事', 44, 92);
  ctx.fillStyle = 'rgba(74,64,56,.6)'; ctx.font = `600 14px ${FONT}`;
  ctx.fillText('勾一勾，就少一件', 44, 114);
  ctx.restore();

  // 右侧便利贴：掉下来，之后轻轻晃
  const dropP = k11back(k11seg(t, -0.3, 0.75));
  const noteY = lerp(-90, 0, dropP);
  const noteRot = -0.055 + Math.sin(t * 1.5) * 0.018;
  const noteSway = Math.sin(t * 1.9) * 3.5;
  if (dropP > 0.02) {
    ctx.save();
    ctx.translate(486 + noteSway, 176 + noteY);
    ctx.rotate(noteRot);
    // 阴影
    ctx.save();
    ctx.globalAlpha = 0.14; ctx.fillStyle = '#5a4a38';
    ctx.translate(4, 7);
    k11rr(-92, -66, 184, 140, 4); ctx.fill();
    ctx.restore();
    // 便签
    ctx.fillStyle = '#fff0a8';
    k11rr(-92, -66, 184, 140, 4); ctx.fill();
    // 便签横线
    ctx.save();
    ctx.strokeStyle = 'rgba(120,100,60,.22)'; ctx.lineWidth = 1;
    for (let y = -42; y < 60; y += 18) { ctx.beginPath(); ctx.moveTo(-78, y); ctx.lineTo(76, y); ctx.stroke(); }
    ctx.restore();
    // 折角
    ctx.fillStyle = '#f7d96f';
    ctx.beginPath(); ctx.moveTo(92, 74); ctx.lineTo(92, 44); ctx.lineTo(62, 74); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(120,100,60,.35)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(92, 44); ctx.lineTo(62, 74); ctx.stroke();
    // 便签上的字
    ctx.fillStyle = '#5a4a38'; ctx.font = `700 20px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText('先做最简单的', 0, -38);
    // 小涂鸦
    k11Doodle(0, 8, 1.05, t);
    // 便签右下的小星星
    ctx.save();
    ctx.translate(64, 54); ctx.rotate(Math.sin(t * 1.4) * 0.15);
    ctx.fillStyle = K11_PINK;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rr = i % 2 ? 4 : 9;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  // 待办清单
  K11_ITEMS.forEach((label, i) => {
    const y = 176 + i * 48;
    const appear = k11seg(t, -0.4 + i * 0.12, 0.2 + i * 0.12);
    if (appear <= 0) return;
    ctx.save();
    ctx.globalAlpha = appear;
    const dx = (1 - k11ease(appear)) * -14;
    // 复选框
    ctx.strokeStyle = K11_INK; ctx.lineWidth = 2.2;
    k11rr(70 + dx, y - 14, 22, 22, 4); ctx.stroke();
    // 勾
    const tickP = k11seg(t, 1.55 + i * 0.62, 1.95 + i * 0.62);
    if (tickP > 0) {
      ctx.save();
      ctx.strokeStyle = K11_PINK; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
      ctx.beginPath();
      const a1 = k11ease(clamp(tickP * 1.7, 0, 1)), a2 = k11ease(clamp((tickP - 0.42) / 0.58, 0, 1));
      ctx.moveTo(74 + dx, y - 2);
      if (a1 > 0) ctx.lineTo(lerp(74 + dx, 80 + dx, a1), lerp(y - 2, y + 5, a1));
      if (a2 > 0) ctx.lineTo(lerp(80 + dx, 90 + dx, a2), lerp(y + 5, y - 9, a2));
      ctx.stroke(); ctx.restore();
    }
    // 文字
    ctx.fillStyle = K11_INK; ctx.font = `600 20px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(label, 108 + dx, y - 2);
    // 荧光笔
    const hlP = k11seg(t, 2.5 + i * 0.4, 2.95 + i * 0.4);
    if (hlP > 0) {
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = K11_HIGH;
      ctx.fillRect(104 + dx, y - 15, 132 * k11ease(hlP), 26);
      ctx.restore();
    }
    // 完成后划一道
    const lineP = k11seg(t, 1.95 + i * 0.62, 2.3 + i * 0.62);
    if (lineP > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(74,64,56,.5)'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(106 + dx, y - 2);
      ctx.lineTo(lerp(106 + dx, 220 + dx, k11ease(lineP)), y - 3);
      ctx.stroke(); ctx.restore();
    }
    ctx.restore();
  });

  // 便签下方的手写备注
  const remarkP = k11seg(t, 3.6, 4.3);
  if (remarkP > 0) {
    ctx.save();
    ctx.globalAlpha = remarkP;
    ctx.translate(452, 300); ctx.rotate(0.035);
    ctx.fillStyle = K11_BLUE; ctx.font = `600 16px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText('先动手，再完美', 0, 0);
    ctx.strokeStyle = 'rgba(122,167,199,.5)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-62, 8); ctx.lineTo(62, 9); ctx.stroke();
    ctx.restore();
  }

  // 左下角小胶带
  k11tape(120, 340, 96, 18, 0.03, K11_PINK, t, 2);

  // 风格标签
  ctx.save();
  ctx.globalAlpha = 0.5; ctx.fillStyle = K11_INK; ctx.font = `500 13px ${FONT}`; ctx.textAlign = 'left';
  ctx.fillText('K11 · 手账笔记 / planner', 44, 34);
  ctx.restore();

  // 页面右下：小回形针（避开署名条，放高一点）
  ctx.save();
  ctx.translate(596, 300);
  ctx.rotate(0.35 + Math.sin(t * 1.2) * 0.03);
  ctx.strokeStyle = K11_BLUE; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -14); ctx.lineTo(0, 8);
  ctx.arc(0, 8, 6, Math.PI, 0, true);
  ctx.stroke();
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

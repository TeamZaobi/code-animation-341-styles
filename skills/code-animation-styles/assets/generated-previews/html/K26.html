<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 卡通渲染 3D：硬边阴影与黑描边的圆头机器人站在平涂布景里，抬起手点亮灯泡，影子随光扫过。
const K26_BG = '#f1e7d2';
const K26_INK = '#1b1b22';
const K26_CREAM = '#f4e8d1';
const K26_CREAM_L = '#fff9ea';
const K26_SHADOW = '#b4aabf';
const K26_CORAL = '#ef7d5c';
const K26_CORAL_D = '#b04c3d';
const K26_TEAL = '#4f9a94';
const K26_TEAL_D = '#2c6763';
const K26_NAVY = '#25313f';
const K26_YELLOW = '#ffd45e';

function k26seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function k26ease(p) { return 1 - Math.pow(1 - p, 3); }
function k26pop(p) {
  p = clamp(p, 0, 1);
  const c1 = 1.6, c3 = c1 + 1;
  return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
}
function k26Outline(draw, lw) {
  ctx.save();
  ctx.lineWidth = lw || 4; ctx.strokeStyle = K26_INK; ctx.lineJoin = 'round';
  draw(); ctx.stroke();
  ctx.restore();
}
function k26Hatch(x, y, w, h, clipFn, alpha) {
  ctx.save();
  ctx.beginPath(); clipFn(); ctx.clip();
  ctx.strokeStyle = `rgba(27,27,34,${alpha || 0.10})`;
  ctx.lineWidth = 1.4;
  for (let i = -h; i < w + h; i += 9) {
    ctx.beginPath(); ctx.moveTo(x + i, y); ctx.lineTo(x + i + h, y + h); ctx.stroke();
  }
  ctx.restore();
}
// 硬边两块面：底色 + 圆形硬阴影 + 顶部亮带 + 黑描边
function k26Panel(x, y, w, h, r, base, shadow, light, sh, hatch) {
  const rr = () => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
  rr(); ctx.fillStyle = base; ctx.fill();
  ctx.save(); rr(); ctx.clip();
  ctx.fillStyle = light;
  ctx.fillRect(x, y, w, Math.max(4, h * 0.08));
  ctx.fillStyle = shadow;
  // 弯曲的硬边明暗交界线：亮部在左上
  ctx.beginPath();
  ctx.moveTo(x + w * 0.5 + sh, y);
  ctx.quadraticCurveTo(x + w * 0.94 + sh, y + h * 0.42, x + w * 0.6 + sh, y + h);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x + w, y);
  ctx.closePath();
  ctx.fill();
  // 底部的第二层暗面
  ctx.beginPath();
  ctx.moveTo(x, y + h * 0.86);
  ctx.quadraticCurveTo(x + w * 0.5, y + h * 1.02, x + w, y + h * 0.78);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.closePath();
  ctx.fill();
  if (hatch) k26Hatch(x, y, w, h, rr, 0.08);
  ctx.restore();
  k26Outline(rr, 4);
}
function k26Ball(cx, cy, r, base, shadow, light, sh) {
  const ball = () => { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); };
  ball(); ctx.fillStyle = base; ctx.fill();
  ctx.save(); ball(); ctx.clip();
  ctx.fillStyle = light;
  ctx.beginPath(); ctx.arc(cx - r * 0.34 + sh * 0.2, cy - r * 0.4, r * 0.72, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = shadow;
  ctx.beginPath(); ctx.arc(cx + r * 1.02 + sh, cy + r * 0.8 + sh * 0.5, r * 1.08, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  k26Outline(ball, 4);
}

function drawScene(t) {
  // 平涂布景
  ctx.fillStyle = K26_BG; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = K26_TEAL;
  ctx.beginPath(); ctx.arc(548, 84, 112, 0, Math.PI * 2); ctx.fill();
  k26Outline(() => { ctx.beginPath(); ctx.arc(548, 84, 112, 0, Math.PI * 2); }, 4);
  // 圆里的硬光块
  ctx.save();
  ctx.beginPath(); ctx.arc(548, 84, 112, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#6fb7ae';
  ctx.beginPath(); ctx.arc(548 - 26, 84 - 34, 86, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 地面
  ctx.fillStyle = '#e4d7be'; ctx.fillRect(0, 300, W, 60);
  ctx.strokeStyle = K26_INK; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 300); ctx.lineTo(W, 300); ctx.stroke();
  // 平涂斜纹
  ctx.save();
  ctx.strokeStyle = 'rgba(239,125,92,.35)'; ctx.lineWidth = 10;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath(); ctx.moveTo(-30 + i * 44, 360); ctx.lineTo(30 + i * 44, 300); ctx.stroke();
  }
  ctx.restore();

  const bob = Math.sin(t * 2.1) * 2;
  const sh = Math.sin(t * 0.8) * 12;
  const lift = k26ease(k26seg(t, 1.2, 2.1));
  const jumpP = k26seg(t, 4.0, 4.5);
  const jump = Math.sin(jumpP * Math.PI) * 8;

  // 硬边地面投影
  ctx.save();
  ctx.globalAlpha = 0.30;
  ctx.fillStyle = '#5a5060';
  ctx.beginPath(); ctx.ellipse(300, 324, 96, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(0, bob - jump);
  const turn = Math.sin(t * 0.9) * 6;

  // 腿与靴
  for (const bx of [258, 318]) {
    k26Panel(bx, 286, 46, 40, 12, K26_NAVY, '#141c26', '#3a4a5c', sh * 0.5, false);
  }

  // 身体
  k26Panel(210, 190, 180, 106, 24, K26_CORAL, K26_CORAL_D, '#ff9d7c', sh, true);
  // 胸前面板
  k26Panel(262, 208, 76, 60, 14, K26_CREAM, K26_SHADOW, K26_CREAM_L, sh * 0.7, false);
  // 按钮
  k26Ball(300, 238, 10, K26_TEAL, K26_TEAL_D, '#7cc0b6', sh * 0.5);

  // 左臂
  ctx.save();
  ctx.translate(214, 214); ctx.rotate(0.22 + Math.sin(t * 2.2) * 0.03);
  k26Panel(-13, 0, 26, 78, 13, K26_TEAL, K26_TEAL_D, '#7cc0b6', sh * 0.6, false);
  k26Ball(0, 84, 14, K26_CREAM, K26_SHADOW, K26_CREAM_L, sh * 0.4);
  ctx.restore();

  // 右臂：抬起
  const armAng = lerp(-0.2, -2.32, lift);
  ctx.save();
  ctx.translate(386, 214); ctx.rotate(armAng);
  k26Panel(-13, 0, 26, 78, 13, K26_TEAL, K26_TEAL_D, '#7cc0b6', sh * 0.6, false);
  k26Ball(0, 84, 14, K26_CREAM, K26_SHADOW, K26_CREAM_L, sh * 0.4);
  ctx.restore();

  // 头
  const hx = 226, hy = 62, hw = 150, hh = 128;
  k26Panel(hx, hy, hw, hh, 40, K26_CREAM, K26_SHADOW, K26_CREAM_L, sh, true);
  // 头盔顶部受光
  ctx.save();
  ctx.beginPath(); ctx.roundRect(hx, hy, hw, hh, 40); ctx.clip();
  ctx.fillStyle = 'rgba(255,249,234,.85)';
  ctx.beginPath(); ctx.ellipse(hx + hw * 0.42, hy + 30, hw * 0.34, 20, -0.1, 0, Math.PI * 2); ctx.fill();
  // 硬边高光
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.ellipse(hx + 38, hy + 46, 20, 11, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 面罩
  const vx = 246 + turn, vy = 108, vw = 110, vh = 54;
  k26Panel(vx, vy, vw, vh, 16, K26_NAVY, '#141c26', '#3a4a5c', sh * 0.8, false);
  // 眼睛
  ctx.save();
  ctx.fillStyle = '#8ef0ff';
  ctx.strokeStyle = K26_INK; ctx.lineWidth = 3;
  for (const ex of [vx + 30, vx + 74]) {
    ctx.beginPath(); ctx.arc(ex, vy + 27, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.arc(ex - 3.5, vy + 23, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8ef0ff';
  }
  ctx.restore();
  // 面罩高光
  ctx.save();
  ctx.beginPath(); ctx.roundRect(vx, vy, vw, vh, 16); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.beginPath(); ctx.moveTo(vx + 4, vy + 6); ctx.lineTo(vx + 44, vy + 6); ctx.lineTo(vx + 22, vy + 24); ctx.lineTo(vx + 4, vy + 24); ctx.closePath(); ctx.fill();
  ctx.restore();
  // 耳朵旋钮
  k26Ball(hx - 4, hy + 66, 12, K26_YELLOW, '#c99a2c', '#ffe7a1', sh * 0.5);
  k26Ball(hx + hw + 4, hy + 66, 12, K26_YELLOW, '#c99a2c', '#ffe7a1', sh * 0.5);
  // 天线
  const sway = Math.sin(t * 2.4) * 5;
  ctx.strokeStyle = K26_INK; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx + hw / 2, hy + 6);
  ctx.quadraticCurveTo(hx + hw / 2 + 8, hy - 22, hx + hw / 2 + 14 + sway, hy - 34); ctx.stroke();
  k26Ball(hx + hw / 2 + 14 + sway, hy - 38, 7, K26_YELLOW, '#c99a2c', '#ffe7a1', 0);

  ctx.restore();

  // 灯泡
  const bulbP = k26pop(k26seg(t, 1.9, 2.5));
  if (bulbP > 0.01) {
    const bx = 452, by = 122 + Math.sin(t * 2.3) * 3;
    // 平涂光晕
    ctx.save();
    ctx.globalAlpha = 0.12 * bulbP;
    ctx.fillStyle = K26_YELLOW;
    for (const r of [66, 52, 40]) {
      ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.save();
    ctx.translate(bx, by); ctx.scale(bulbP, bulbP);
    // 玻璃
    ctx.beginPath(); ctx.arc(0, -4, 18, Math.PI * 0.9, Math.PI * 2.1);
    ctx.lineTo(8, 16); ctx.lineTo(-8, 16); ctx.closePath();
    ctx.fillStyle = K26_YELLOW; ctx.fill();
    ctx.strokeStyle = K26_INK; ctx.lineWidth = 4; ctx.stroke();
    // 硬阴影
    ctx.save();
    ctx.beginPath(); ctx.arc(0, -4, 18, Math.PI * 0.9, Math.PI * 2.1); ctx.lineTo(8, 16); ctx.lineTo(-8, 16); ctx.closePath(); ctx.clip();
    ctx.fillStyle = '#d9a235';
    ctx.beginPath(); ctx.arc(13, 8, 17, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // 灯座
    ctx.fillStyle = K26_CREAM;
    ctx.beginPath(); ctx.roundRect(-8, 15, 16, 10, 3); ctx.fill();
    ctx.strokeStyle = K26_INK; ctx.lineWidth = 3.4; ctx.stroke();
    // 灯丝
    ctx.strokeStyle = K26_INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-5, 11); ctx.lineTo(-2, 2); ctx.lineTo(0, 8); ctx.lineTo(2, 2); ctx.lineTo(5, 11); ctx.stroke();
    ctx.restore();
  }

  // 方块：卡通渲染的小 3D 体
  const cp = k26ease(k26seg(t, 3.0, 3.7));
  if (cp > 0.01) {
    const cx = 500, cy = 236 + Math.sin(t * 1.8) * 5;
    const rot = Math.sin(t * 1.1) * 0.6;
    const sz = 36 * cp;
    ctx.save();
    ctx.translate(cx, cy);
    // 顶面
    ctx.beginPath();
    ctx.moveTo(-sz, -sz * 0.55);
    ctx.lineTo(-sz + rot * sz, -sz * 0.9);
    ctx.lineTo(sz + rot * sz, -sz * 0.9);
    ctx.lineTo(sz, -sz * 0.55);
    ctx.closePath();
    ctx.fillStyle = K26_TEAL; ctx.fill();
    ctx.strokeStyle = K26_INK; ctx.lineWidth = 3; ctx.stroke();
    // 正面
    ctx.fillStyle = K26_CREAM;
    ctx.beginPath(); ctx.rect(-sz, -sz * 0.55, sz * 2, sz * 1.3); ctx.fill(); ctx.stroke();
    // 侧面硬阴影
    ctx.save();
    ctx.beginPath(); ctx.rect(-sz, -sz * 0.55, sz * 2, sz * 1.3); ctx.clip();
    ctx.fillStyle = K26_SHADOW;
    ctx.beginPath(); ctx.rect(sz * 0.42 + rot * sz * 0.4, -sz, sz * 0.7, sz * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = K26_INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.rect(-sz, -sz * 0.55, sz * 2, sz * 1.3); ctx.stroke();
    // 侧面
    ctx.beginPath();
    ctx.moveTo(sz, -sz * 0.55);
    ctx.lineTo(sz + sz * 0.42, -sz * 0.55 + rot * sz * 0.3);
    ctx.lineTo(sz + sz * 0.42, sz * 0.75 + rot * sz * 0.3);
    ctx.lineTo(sz, sz * 0.75);
    ctx.closePath();
    ctx.fillStyle = K26_TEAL_D; ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // 星芒
  const sp = k26ease(k26seg(t, 2.3, 2.9));
  if (sp > 0) {
    const pts = [[410, 90], [492, 86], [416, 168], [520, 156]];
    pts.forEach((p, i) => {
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 2.2 + i));
      ctx.save();
      ctx.globalAlpha = sp * tw;
      ctx.translate(p[0], p[1]); ctx.rotate(t * 0.3 + i);
      ctx.fillStyle = K26_YELLOW;
      ctx.strokeStyle = K26_INK; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = (k * Math.PI) / 4;
        const rr = k % 2 ? 4 : 11;
        if (k === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    });
  }

  // 标题
  ctx.save();
  ctx.fillStyle = K26_INK;
  ctx.font = `800 36px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('硬边光', 36, 68);
  ctx.fillStyle = 'rgba(27,27,34,.62)';
  ctx.font = `600 13px ${FONT}`;
  ctx.fillText('卡通渲染 3D  ·  硬阴影 + 黑描边', 38, 92);
  ctx.restore();

  // 字幕
  const cp2 = k26ease(k26seg(t, 4.4, 5.0));
  if (cp2 > 0) {
    ctx.save();
    ctx.globalAlpha = cp2;
    ctx.fillStyle = K26_INK;
    ctx.font = `600 15px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('影子是硬的，轮廓是黑的。', 36, 332);
    ctx.restore();
  }

  // 收口
  const fp = k26seg(t, 5.75, 6.0);
  if (fp > 0) {
    ctx.save(); ctx.globalAlpha = fp * 0.4; ctx.fillStyle = K26_BG; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

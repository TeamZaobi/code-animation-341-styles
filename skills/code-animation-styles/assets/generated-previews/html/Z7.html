<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 皮影戏台：灯亮后羊皮屏幕上撑起武生，关节分明、镂空透光，翎子随动作甩动。
// Z7 皮影 · DeepSeek Harness 生成示例

const Z7_GOLD = '#e6b95f', Z7_WOOD = '#3a1e14', Z7_LEATHER = '#a63f1d';
const Z7_DARK = '#2a1009', Z7_GLOW = '#f8d79b';

const Z7_SCREEN = (() => {
  const c = document.createElement('canvas'); c.width = 360; c.height = 250;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(180, 120, 30, 180, 120, 240);
  grd.addColorStop(0, '#fbdfae');
  grd.addColorStop(0.6, '#efc283');
  grd.addColorStop(1, '#c98f52');
  g.fillStyle = grd; g.fillRect(0, 0, 360, 250);
  const r = rng(7707);
  for (let i = 0; i < 260; i++) {
    const x = r() * 360, y = r() * 250, len = 4 + r() * 22, a = r() * Math.PI;
    g.strokeStyle = `rgba(120,80,40,${0.02 + r() * 0.04})`;
    g.lineWidth = 0.6;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); g.stroke();
  }
  return c;
})();

const Z7_MOTES = (() => {
  const r = rng(9917);
  return Array.from({ length: 34 }, () => ({
    x: 146 + r() * 348, y: 58 + r() * 240, sp: 4 + r() * 9, ph: r() * 6.28, sz: 0.7 + r() * 1.6,
  }));
})();

function z7seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

function z7woodFrame() {
  // 台框
  ctx.fillStyle = '#2c150e';
  ctx.fillRect(126, 44, 388, 274);
  ctx.fillStyle = Z7_WOOD;
  ctx.fillRect(132, 50, 376, 262);
  ctx.strokeStyle = 'rgba(214,160,86,0.55)';
  ctx.lineWidth = 1.4;
  ctx.strokeRect(138, 56, 364, 250);
  // 回纹（上沿）
  ctx.strokeStyle = 'rgba(214,160,86,0.35)';
  ctx.lineWidth = 1.1;
  for (let x = 150; x < 492; x += 22) {
    ctx.beginPath();
    ctx.moveTo(x, 60); ctx.lineTo(x + 12, 60); ctx.lineTo(x + 12, 66);
    ctx.lineTo(x + 5, 66); ctx.lineTo(x + 5, 63);
    ctx.stroke();
  }
  // 台柱
  ctx.fillStyle = '#4a281a';
  ctx.fillRect(118, 44, 14, 300);
  ctx.fillRect(508, 44, 14, 300);
  // 匾额
  const bx = 250, by = 8, bw = 140, bh = 34;
  ctx.fillStyle = '#6d1a12';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = Z7_GOLD;
  ctx.lineWidth = 1.6;
  ctx.strokeRect(bx + 2, by + 2, bw - 4, bh - 4);
  ctx.fillStyle = '#f6d98c';
  ctx.font = `700 25px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('皮影', 320, by + bh / 2 + 1);
}

function z7joint(x, y, r) {
  ctx.fillStyle = 'rgba(46,18,10,0.92)';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(248,215,155,0.55)';
  ctx.beginPath(); ctx.arc(x, y, r * 0.42, 0, Math.PI * 2); ctx.fill();
}

// 一段皮革肢体：从 (0,0) 沿 +x 画起，宽 w1→w2，末梢收圆
function z7limb(len, w1, w2, color, holes) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -w1 / 2);
  ctx.quadraticCurveTo(len * 0.55, -w1 * 0.46, len, -w2 / 2);
  ctx.quadraticCurveTo(len + w2 * 0.45, 0, len, w2 / 2);
  ctx.quadraticCurveTo(len * 0.55, w1 * 0.46, 0, w1 / 2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(40,16,8,0.9)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  // 镂空小花孔
  if (holes) {
    ctx.fillStyle = 'rgba(248,215,155,0.62)';
    for (let i = 1; i <= 2; i++) {
      const u = i / 3;
      ctx.beginPath();
      ctx.arc(len * u, 0, Math.min(w1, w2) * 0.16, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function z7puppet(t, enter, pose) {
  const cx = 320, cy = 186;
  ctx.save();
  ctx.translate(cx, cy + (1 - enter) * 130);
  ctx.scale(1.16, 1.16);
  // 整体微摆
  const sway = Math.sin(t * 1.3) * 0.028;
  ctx.rotate(sway);

  // ---- 腿 ----
  const legPhase = Math.sin(t * 2.0) * 0.5;
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(side * 13, 40);
    const a1 = Math.PI / 2 + side * 0.10 + (side > 0 ? legPhase * 0.12 : -legPhase * 0.12);
    const a2 = 0.16 + (side > 0 ? legPhase * 0.35 : -legPhase * 0.3);
    ctx.rotate(a1);
    z7limb(36, 15, 12, '#8f3416', true);
    ctx.translate(36, 0);
    ctx.rotate(a2);
    z7limb(30, 12, 9, '#8f3416', false);
    // 靴
    ctx.translate(30, 0);
    ctx.rotate(-0.3);
    ctx.fillStyle = '#2c6650';
    ctx.beginPath();
    ctx.ellipse(4, 0, 11, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(40,16,8,0.9)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  // ---- 身 ----
  ctx.save();
  const bodyG = ctx.createLinearGradient(-24, -40, 24, 46);
  bodyG.addColorStop(0, '#b04922');
  bodyG.addColorStop(1, '#8c3315');
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.moveTo(-25, -40);
  ctx.quadraticCurveTo(-33, -6, -26, 34);
  ctx.lineTo(26, 34);
  ctx.quadraticCurveTo(33, -6, 25, -40);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(40,16,8,0.95)';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  // 靠甲：三排菱形孔
  ctx.fillStyle = 'rgba(248,215,155,0.5)';
  for (let row = 0; row < 3; row++) {
    for (let k = -3; k <= 3; k++) {
      const x = k * 7.2, y = -26 + row * 15 + (k % 2 ? 3.6 : 0);
      if (Math.abs(x) > 22 - row * 2) continue;
      ctx.beginPath();
      ctx.moveTo(x, y - 3.4); ctx.lineTo(x + 3.2, y); ctx.lineTo(x, y + 3.4); ctx.lineTo(x - 3.2, y);
      ctx.closePath();
      ctx.fill();
    }
  }
  // 腰带
  ctx.fillStyle = '#2c6650';
  ctx.fillRect(-27, 14, 54, 9);
  ctx.strokeStyle = 'rgba(40,16,8,0.9)';
  ctx.lineWidth = 1.2;
  ctx.strokeRect(-27, 14, 54, 9);
  ctx.fillStyle = 'rgba(232,185,95,0.95)';
  ctx.beginPath(); ctx.arc(0, 18.5, 2.8, 0, Math.PI * 2); ctx.fill();
  // 云肩
  ctx.fillStyle = 'rgba(46,110,86,0.62)';
  ctx.beginPath();
  ctx.moveTo(-26, -38);
  ctx.quadraticCurveTo(0, -50, 26, -38);
  ctx.quadraticCurveTo(0, -30, -26, -38);
  ctx.fill();
  ctx.restore();

  // ---- 手臂 ----
  const armPose = [[-1, -1.95], [1, -0.35]];
  for (const [side, target] of armPose) {
    const base = Math.PI / 2 + side * 0.22;
    const a1 = lerp(base, target, pose);
    const elbow = lerp(0.45, side < 0 ? -0.55 : 0.5, pose);
    ctx.save();
    ctx.translate(side * 24, -36);
    ctx.rotate(a1);
    z7limb(30, 13, 10, Z7_LEATHER, true);
    ctx.translate(30, 0);
    ctx.rotate(elbow);
    z7limb(28, 10, 7, Z7_LEATHER, false);
    // 手
    ctx.fillStyle = '#8c3315';
    ctx.beginPath(); ctx.arc(30, 0, 5.4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(40,16,8,0.9)';
    ctx.lineWidth = 1.1;
    ctx.stroke();
    ctx.restore();
  }
  z7joint(-24, -36, 3.2);
  z7joint(24, -36, 3.2);
  z7joint(-13, 40, 3.2);
  z7joint(13, 40, 3.2);

  // ---- 头 ----
  ctx.save();
  ctx.translate(0, -40);
  // 脖子
  ctx.fillStyle = '#a63f1d';
  ctx.beginPath();
  ctx.moveTo(-8, -2); ctx.lineTo(-7, 12); ctx.lineTo(7, 12); ctx.lineTo(8, -2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(40,16,8,0.9)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.scale(1.26, 1.26);
  const headAng = -0.06 + Math.sin(t * 1.1) * 0.05 - pose * 0.06;
  ctx.rotate(headAng);
  // 冠
  ctx.fillStyle = '#7d2712';
  ctx.beginPath();
  ctx.moveTo(-14, -14);
  ctx.quadraticCurveTo(0, -34, 14, -14);
  ctx.lineTo(12, -2);
  ctx.lineTo(-12, -2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(248,215,155,0.5)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // 翎子：两根雉尾，根粗梢细
  for (const side of [-1, 1]) {
    const wob = Math.sin(t * 2.1 + side) * 0.18 + pose * 0.14 * side;
    ctx.save();
    ctx.translate(side * 7, -18);
    ctx.rotate(-Math.PI / 2 + side * 0.92 + wob * 0.55);
    const L = 44, N = 14;
    const up = [], dn = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const px = L * u;
      const py = Math.sin(u * 2.2) * (6 + side * 3) + u * u * (10 + side * 8);
      const w = 4.6 * (1 - 0.82 * u) * (0.6 + 0.6 * Math.sin(Math.PI * Math.pow(u, 0.6)));
      up.push([px, py - w]);
      dn.push([px, py + w]);
    }
    ctx.fillStyle = side > 0 ? '#c1762c' : '#a95f28';
    ctx.beginPath();
    ctx.moveTo(up[0][0], up[0][1]);
    for (let i = 1; i <= N; i++) ctx.lineTo(up[i][0], up[i][1]);
    for (let i = N; i >= 0; i--) ctx.lineTo(dn[i][0], dn[i][1]);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(58,26,14,0.55)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
    // 节纹
    ctx.strokeStyle = 'rgba(58,26,14,0.4)';
    for (let k = 2; k <= 5; k++) {
      const u = k / 7;
      ctx.beginPath();
      ctx.moveTo(L * u, Math.sin(u * 2.2) * (6 + side * 3) - 3.2 * (1 - u));
      ctx.lineTo(L * u, Math.sin(u * 2.2) * (6 + side * 3) + 3.2 * (1 - u));
      ctx.stroke();
    }
    ctx.restore();
  }
  // 脸：侧脸轮廓
  ctx.fillStyle = '#c8663a';
  ctx.beginPath();
  ctx.moveTo(-13, -12);
  ctx.quadraticCurveTo(-16, 6, -9, 18);
  ctx.quadraticCurveTo(-1, 25, 8, 17);
  ctx.quadraticCurveTo(15, 8, 13, -4);
  ctx.quadraticCurveTo(9, -14, -13, -12);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(40,16,8,0.95)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  // 五官（刻线）
  ctx.strokeStyle = '#2a1009';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-2, 0); ctx.quadraticCurveTo(4, -2, 8, 1); ctx.stroke();  // 眉
  ctx.beginPath(); ctx.moveTo(1, 3); ctx.quadraticCurveTo(6, 2, 7, 6); ctx.stroke();    // 眼
  ctx.beginPath(); ctx.moveTo(9, 6); ctx.lineTo(13, 9); ctx.stroke();                   // 鼻
  ctx.beginPath(); ctx.moveTo(4, 13); ctx.quadraticCurveTo(8, 15, 11, 12); ctx.stroke(); // 嘴
  // 耳环
  ctx.fillStyle = 'rgba(248,215,155,0.75)';
  ctx.beginPath(); ctx.arc(-11, 8, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  z7joint(0, -38, 3.4);
  ctx.restore();
}

function z7rods(t, enter) {
  // 操纵杆：签子
  ctx.save();
  ctx.strokeStyle = 'rgba(50,24,14,0.85)';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(322 + 30, 196 + (1 - enter) * 130 - 8);
  ctx.lineTo(376, 352);
  ctx.stroke();
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(322 - 40, 196 + (1 - enter) * 130 - 30);
  ctx.lineTo(268, 352);
  ctx.stroke();
  ctx.restore();
}

function z7motes(t, p) {
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha = p;
  Z7_MOTES.forEach(m => {
    const y = 306 - ((m.y - 56 + t * m.sp) % 244);
    const x = m.x + Math.sin(t * 0.8 + m.ph) * 5;
    const a = 0.16 + 0.3 * Math.abs(Math.sin(t * 0.9 + m.ph));
    ctx.fillStyle = `rgba(255,238,200,${a})`;
    ctx.beginPath();
    ctx.arc(x, y, m.sz, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

function drawScene(t) {
  // 台外暗场
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#150c08');
  bg.addColorStop(0.6, '#1d100a');
  bg.addColorStop(1, '#0d0705');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 灯：屏幕由暗到亮
  const lp = z7seg(t, -0.2, 0.8);
  ctx.save();
  const lg = ctx.createRadialGradient(322, 180, 40, 322, 180, 360);
  lg.addColorStop(0, `rgba(255,196,112,${0.34 * lp})`);
  lg.addColorStop(0.55, `rgba(255,170,90,${0.13 * lp})`);
  lg.addColorStop(1, 'rgba(255,170,90,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  z7woodFrame();

  // 羊皮屏幕
  ctx.save();
  ctx.globalAlpha = 0.3 + 0.7 * lp;
  ctx.drawImage(Z7_SCREEN, 140, 56, 360, 250);
  // 屏幕暗角
  const vg = ctx.createRadialGradient(320, 180, 90, 320, 180, 250);
  vg.addColorStop(0, 'rgba(90,44,20,0)');
  vg.addColorStop(1, 'rgba(70,32,14,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(140, 56, 360, 250);
  ctx.restore();

  // 屏幕内裁切
  ctx.save();
  ctx.beginPath();
  ctx.rect(141, 57, 358, 248);
  ctx.clip();

  // 皮影背后的影
  const enterP = z7seg(t, 0.35, 1.5);
  const pose = z7seg(t, 1.4, 2.9);
  ctx.save();
  ctx.globalAlpha = enterP * 0.16;
  ctx.translate(6, 5);
  z7puppet(t, easeOut(enterP), pose);
  ctx.restore();

  // 皮影本体
  if (enterP > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, enterP * 1.15);
    z7puppet(t, easeOut(enterP), pose);
    ctx.restore();
  }

  z7motes(t, lp);
  ctx.restore();

  z7rods(t, easeOut(enterP));

  // 小字
  const tp = z7seg(t, 3.2, 3.8);
  if (tp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(tp) * 0.9;
    ctx.fillStyle = 'rgba(246,215,150,0.8)';
    ctx.font = `400 13px ${FONT}`;
    ctx.textAlign = 'left';
    ctx.fillText('灯下起舞', 30, 344);
    ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M25 歌词卡点 · DeepSeek Harness 生成示例</title>
<!--
  Provenance

  catalog commit: 01576924a2b316d1f11ae33f75d3c005e8781451

  本文件：DeepSeek Harness（deepseek-flash）根据该风格提示词新写的候选示例，
  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。
  原文“只输出代码”等语句属于素材的一部分，不覆盖本任务的交付合同。
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>M25 · 歌词卡点</h1>
    <p>深色舞台上一句歌词踩着一拍一个字弹出来，卡拉 OK 高亮扫过，底部条形随节拍起伏。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="歌词卡点 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 深色舞台上一句歌词踩着一拍一个字弹出来，卡拉 OK 高亮扫过，底部条形随节拍起伏。
// M25 歌词卡点 · DeepSeek Harness 生成示例
const M25_BG = '#0d0a16';
const M25_HOT = '#ff5c8a', M25_COLD = '#69e0ff', M25_CREAM = '#f7f1ec';
const M25_BEAT = 0.5;                  // 120 BPM，一拍 0.5 秒
const M25_LINE1 = [['把', -0.18], ['灯', 0.50], ['打', 1.00], ['开', 1.50]];
const M25_LINE2 = [['让', 2.00], ['夜', 2.50], ['慢', 3.00], ['慢', 3.50], ['亮', 4.00], ['起', 4.50], ['来', 5.00]];
const M25_BARS = (() => {
  const r = rng(2525);
  return Array.from({ length: 30 }, (_, i) => 0.35 + r() * 0.65 + (i % 5 === 0 ? 0.25 : 0));
})();

function m25seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function m25e(t) { return 1 - Math.pow(1 - t, 3); }
function m25pop(p) {
  if (p <= 0) return 0;
  if (p >= 1) return 1;
  return 1 - Math.exp(-9 * p) * Math.cos(13 * p) * (1 - p * 0.4);
}
// 距上一拍的衰减，做视觉重音
function m25pulse(t) {
  const local = t - Math.floor(t / M25_BEAT) * M25_BEAT;
  return Math.max(0, 1 - local / 0.3);
}

function m25Lyric(chars, y, base, t, size, sweep) {
  ctx.save();
  ctx.font = `800 ${size}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const gap = size * 1.34;
  const startX = W / 2 - (chars.length - 1) * gap / 2;
  chars.forEach(([ch, at], i) => {
    const p = m25pop(m25seg(t, at, at + 0.34));
    if (p <= 0.001) return;
    const x = startX + i * gap;
    const yy = y + (1 - clamp(p, 0, 1)) * 16;
    const sc = 0.55 + 0.45 * clamp(p, 0, 1.25);
    ctx.save();
    ctx.translate(x, yy);
    ctx.rotate((1 - clamp(p, 0, 1)) * -0.12);
    ctx.scale(sc, sc);
    // 未唱到的暗字
    ctx.globalAlpha = 0.26;
    ctx.fillStyle = M25_CREAM;
    ctx.fillText(ch, 0, 0);
    // 唱过后：卡拉 OK 从左往右填色
    const kp = sweep ? m25seg(t, at + 0.02, at + 0.3) : 1;
    if (kp > 0) {
      const w = ctx.measureText(ch).width + size * 0.3;
      ctx.save();
      ctx.beginPath();
      ctx.rect(-w / 2, -size, w * kp, size * 2);
      ctx.clip();
      ctx.globalAlpha = 1;
      ctx.fillStyle = base;
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    }
    // 拍点瞬间的外发光
    const pl = m25pulse(t) * (t - at < 0.5 && t >= at ? 1 : 0);
    if (pl > 0.02) {
      ctx.globalAlpha = pl * 0.5;
      ctx.fillStyle = base;
      ctx.fillText(ch, 0, 0);
    }
    ctx.restore();
  });
  ctx.restore();
}

function drawScene(t) {
  const pulse = m25pulse(t);
  const beatN = Math.floor(t / M25_BEAT);

  // 背景：随拍点起伏的径向光
  ctx.fillStyle = M25_BG; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, 176, 10, W / 2, 176, 300 + pulse * 70);
  glow.addColorStop(0, `rgba(255,92,138,${0.20 + pulse * 0.16})`);
  glow.addColorStop(0.55, 'rgba(105,224,255,.07)');
  glow.addColorStop(1, 'rgba(13,10,22,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  // 拍点竖光带
  ctx.save();
  for (let i = 0; i < 5; i++) {
    const x = 80 + i * 120;
    const a = 0.03 + (i % 2 ? pulse * 0.05 : pulse * 0.09);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(247,241,236,0)');
    g.addColorStop(0.45, `rgba(247,241,236,${a})`);
    g.addColorStop(1, 'rgba(247,241,236,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, 0, i % 2 ? 2 : 4, H);
  }
  ctx.restore();

  // 顶部 12 个拍点刻度
  ctx.save();
  for (let i = 0; i < 12; i++) {
    const on = i <= beatN;
    ctx.fillStyle = on ? (i % 4 === 0 ? M25_HOT : 'rgba(247,241,236,.55)') : 'rgba(247,241,236,.16)';
    const h = i === beatN ? 12 : 7;
    ctx.fillRect(220 + i * 17, 46 - h / 2, 9, h);
  }
  ctx.restore();

  // 歌词：两行，一个字一拍
  m25Lyric(M25_LINE1, 140, M25_CREAM, t, 42, true);
  m25Lyric(M25_LINE2, 214, M25_HOT, t, 46, true);
  // 第二行里「亮起来」换成冷色强调
  if (t >= 4.0) {
    ctx.save();
    const p = m25e(m25seg(t, 4.0, 4.5));
    ctx.strokeStyle = M25_COLD;
    ctx.globalAlpha = p * 0.9;
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    const x0 = 336, x1 = 502;
    ctx.beginPath();
    ctx.moveTo(x0, 250);
    ctx.lineTo(lerp(x0, x1, p), 250);
    ctx.stroke();
    ctx.restore();
  }

  // 底部条形：跟着拍点上下
  ctx.save();
  const baseY = 330;
  for (let i = 0; i < M25_BARS.length; i++) {
    const x = 34 + i * 14;
    if (x > 448) break;
    const wob = 0.55 + 0.45 * Math.sin(t * 9 + i * 0.7);
    const h = 8 + 34 * M25_BARS[i] * (0.5 + 0.5 * pulse) * wob;
    const g = ctx.createLinearGradient(0, baseY - h, 0, baseY);
    g.addColorStop(0, i % 3 === 0 ? M25_HOT : M25_COLD);
    g.addColorStop(1, 'rgba(247,241,236,.10)');
    ctx.fillStyle = g;
    ctx.fillRect(x, baseY - h, 7, h);
  }
  ctx.restore();

  // 左下角小标 + 拍号
  ctx.save();
  ctx.fillStyle = 'rgba(247,241,236,.42)';
  ctx.font = `600 10px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('120 BPM  ·  ' + String(beatN + 1).padStart(2, '0'), 34, 40);
  ctx.restore();

  // 结尾：一拍重音，白闪收束
  const endP = m25seg(t, 5.5, 5.62) * (1 - m25seg(t, 5.7, 5.96));
  if (endP > 0) {
    ctx.save(); ctx.globalAlpha = endP * 0.18; ctx.fillStyle = M25_CREAM;
    ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

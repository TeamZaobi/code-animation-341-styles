<title>M11 人生循环 · DeepSeek Harness 生成示例</title>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>M11 · 人生循环</h1>
    <p>一个圈就是一生：圆环像钟一样转，环里同一个人从小孩长成老人，最后无缝接回小孩。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="人生循环 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 一个圈就是一生：圆环像钟一样转，环里同一个人从小孩长成老人，最后无缝接回小孩。
// M11 人生循环 · DeepSeek Harness 生成示例
const M11_BG = '#f3ebda', M11_INK = '#3a2f28', M11_RUST = '#c25c33', M11_SAGE = '#8b9a7b';

const M11_STAGES = [
  { name: '小时候', h: 66, head: 12.5, bw: 20, stoop: 0.0 },
  { name: '读书时', h: 92, head: 11.0, bw: 21, stoop: 0.02 },
  { name: '工作时', h: 108, head: 10.5, bw: 23, stoop: 0.04 },
  { name: '后来', h: 92, head: 10.5, bw: 22, stoop: 0.20 }
];

function m11p(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

function m11bg() {
  ctx.fillStyle = M11_BG; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(320, 170, 40, 320, 170, 400);
  g.addColorStop(0, 'rgba(255,252,240,.85)');
  g.addColorStop(1, 'rgba(226,210,184,.35)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function m11figure(fx, fy, st, props, t) {
  const h = st.h, head = st.head, bw = st.bw;
  const hipY = fy - h * 0.42;
  const neckY = fy - h + head * 2;
  const shoulderY = neckY + h * 0.10;
  const lean = st.stoop;
  const sway = Math.sin(t * 2.4) * 0.012;

  ctx.save();
  // 地上的影子
  ctx.fillStyle = 'rgba(58,47,40,.13)';
  ctx.beginPath(); ctx.ellipse(fx, fy + 2, bw * 1.1, 5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.translate(fx, fy);
  ctx.rotate(lean * 0.5 + sway);
  ctx.strokeStyle = M11_INK; ctx.fillStyle = M11_INK;
  ctx.lineWidth = Math.max(3, bw * 0.19);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // 腿
  ctx.beginPath();
  ctx.moveTo(-bw * 0.28, -(fy - hipY));
  ctx.lineTo(-bw * 0.3, 0);
  ctx.moveTo(bw * 0.28, -(fy - hipY));
  ctx.lineTo(bw * 0.3, 0);
  ctx.stroke();
  // 身体
  ctx.beginPath();
  ctx.moveTo(-bw * 0.5, -(fy - shoulderY));
  ctx.quadraticCurveTo(-bw * 0.62, -(fy - hipY) - 6, -bw * 0.42, -(fy - hipY));
  ctx.lineTo(bw * 0.42, -(fy - hipY));
  ctx.quadraticCurveTo(bw * 0.62, -(fy - hipY) - 6, bw * 0.5, -(fy - shoulderY));
  ctx.closePath();
  ctx.fill();
  // 手臂
  const armSwing = Math.sin(t * 2.4 + 0.7) * 3;
  ctx.beginPath();
  ctx.moveTo(-bw * 0.52, -(fy - shoulderY));
  ctx.lineTo(-bw * 0.78, -(fy - shoulderY) + h * 0.26 + armSwing);
  ctx.moveTo(bw * 0.52, -(fy - shoulderY));
  ctx.lineTo(bw * 0.78, -(fy - shoulderY) + h * 0.26 - armSwing);
  ctx.stroke();
  // 头
  ctx.beginPath();
  ctx.arc(0, -(fy - (fy - h + head)) - 0, head, 0, Math.PI * 2);
  ctx.fill();

  // 道具（每个阶段一件，交叉淡入）
  for (const pr of props) {
    const propK = pr.k, prop = pr.kind;
    if (propK <= 0.02) continue;
    ctx.save();
    ctx.globalAlpha = clamp(propK, 0, 1);
    ctx.strokeStyle = M11_RUST; ctx.fillStyle = M11_RUST;
    ctx.lineWidth = 3.2; ctx.lineCap = 'round';
    if (prop === 'ball') {
      ctx.beginPath(); ctx.arc(-bw * 0.9, -6, 8, 0, Math.PI * 2); ctx.fill();
    } else if (prop === 'book') {
      ctx.save();
      ctx.translate(bw * 0.92, -(fy - shoulderY) + h * 0.3);
      ctx.fillRect(-9, -7, 18, 14);
      ctx.strokeStyle = M11_BG; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, 7); ctx.stroke();
      ctx.restore();
    } else if (prop === 'bag') {
      ctx.save();
      ctx.translate(-bw * 0.95, -(fy - shoulderY) + h * 0.34);
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-9, 0, 20, 15, 4); else ctx.rect(-9, 0, 20, 15);
      ctx.fill();
      ctx.strokeStyle = M11_INK; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(1, 0, 5, Math.PI, 0); ctx.stroke();
      ctx.restore();
    } else if (prop === 'cane') {
      ctx.strokeStyle = M11_RUST; ctx.lineWidth = 3.4;
      ctx.beginPath();
      ctx.moveTo(bw * 0.95, -(fy - shoulderY) + h * 0.28);
      ctx.lineTo(bw * 1.25, 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawScene(t) {
  m11bg();

  // 一件小事：环像钟一样走一圈，正好四种人生
  const u = (t / 6) * 4;
  const i0 = Math.floor(u) % 4;
  const f = smooth(clamp(u - Math.floor(u), 0, 1));
  const i1 = (i0 + 1) % 4;
  const st = {
    h: lerp(M11_STAGES[i0].h, M11_STAGES[i1].h, f),
    head: lerp(M11_STAGES[i0].head, M11_STAGES[i1].head, f),
    bw: lerp(M11_STAGES[i0].bw, M11_STAGES[i1].bw, f),
    stoop: lerp(M11_STAGES[i0].stoop, M11_STAGES[i1].stoop, f)
  };
  const ang = -Math.PI / 2 + (u / 4) * Math.PI * 2;

  // 环
  ctx.save();
  ctx.strokeStyle = 'rgba(58,47,40,.30)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(320, 182, 132, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(58,47,40,.16)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(320, 182, 120, 0, Math.PI * 2); ctx.stroke();
  // 12 个刻度
  for (let i = 0; i < 12; i++) {
    const a = -Math.PI / 2 + (i / 12) * Math.PI * 2;
    const long = i % 3 === 0;
    ctx.strokeStyle = long ? 'rgba(58,47,40,.5)' : 'rgba(58,47,40,.22)';
    ctx.lineWidth = long ? 2 : 1.2;
    ctx.beginPath();
    ctx.moveTo(320 + Math.cos(a) * 132, 182 + Math.sin(a) * 132);
    ctx.lineTo(320 + Math.cos(a) * (132 - (long ? 12 : 7)), 182 + Math.sin(a) * (132 - (long ? 12 : 7)));
    ctx.stroke();
  }
  // 走过的弧
  ctx.strokeStyle = M11_RUST; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(320, 182, 132, -Math.PI / 2, ang);
  ctx.stroke();
  // 环上的点
  ctx.fillStyle = M11_RUST;
  ctx.beginPath(); ctx.arc(320 + Math.cos(ang) * 132, 182 + Math.sin(ang) * 132, 5.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 地面
  ctx.save();
  ctx.strokeStyle = 'rgba(58,47,40,.42)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(226, 301.5); ctx.lineTo(414, 301.5); ctx.stroke();
  ctx.restore();

  // 人（一次画完，道具按阶段交叉淡入）
  const propKinds = ['ball', 'book', 'bag', 'cane'];
  const props = [];
  for (let k = 0; k < 4; k++) {
    let d = Math.abs(u - k);
    d = Math.min(d, 4 - d);
    const kk = clamp(1 - d * 2.2, 0, 1);
    if (kk > 0.02) props.push({ kind: propKinds[k], k: kk });
  }
  m11figure(320, 300, st, props, t);

  // 阶段名（环里上方）
  ctx.save();
  ctx.fillStyle = M11_INK;
  ctx.font = `500 18px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const cur = f < 0.5 ? i0 : i1;
  ctx.fillText(M11_STAGES[cur].name, 320, 96);
  ctx.restore();

  // 标题与整条时间
  ctx.save();
  ctx.fillStyle = M11_INK;
  ctx.font = `800 26px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('一圈又一圈', 44, 56);
  ctx.fillStyle = 'rgba(58,47,40,.55)';
  ctx.font = `400 14px ${FONT}`;
  ctx.fillText('小时候 → 读书时 → 工作时 → 后来 → 小时候', 44, 336);
  ctx.restore();

  // 右上角说明
  ctx.save();
  ctx.globalAlpha = 0.45;
  ctx.fillStyle = M11_INK;
  ctx.font = `500 13px ${FONT}`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('同一个人 · 无缝循环', 596, 40);
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M6 苹果发布会风 · DeepSeek Harness 生成示例</title>
<!--

  本文件：DeepSeek Harness（deepseek-flash）根据该风格提示词新写的候选示例，
  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。
  原文“只输出代码”等语句属于素材的一部分，不覆盖本任务的交付合同。

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>M6 · 苹果发布会风</h1>
    <p>白底亮蓝的发布会风：玻璃板拖着速度残影滑进画面，一道光扫过，再切到界面卡片，最后落到一句极简标题。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="苹果发布会风 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 白底亮蓝的发布会风：玻璃板拖着速度残影滑进画面，一道光扫过，再切到界面卡片，最后落到一句极简标题。
// M6 苹果发布会风 · DeepSeek Harness 生成示例
const M6_INK = '#1d1d1f', M6_GREY = '#8a8f98', M6_BLUE = '#0a84ff';
const M6_FONT = 'Inter, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif';

function m6p(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function m6rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }

function m6bg() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.5, '#f4f8fe'); g.addColorStop(1, '#e1ecfb');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r = ctx.createRadialGradient(452, 44, 16, 452, 44, 430);
  r.addColorStop(0, 'rgba(255,255,255,.92)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
  const b = ctx.createLinearGradient(0, H - 64, 0, H);
  b.addColorStop(0, 'rgba(198,222,250,0)'); b.addColorStop(1, 'rgba(198,222,250,.5)');
  ctx.fillStyle = b; ctx.fillRect(0, H - 64, W, 64);
}

function m6glass(cx, cy, w, h, r, skew, sp) {
  for (let k = 3; k >= 1; k--) {
    ctx.save();
    ctx.translate(cx - sp * 9 * k, cy);
    ctx.transform(1, 0, skew, 1, 0, 0);
    ctx.globalAlpha = 0.15 / k;
    m6rr(-w / 2, -h / 2, w, h, r);
    ctx.fillStyle = '#d3e4fa'; ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(cx, cy); ctx.transform(1, 0, skew, 1, 0, 0);
  ctx.globalAlpha = 0.34; m6rr(-w / 2 + 4, -h / 2 + 22, w, h, r); ctx.fillStyle = '#c9dcf3'; ctx.fill();
  ctx.globalAlpha = 0.2; m6rr(-w / 2 + 9, -h / 2 + 30, w, h, r); ctx.fillStyle = '#d8e6f8'; ctx.fill();
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
  g.addColorStop(0, 'rgba(255,255,255,.94)');
  g.addColorStop(.5, 'rgba(239,246,255,.74)');
  g.addColorStop(1, 'rgba(210,229,252,.68)');
  m6rr(-w / 2, -h / 2, w, h, r); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.96)'; ctx.lineWidth = 1.5; ctx.stroke();
  const lg = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  lg.addColorStop(0, 'rgba(10,132,255,0)');
  lg.addColorStop(.55, 'rgba(10,132,255,.12)');
  lg.addColorStop(1, 'rgba(10,132,255,0)');
  m6rr(-w / 2, -h / 2, w, h, r); ctx.fillStyle = lg; ctx.fill();
  ctx.restore();
}

function m6sweep(cx, cy, w, h, r, skew, pos) {
  if (pos <= -0.15 || pos >= 1.15) return;
  ctx.save();
  ctx.translate(cx, cy); ctx.transform(1, 0, skew, 1, 0, 0);
  m6rr(-w / 2, -h / 2, w, h, r); ctx.clip();
  const x = lerp(-w * 0.7, w * 0.7, pos);
  const g = ctx.createLinearGradient(x - 64, -h / 2, x + 64, h / 2);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(.5, 'rgba(255,255,255,.9)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.restore();
}

// 带速度残影的字
function m6text(text, x, y, size, color, sp, weight, track, align) {
  ctx.save();
  ctx.font = `${weight || 600} ${size}px ${M6_FONT}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = track || '-1px';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  if (sp > 0.03) {
    for (let k = 3; k >= 1; k--) {
      ctx.globalAlpha = 0.10 * (4 - k) / 3;
      ctx.fillStyle = color;
      ctx.fillText(text, x - sp * 6 * k, y);
    }
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// 进场已经在动，离场加速
function m6motion(p, dir, enter) {
  const ep = 1 - Math.pow(1 - clamp(p / enter, 0, 1), 3);
  const xp = easeIn(clamp((p - 0.8) / 0.2, 0, 1));
  return {
    off: dir * 300 * (1 - ep) - dir * 330 * xp,
    speed: (1 - ep) * 1.1 + xp * 2.4
  };
}

function m6card(p, x, sp) {
  ctx.save();
  ctx.translate(x, 186);
  for (let k = 3; k >= 1; k--) {
    ctx.save(); ctx.globalAlpha = 0.12 / k;
    m6rr(-160 - sp * 7 * k, -95, 320, 190, 22); ctx.fillStyle = '#c9dcf3'; ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 0.3; m6rr(-156, -73, 320, 190, 22); ctx.fillStyle = '#cfe0f4'; ctx.fill();
  ctx.globalAlpha = 1;
  m6rr(-160, -95, 320, 190, 22); ctx.fillStyle = '#fdfeff'; ctx.fill();
  ctx.strokeStyle = 'rgba(190,212,238,.85)'; ctx.lineWidth = 1.2; ctx.stroke();
  const rows = ['连接', '同步', '完成'];
  rows.forEach((label, i) => {
    const rp = clamp((p - 0.28 - i * 0.16) / 0.25, 0, 1);
    const yy = -58 + i * 46;
    ctx.fillStyle = 'rgba(29,29,31,.055)';
    m6rr(-138, yy, 276 * (0.35 + 0.65 * rp), 28, 8); ctx.fill();
    ctx.globalAlpha = rp;
    ctx.fillStyle = M6_INK; ctx.font = `500 13px ${M6_FONT}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(label, -128, yy + 14);
    ctx.globalAlpha = 1;
  });
  const bp = clamp((p - 0.5) / 0.5, 0, 1);
  ctx.strokeStyle = 'rgba(10,132,255,.22)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-138, 82); ctx.lineTo(138, 82); ctx.stroke();
  ctx.strokeStyle = M6_BLUE; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-138, 82); ctx.lineTo(-138 + 276 * (1 - Math.pow(1 - bp, 2)), 82); ctx.stroke();
  ctx.restore();
}

function drawScene(t) {
  m6bg();
  const cam = 1 + 0.05 * smooth(t / 6);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(cam, cam); ctx.translate(-W / 2, -H / 2);

  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = M6_GREY; ctx.font = `500 13px ${M6_FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('发布会风 · 镜头没有一秒是停的', 44, 34);
  ctx.restore();

  if (t < 1.5) {
    const p = m6p(t, 0, 1.5);
    const m = m6motion(clamp(p + 0.2, 0, 1), -1, 0.34);
    const cx = 438 + m.off * 0.55;
    m6glass(cx, 176, 292, 176, 28, -0.05, m.speed * 0.5);
    m6sweep(cx, 176, 292, 176, 28, -0.05, m6p(t, 0.85, 1.5) * 1.5 - 0.25);
    m6text('薄一点', 48 + m.off * 0.42, 196, 44, M6_INK, m.speed, 600, '-1.5px', 'left');
    m6text('同样的东西，少一点重量', 50 + m.off * 0.42, 228, 14, M6_GREY, m.speed * 0.7, 400, '0px', 'left');
  } else if (t < 3.0) {
    const p = m6p(t, 1.5, 3.0);
    const m = m6motion(p, 1, 0.28);
    const cx = 424 + m.off * 0.55;
    m6glass(cx, 176, 292, 176, 28, 0.05, m.speed * 0.5);
    m6sweep(cx, 176, 292, 176, 28, 0.05, m6p(t, 1.6, 2.55) * 1.55 - 0.28);
    m6text('亮得安静', 48 + m.off * 0.42, 196, 44, M6_INK, m.speed, 600, '-1.5px', 'left');
    m6text('光只落在该亮的地方', 50 + m.off * 0.42, 228, 14, M6_GREY, m.speed * 0.7, 400, '0px', 'left');
    const dp = clamp(m6p(t, 1.9, 2.35), 0, 1);
    if (dp > 0) {
      ctx.save();
      const d = 1 - Math.pow(1 - dp, 3);
      ctx.fillStyle = 'rgba(10,132,255,.16)';
      ctx.fillRect(50, 240, 132 * d, 5);
      ctx.fillStyle = M6_BLUE;
      ctx.fillRect(50, 240, 132 * d, 2);
      ctx.restore();
    }
  } else if (t < 4.5) {
    const p = m6p(t, 3.0, 4.5);
    const m = m6motion(clamp(p + 0.2, 0, 1), -1, 0.34);
    m6card(p, 448 + m.off * 0.6, m.speed);
    m6text('一次就够', 44 + m.off * 0.4, 196, 40, M6_INK, m.speed, 600, '-1.5px', 'left');
    m6text('连接 · 同步 · 完成', 46 + m.off * 0.4, 226, 14, M6_GREY, m.speed * 0.7, 400, '0px', 'left');
  } else {
    const p = m6p(t, 4.5, 6.0);
    const m = m6motion(p, 1, 0.32);
    m6glass(320 + m.off * 0.2, 212, 460, 146, 30, 0, m.speed * 0.2);
    m6text('让工具退到身后', 320 + m.off * 0.4, 176, 40, M6_INK, m.speed, 700, '-2px', 'center');
    m6text('你只需要留着自己的想法', 320 + m.off * 0.35, 212, 14, M6_GREY, m.speed * 0.7, 400, '0px', 'center');
    const lp = clamp((p - 0.34) / 0.3, 0, 1);
    if (lp > 0) {
      ctx.save();
      ctx.strokeStyle = M6_BLUE; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(320 - 38 * lp, 230); ctx.lineTo(320 + 38 * lp, 230); ctx.stroke();
      ctx.restore();
    }
  }

  ctx.restore();

  const endP = m6p(t, 5.87, 6.0);
  if (endP > 0) {
    ctx.save();
    ctx.globalAlpha = easeIn(endP) * 0.6;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

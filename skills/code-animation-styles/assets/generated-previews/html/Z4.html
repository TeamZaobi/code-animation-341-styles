<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 浅绛青绿山水：峰峦自纸面立起，斧劈皴见石骨，飞瀑落潭，崖头古亭，江心一叶帆。
// Z4 山水 · DeepSeek Harness 生成示例

const Z4_PAPER = '#f3eddd';
const Z4_INK = '40,46,44';

const Z4_TEX = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#f8f3e6');
  sky.addColorStop(0.55, Z4_PAPER);
  sky.addColorStop(1, '#eee6d3');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const r = rng(4404);
  for (let i = 0; i < 460; i++) {
    const x = r() * W, y = r() * H, len = 4 + r() * 26, a = r() * Math.PI;
    g.strokeStyle = `rgba(128,110,80,${0.01 + r() * 0.03})`;
    g.lineWidth = 0.5 + r() * 0.5;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); g.stroke();
  }
  return c;
})();

function z4profile(peaks, seed, noise) {
  const r = rng(seed);
  const pts = [];
  for (let x = 0; x <= W; x += 4) {
    let i = 0;
    while (i < peaks.length - 2 && x > peaks[i + 1][0]) i++;
    const [x0, y0] = peaks[i], [x1, y1] = peaks[i + 1];
    const u = clamp((x - x0) / (x1 - x0), 0, 1);
    const sm = u * u * (3 - 2 * u);
    const y = lerp(y0, y1, sm) + Math.sin(x * 0.06 + seed) * noise * 0.4 + (r() - 0.5) * noise;
    pts.push([x, y]);
  }
  return pts;
}

function z4poly(pts, base) {
  return pts.concat([[W, base], [0, base]]);
}

function z4inside(px, py, poly) {
  let hit = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) hit = !hit;
  }
  return hit;
}

function z4mountain(opts) {
  const { peaks, base, seed, ink, tint, topAlpha, bottomAlpha, cunLen } = opts;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const ridge = z4profile(peaks, seed, opts.noise || 3);
  const poly = z4poly(ridge, base);
  const top = Math.min(...ridge.map(p => p[1]));

  g.save();
  g.beginPath();
  poly.forEach(([x, y], i) => { if (i === 0) g.moveTo(x, y); else g.lineTo(x, y); });
  g.closePath();
  const grd = g.createLinearGradient(0, top, 0, base);
  grd.addColorStop(0, `rgba(${ink},${topAlpha})`);
  grd.addColorStop(0.45, `rgba(${ink},${topAlpha * 0.72})`);
  grd.addColorStop(1, `rgba(${ink},${bottomAlpha})`);
  g.fillStyle = grd;
  g.fill();
  g.clip();

  if (tint) {
    const tg = g.createLinearGradient(0, top, 0, top + (base - top) * 0.5);
    tg.addColorStop(0, tint);
    tg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = tg;
    g.fillRect(0, 0, W, H);
  }

  // 皴：贴着山脊、顺坡而下的短笔，越往山脚越淡
  const r = rng(seed + 77);
  for (let i = 1; i < ridge.length - 1; i++) {
    if (r() < 0.62) continue;
    const [rx, ry] = ridge[i];
    if (ry > base - 12) continue;
    const t1x = ridge[i + 1][0] - ridge[i - 1][0];
    const t1y = ridge[i + 1][1] - ridge[i - 1][1];
    const tAng = Math.atan2(t1y, t1x);
    const n = 1 + Math.floor(r() * 2);
    for (let k = 0; k < n; k++) {
      const sx = rx + (r() - 0.5) * 7;
      const sy = ry + 2 + r() * Math.min(18, (base - ry) * 0.22);
      if (!z4inside(sx, sy, poly)) continue;
      const horizontal = r() < 0.22;
      const ang = horizontal ? tAng + (r() - 0.5) * 0.5 : tAng + Math.PI / 2 + (r() - 0.5) * 0.55;
      const len = cunLen * (0.8 + r() * 1.3);
      const depthFade = clamp(1 - (sy - ry) / 90, 0.2, 1);
      g.strokeStyle = `rgba(${ink},${(0.16 + r() * 0.24) * depthFade})`;
      g.lineWidth = 0.8 + r() * 0.9;
      g.beginPath();
      g.moveTo(sx, sy);
      g.quadraticCurveTo(sx + Math.cos(ang) * len * 0.55 + (r() - 0.5) * 2,
        sy + Math.sin(ang) * len * 0.55,
        sx + Math.cos(ang) * len, sy + Math.sin(ang) * len);
      g.stroke();
    }
  }

  // 石骨：几道深缝
  const rv = rng(seed + 313);
  for (let i = 2; i < ridge.length - 2; i += 4) {
    if (rv() < 0.72) continue;
    const [x, y] = ridge[i];
    const len = 26 + rv() * 44;
    g.strokeStyle = `rgba(${ink},0.30)`;
    g.lineWidth = 1.1 + rv() * 0.8;
    g.beginPath();
    g.moveTo(x, y + 3);
    g.quadraticCurveTo(x + (rv() - 0.5) * 12, y + len * 0.6, x + (rv() - 0.5) * 18, y + len);
    g.stroke();
  }

  // 脊线
  g.strokeStyle = `rgba(${ink},0.62)`;
  g.lineWidth = 1.5;
  g.beginPath();
  ridge.forEach(([x, y], i) => { if (i === 0) g.moveTo(x, y); else g.lineTo(x, y); });
  g.stroke();

  // 苔点
  const rm = rng(seed + 991);
  for (let i = 3; i < ridge.length - 3; i += 3) {
    if (rm() < 0.45) continue;
    const [x, y] = ridge[i];
    const n = 1 + Math.floor(rm() * 3);
    for (let k = 0; k < n; k++) {
      g.fillStyle = `rgba(${ink},${0.42 + rm() * 0.34})`;
      g.beginPath();
      g.arc(x + (rm() - 0.5) * 9, y - 1 + rm() * 7, 0.8 + rm() * 1.4, 0, Math.PI * 2);
      g.fill();
    }
  }

  // 山脚云气
  // 山脚云气：自下而上化开
  const fog = g.createLinearGradient(0, base - (base - top) * 0.5, 0, base);
  fog.addColorStop(0, 'rgba(244,238,223,0)');
  fog.addColorStop(0.6, 'rgba(244,238,223,0.30)');
  fog.addColorStop(1, 'rgba(244,238,223,0.72)');
  g.fillStyle = fog;
  g.fillRect(0, top - 2, W, base - top + 4);
  g.restore();
  return { canvas: c, ridge, base, top };
}

const Z4_FAR = z4mountain({
  peaks: [[0, 152], [58, 122], [96, 134], [150, 96], [196, 126], [250, 86], [300, 122], [352, 102], [398, 134], [450, 96], [500, 128], [548, 106], [596, 134], [640, 118]],
  base: 302, seed: 12, ink: '96,124,128', topAlpha: 0.40, bottomAlpha: 0.10,
  cunLen: 8, noise: 3, tint: 'rgba(88,148,152,0.30)',
});
const Z4_MID = z4mountain({
  peaks: [[0, 198], [54, 162], [88, 178], [136, 130], [178, 152], [226, 116], [268, 148], [316, 128], [360, 160], [404, 132], [450, 162], [500, 138], [548, 168], [596, 146], [640, 172]],
  base: 324, seed: 27, ink: '58,84,82', topAlpha: 0.60, bottomAlpha: 0.12,
  cunLen: 12, noise: 4, tint: 'rgba(72,124,106,0.28)',
});
const Z4_NEAR = z4mountain({
  peaks: [[0, 274], [40, 240], [84, 208], [118, 186], [152, 202], [180, 178], [204, 236], [232, 250], [272, 266], [318, 284], [372, 298], [430, 312], [500, 322], [560, 328], [640, 332]],
  base: 360, seed: 41, ink: '36,50,48', topAlpha: 0.86, bottomAlpha: 0.26,
  cunLen: 17, noise: 3, tint: 'rgba(126,94,60,0.30)',
});
const Z4_CLIFF = z4mountain({
  peaks: [[398, 352], [404, 306], [410, 254], [428, 224], [450, 212], [470, 216], [492, 208], [514, 210], [538, 222], [562, 248], [586, 292], [606, 330], [618, 352], [640, 356]],
  base: 360, seed: 63, ink: '32,44,42', topAlpha: 0.9, bottomAlpha: 0.42,
  cunLen: 16, noise: 2, tint: 'rgba(96,120,96,0.16)',
});

function z4pavilion(x, y, s, p) {
  if (p <= 0) return;
  const e = easeOut(p);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.globalAlpha = Math.min(1, e * 1.25);
  ctx.fillStyle = 'rgba(46,54,50,0.92)';
  ctx.fillRect(-33, 30, 66, 5);
  ctx.fillStyle = 'rgba(52,60,54,0.5)';
  ctx.fillRect(-29, 35, 58, 4);
  ctx.strokeStyle = 'rgba(116,68,48,0.95)';
  ctx.lineWidth = 2.2;
  for (const dx of [-26, -9, 9, 26]) {
    ctx.beginPath(); ctx.moveTo(dx, 30); ctx.lineTo(dx, 0); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(52,58,50,0.82)';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(-30, 20); ctx.lineTo(30, 20);
  ctx.moveTo(-30, 25); ctx.lineTo(30, 25);
  ctx.stroke();
  ctx.fillStyle = 'rgba(40,46,42,0.32)';
  ctx.fillRect(-30, 1, 60, 8);
  ctx.fillStyle = 'rgba(34,44,42,0.96)';
  ctx.beginPath();
  ctx.moveTo(-38, 0);
  ctx.quadraticCurveTo(-22, -4, -12, -16);
  ctx.quadraticCurveTo(0, -27, 12, -16);
  ctx.quadraticCurveTo(22, -4, 38, 0);
  ctx.quadraticCurveTo(24, 2, 0, 3);
  ctx.quadraticCurveTo(-24, 2, -38, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(240,234,220,0.32)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-12, -16); ctx.quadraticCurveTo(0, -27, 12, -16);
  ctx.stroke();
  ctx.restore();
}

function z4pine(x, y, s, p, seed) {
  if (p <= 0) return;
  const e = easeOut(p);
  const r = rng(seed);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  // 干
  ctx.strokeStyle = 'rgba(30,40,38,0.92)';
  ctx.lineCap = 'round';
  ctx.lineWidth = 3.2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-6, -22 * e, 3, -46 * e);
  ctx.stroke();
  // 三层松针：扁平扇面，中国画里的松
  const levels = [[-18, 22], [-33, 19], [-46, 14]];
  levels.forEach(([ly, w], i) => {
    const pp = clamp((p - 0.2 - i * 0.12) / 0.55, 0, 1);
    if (pp <= 0) return;
    const yy = ly * e;
    const ww = w * pp;
    ctx.fillStyle = `rgba(28,44,40,${0.72 * pp})`;
    ctx.beginPath();
    ctx.ellipse(0, yy, ww, 4.4 * pp, 0, 0, Math.PI * 2);
    ctx.fill();
    // 扇面上的针
    ctx.strokeStyle = `rgba(28,44,40,${0.62 * pp})`;
    ctx.lineWidth = 0.9;
    for (let k = -4; k <= 4; k++) {
      const bx = (k / 4) * ww;
      const by = yy + 1.5;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + k * 1.6, by - (5 + r() * 4) * pp);
      ctx.stroke();
    }
  });
  ctx.restore();
}

function z4waterfall(p, t) {
  if (p <= 0) return;
  const top = 234, bot = 320, x = 206;
  ctx.save();
  ctx.globalAlpha = p;
  // 水口两侧的石棱
  ctx.strokeStyle = 'rgba(30,44,42,0.75)';
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(x - 10, top - 4); ctx.quadraticCurveTo(x - 13, top + 26, x - 15, bot - 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 8, top - 3); ctx.quadraticCurveTo(x + 12, top + 30, x + 15, bot - 2); ctx.stroke();
  // 水面
  ctx.fillStyle = 'rgba(250,246,236,0.95)';
  ctx.beginPath();
  ctx.moveTo(x - 6, top);
  ctx.quadraticCurveTo(x - 8, (top + bot) / 2, x - 13, bot);
  ctx.lineTo(x + 14, bot);
  ctx.quadraticCurveTo(x + 10, (top + bot) / 2, x + 6, top);
  ctx.closePath();
  ctx.fill();
  // 水流线
  const r = rng(717);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x - 6, top);
  ctx.quadraticCurveTo(x - 8, (top + bot) / 2, x - 13, bot);
  ctx.lineTo(x + 14, bot);
  ctx.quadraticCurveTo(x + 10, (top + bot) / 2, x + 6, top);
  ctx.closePath();
  ctx.clip();
  for (let i = 0; i < 10; i++) {
    const off = -7 + i * 2.2;
    const len = 14 + r() * 26;
    const speed = 46 + r() * 46;
    const ph = ((t * speed + r() * 200) % 100) / 100;
    const y0 = top + ph * (bot - top);
    ctx.strokeStyle = `rgba(118,132,126,${0.2 + r() * 0.26})`;
    ctx.lineWidth = 0.7 + r() * 0.7;
    ctx.beginPath();
    ctx.moveTo(x + off, y0);
    ctx.quadraticCurveTo(x + off + 1.4, y0 + len * 0.5, x + off - 0.8, Math.min(bot, y0 + len));
    ctx.stroke();
  }
  ctx.restore();
  // 落水
  ctx.fillStyle = 'rgba(250,246,236,0.9)';
  ctx.beginPath(); ctx.ellipse(x, bot + 2, 27, 8, 0, 0, Math.PI * 2); ctx.fill();
  const mist = ctx.createRadialGradient(x, bot, 2, x, bot, 44);
  mist.addColorStop(0, 'rgba(250,246,236,0.55)');
  mist.addColorStop(1, 'rgba(250,246,236,0)');
  ctx.fillStyle = mist;
  ctx.beginPath(); ctx.ellipse(x, bot + 2, 46, 18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function z4clouds(t, p) {
  if (p <= 0) return;
  const bands = [
    { y: 252, h: 11, a: 0.20, sp: 7, w: 250 },
    { y: 292, h: 16, a: 0.16, sp: -5, w: 300 },
    { y: 214, h: 8, a: 0.10, sp: 9, w: 220 },
  ];
  ctx.save();
  bands.forEach((B, i) => {
    const dx = Math.sin(t * 0.3 + i) * B.sp;
    for (let k = 0; k < 3; k++) {
      const cx = (k - 1) * B.w * 0.62 + dx + (i * 40);
      const g = ctx.createRadialGradient(cx, B.y, 2, cx, B.y, B.w * 0.62);
      g.addColorStop(0, `rgba(250,246,236,${B.a * p})`);
      g.addColorStop(1, 'rgba(250,246,236,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(cx, B.y, B.w * 0.6, B.h, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  ctx.restore();
}

function z4river(t, p) {
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha = p;
  const g = ctx.createLinearGradient(0, 312, 0, 360);
  g.addColorStop(0, 'rgba(186,204,198,0.16)');
  g.addColorStop(1, 'rgba(176,198,196,0.32)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 312, W, 48);
  const r = rng(9091);
  for (let i = 0; i < 16; i++) {
    const y = 322 + r() * 34;
    const x = r() * W;
    const len = 20 + r() * 46;
    const ph = Math.sin(t * 1.4 + i) * 5;
    ctx.strokeStyle = `rgba(70,92,92,${0.10 + r() * 0.13})`;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(x + ph, y);
    ctx.quadraticCurveTo(x + ph + len * 0.5, y - 1.6, x + ph + len, y);
    ctx.stroke();
  }
  ctx.restore();
}

function z4boat(t, p) {
  if (p <= 0) return;
  const e = easeOut(p);
  const x = lerp(196, 430, e * 0.5 + 0.5 * clamp(t / 6, 0, 1));
  const y = 332 + Math.sin(t * 1.6) * 1.6;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(44,52,48,0.9)';
  ctx.beginPath();
  ctx.moveTo(-20, 0);
  ctx.quadraticCurveTo(0, 7, 20, 0);
  ctx.quadraticCurveTo(0, 4, -20, 0);
  ctx.fill();
  ctx.strokeStyle = 'rgba(50,58,52,0.9)';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -26); ctx.stroke();
  ctx.fillStyle = 'rgba(248,242,229,0.94)';
  ctx.strokeStyle = 'rgba(54,62,56,0.75)';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.moveTo(1, -25);
  ctx.quadraticCurveTo(15, -14, 3, -2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(60,74,70,0.28)';
  ctx.lineWidth = 0.8;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-12 + i * 3, 6 + i * 2);
    ctx.lineTo(12 - i * 3, 6 + i * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function z4birds(t, p) {
  if (p <= 0) return;
  ctx.save();
  for (let i = 0; i < 3; i++) {
    const pp = clamp(p * 1.2 - i * 0.15, 0, 1);
    if (pp <= 0) continue;
    const bx = 96 + i * 22 + t * 9;
    const by = 66 + i * 9 + Math.sin(t * 1.6 + i) * 3;
    ctx.strokeStyle = `rgba(50,60,58,${0.7 * pp})`;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(bx - 6, by);
    ctx.quadraticCurveTo(bx - 2, by - 3.4, bx, by - 0.4);
    ctx.quadraticCurveTo(bx + 2, by - 3.4, bx + 6, by);
    ctx.stroke();
  }
  ctx.restore();
}

function z4reveal(layer, p) {
  if (p <= 0.01) return;
  const e = easeOut(p);
  const cut = layer.top - 2 + (layer.base - layer.top) * e + 6;
  // 主体
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, layer.top - 2, W, Math.max(0, cut - layer.top - 20));
  ctx.clip();
  ctx.drawImage(layer.canvas, 0, 0);
  ctx.restore();
  // 羽化落笔口：渐隐带，避免出现生硬横线
  for (let i = 0; i < 13; i++) {
    const y0 = cut - 39 + i * 3;
    ctx.save();
    ctx.globalAlpha = 1 - (i + 1) / 14;
    ctx.beginPath();
    ctx.rect(0, y0, W, 3.1);
    ctx.clip();
    ctx.drawImage(layer.canvas, 0, 0);
    ctx.restore();
  }
}

function drawScene(t) {
  ctx.drawImage(Z4_TEX, 0, 0);

  z4reveal(Z4_FAR, clamp((t + 0.35) / 1.15, 0, 1));
  z4clouds(t, clamp((t - 0.1) / 1.2, 0, 1) * 0.5);
  z4reveal(Z4_MID, clamp((t - 0.4) / 1.2, 0, 1));
  z4reveal(Z4_NEAR, clamp((t - 1.0) / 1.25, 0, 1));
  z4waterfall(clamp((t - 2.3) / 0.85, 0, 1), t);
  z4reveal(Z4_CLIFF, clamp((t - 1.7) / 1.05, 0, 1));
  z4pavilion(500, 208, 0.96, clamp((t - 3.25) / 0.85, 0, 1));
  z4pine(560, 236, 0.92, clamp((t - 3.5) / 0.9, 0, 1), 501);
  z4pine(446, 214, 0.66, clamp((t - 3.7) / 0.9, 0, 1), 502);
  z4river(t, clamp((t - 2.75) / 0.8, 0, 1));
  z4boat(t, clamp((t - 3.85) / 0.7, 0, 1));
  z4clouds(t, clamp((t - 3.1) / 1.4, 0, 1) * 0.5);
  z4birds(t, clamp((t - 4.3) / 0.9, 0, 1));

  const tp = clamp((t - 4.5) / 0.7, 0, 1);
  if (tp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(tp);
    ctx.fillStyle = 'rgba(40,44,40,0.9)';
    ctx.font = `300 30px ${FONT}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('山', 470, 46);
    ctx.fillText('水', 510, 46);
    ctx.restore();
  }
  const sp = clamp((t - 4.9) / 0.5, 0, 1);
  if (sp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(sp) * 0.86;
    ctx.fillStyle = 'rgba(40,44,40,0.84)';
    ctx.font = `400 14px ${FONT}`;
    ctx.textAlign = 'left';
    ctx.fillText('千岩万壑', 470, 78);
    ctx.restore();
  }
  const cp = clamp((t - 5.2) / 0.3, 0, 1);
  if (cp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(cp);
    ctx.translate(490, 110);
    ctx.rotate(-0.04);
    const s = 0.9 + 0.14 * (1 - easeOut(cp));
    ctx.scale(s, s);
    ctx.fillStyle = '#a8322a';
    ctx.fillRect(-11, -11, 22, 22);
    ctx.fillStyle = 'rgba(243,237,221,0.95)';
    ctx.font = `700 13px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('山', 0, 1);
    ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K3 卡哇伊 · DeepSeek Harness 生成示例</title>
<!--

  本文件：DeepSeek Harness（deepseek-flash）根据该风格提示词新写的候选示例，
  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。
  原文“只输出代码”等语句属于素材的一部分，不覆盖本任务的交付合同。
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>K3 · 卡哇伊</h1>
    <p>一只圆滚滚的豆豆眼小团子弹一下，头顶冒出一串爱心，越弹越软。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="卡哇伊 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 一只圆滚滚的豆豆眼小团子弹一下，头顶冒出一串爱心，越弹越软。
// K3 卡哇伊 · DeepSeek Harness 生成示例
const K3_BG = '#fff4f8', K3_ROSE = '#ff9eb5', K3_DEEP = '#c46a83', K3_COCOA = '#8a635f';
const K3_CREAM = '#fffaf3', K3_MINT = '#b9e7d5', K3_BLUSH = '#ffb7c8', K3_BUTTER = '#ffe6a3';

const K3_SPRINKLES = (() => {
  const r = rng(20261103);
  const cols = [K3_ROSE, K3_MINT, K3_BUTTER, '#c9b6f2'];
  return Array.from({ length: 34 }, () => ({
    x: r() * W, y: r() * H, a: r() * Math.PI, l: 5 + r() * 7, c: cols[Math.floor(r() * cols.length)], o: 0.35 + r() * 0.4,
  }));
})();
const K3_HEARTS = (() => {
  const r = rng(771);
  return Array.from({ length: 6 }, i => ({ x: i % 2 ? 500 + r() * 46 : 96 + r() * 60, d: i * 0.34, s: 9 + r() * 7, c: [K3_ROSE, '#ffc2d2', '#ff7f9d'][i % 3] }));
})();

function k3seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function k3ease(p) { return 1 - Math.pow(1 - p, 3); }
function k3back(p) { const c = 1.9, q = clamp(p, 0, 1) - 1; return 1 + (c + 1) * q * q * q + c * q * q; }
function k3heart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + 0.35 * s);
  ctx.bezierCurveTo(x - 0.95 * s, y - 0.25 * s, x - 0.55 * s, y - 1.05 * s, x, y - 0.42 * s);
  ctx.bezierCurveTo(x + 0.55 * s, y - 1.05 * s, x + 0.95 * s, y - 0.25 * s, x, y + 0.35 * s);
  ctx.closePath();
}
function k3sparkle(x, y, s) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 4;
    const rr = i % 2 ? s * 0.26 : s;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function drawScene(t) {
  // 底板
  ctx.fillStyle = K3_BG; ctx.fillRect(0, 0, W, H);

  // 背景大圆 + 光晕
  const glow = ctx.createRadialGradient(320, 210, 30, 320, 210, 300);
  glow.addColorStop(0, '#ffe3ec');
  glow.addColorStop(1, 'rgba(255,244,248,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  // 撒糖粒
  for (const s of K3_SPRINKLES) {
    ctx.save();
    ctx.globalAlpha = s.o * (0.5 + 0.5 * Math.sin(t * 1.4 + s.x * 0.05));
    ctx.translate(s.x, ((s.y + t * 5) % (H + 30)) - 15);
    ctx.rotate(s.a + Math.sin(t + s.x) * 0.2);
    ctx.fillStyle = s.c;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-s.l / 2, -2.2, s.l, 4.4, 2.2); else ctx.rect(-s.l / 2, -2.2, s.l, 4.4);
    ctx.fill();
    ctx.restore();
  }

  // 角色：出场压扁再弹回
  const inP = k3seg(t, 0, 0.75);
  const pop = k3back(inP);
  const hopP = k3seg(t, 0.95, 1.55);
  const hopY = -34 * Math.sin(hopP * Math.PI) * (hopP < 1 ? 1 : 0);
  const breathe = Math.sin(t * 3.1) * 0.028;
  const landSq = (t > 1.5 && t < 2.0) ? 0.06 * Math.sin(k3seg(t, 1.5, 2.0) * Math.PI) : 0;
  const sx = (0.64 + 0.36 * pop) * (1 + breathe + landSq);
  const sy = (0.64 + 0.36 * pop) * (1 - breathe - landSq);
  const cx = 320, cy = 214 + hopY;
  const eyeOpen = 1;

  // 影子
  ctx.save();
  ctx.globalAlpha = 0.12; ctx.fillStyle = K3_DEEP;
  ctx.beginPath(); ctx.ellipse(320, 312, 78 - hopY * 0.6, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(sx, sy);

  // 小脚
  ctx.fillStyle = K3_CREAM; ctx.strokeStyle = K3_COCOA; ctx.lineWidth = 4;
  for (const fx of [-34, 34]) {
    ctx.beginPath(); ctx.ellipse(fx, 100, 17, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // 耳朵（先画，藏在身体后面）
  ctx.fillStyle = K3_ROSE; ctx.strokeStyle = K3_COCOA; ctx.lineWidth = 4.5;
  for (const ex of [-64, 64]) {
    ctx.beginPath(); ctx.arc(ex, -80, 27, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#ffd0dc';
  for (const ex of [-64, 64]) {
    ctx.beginPath(); ctx.arc(ex, -80, 14, 0, Math.PI * 2); ctx.fill();
  }

  // 圆滚滚的身体（一个整体，没有脖子）
  const bodyGrad = ctx.createRadialGradient(-30, -40, 20, 0, 6, 120);
  bodyGrad.addColorStop(0, '#fff2f5');
  bodyGrad.addColorStop(0.55, K3_ROSE);
  bodyGrad.addColorStop(1, '#ff8aa6');
  ctx.fillStyle = bodyGrad;
  ctx.strokeStyle = K3_COCOA; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.ellipse(0, 0, 92, 88, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // 肚皮浅色块
  ctx.save();
  ctx.globalAlpha = 0.55; ctx.fillStyle = K3_CREAM;
  ctx.beginPath(); ctx.ellipse(0, 30, 54, 44, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 小短手（在身体前面，向外撇）
  ctx.strokeStyle = K3_ROSE; ctx.lineWidth = 16; ctx.lineCap = 'round';
  for (const side of [-1, 1]) {
    const wig = Math.sin(t * 4 + side * 1.4) * 0.1;
    ctx.save();
    ctx.translate(side * 82, 22);
    ctx.rotate(-side * (1.16 + wig));
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22); ctx.stroke();
    ctx.fillStyle = K3_ROSE;
    ctx.beginPath(); ctx.arc(0, 24, 9.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // 豆豆眼
  ctx.fillStyle = K3_COCOA;
  const blink = ((t + 0.6) % 3.2) < 0.1 ? 0.22 : 1;
  for (const ex of [-26, 26]) {
    ctx.beginPath(); ctx.ellipse(ex, -16, 8.5, 9.5 * blink * eyeOpen, 0, 0, Math.PI * 2); ctx.fill();
    if (blink > 0.6) {
      ctx.save(); ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ex - 2.6, -20, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  // 腮红
  ctx.save(); ctx.globalAlpha = 0.72; ctx.fillStyle = K3_BLUSH;
  for (const ex of [-52, 52]) {
    ctx.beginPath(); ctx.ellipse(ex, 8, 15, 8.5, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // 小嘴巴：ω
  const mouthOpen = k3seg(t, 2.0, 2.3) * (1 - k3seg(t, 2.9, 3.2));
  ctx.strokeStyle = K3_COCOA; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
  if (mouthOpen > 0.4) {
    ctx.fillStyle = '#d9748c';
    ctx.beginPath(); ctx.ellipse(0, 18, 9, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(-11, 14);
    ctx.quadraticCurveTo(-5.5, 21, 0, 14);
    ctx.quadraticCurveTo(5.5, 21, 11, 14);
    ctx.stroke();
  }

  // 头顶的小草莓装饰
  ctx.save();
  ctx.translate(0, -86);
  ctx.rotate(Math.sin(t * 2.2) * 0.06);
  ctx.fillStyle = '#ef6f7f'; ctx.strokeStyle = K3_COCOA; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 20);
  ctx.bezierCurveTo(-15, 6, -12, -12, 0, -12);
  ctx.bezierCurveTo(12, -12, 15, 6, 0, 20);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7fc79e';
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    ctx.lineTo(Math.cos(a) * 9, -12 + Math.sin(a) * 5);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff6d6';
  for (const [px, py] of [[-5, 2], [5, 4], [0, 10], [-7, 10], [7, 11]]) {
    ctx.beginPath(); ctx.arc(px, py, 1.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // 手臂上举时的小爱心
  if (t > 3.0) {
    for (let i = 0; i < 3; i++) {
      const p = k3seg(t, 3.0 + i * 0.18, 4.4 + i * 0.18);
      if (p <= 0) continue;
      ctx.save();
      ctx.globalAlpha = Math.sin(p * Math.PI) * 0.85;
      ctx.fillStyle = i === 1 ? K3_ROSE : '#ffc2d2';
      k3heart(-92 - i * 7, -36 - p * 26, 12 + i * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();

  // 浮动爱心（2 个周期正好 6 秒，循环无缝）
  K3_HEARTS.forEach((h, i) => {
    const p = ((t / 6) * 2 + i * 0.16) % 1;
    const y = 292 - p * 250;
    const x = h.x + Math.sin(p * 6 + i) * 14;
    ctx.save();
    ctx.globalAlpha = Math.sin(p * Math.PI) * 0.95;
    ctx.fillStyle = h.c;
    k3heart(x, y, h.s); ctx.fill();
    ctx.strokeStyle = 'rgba(185,84,110,.55)'; ctx.lineWidth = 2;
    k3heart(x, y, h.s); ctx.stroke();
    ctx.restore();
  });

  // 闪光
  ctx.save();
  ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 3.4);
  ctx.fillStyle = '#ffffff';
  for (const [x, y, s] of [[132, 118, 9], [512, 150, 11], [474, 88, 6], [176, 268, 7]]) {
    k3sparkle(x, y, s); ctx.fill();
  }
  ctx.restore();

  // 标题
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = K3_DEEP; ctx.font = `800 32px ${FONT}`;
  ctx.fillText('圆圆一小只', 320, 58);
  ctx.fillStyle = 'rgba(196,106,131,.72)'; ctx.font = `600 14px ${FONT}`;
  ctx.fillText('豆豆眼 · 小嘴巴 · 粉彩', 320, 82);
  ctx.restore();

  // 底部文案（左侧，避开右下角署名区）
  const capP = k3seg(t, 3.8, 4.6);
  if (capP > 0) {
    ctx.save();
    ctx.globalAlpha = capP;
    ctx.fillStyle = K3_COCOA; ctx.font = `700 16px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText('摸起来，软软的', 40, 330);
    ctx.restore();
  }

  // 风格标签
  ctx.save();
  ctx.globalAlpha = 0.5; ctx.fillStyle = K3_COCOA; ctx.font = `500 13px ${FONT}`; ctx.textAlign = 'left';
  ctx.fillText('K3 · 卡哇伊 / kawaii', 34, 28);
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

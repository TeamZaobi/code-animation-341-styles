<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M19 零基础科普 · DeepSeek Harness 生成示例</title>
<!--

  本文件：DeepSeek Harness（deepseek-flash）根据该风格提示词新写的候选示例，
  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。
  原文“只输出代码”等语句属于素材的一部分，不覆盖本任务的交付合同。
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>M19 · 零基础科普</h1>
    <p>先讲冰箱：把一盘菜提前放进去，想吃直接拿；再把这个道理换成专业词——「缓存」。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="零基础科普 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 先讲冰箱：把一盘菜提前放进去，想吃直接拿；再把这个道理换成专业词——「缓存」。
// M19 零基础科普 · DeepSeek Harness 生成示例
const M19_BG = '#fdf6e8', M19_INK = '#24303a', M19_ORANGE = '#e07a3c', M19_MINT = '#7fae9b', M19_GREY = '#8b8b7f';

function m19p(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

const M19_DOTS = (() => {
  const r = rng(1919);
  return Array.from({ length: 220 }, () => ({ x: r() * W, y: r() * H, a: 0.04 + r() * 0.05 }));
})();

function m19bg() {
  ctx.fillStyle = M19_BG; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(36,48,58,.5)';
  for (const d of M19_DOTS) { ctx.globalAlpha = d.a; ctx.fillRect(d.x, d.y, 1.4, 1.4); }
  ctx.globalAlpha = 1;
  const g = ctx.createRadialGradient(320, 160, 60, 320, 190, 420);
  g.addColorStop(0, 'rgba(255,255,255,.55)');
  g.addColorStop(1, 'rgba(240,225,195,.35)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function m19badge(text, x, y, active) {
  ctx.save();
  ctx.fillStyle = active ? M19_INK : 'rgba(36,48,58,.08)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, 84, 24, 12); else ctx.rect(x, y, 84, 24);
  ctx.fill();
  ctx.fillStyle = active ? M19_BG : 'rgba(36,48,58,.55)';
  ctx.font = `700 13px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x + 42, y + 12.5);
  ctx.restore();
}

// 冰箱：门绕左边打开（横向压缩），露出里面的架子和盘子
function m19fridge(openP) {
  const x = 150, y = 112, w = 168, h = 186;
  ctx.save();
  // 影子
  ctx.fillStyle = 'rgba(36,48,58,.10)';
  ctx.beginPath(); ctx.ellipse(x + w / 2 + 8, y + h + 4, w * 0.55, 9, 0, 0, Math.PI * 2); ctx.fill();
  // 箱体
  ctx.fillStyle = '#fffdf6';
  ctx.strokeStyle = M19_INK; ctx.lineWidth = 2.6;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, 12); else ctx.rect(x, y, w, h);
  ctx.fill(); ctx.stroke();
  // 内胆
  ctx.fillStyle = '#f1ece0';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x + 6, y + 6, w - 12, h - 12, 8); else ctx.rect(x + 6, y + 6, w - 12, h - 12);
  ctx.fill();
  // 两层架子
  ctx.strokeStyle = 'rgba(36,48,58,.28)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 8, y + 76); ctx.lineTo(x + w - 8, y + 76);
  ctx.moveTo(x + 8, y + 132); ctx.lineTo(x + w - 8, y + 132);
  ctx.stroke();
  // 下层的盘子 + 菜
  const px = x + w / 2, py = y + 158;
  ctx.fillStyle = '#e6e0d0';
  ctx.beginPath(); ctx.ellipse(px, py, 44, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = M19_MINT;
  ctx.beginPath(); ctx.ellipse(px, py - 5, 32, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#a9c7b6';
  ctx.beginPath(); ctx.ellipse(px - 8, py - 8, 10, 5, 0.2, 0, Math.PI * 2); ctx.fill();
  // 上层：一瓶奶
  ctx.fillStyle = '#f6f0e0';
  ctx.strokeStyle = 'rgba(36,48,58,.35)'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x + 26, y + 34, 26, 40, 5); else ctx.rect(x + 26, y + 34, 26, 40);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = M19_ORANGE;
  ctx.fillRect(x + 26, y + 52, 26, 8);
  // 门：绕左边压缩
  const sx = lerp(1, 0.1, smooth(clamp(openP, 0, 1)));
  ctx.save();
  ctx.translate(x, 0);
  ctx.scale(sx, 1);
  ctx.translate(-x, 0);
  ctx.fillStyle = '#fffdf6';
  ctx.strokeStyle = M19_INK; ctx.lineWidth = 2.6;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, 12); else ctx.rect(x, y, w, h);
  ctx.fill(); ctx.stroke();
  // 门缝与把手
  ctx.strokeStyle = 'rgba(36,48,58,.30)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(x + 4, y + 74); ctx.lineTo(x + w - 4, y + 74); ctx.stroke();
  ctx.strokeStyle = 'rgba(36,48,58,.10)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x + 4, y + 78); ctx.lineTo(x + w - 4, y + 78); ctx.stroke();
  ctx.fillStyle = M19_ORANGE;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x + w - 24, y + 36, 8, 30, 4); else ctx.rect(x + w - 24, y + 36, 8, 30);
  ctx.fill();
  ctx.strokeStyle = 'rgba(36,48,58,.20)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x + w - 16, y + 36); ctx.lineTo(x + w - 16, y + 66); ctx.stroke();
  // 门上的小磁贴
  ctx.fillStyle = M19_MINT;
  ctx.beginPath(); ctx.arc(x + 40, y + 46, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 冰箱脚的影子
  ctx.restore();
}

function m19arrow(p, x1, y1, x2, y2, color) {
  if (p <= 0) return;
  const e = 1 - Math.pow(1 - clamp(p, 0, 1), 3);
  const x = lerp(x1, x2, e), y = lerp(y1, y2, e);
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  ctx.setLineDash([]);
  const ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - Math.cos(ang - 0.4) * 9, y - Math.sin(ang - 0.4) * 9);
  ctx.lineTo(x - Math.cos(ang + 0.4) * 9, y - Math.sin(ang + 0.4) * 9);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawScene(t) {
  m19bg();

  // 顶部：步骤
  m19badge('01 生活里', 48, 24, t < 2.1);
  m19badge('02 提前放', 138, 24, t >= 2.1 && t < 3.7);
  m19badge('03 专业词', 228, 24, t >= 3.7);

  // 标题
  ctx.save();
  ctx.fillStyle = M19_INK;
  ctx.font = `800 26px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('先放好，再取用', 48, 86);
  ctx.fillStyle = M19_GREY;
  ctx.font = `400 14px ${FONT}`;
  ctx.fillText('零基础科普 · 拿冰箱讲清楚「缓存」', 48, 108);
  ctx.restore();

  const openP = m19p(t, 1.75, 2.5);
  m19fridge(openP);

  // 右侧的讲解，一句一句换
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (t < 2.4) {
    const p = m19p(t, 0.35, 1.0) * (1 - m19p(t, 2.15, 2.4));
    ctx.globalAlpha = clamp(p, 0, 1);
    ctx.fillStyle = M19_INK; ctx.font = `700 19px ${FONT}`;
    ctx.fillText('冰箱里，先放好一盘菜', 360, 158);
    ctx.fillStyle = M19_GREY; ctx.font = `400 14px ${FONT}`;
    ctx.fillText('不用每次饿了都从头做', 360, 184);
  } else if (t < 3.9) {
    const p = m19p(t, 2.4, 2.9) * (1 - m19p(t, 3.7, 3.95));
    ctx.globalAlpha = clamp(p, 0, 1);
    ctx.fillStyle = M19_INK; ctx.font = `700 19px ${FONT}`;
    ctx.fillText('想吃的时候，打开就拿', 360, 158);
    ctx.fillStyle = M19_GREY; ctx.font = `400 14px ${FONT}`;
    ctx.fillText('省掉的，是每次重做的时间', 360, 184);
  } else {
    const p = m19p(t, 3.9, 4.4);
    ctx.globalAlpha = clamp(p, 0, 1);
    ctx.fillStyle = M19_INK; ctx.font = `700 19px ${FONT}`;
    ctx.fillText('这个思路，有个名字', 360, 132);
  }
  ctx.restore();

  // 第三步：箭头 + 术语卡片
  m19arrow(m19p(t, 3.6, 4.3), 330, 268, 392, 240, M19_ORANGE);
  const cp = m19p(t, 3.95, 4.6);
  if (cp > 0) {
    const e = 1 - Math.pow(1 - cp, 3);
    ctx.save();
    ctx.globalAlpha = clamp(cp * 1.5, 0, 1);
    ctx.translate(0, (1 - e) * 8);
    const bx = 396, by = 176, bw = 208, bh = 96;
    ctx.fillStyle = 'rgba(36,48,58,.10)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx + 5, by + 6, bw, bh, 10); else ctx.rect(bx + 5, by + 6, bw, bh);
    ctx.fill();
    ctx.fillStyle = '#fffdf6';
    ctx.strokeStyle = M19_ORANGE; ctx.lineWidth = 2.4;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 10); else ctx.rect(bx, by, bw, bh);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = M19_ORANGE;
    ctx.font = `500 13px ${FONT}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('CACHE', bx + 18, by + 26);
    ctx.fillStyle = M19_INK;
    ctx.font = `800 26px ${FONT}`;
    ctx.fillText('缓存', bx + 18, by + 58);
    ctx.fillStyle = M19_GREY;
    ctx.font = `400 14px ${FONT}`;
    ctx.fillText('把常用的，先放在手边', bx + 18, by + 80);
    ctx.restore();
  }

  // 收束的一句
  const fp = m19p(t, 5.0, 5.6);
  if (fp > 0) {
    ctx.save();
    ctx.globalAlpha = fp;
    ctx.fillStyle = M19_INK;
    ctx.font = `500 15px ${FONT}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('术语只是把生活里的道理，说得更准一点', 48, 336);
    ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<body>
<div id="app">
  <div id="head">

    <p>青花梅瓶：钴蓝一线勾出器形，缠枝莲自肩及足漫开，釉下晕散与铁锈斑渐显。</p>

<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 青花梅瓶：钴蓝一线勾出器形，缠枝莲自肩及足漫开，釉下晕散与铁锈斑渐显。
// Z9 青花 · DeepSeek Harness 生成示例

const Z9_COBALT = '#24518f', Z9_COBALT_L = '#4b79b6', Z9_PORCELAIN = '#f4f6f3';

// 白瓷背景 + 冰裂纹
const Z9_BG = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, W, H);
  grd.addColorStop(0, '#f7f9f6');
  grd.addColorStop(0.5, '#eef1ee');
  grd.addColorStop(1, '#e3e8e4');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  // 冰裂纹
  const r = rng(90210);
  g.strokeStyle = 'rgba(140,155,160,0.10)';
  for (let i = 0; i < 26; i++) {
    let x = r() * W, y = r() * H;
    g.lineWidth = 0.5 + r() * 0.6;
    g.beginPath();
    g.moveTo(x, y);
    for (let k = 0; k < 4; k++) {
      x += (r() - 0.5) * 70;
      y += (r() - 0.5) * 60;
      g.lineTo(x, y);
    }
    g.stroke();
  }
  const vg = g.createRadialGradient(W * 0.45, H * 0.42, 120, W * 0.45, H * 0.42, 430);
  vg.addColorStop(0, 'rgba(255,255,255,0.5)');
  vg.addColorStop(1, 'rgba(120,140,145,0.16)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return c;
})();

// 缠枝莲：离屏一次画好，再按时序揭开
const Z9_PATTERN = (() => {
  const PW = 152, PH = 198;
  const c = document.createElement('canvas'); c.width = PW; c.height = PH;
  const g = c.getContext('2d');
  const r = rng(3311);

  function vines(gg, main) {
    const rows = [30, 84, 138, 190];
    rows.forEach((ly, ri) => {
      // 主枝：波浪
      gg.beginPath();
      gg.lineWidth = main ? 2.8 : 4.4;
      gg.moveTo(-6, ly + 10);
      for (let x = -6; x <= PW + 6; x += 4) {
        const y = ly + Math.sin(x * 0.075 + ri * 1.7) * 12;
        gg.lineTo(x, y);
      }
      gg.stroke();
      // 卷须
      for (let k = 0; k < 4; k++) {
        const cx = 12 + k * 40 + ri * 9;
        const cy = ly + Math.sin(cx * 0.075 + ri * 1.7) * 12;
        gg.beginPath();
        gg.lineWidth = main ? 1.6 : 2.4;
        gg.arc(cx, cy - 4, 9, 0.4, Math.PI * 1.9);
        gg.stroke();
        gg.beginPath();
        gg.arc(cx, cy - 4, 4.6, 1.2, Math.PI * 2.6);
        gg.stroke();
      }
      // 叶
      for (let k = 0; k < 7; k++) {
        const lx = 6 + k * 23 + (ri % 2) * 9;
        const ly2 = ly + Math.sin(lx * 0.075 + ri * 1.7) * 12;
        const side = k % 2 ? 1 : -1;
        gg.save();
        gg.translate(lx, ly2);
        gg.rotate(side * (0.9 + (r() - 0.5) * 0.3));
        gg.beginPath();
        gg.moveTo(0, 0);
        gg.quadraticCurveTo(9, -5 * side, 20, 0);
        gg.quadraticCurveTo(9, 5 * side, 0, 0);
        gg.closePath();
        gg.fill();
        gg.restore();
      }
      // 莲：五瓣
      for (let fi = 0; fi < 2; fi++) {
        const fx = 26 + ri * 30 + fi * 62;
        const fy = ly + Math.sin(fx * 0.075 + ri * 1.7) * 12 - 4;
        for (let p = 0; p < 5; p++) {
          const a = -Math.PI / 2 + p * (Math.PI * 2 / 5);
          gg.save();
          gg.translate(fx, fy);
          gg.rotate(a);
          gg.beginPath();
          gg.moveTo(0, 0);
          gg.quadraticCurveTo(8, -10, 0, -19);
          gg.quadraticCurveTo(-8, -10, 0, 0);
          gg.closePath();
          gg.fill();
          gg.restore();
        }
        gg.beginPath();
        gg.arc(fx, fy, 3.2, 0, Math.PI * 2);
        gg.fill();
      }
      gg.beginPath();
    });
    // 斜向缠枝：只在行间回绕，不贯穿全高
    for (let k = 0; k < 3; k++) {
      const sx = 24 + k * 50;
      gg.beginPath();
      gg.lineWidth = main ? 1.8 : 3;
      gg.moveTo(sx, 24);
      gg.bezierCurveTo(sx + 26, 58, sx - 22, 96, sx + 14, 132);
      gg.stroke();
    }
    for (let k = 0; k < 3; k++) {
      const sx = 40 + k * 46;
      gg.beginPath();
      gg.lineWidth = main ? 1.8 : 3;
      gg.moveTo(sx, 130);
      gg.bezierCurveTo(sx + 24, 158, sx - 20, 182, sx + 10, PH - 14);
      gg.stroke();
    }
    // 肩部如意云头
    for (let k = 0; k < 4; k++) {
      const cx = 20 + k * 38;
      gg.beginPath();
      gg.lineWidth = main ? 1.8 : 2.8;
      gg.moveTo(cx - 14, 6);
      gg.quadraticCurveTo(cx, -8, cx + 14, 6);
      gg.quadraticCurveTo(cx, 16, cx - 14, 6);
      gg.stroke();
    }
    // 底部莲瓣
    for (let k = 0; k < 7; k++) {
      const cx = 10 + k * 22;
      gg.beginPath();
      gg.lineWidth = main ? 1.6 : 2.4;
      gg.moveTo(cx - 8, PH - 6);
      gg.quadraticCurveTo(cx, PH - 26, cx + 8, PH - 6);
      gg.stroke();
    }
  }

  // 晕散层
  g.save();
  g.filter = 'blur(2.4px)';
  g.globalAlpha = 0.5;
  g.strokeStyle = Z9_COBALT_L;
  g.fillStyle = Z9_COBALT_L;
  vines(g, false);
  g.restore();
  // 清晰层
  g.save();
  g.strokeStyle = Z9_COBALT;
  g.fillStyle = Z9_COBALT;
  vines(g, true);
  g.restore();
  // 铁锈斑
  const rs = rng(778);
  for (let i = 0; i < 60; i++) {
    const x = rs() * PW, y = rs() * PH;
    g.fillStyle = `rgba(20,40,80,${0.25 + rs() * 0.45})`;
    g.beginPath();
    g.arc(x, y, 0.5 + rs() * 1.5, 0, Math.PI * 2);
    g.fill();
  }
  return c;
})();

function z9seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

// 梅瓶器形（对称）
function z9vasePath() {
  ctx.beginPath();
  ctx.moveTo(296, 62);
  ctx.bezierCurveTo(296, 50, 344, 50, 344, 62);   // 口
  ctx.lineTo(336, 70);
  ctx.bezierCurveTo(333, 84, 335, 92, 336, 100); // 颈
  ctx.bezierCurveTo(345, 112, 372, 118, 380, 138); // 肩
  ctx.bezierCurveTo(394, 168, 396, 210, 384, 240);
  ctx.bezierCurveTo(374, 268, 362, 282, 356, 292); // 腹收
  ctx.lineTo(356, 300);
  ctx.bezierCurveTo(368, 302, 372, 310, 362, 312);
  ctx.lineTo(278, 312);
  ctx.bezierCurveTo(268, 310, 272, 302, 284, 300);
  ctx.lineTo(284, 292);
  ctx.bezierCurveTo(278, 282, 266, 268, 256, 240);
  ctx.bezierCurveTo(244, 210, 246, 168, 260, 138);
  ctx.bezierCurveTo(268, 118, 295, 112, 306, 100);
  ctx.bezierCurveTo(307, 92, 308, 84, 304, 70);
  ctx.closePath();
}

function z9shadow(p) {
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha = p * 0.5;
  const g = ctx.createRadialGradient(320, 318, 4, 320, 318, 100);
  g.addColorStop(0, 'rgba(90,110,110,0.42)');
  g.addColorStop(1, 'rgba(90,110,110,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(320, 318, 100, 16, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function z9vaseBody(alpha, t) {
  ctx.save();
  ctx.globalAlpha = alpha;
  // 瓷胎
  const grd = ctx.createLinearGradient(250, 0, 392, 0);
  grd.addColorStop(0, '#ffffff');
  grd.addColorStop(0.35, '#f7faf8');
  grd.addColorStop(0.78, '#e6ece8');
  grd.addColorStop(1, '#d3ded9');
  ctx.fillStyle = grd;
  z9vasePath();
  ctx.fill();
  // 釉面高光
  ctx.save();
  z9vasePath();
  ctx.clip();
  const hs = Math.sin(t * 0.75) * 9;
  const hl = ctx.createLinearGradient(268 + hs, 60, 302 + hs, 300);
  hl.addColorStop(0, 'rgba(255,255,255,0)');
  hl.addColorStop(0.35, 'rgba(255,255,255,0.7)');
  hl.addColorStop(0.55, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl;
  ctx.fillRect(246 + hs, 50, 64, 270);
  // 第二道细小反光，缓慢游走
  const hs2 = Math.cos(t * 0.55) * 14;
  const hl2 = ctx.createLinearGradient(360 + hs2, 90, 380 + hs2, 260);
  hl2.addColorStop(0, 'rgba(255,255,255,0)');
  hl2.addColorStop(0.45, 'rgba(255,255,255,0.34)');
  hl2.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl2;
  ctx.fillRect(352 + hs2, 80, 26, 200);
  ctx.restore();
  ctx.restore();
}

function drawScene(t) {
  ctx.drawImage(Z9_BG, 0, 0);

  // 极缓推近，全段都有呼吸般的位移
  ctx.save();
  const zoom = 1 + 0.013 * Math.sin(t * 0.8 + 0.4);
  ctx.translate(320, 192);
  ctx.scale(zoom, zoom);
  ctx.translate(-320, -192);

  // 器形：一笔勾出
  const vp = z9seg(t, 0.05, 1.7);
  if (vp > 0) {
    z9shadow(easeOut(vp));
    z9vaseBody(easeOut(clamp(vp * 1.6 - 0.35, 0, 1)), t);
    const per = 760;
    ctx.save();
    ctx.strokeStyle = 'rgba(36,81,143,0.85)';
    ctx.lineWidth = 2.2;
    ctx.setLineDash([per * easeOut(vp), per]);
    z9vasePath();
    ctx.stroke();
    ctx.restore();
  }

  // 花纹：自上而下分水
  const pp = z9seg(t, 1.5, 3.5);
  if (pp > 0) {
    ctx.save();
    z9vasePath();
    ctx.clip();
    const cy = 96 + 198 * easeOut(pp);
    ctx.beginPath();
    ctx.rect(240, 90, 160, cy - 90);
    ctx.clip();
    ctx.globalAlpha = 0.96;
    ctx.drawImage(Z9_PATTERN, 244 + Math.sin(t * 0.5) * 1.6, 96);
    ctx.restore();
    // 分水口的一线湿痕
    if (pp < 0.99) {
      ctx.save();
      z9vasePath();
      ctx.clip();
      ctx.globalAlpha = 0.35 * (1 - pp);
      ctx.fillStyle = Z9_COBALT_L;
      ctx.beginPath();
      ctx.ellipse(320, cy, 62, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // 弦纹
  const lp = z9seg(t, 1.15, 2.0);
  if (lp > 0) {
    ctx.save();
    ctx.strokeStyle = 'rgba(36,81,143,0.85)';
    ctx.lineWidth = 1.8;
    ctx.globalAlpha = easeOut(lp);
    for (const y of [72, 84]) {
      ctx.beginPath();
      ctx.moveTo(306 + (y - 72) * 0.12, y);
      ctx.lineTo(334 - (y - 72) * 0.12, y);
      ctx.stroke();
    }
    for (const y of [296, 304]) {
      ctx.beginPath();
      ctx.moveTo(286, y); ctx.lineTo(354, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 晕散：钴蓝往胎里洇
  const bp = z9seg(t, 3.0, 4.6);
  if (bp > 0) {
    ctx.save();
    z9vasePath();
    ctx.clip();
    const spots = [[300, 150, 26], [352, 210, 30], [286, 236, 22], [330, 120, 18]];
    spots.forEach(([x, y, rr], i) => {
      const a = easeOut(clamp(bp * 1.3 - i * 0.14, 0, 1));
      const g = ctx.createRadialGradient(x, y, 2, x, y, rr * (0.6 + 0.4 * a));
      g.addColorStop(0, `rgba(60,110,180,${0.20 * a})`);
      g.addColorStop(0.6, `rgba(60,110,180,${0.09 * a})`);
      g.addColorStop(1, 'rgba(60,110,180,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, rr * (0.6 + 0.4 * a), 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  ctx.restore();

  // 题字
  const tp = z9seg(t, 4.3, 5.0);
  if (tp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(tp);
    ctx.fillStyle = '#1f4a86';
    ctx.font = `300 30px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('青', 574, 88);
    ctx.fillText('花', 574, 126);
    ctx.font = `400 15px ${FONT}`;
    ctx.fillStyle = 'rgba(31,74,134,0.85)';
    ctx.fillText('缠枝莲', 574, 164);
    ctx.restore();
  }
  const sp = z9seg(t, 4.95, 5.35);
  if (sp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(sp) * 0.9;
    ctx.fillStyle = 'rgba(31,74,134,0.75)';
    ctx.font = `400 13px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText('白地青花', 574, 194);
    ctx.restore();
  }
  // 底款
  const cp = z9seg(t, 5.2, 5.5);
  if (cp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(cp);
    ctx.translate(320, 334);
    ctx.strokeStyle = 'rgba(36,81,143,0.9)';
    ctx.lineWidth = 1.4;
    ctx.strokeRect(-11, -9, 22, 18);
    ctx.fillStyle = 'rgba(36,81,143,0.95)';
    ctx.font = `700 11px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('青', 0, 1);
    ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>

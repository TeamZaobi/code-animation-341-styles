<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H9 Coral · DeepSeek Harness 生成示例</title>
<!--

  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>H9 · Coral</h1>
    <p>奶油底珊瑚色海报：压缩全大写字 MAKE IT REAL 从基线升起，右侧珊瑚拱门展开，底部字幕持续滚动。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="Coral 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 奶油底珊瑚色海报：压缩全大写字 MAKE IT REAL 从基线升起，右侧珊瑚拱门展开，底部字幕持续滚动。
// H9 Coral · DeepSeek Harness 生成示例
const H9_CREAM = '#fbf0e2', H9_CORAL = '#ff6b57', H9_INK = '#24201d';
const H9_SOFT = '#ffc9bf', H9_MUTED = '#8a7b6f';

function h9seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function h9ease(t) { return 1 - Math.pow(1 - t, 3); }
function h9mix(a, b, u) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  return 'rgb(' + Math.round(lerp((pa >> 16) & 255, (pb >> 16) & 255, u)) + ',' +
    Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, u)) + ',' +
    Math.round(lerp(pa & 255, pb & 255, u)) + ')';
}
// 横向压缩的全大写标题
function h9caps(text, x, y, size, color, p, scaleX) {
  if (p <= 0) return;
  const e = h9ease(clamp(p, 0, 1));
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scaleX || 0.74, 1);
  ctx.font = `900 ${size}px "Arial Black","Helvetica Neue",Arial,${FONT}`;
  const tw = ctx.measureText(text).width;
  ctx.beginPath(); ctx.rect(-6, -size * 0.82, (tw + 12) * e, size * 1.0); ctx.clip();
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, 0, 0);
  ctx.restore();
}
function h9track(text, x, y, gap, size, weight, color, align) {
  ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  let total = 0; for (const ch of text) total += ctx.measureText(ch).width + gap;
  total -= gap;
  let cx = align === 'right' ? x - total : x;
  ctx.textAlign = 'left';
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + gap; }
  ctx.restore();
}
function h9arch(x, y, w, h, p) {
  if (p <= 0) return;
  const reveal = h * h9ease(clamp(p, 0, 1));
  ctx.save();
  ctx.beginPath(); ctx.rect(x - 2, y + h - reveal, w + 4, reveal + 2); ctx.clip();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, [96, 96, 8, 8]);
  else {
    ctx.moveTo(x, y + 96); ctx.arc(x + 96, y + 96, 96, Math.PI, 0);
    ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath();
  }
  ctx.fillStyle = H9_CORAL; ctx.fill();
  ctx.restore();
}

function drawScene(t) {
  const bu = 0.5 - 0.5 * Math.cos(t * Math.PI * 2 / 6);
  ctx.fillStyle = h9mix(H9_CREAM, '#f6e5d1', bu * 0.9); ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(Math.sin(t * 0.7) * 2.0, Math.cos(t * 0.5) * 1.4);

  // 顶部标记
  h9track('CORAL / POSTER 09', 34, 28, 2, 9, 700, H9_INK);
  h9track('全大写 · 奶油底 · 珊瑚色', 606, 28, 1.6, 9, 600, H9_MUTED, 'right');
  const rp = h9seg(t, -0.1, 0.55);
  if (rp > 0) {
    ctx.save(); ctx.fillStyle = H9_CORAL; ctx.fillRect(34, 37, 572 * h9ease(rp), 2); ctx.restore();
  }

  // 右侧珊瑚拱门
  h9arch(424, 64, 192, 236, h9seg(t, -0.5, 0.7));
  // 拱门内容
  const ap = h9seg(t, 0.7, 1.45);
  if (ap > 0) {
    ctx.save(); ctx.globalAlpha = h9ease(ap);
    ctx.fillStyle = H9_CREAM; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = `900 64px ${FONT}`;
    ctx.fillText('做', 446, 164);
    ctx.strokeStyle = 'rgba(251,240,226,.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(448, 182); ctx.lineTo(590, 182); ctx.stroke();
    const steps = ['01  起念', '02  动手', '03  成形'];
    ctx.font = `600 13px ${FONT}`;
    steps.forEach((s, i) => {
      const y = 204 + i * 22;
      ctx.fillStyle = 'rgba(251,240,226,.95)'; ctx.fillText(s, 448, y);
      ctx.fillStyle = 'rgba(251,240,226,.3)'; ctx.fillRect(448, y + 6, 142, 1);
    });
    ctx.fillStyle = 'rgba(251,240,226,.8)'; ctx.font = `500 9px ${FONT}`;
    ctx.fillText('MAKE IT REAL', 448, 284);
    ctx.restore();
    // 拱门里缓慢转动的奶油虚线环
    const ringP = h9seg(t, 1.4, 2.0);
    if (ringP > 0) {
      ctx.save(); ctx.globalAlpha = 0.55 * h9ease(ringP);
      ctx.translate(560, 108); ctx.rotate(t * 0.2);
      ctx.strokeStyle = H9_CREAM; ctx.lineWidth = 1.2; ctx.setLineDash([3, 9]);
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  // 主标题三行
  h9caps('MAKE', 34, 132, 96, H9_INK, i0(t));
  h9caps('IT', 34, 204, 96, H9_INK, i1(t));
  h9caps('REAL', 34, 274, 96, H9_CORAL, i2(t));
  function i0(tt) { return 0.55 + 0.45 * h9seg(tt, -0.4, 0.45); }
  function i1(tt) { return 0.35 + 0.65 * h9seg(tt, -0.2, 0.6); }
  function i2(tt) { return 0.12 + 0.88 * h9seg(tt, 0, 0.85); }

  // 珊瑚短横线：压在 REAL 下
  const up = h9seg(t, 1.55, 2.1);
  if (up > 0) {
    ctx.save(); ctx.fillStyle = H9_CORAL;
    ctx.fillRect(36, 286, 150 * h9ease(up), 6);
    ctx.restore();
  }
  // 中文副题
  const sp = h9seg(t, 1.35, 1.95);
  if (sp > 0) {
    ctx.save(); ctx.globalAlpha = h9ease(sp);
    ctx.fillStyle = H9_INK; ctx.font = `600 15px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText('把想法做成真的。', 196, 296);
    ctx.restore();
  }
  // 一个小箭头指向拱门
  const arp = h9seg(t, 2.15, 2.7);
  if (arp > 0) {
    const e = h9ease(arp);
    ctx.save(); ctx.strokeStyle = H9_CORAL; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(352, 248); ctx.lineTo(352 + 40 * e, 248);
    ctx.lineTo(352 + 30 * e, 240); ctx.moveTo(352 + 40 * e, 248); ctx.lineTo(352 + 30 * e, 256);
    ctx.stroke(); ctx.restore();
  }

  // 底部滚动字幕
  ctx.save();
  ctx.fillStyle = H9_CREAM; ctx.fillRect(0, 312, W, 20);
  ctx.fillStyle = H9_CORAL; ctx.fillRect(0, 312, W, 1.2); ctx.fillRect(0, 331, W, 1.2);
  ctx.beginPath(); ctx.rect(0, 312, W, 20); ctx.clip();
  ctx.font = `700 10px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const tk = '做了才算  /  MAKE IT REAL  /  先动手  /  ';
  const tw = ctx.measureText(tk).width;
  const off = -((t * 46) % tw);
  for (let x = off; x < W + tw; x += tw) {
    ctx.fillStyle = H9_CORAL; ctx.fillText(tk, x, 323);
  }
  ctx.restore();

  // 缓慢漂浮的小圆点
  const dotP = h9ease(h9seg(t, 1.9, 2.4));
  if (dotP > 0) {
    ctx.save(); ctx.globalAlpha = 0.7 * dotP;
    ctx.fillStyle = H9_CORAL;
    ctx.beginPath(); ctx.arc(384 + Math.sin(t * 0.9) * 5, 104 + Math.cos(t * 0.7) * 5, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H7 Cartesian · DeepSeek Harness 生成示例</title>
<!--

  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>H7 · Cartesian</h1>
    <p>极简笛卡尔坐标系：暖羊皮纸上细轴与刻度生长，一个墨点在留白里落在坐标上并连向下一步。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="Cartesian 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 极简笛卡尔坐标系：暖羊皮纸上细轴与刻度生长，一个墨点在留白里落在坐标上并连向下一步。
// H7 Cartesian · DeepSeek Harness 生成示例
const H7_PAPER = '#f2ead9', H7_INK = '#2a251f', H7_TAUPE = '#a1907a';
const H7_FAINT = '#d8ccb7', H7_MUTED = '#7d6f5d';

function h7seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function h7ease(t) { return 1 - Math.pow(1 - t, 3); }
function h7line(x1, y1, x2, y2, color, w, p) {
  if (p <= 0) return;
  const e = h7ease(clamp(p, 0, 1));
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w || 1;
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(lerp(x1, x2, e), lerp(y1, y2, e)); ctx.stroke(); ctx.restore();
}
function h7mix(a, b, u) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  return 'rgb(' + Math.round(lerp((pa >> 16) & 255, (pb >> 16) & 255, u)) + ',' +
    Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, u)) + ',' +
    Math.round(lerp(pa & 255, pb & 255, u)) + ')';
}
function h7track(text, x, y, gap, size, weight, color) {
  ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  let cx = x; ctx.textAlign = 'left';
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + gap; }
  ctx.restore();
}
function h7clip(text, x, y, size, weight, color, p, gap) {
  if (p <= 0) return;
  ctx.save();
  ctx.font = `${weight} ${size}px ${FONT}`;
  const e = h7ease(clamp(p, 0, 1));
  let tw = 0; for (const ch of text) tw += ctx.measureText(ch).width + (gap || 0);
  ctx.beginPath(); ctx.rect(x - 6, y - size * 1.1, (tw + 12) * e, size * 1.35); ctx.clip();
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let cx = x; for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + (gap || 0); }
  ctx.restore();
}

function drawScene(t) {
  const bu = 0.5 - 0.5 * Math.cos(t * Math.PI * 2 / 6);
  ctx.fillStyle = h7mix(H7_PAPER, '#e7d9c1', bu); ctx.fillRect(0, 0, W, H);
  // 极轻视差
  ctx.save();
  ctx.translate(Math.sin(t * 0.7) * 2.0, Math.cos(t * 0.5) * 1.5);
  // 纸面细颗粒
  ctx.save(); ctx.fillStyle = 'rgba(120,100,70,.05)';
  for (let i = 0; i < 90; i++) ctx.fillRect((i * 71) % W, (i * 37) % H, 1.6, 1.6);
  ctx.restore();

  // 坐标轴
  const ax = 92, ay = 276;
  h7line(ax, ay, ax, 40, H7_TAUPE, 1, h7seg(t, -0.2, 0.6));
  h7line(ax, ay, 606, ay, H7_TAUPE, 1, h7seg(t, -0.1, 0.7));
  // 刻度
  for (let i = 1; i <= 7; i++) {
    const p = h7seg(t, 0.35 + i * 0.07, 0.7 + i * 0.07);
    if (p <= 0) continue;
    ctx.save(); ctx.globalAlpha = p * 0.75;
    ctx.strokeStyle = H7_TAUPE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ax - 3, ay - i * 32); ctx.lineTo(ax + 3, ay - i * 32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax + i * 64, ay - 3); ctx.lineTo(ax + i * 64, ay + 3); ctx.stroke();
    ctx.restore();
  }
  // 轴标
  ctx.save(); ctx.fillStyle = H7_TAUPE; ctx.font = `400 11px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillText('y', ax, 32); ctx.fillText('x', 614, ay + 4);
  ctx.textAlign = 'right'; ctx.fillText('0', ax - 9, ay + 16);
  ctx.restore();

  // 页眉
  h7track('CARTESIAN / 07', 40, 28, 2, 9, 700, H7_MUTED);
  ctx.save(); ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(125,111,93,.7)'; ctx.font = `500 8px ${FONT}`;
  ctx.fillText('A QUIET COMPOSITION', 600, 28); ctx.restore();

  // 标题
  h7clip('从原点出发', 150, 128, 40, 300, H7_INK, 0.58 + 0.42 * h7seg(t, 0, 0.85), 5);
  // 标题下的短竖线
  h7line(150, 144, 150, 190, H7_TAUPE, 1, h7seg(t, 0.8, 1.3));
  // 副题
  const subP = h7seg(t, 1.15, 1.7);
  if (subP > 0) {
    ctx.save(); ctx.globalAlpha = h7ease(subP);
    ctx.fillStyle = H7_MUTED; ctx.font = `400 14px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText('先定一个点，再画下一步。', 170, 176);
    ctx.restore();
  }

  // 点 A：起点
  const ap = h7ease(h7seg(t, 1.25, 1.7));
  const A = [250, 226], B = [500, 190];
  if (ap > 0) {
    ctx.save(); ctx.globalAlpha = ap;
    ctx.fillStyle = H7_INK; ctx.beginPath(); ctx.arc(A[0], A[1], 3.6, 0, Math.PI * 2); ctx.fill();
    // 十字准线
    ctx.strokeStyle = 'rgba(42,37,31,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(A[0] - 14, A[1]); ctx.lineTo(A[0] + 14, A[1]);
    ctx.moveTo(A[0], A[1] - 14); ctx.lineTo(A[0], A[1] + 14); ctx.stroke();
    // 扩散环
    const ring = h7seg(t, 1.45, 2.2);
    if (ring > 0) {
      ctx.globalAlpha = ap * (1 - ring) * 0.8;
      ctx.beginPath(); ctx.arc(A[0], A[1], 4 + ring * 18, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = ap;
    ctx.fillStyle = H7_MUTED; ctx.font = `500 12px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText('A / 起点', A[0] + 18, A[1] + 4);
    ctx.restore();
  }

  // 连向下一步的细曲线
  const lp = h7ease(h7seg(t, 2.15, 3.15));
  if (lp > 0) {
    ctx.save();
    ctx.strokeStyle = H7_TAUPE; ctx.lineWidth = 1.2; ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.moveTo(A[0], A[1]);
    const N = 40;
    for (let i = 1; i <= N * lp; i++) {
      const u = i / N;
      const x = lerp(A[0], B[0], u) + Math.sin(u * Math.PI) * 18;
      const y = lerp(A[1], B[1], u) - Math.sin(u * Math.PI) * 22;
      ctx.lineTo(x, y);
    }
    ctx.stroke(); ctx.restore();
  }

  // 点 B
  const bp = h7ease(h7seg(t, 3.0, 3.45));
  if (bp > 0) {
    ctx.save(); ctx.globalAlpha = bp;
    ctx.fillStyle = H7_INK; ctx.beginPath(); ctx.arc(B[0], B[1], 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(42,37,31,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(B[0] - 12, B[1]); ctx.lineTo(B[0] + 12, B[1]);
    ctx.moveTo(B[0], B[1] - 12); ctx.lineTo(B[0], B[1] + 12); ctx.stroke();
    ctx.fillStyle = H7_MUTED; ctx.font = `500 12px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText('B / 下一步', B[0] + 16, B[1] + 4);
    ctx.restore();
  }
  // 沿曲线往返滑动的小点：后半段持续运动
  if (t > 2.3) {
    const u = 0.5 - 0.5 * Math.cos((t - 2.3) * 0.95);
    const x = lerp(A[0], B[0], u) + Math.sin(u * Math.PI) * 18;
    const y = lerp(A[1], B[1], u) - Math.sin(u * Math.PI) * 22;
    ctx.save();
    ctx.fillStyle = H7_MUTED; ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // 右侧细线与留白注记
  const vp = h7seg(t, 3.9, 4.6);
  h7line(584, 74, 584, 196, 'rgba(161,144,122,.6)', 1, vp);
  const np = h7seg(t, 4.3, 4.9);
  if (np > 0) {
    ctx.save(); ctx.globalAlpha = h7ease(np);
    ctx.fillStyle = H7_MUTED; ctx.font = `400 14px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText('留白，是构图的一部分。', 408, 236);
    ctx.strokeStyle = 'rgba(161,144,122,.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(408, 248); ctx.lineTo(408 + 190 * h7ease(np), 248); ctx.stroke();
    ctx.restore();
  }

  // 底部坐标注记
  ctx.save();
  ctx.fillStyle = 'rgba(125,111,93,.8)'; ctx.font = `500 11px ${FONT}`; ctx.textAlign = 'left';
  ctx.fillText('(0, 0)', 100, ay + 20);
  ctx.fillStyle = 'rgba(125,111,93,.5)'; ctx.font = `400 9px ${FONT}`;
  ctx.fillText('640 × 360 / 6S', 40, 330);
  ctx.restore();

  // 竖线旁的小注记
  const vlab = h7seg(t, 4.5, 5.0);
  if (vlab > 0) {
    ctx.save(); ctx.globalAlpha = h7ease(vlab) * 0.8;
    ctx.translate(578, 210); ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = H7_TAUPE; ctx.font = `400 9px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText('留白 / 余白', 0, 0);
    ctx.restore();
  }

  // 右下极小的 + 标记
  ctx.save(); ctx.strokeStyle = 'rgba(125,111,93,.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(600, 312); ctx.lineTo(612, 312); ctx.moveTo(606, 306); ctx.lineTo(606, 318); ctx.stroke(); ctx.restore();

  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

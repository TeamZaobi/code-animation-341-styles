<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K16 中世纪现代 · DeepSeek Harness 生成示例</title>
<!--

  本文件：DeepSeek Harness（deepseek-flash）根据该风格提示词新写的候选示例，
  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。
  原文“只输出代码”等语句属于素材的一部分，不覆盖本任务的交付合同。
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>K16 · 中世纪现代</h1>
    <p>50 年代广告版式：奶油底、青绿大圆与芥末星芒，几何化的短发女郎抬手指向「想法」星标。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="中世纪现代 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 50 年代广告版式：奶油底、青绿大圆与芥末星芒，几何化的短发女郎抬手指向「想法」星标。
const K16_CREAM = '#f3ebd7';
const K16_INK = '#22303a';
const K16_TEAL = '#2c7a78';
const K16_MUST = '#e3a72f';
const K16_CORAL = '#dd6342';
const K16_SKIN = '#f0c39b';
const K16_SAND = '#e8d9b8';

function k16seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function k16ease(p) { return 1 - Math.pow(1 - p, 3); }
function k16pop(p) {
  p = clamp(p, 0, 1);
  const c1 = 1.6, c3 = c1 + 1;
  return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
}
function k16Star(x, y, r1, r2, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + (i * Math.PI) / n;
    const r = i % 2 ? r2 : r1;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    else ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}

function k16Woman(t) {
  const rise = k16pop(k16seg(t, -0.35, 1.15));
  const bob = Math.sin(t * 2.1) * 2;
  const arm = k16ease(k16seg(t, 1.5, 2.3));
  ctx.save();
  ctx.translate(232, 318 + (1 - rise) * 150 + bob);

  // 影子
  ctx.fillStyle = 'rgba(34,48,58,.10)';
  ctx.beginPath(); ctx.ellipse(0, 2, 66, 9, 0, 0, Math.PI * 2); ctx.fill();

  // 腿
  ctx.strokeStyle = K16_INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-18, -52); ctx.lineTo(-24, -6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18, -52); ctx.lineTo(26, -6); ctx.stroke();
  // 鞋
  ctx.fillStyle = K16_MUST;
  ctx.beginPath(); ctx.ellipse(-29, -2, 15, 6, -0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(31, -2, 15, 6, 0.1, 0, Math.PI * 2); ctx.fill();

  // 裙子（A 字三角）
  ctx.fillStyle = K16_CORAL;
  ctx.beginPath();
  ctx.moveTo(-30, -160);
  ctx.lineTo(30, -160);
  ctx.quadraticCurveTo(44, -104, 62, -50);
  ctx.quadraticCurveTo(0, -38, -62, -50);
  ctx.quadraticCurveTo(-44, -104, -30, -160);
  ctx.closePath(); ctx.fill();
  // 裙上浅色斜纹
  ctx.save(); ctx.clip();
  ctx.strokeStyle = 'rgba(243,235,215,.32)'; ctx.lineWidth = 7;
  for (let i = -3; i < 5; i++) {
    ctx.beginPath(); ctx.moveTo(-80 + i * 34, -40); ctx.lineTo(-46 + i * 34, -170); ctx.stroke();
  }
  ctx.restore();
  // 白领
  ctx.fillStyle = K16_CREAM;
  ctx.beginPath();
  ctx.moveTo(-18, -163); ctx.lineTo(0, -150); ctx.lineTo(-20, -146); ctx.closePath();
  ctx.moveTo(18, -163); ctx.lineTo(0, -150); ctx.lineTo(20, -146); ctx.closePath();
  ctx.fill();
  // 腰带
  ctx.fillStyle = K16_INK;
  ctx.fillRect(-31, -132, 62, 8);

  // 脖子
  ctx.fillStyle = K16_SKIN;
  ctx.fillRect(-8, -178, 16, 22);

  // 手臂：左手垂下，右手抬起指向星标
  ctx.strokeStyle = K16_INK; ctx.lineWidth = 4.6;
  ctx.beginPath(); ctx.moveTo(-28, -156); ctx.quadraticCurveTo(-46, -128, -44, -102); ctx.stroke();
  ctx.fillStyle = K16_SKIN;
  ctx.beginPath(); ctx.arc(-44, -99, 7, 0, Math.PI * 2); ctx.fill();
  const hx = lerp(44, 102, arm), hy = lerp(-100, -176, arm);
  ctx.beginPath(); ctx.moveTo(28, -156); ctx.quadraticCurveTo(lerp(44, 80, arm), lerp(-142, -166, arm), hx, hy); ctx.stroke();
  ctx.beginPath(); ctx.arc(hx, hy, 7, 0, Math.PI * 2); ctx.fill();
  // 抬起的手指
  if (arm > 0.5) {
    ctx.strokeStyle = K16_SKIN; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + 7, hy - 8); ctx.stroke();
  }

  // 短发：后层大圆 + 两侧发片，再叠脸与刘海
  ctx.fillStyle = K16_INK;
  ctx.beginPath(); ctx.arc(0, -208, 36, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-39, -216, 11, 46, 5.5); ctx.fill();
  ctx.beginPath(); ctx.roundRect(28, -216, 11, 46, 5.5); ctx.fill();
  // 脸
  ctx.fillStyle = K16_SKIN;
  ctx.beginPath(); ctx.arc(0, -202, 28, 0, Math.PI * 2); ctx.fill();
  // 刘海：上缘贴发际，下缘做波浪
  ctx.fillStyle = K16_INK;
  ctx.beginPath();
  ctx.arc(0, -202, 29, Math.PI * 1.02, Math.PI * 1.98);
  ctx.quadraticCurveTo(26, -221, 15, -222);
  ctx.quadraticCurveTo(6, -212, -3, -221);
  ctx.quadraticCurveTo(-14, -229, -24, -218);
  ctx.closePath(); ctx.fill();
  // 五官
  ctx.fillStyle = K16_INK;
  ctx.beginPath(); ctx.arc(-10, -203, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(10, -203, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = K16_INK; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-17, -212); ctx.quadraticCurveTo(-10, -215, -4, -212); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4, -212); ctx.quadraticCurveTo(10, -215, 17, -212); ctx.stroke();
  // 腮红与唇
  ctx.fillStyle = K16_CORAL; ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.arc(-20, -193, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(20, -193, 5, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = K16_CORAL;
  ctx.beginPath(); ctx.ellipse(0, -188, 5.5, 3.4, 0, 0, Math.PI * 2); ctx.fill();
  // 耳环
  ctx.fillStyle = K16_MUST;
  ctx.beginPath(); ctx.arc(-27, -190, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(27, -190, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawScene(t) {
  ctx.fillStyle = K16_CREAM; ctx.fillRect(0, 0, W, H);

  // 青绿大圆
  const cp = k16pop(k16seg(t, -0.5, 0.9));
  ctx.save();
  ctx.translate(566, 42);
  ctx.scale(cp, cp);
  ctx.fillStyle = K16_TEAL;
  ctx.beginPath(); ctx.arc(0, 0, 132, 0, Math.PI * 2); ctx.fill();
  // 圆里细弧线
  ctx.strokeStyle = 'rgba(243,235,215,.35)'; ctx.lineWidth = 1.4;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath(); ctx.arc(0, 0, 30 + i * 30, Math.PI * 0.2, Math.PI * 1.25); ctx.stroke();
  }
  ctx.restore();

  // 芥末回旋镖
  const bp = k16ease(k16seg(t, -0.3, 0.9));
  ctx.save();
  ctx.translate(92 + (1 - bp) * -90, 268);
  ctx.rotate(-0.35);
  ctx.fillStyle = K16_MUST;
  ctx.beginPath();
  ctx.moveTo(-52, 12);
  ctx.quadraticCurveTo(-16, -20, 46, -16);
  ctx.quadraticCurveTo(18, -2, 8, 14);
  ctx.quadraticCurveTo(-16, 28, -52, 12);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // 背景点阵
  ctx.fillStyle = 'rgba(34,48,58,.16)';
  for (let i = 0; i < 5; i++) {
    for (let j = 0; j < 3; j++) {
      ctx.beginPath(); ctx.arc(372 + i * 16, 300 + j * 16, 1.8, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 顶栏细线与标题
  const lp = k16ease(k16seg(t, -0.2, 0.7));
  ctx.strokeStyle = K16_INK; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(36, 100); ctx.lineTo(36 + 230 * lp, 100); ctx.stroke();
  ctx.save();
  ctx.fillStyle = K16_INK;
  ctx.font = `800 13px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('1950s  ·  广告版式', 36, 34);
  ctx.font = `800 34px ${FONT}`;
  ctx.fillText('一个新想法', 36, 80);
  ctx.restore();

  // 角色
  k16Woman(t);

  // 星标
  const sp = k16ease(k16seg(t, 1.9, 2.7));
  if (sp > 0.01) {
    const step = Math.ceil(sp * 5) / 5; // 阶梯式旋转
    ctx.save();
    ctx.translate(474, 196);
    ctx.rotate(step * Math.PI * 0.4);
    ctx.scale(0.5 + 0.5 * sp, 0.5 + 0.5 * sp);
    k16Star(0, 0, 82, 46, 12, 0);
    ctx.fillStyle = K16_MUST; ctx.fill();
    ctx.lineWidth = 2.4; ctx.strokeStyle = K16_INK; ctx.stroke();
    ctx.rotate(-step * Math.PI * 0.4);
    ctx.fillStyle = K16_INK;
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = K16_CREAM;
    ctx.font = `800 20px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('想法', 0, 1);
    ctx.restore();
  }

  // 小光点 / 星尘
  const dp = k16ease(k16seg(t, 2.4, 3.2));
  if (dp > 0) {
    const pts = [[392, 120], [560, 274], [366, 252], [596, 150], [430, 86]];
    pts.forEach((p, i) => {
      const q = k16ease(k16seg(t, 2.4 + i * 0.1, 2.9 + i * 0.1));
      if (q <= 0) return;
      ctx.save();
      ctx.globalAlpha = q;
      ctx.fillStyle = i % 2 ? K16_CORAL : K16_INK;
      ctx.beginPath(); ctx.arc(p[0], p[1], 2.6 + Math.sin(t * 3 + i) * 0.8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  // 右下广告文案（避开署名区，放左下）
  const tp = k16ease(k16seg(t, 3.1, 4.0));
  if (tp > 0) {
    ctx.save();
    ctx.globalAlpha = tp;
    ctx.fillStyle = K16_INK;
    ctx.font = `600 15px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('先有一个样子，', 36, 314);
    ctx.fillText('再让它慢慢长出来。', 36, 334);
    ctx.fillStyle = K16_CORAL;
    ctx.fillRect(36, 292, 54 * tp, 3);
    ctx.restore();
  }

  // 版式细线
  ctx.strokeStyle = 'rgba(34,48,58,.45)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(36, 344); ctx.lineTo(600, 344); ctx.stroke();
  // 页码
  ctx.fillStyle = 'rgba(34,48,58,.6)';
  ctx.font = `700 11px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('NO. 03', 604, 34);

  // 收口
  const fp = k16seg(t, 5.7, 5.98);
  if (fp > 0) {
    ctx.save(); ctx.globalAlpha = fp * 0.5; ctx.fillStyle = K16_CREAM; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 敦煌壁画：土红壁面上矿物颜料斑驳，联珠卷草边饰展开，飞天与飘带舒展，散花。
// Z8 敦煌 · DeepSeek Harness 生成示例

const Z8_WALL = '#9c4a32';
const Z8_PLASTER = '#e0cba8';
const Z8_QING = '#3f7186', Z8_QING_D = '#2b5568';
const Z8_LU = '#5c8560', Z8_LU_D = '#3f6b4c';
const Z8_TU = '#c88f43', Z8_ZHE = '#a4482f';
const Z8_LINE = '#6a2f21';

// 壁面：矿物颜料颗粒 + 剥落 + 裂纹
const Z8_MURAL = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, W, H);
  grd.addColorStop(0, '#a45037');
  grd.addColorStop(0.5, Z8_WALL);
  grd.addColorStop(1, '#8a3d2a');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  const r = rng(8808);
  // 颗粒
  for (let i = 0; i < 5200; i++) {
    const x = r() * W, y = r() * H;
    const pal = ['61,113,134', '92,133,96', '200,143,67', '164,72,47', '224,203,168', '43,85,104'];
    const col = pal[Math.floor(r() * pal.length)];
    g.fillStyle = `rgba(${col},${0.05 + r() * 0.16})`;
    g.beginPath();
    g.arc(x, y, 0.4 + r() * 1.7, 0, Math.PI * 2);
    g.fill();
  }
  // 剥落：露出白灰地仗
  for (let i = 0; i < 9; i++) {
    const edge = r();
    const x = edge < 0.5 ? (r() < 0.5 ? 20 + r() * 90 : W - 20 - r() * 90) : r() * W;
    const y = edge < 0.5 ? r() * H : (r() < 0.5 ? 20 + r() * 50 : H - 20 - r() * 60);
    const rr = 5 + r() * 13;
    g.save();
    g.globalAlpha = 0.16 + r() * 0.22;
    g.fillStyle = Z8_PLASTER;
    g.beginPath();
    for (let k = 0; k <= 14; k++) {
      const a = (k / 14) * Math.PI * 2;
      const rad = rr * (0.62 + r() * 0.55);
      const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad * 0.8;
      if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
    g.fill();
    g.restore();
  }
  // 裂纹
  g.strokeStyle = 'rgba(58,32,22,0.22)';
  for (let i = 0; i < 22; i++) {
    let x = r() * W, y = r() * H;
    g.lineWidth = 0.5 + r() * 0.9;
    g.beginPath();
    g.moveTo(x, y);
    for (let k = 0; k < 5; k++) {
      x += (r() - 0.5) * 40;
      y += (r() - 0.5) * 34;
      g.lineTo(x, y);
    }
    g.stroke();
  }
  // 烟熏暗角
  const vg = g.createRadialGradient(W * 0.45, H * 0.45, 90, W * 0.45, H * 0.45, 400);
  vg.addColorStop(0, 'rgba(255,220,170,0.06)');
  vg.addColorStop(1, 'rgba(30,12,8,0.36)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return c;
})();

// 边饰：联珠 + 卷草忍冬
function z8band(w, h, seed, flip) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.clearRect(0, 0, w, h);
  const r = rng(seed);
  // 底色带
  g.fillStyle = 'rgba(58,26,18,0.35)';
  g.fillRect(0, flip ? h - 6 : 0, w, 6);
  const cy = h * 0.5;
  // 卷草：连续涡卷
  for (let x = 0; x < w + 40; x += 44) {
    const ox = x + (r() - 0.5) * 4;
    g.strokeStyle = Z8_QING;
    g.lineWidth = 2.6;
    g.beginPath();
    g.moveTo(ox - 20, cy + 6);
    g.bezierCurveTo(ox - 10, cy - 12, ox + 6, cy - 14, ox + 12, cy - 2);
    g.bezierCurveTo(ox + 16, cy + 6, ox + 6, cy + 10, ox + 2, cy + 4);
    g.stroke();
    // 忍冬叶
    g.fillStyle = Z8_LU;
    g.beginPath();
    g.ellipse(ox - 6, cy - 8, 6, 3.4, -0.6, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = Z8_TU;
    g.beginPath();
    g.ellipse(ox + 12, cy + 6, 5, 3, 0.5, 0, Math.PI * 2);
    g.fill();
    // 联珠
    g.fillStyle = 'rgba(232,213,180,0.85)';
    for (let k = 0; k < 3; k++) {
      g.beginPath();
      g.arc(ox - 12 + k * 12, flip ? h - 3 : 3, 2.2, 0, Math.PI * 2);
      g.fill();
    }
    // 土红勾线
    g.strokeStyle = 'rgba(150,60,40,0.7)';
    g.lineWidth = 0.9;
    g.beginPath();
    g.moveTo(ox - 20, cy + 8);
    g.quadraticCurveTo(ox, cy + 16, ox + 22, cy + 6);
    g.stroke();
  }
  return c;
}

const Z8_BAND_T = z8band(660, 34, 3311, false);
const Z8_BAND_B = z8band(660, 30, 4411, true);

const Z8_PETALS = (() => {
  const r = rng(6602);
  return Array.from({ length: 16 }, () => ({
    sx: 420 + (r() - 0.5) * 40, sy: 150 + (r() - 0.5) * 30,
    dx: -40 - r() * 200, dy: 40 + r() * 110, sp: 0.5 + r() * 0.7, ph: r() * 6.28,
    sz: 2.6 + r() * 2.6, rot: r() * 6.28,
  }));
})();

function z8seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

// 飘带：粗细渐变 + 波动
function z8ribbon(p0, pc, p1, w0, w1, col, phase, t, amp) {
  const N = 22;
  const up = [], dn = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N, v = 1 - u;
    const x = v * v * p0[0] + 2 * v * u * pc[0] + u * u * p1[0];
    const y = v * v * p0[1] + 2 * v * u * pc[1] + u * u * p1[1];
    const x2 = 2 * v * (pc[0] - p0[0]) + 2 * u * (p1[0] - pc[0]);
    const y2 = 2 * v * (pc[1] - p0[1]) + 2 * u * (p1[1] - pc[1]);
    const dl = Math.hypot(x2, y2) || 1;
    const nx = -y2 / dl, ny = x2 / dl;
    const wave = Math.sin(u * 5.2 + phase + t * 1.5) * amp * (0.25 + u);
    const hw = (w0 + (w1 - w0) * u) * 0.5 * (0.8 + 0.35 * Math.sin(u * 9 + phase));
    up.push([x + nx * (hw + wave), y + ny * (hw + wave)]);
    dn.push([x - nx * (hw - wave), y - ny * (hw - wave)]);
  }
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(up[0][0], up[0][1]);
  for (let i = 1; i <= N; i++) ctx.lineTo(up[i][0], up[i][1]);
  const tip = [(up[N][0] + dn[N][0]) / 2, (up[N][1] + dn[N][1]) / 2];
  ctx.quadraticCurveTo(tip[0], tip[1] - 2, dn[N][0], dn[N][1]);
  for (let i = N; i >= 0; i--) ctx.lineTo(dn[i][0], dn[i][1]);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(106,47,33,0.5)';
  ctx.lineWidth = 0.8;
  ctx.stroke();
}

// 如意云纹
function z8cloud(x, y, s, alpha, col, t) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.translate(x, y + Math.sin(t * 0.9 + x) * 2);
  ctx.scale(s, s);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col;
  ctx.lineWidth = 4.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(-12, 0, 11, Math.PI * 0.85, Math.PI * 2.15);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(10, 4, 8.4, Math.PI * 0.9, Math.PI * 2.2);
  ctx.stroke();
  ctx.lineWidth = 3.2;
  ctx.beginPath();
  ctx.moveTo(16, 8);
  ctx.quadraticCurveTo(30, 12, 40, 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-22, 6);
  ctx.quadraticCurveTo(-34, 10, -42, 4);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(224,203,168,0.5)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(-12, 0, 7, Math.PI * 0.9, Math.PI * 2.1);
  ctx.stroke();
  ctx.restore();
}

// 飞天
function z8apsara(t, p) {
  if (p <= 0) return;
  const e = easeOut(p);
  const fx = 330, fy = 190 + Math.sin(t * 1.1) * 3;
  ctx.save();
  ctx.translate(fx, fy);
  ctx.rotate(-0.06 + Math.sin(t * 0.9) * 0.02);
  ctx.scale(0.94 + 0.06 * e, 0.94 + 0.06 * e);

  // 头光
  ctx.save();
  ctx.strokeStyle = `rgba(63,113,134,${0.9 * e})`;
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(58, -52, 31, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = `rgba(200,143,67,${0.9 * e})`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(58, -52, 24, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = `rgba(63,113,134,${0.12 * e})`;
  ctx.beginPath(); ctx.arc(58, -52, 31, 0, Math.PI * 2); ctx.fill();
  // 联珠光
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    ctx.fillStyle = `rgba(224,203,168,${0.8 * e})`;
    ctx.beginPath();
    ctx.arc(58 + Math.cos(a) * 34, -52 + Math.sin(a) * 34, 1.7, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 后飘带（左）
  z8ribbon([26, -34], [-60, -120], [-168, -44], 17, 3, `rgba(164,72,47,${0.92 * e})`, 0.4, t, 14);
  z8ribbon([28, -12], [-56, 54], [-160, 34], 14, 3, `rgba(63,113,134,${0.88 * e})`, 2.1, t, 13);
  // 后飘带（右）
  z8ribbon([88, -64], [150, -118], [206, -46], 13, 3, `rgba(92,133,96,${0.9 * e})`, 1.2, t, 13);

  // 腿与裙
  ctx.save();
  ctx.fillStyle = `rgba(92,133,96,${0.95 * e})`;
  ctx.beginPath();
  ctx.moveTo(-6, 4);
  ctx.quadraticCurveTo(-46, 34, -58, 70);
  ctx.quadraticCurveTo(-20, 78, 12, 46);
  ctx.quadraticCurveTo(22, 26, 12, 6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = `rgba(63,107,76,${0.9 * e})`;
  ctx.lineWidth = 1.6;
  ctx.stroke();
  // 裙褶
  ctx.strokeStyle = `rgba(43,85,104,${0.55 * e})`;
  ctx.lineWidth = 1.2;
  for (let k = 0; k < 3; k++) {
    ctx.beginPath();
    ctx.moveTo(-4 + k * 6, 10);
    ctx.quadraticCurveTo(-30 + k * 8, 40, -46 + k * 10, 68);
    ctx.stroke();
  }
  // 双腿：一屈一伸
  ctx.strokeStyle = `rgba(200,143,67,${0.95 * e})`;
  ctx.lineWidth = 11;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-4, 56);
  ctx.quadraticCurveTo(-26, 78, -6, 96);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(6, 50);
  ctx.quadraticCurveTo(34, 78, 22, 102);
  ctx.stroke();
  // 赤足
  ctx.fillStyle = `rgba(216,166,108,${0.95 * e})`;
  ctx.beginPath(); ctx.ellipse(-4, 98, 7, 4, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(24, 104, 7, 4, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 躯干
  ctx.save();
  ctx.fillStyle = `rgba(200,143,67,${0.95 * e})`;
  ctx.beginPath();
  ctx.moveTo(30, -44);
  ctx.quadraticCurveTo(58, -52, 74, -34);
  ctx.quadraticCurveTo(66, -4, 48, 14);
  ctx.quadraticCurveTo(26, 6, 24, -22);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = `rgba(106,47,33,${0.75 * e})`;
  ctx.lineWidth = 1.6;
  ctx.stroke();
  // 天衣：石青斜披
  ctx.fillStyle = `rgba(63,113,134,${0.92 * e})`;
  ctx.beginPath();
  ctx.moveTo(28, -40);
  ctx.quadraticCurveTo(48, -34, 70, -40);
  ctx.quadraticCurveTo(60, -16, 46, 2);
  ctx.quadraticCurveTo(32, -12, 28, -40);
  ctx.closePath();
  ctx.fill();
  // 项圈
  ctx.strokeStyle = `rgba(224,203,168,${0.9 * e})`;
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.arc(46, -40, 16, 0.25 * Math.PI, 0.95 * Math.PI);
  ctx.stroke();
  ctx.restore();

  // 手臂：一上举拈花，一后展
  ctx.save();
  ctx.strokeStyle = `rgba(200,143,67,${0.95 * e})`;
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(64, -36);
  ctx.quadraticCurveTo(88, -66, 104, -78);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(34, -38);
  ctx.quadraticCurveTo(4, -58, -24, -52);
  ctx.stroke();
  // 手
  ctx.fillStyle = `rgba(216,166,108,${0.95 * e})`;
  ctx.beginPath(); ctx.arc(106, -80, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-26, -52, 5, 0, Math.PI * 2); ctx.fill();
  // 莲花
  ctx.fillStyle = `rgba(232,203,180,${0.95 * e})`;
  for (let i = -2; i <= 2; i++) {
    ctx.save();
    ctx.translate(108, -84);
    ctx.rotate(i * 0.4 - 0.2);
    ctx.beginPath(); ctx.ellipse(0, -9, 3.4, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = `rgba(200,143,67,${0.95 * e})`;
  ctx.beginPath(); ctx.arc(108, -86, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 头
  ctx.save();
  ctx.translate(56, -56);
  ctx.fillStyle = `rgba(216,166,108,${0.97 * e})`;
  ctx.beginPath(); ctx.ellipse(2, 0, 15, 17, 0.05, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `rgba(106,47,33,${0.8 * e})`;
  ctx.lineWidth = 1.4;
  ctx.stroke();
  // 发髻
  ctx.fillStyle = `rgba(43,46,48,${0.95 * e})`;
  ctx.beginPath(); ctx.arc(2, -15, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(2, -6, 15, 7, 0, Math.PI, Math.PI * 2); ctx.fill();
  // 五官（细线）
  ctx.strokeStyle = `rgba(106,47,33,${0.85 * e})`;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(2, -2); ctx.quadraticCurveTo(6, -4, 9, -1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3, 4); ctx.quadraticCurveTo(7, 4, 8, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1, 9); ctx.quadraticCurveTo(3, 11, 6, 9); ctx.stroke();
  // 耳饰
  ctx.fillStyle = `rgba(200,143,67,${0.9 * e})`;
  ctx.beginPath(); ctx.arc(-12, 4, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 前飘带（右）
  z8ribbon([72, -18], [146, 46], [222, -6], 12, 3, `rgba(200,143,67,${0.92 * e})`, 3.0, t, 15);
  z8ribbon([64, 12], [128, 82], [206, 54], 10, 2, `rgba(164,72,47,${0.86 * e})`, 4.2, t, 12);
  ctx.restore();
}

function drawScene(t) {
  ctx.drawImage(Z8_MURAL, 0, 0);

  // 边饰自上而下展开
  const bp = z8seg(t, 0.3, 1.6);
  if (bp > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 6, 660 * easeOut(bp), 34);
    ctx.clip();
    ctx.drawImage(Z8_BAND_T, 0, 6);
    ctx.restore();
  }
  const bp2 = z8seg(t, 0.55, 1.9);
  if (bp2 > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 320, 660 * easeOut(bp2), 32);
    ctx.clip();
    ctx.drawImage(Z8_BAND_B, 0, 322);
    ctx.restore();
  }

  // 云纹
  const cp = z8seg(t, 1.05, 2.1);
  z8cloud(104, 118, 1.15, easeOut(cp) * 0.85, Z8_QING, t);
  z8cloud(62, 246, 0.85, easeOut(clamp(cp * 1.2 - 0.2, 0, 1)) * 0.75, Z8_LU, t);
  z8cloud(486, 286, 0.72, easeOut(clamp(cp * 1.2 - 0.3, 0, 1)) * 0.7, Z8_QING, t);

  // 飞天
  z8apsara(t, z8seg(t, 1.5, 2.6));

  // 散花
  const fp = z8seg(t, 3.3, 6.0);
  if (fp > 0) {
    ctx.save();
    Z8_PETALS.forEach((pl, i) => {
      const u = clamp(fp * pl.sp * 1.5 - i * 0.02, 0, 1);
      if (u <= 0) return;
      const x = pl.sx + pl.dx * u + Math.sin(t * 1.7 + pl.ph) * 10;
      const y = pl.sy + pl.dy * u + Math.cos(t * 1.3 + pl.ph) * 6;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(pl.rot + t * 0.7);
      ctx.fillStyle = `rgba(232,203,180,${0.75 * (1 - u * 0.35)})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, pl.sz, pl.sz * 1.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
    ctx.restore();
  }

  // 题字
  const tp = z8seg(t, 4.3, 5.0);
  if (tp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(tp);
    ctx.fillStyle = 'rgba(232,213,180,0.94)';
    ctx.font = `400 30px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('敦', 586, 92);
    ctx.fillText('煌', 586, 130);
    ctx.font = `400 14px ${FONT}`;
    ctx.fillStyle = 'rgba(232,213,180,0.85)';
    ctx.fillText('飞天', 586, 168);
    ctx.restore();
  }
  const sp = z8seg(t, 5.0, 5.4);
  if (sp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(sp) * 0.85;
    ctx.fillStyle = 'rgba(63,113,134,0.95)';
    ctx.fillRect(568, 196, 36, 3);
    ctx.fillStyle = 'rgba(232,213,180,0.8)';
    ctx.font = `400 13px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText('矿物颜料', 586, 216);
    ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

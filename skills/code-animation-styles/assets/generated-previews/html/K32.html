<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 一块块积木从上方落下、咔哒拼上：小黄人举起手，最后一块黄色积木亮起，塔顶冒出一颗灯泡。
// K32 积木 · DeepSeek Harness 生成示例
const K32 = {
  bg: '#edf2f5', plate: '#c7d1d8', plateDark: '#aab6bf',
  red: '#cf2323', blue: '#1466ad', yellow: '#f0bf1c', green: '#2f8f45',
  white: '#f7f7f4', navy: '#243247', skin: '#f7c948', hair: '#4a2c1c', ink: '#1b2430',
};
const k32seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const k32ease = p => 1 - Math.pow(1 - p, 3);
function K32shade(hex, amt) {
  let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}
const K32_DX = 0.5, K32_DY = 0.34;
const K32_DUST = (() => {
  const r = rng(3207);
  return Array.from({ length: 30 }, () => ({ x: r() * W, y: r() * 300, ph: r() * 6, sp: 0.3 + r() * 0.8, s: 1 + r() * 2.2 }));
})();
const K32_CONF = (() => {
  const r = rng(3211);
  return Array.from({ length: 22 }, (_, i) => ({ x: r() * W, y0: r() * -120, sp: 26 + r() * 40, ph: r() * 6, c: [K32.red, K32.yellow, K32.blue, K32.green][i % 4], s: 5 + r() * 5 }));
})();

function k32Stud(cx, cy, rx, base) {
  const ry = rx * 0.5;
  ctx.fillStyle = K32shade(base, -0.2);
  ctx.beginPath(); ctx.ellipse(cx, cy + 4, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(cx - rx, cy, rx * 2, 4);
  ctx.fillStyle = K32shade(base, 0.32);
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(cx - rx * 0.25, cy - ry * 0.2, rx * 0.45, ry * 0.4, 0, 0, Math.PI * 2); ctx.fill();
}

function k32Brick(x, yBottom, w, h, d, base, sx, sy, t) {
  const dx = d * K32_DX, dy = d * K32_DY;
  const yTop = yBottom - h;
  ctx.save();
  // 落影
  ctx.fillStyle = 'rgba(38,52,66,.16)';
  ctx.beginPath(); ctx.ellipse(x + w * 0.55 + dx * 0.5, yBottom + 5, w * 0.6, 7, 0, 0, Math.PI * 2); ctx.fill();
  // 右侧面
  ctx.fillStyle = K32shade(base, -0.16);
  ctx.beginPath();
  ctx.moveTo(x + w, yTop); ctx.lineTo(x + w + dx, yTop - dy);
  ctx.lineTo(x + w + dx, yBottom - dy); ctx.lineTo(x + w, yBottom); ctx.closePath(); ctx.fill();
  // 正面
  const grad = ctx.createLinearGradient(x, yTop, x, yBottom);
  grad.addColorStop(0, K32shade(base, 0.08));
  grad.addColorStop(1, K32shade(base, -0.04));
  ctx.fillStyle = grad;
  ctx.fillRect(x, yTop, w, h);
  // 顶面
  ctx.fillStyle = K32shade(base, 0.22);
  ctx.beginPath();
  ctx.moveTo(x, yTop); ctx.lineTo(x + w, yTop);
  ctx.lineTo(x + w + dx, yTop - dy); ctx.lineTo(x + dx, yTop - dy); ctx.closePath(); ctx.fill();
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  ctx.fillRect(x, yTop, w, 3);
  // 分模线
  ctx.strokeStyle = 'rgba(0,0,0,.10)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + w, yTop); ctx.lineTo(x + w, yBottom); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x + w, yTop); ctx.stroke();
  // 凸点：只画在顶面以上，避免压到正面
  const su = w / sx, sv = d / sy;
  ctx.save();
  ctx.beginPath(); ctx.rect(x - 24, yTop - 90, w + dx + 70, 90); ctx.clip();
  for (let j = sy - 1; j >= 0; j--) {
    for (let i = 0; i < sx; i++) {
      const u = x + (i + 0.5) * su, v = (j + 0.5) * sv;
      k32Stud(u + v * K32_DX, yTop - v * K32_DY - 2, su * 0.32, base);
    }
  }
  ctx.restore();
  ctx.restore();
}

function k32Hand(x, y, angle, base) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.strokeStyle = K32shade(base, 0.55); ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, 7, -0.55, Math.PI + 0.55); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.13)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 0, 9.2, Math.PI * 0.55, Math.PI * 0.95); ctx.stroke();
  ctx.restore();
}

function k32Minifig(fx, fy, armUp, t, walk) {
  const S = 1;
  const legH = 30, hipH = 9, torsoH = 37, headH = 30;
  const hipY = fy - legH, torsoTop = hipY - hipH - torsoH, headTop = torsoTop - headH;
  ctx.save();
  // 影子
  ctx.fillStyle = 'rgba(38,52,66,.20)';
  ctx.beginPath(); ctx.ellipse(fx, fy + 4, 34, 8, 0, 0, Math.PI * 2); ctx.fill();
  // 腿（走路时前后摆）
  const step = walk ? Math.sin(t * 9) * 4 : 0;
  const bob = walk ? Math.abs(Math.sin(t * 9)) * 1.6 : 0;
  ctx.fillStyle = K32.navy;
  ctx.beginPath(); ctx.roundRect(fx - 17 + step, hipY - bob, 15, legH, 3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(fx + 2 - step, hipY - bob, 15, legH, 3); ctx.fill();
  ctx.fillStyle = K32shade(K32.navy, 0.14);
  ctx.fillRect(fx - 17 + step, hipY - bob, 15, 4);
  ctx.fillRect(fx + 2 - step, hipY - bob, 15, 4);
  // 胯
  ctx.fillStyle = K32.navy;
  ctx.beginPath(); ctx.roundRect(fx - 18, hipY - hipH, 36, hipH + 3, 3); ctx.fill();
  // 躯干
  const tx0 = fx - 19, tx1 = fx + 19, ty0 = torsoTop, ty1 = hipY - hipH;
  const g = ctx.createLinearGradient(tx0, ty0, tx1, ty1);
  g.addColorStop(0, K32shade(K32.red, 0.1));
  g.addColorStop(1, K32shade(K32.red, -0.1));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(tx0, ty1); ctx.lineTo(tx0 + 2, ty0 + 3);
  ctx.quadraticCurveTo(fx, ty0 - 2, tx1 - 2, ty0 + 3);
  ctx.lineTo(tx1, ty1); ctx.closePath(); ctx.fill();
  // 胸口印刷：小灯泡
  ctx.fillStyle = '#ffe27a';
  ctx.beginPath(); ctx.arc(fx, ty0 + 17, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = K32.red;
  ctx.beginPath(); ctx.arc(fx, ty0 + 15, 3.4, Math.PI * 0.15, Math.PI * 0.85); ctx.fill();
  ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const a = -Math.PI * 0.8 + i * Math.PI * 0.52;
    ctx.beginPath();
    ctx.moveTo(fx + Math.cos(a) * 10, ty0 + 17 + Math.sin(a) * 10);
    ctx.lineTo(fx + Math.cos(a) * 13, ty0 + 17 + Math.sin(a) * 13);
    ctx.stroke();
  }
  // 手臂
  const shY = ty0 + 6;
  ctx.strokeStyle = K32.red; ctx.lineWidth = 11; ctx.lineCap = 'round';
  const aR = lerp(0.5, 2.25, armUp);
  const aL = -0.34;
  ctx.beginPath(); ctx.moveTo(fx - 16, shY + 2); ctx.lineTo(fx - 16 + Math.sin(aL) * 26, shY + 2 + Math.cos(aL) * 26); ctx.stroke();
  const hx = fx + 17 + Math.sin(aR) * 27, hy = shY + 2 + Math.cos(aR) * 27;
  ctx.beginPath(); ctx.moveTo(fx + 17, shY + 2); ctx.lineTo(hx, hy); ctx.stroke();
  k32Hand(fx - 16 + Math.sin(aL) * 28, shY + 4 + Math.cos(aL) * 28, aL + Math.PI, K32.skin);
  k32Hand(hx + Math.sin(aR) * 2, hy + Math.cos(aR) * 2, aR + Math.PI, K32.skin);
  // 脖子
  ctx.fillStyle = K32shade(K32.skin, -0.12);
  ctx.fillRect(fx - 7, headTop + headH - 2, 14, 6);
  // 头
  ctx.fillStyle = K32.skin;
  ctx.beginPath(); ctx.roundRect(fx - 16, headTop, 32, headH, 9); ctx.fill();
  // 头顶凸点
  ctx.fillStyle = K32shade(K32.skin, 0.18);
  ctx.beginPath(); ctx.ellipse(fx, headTop + 1, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
  // 头发
  ctx.fillStyle = K32.hair;
  ctx.beginPath();
  ctx.moveTo(fx - 16, headTop + 11);
  ctx.quadraticCurveTo(fx - 17, headTop - 4, fx + 2, headTop - 3);
  ctx.quadraticCurveTo(fx + 17, headTop - 2, fx + 16, headTop + 10);
  ctx.lineTo(fx + 9, headTop + 8);
  ctx.quadraticCurveTo(fx, headTop + 12, fx - 9, headTop + 7);
  ctx.closePath(); ctx.fill();
  // 眼睛
  ctx.fillStyle = K32.ink;
  ctx.beginPath(); ctx.arc(fx - 6, headTop + 16, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx + 6, headTop + 16, 2.4, 0, Math.PI * 2); ctx.fill();
  // 微笑
  ctx.strokeStyle = K32.ink; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(fx, headTop + 19, 6, 0.35, Math.PI - 0.35); ctx.stroke();
  // 腮红
  ctx.fillStyle = 'rgba(230,120,80,.35)';
  ctx.beginPath(); ctx.arc(fx - 12, headTop + 20, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx + 12, headTop + 20, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function k32Bulb(x, y, p) {
  if (p <= 0.02) return;
  ctx.save();
  ctx.translate(x, y);
  const s = 0.4 + 0.6 * p;
  ctx.scale(s, s);
  ctx.globalAlpha = clamp(p * 1.4, 0, 1);
  // 光
  const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 48);
  glow.addColorStop(0, 'rgba(255,224,120,.55)');
  glow.addColorStop(1, 'rgba(255,224,120,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, 48, 0, Math.PI * 2); ctx.fill();
  // 玻璃
  ctx.fillStyle = '#ffe566';
  ctx.beginPath(); ctx.arc(0, -2, 13, Math.PI * 0.88, Math.PI * 2.12); ctx.lineTo(6, 14); ctx.lineTo(-6, 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.arc(-4, -6, 5, 0, Math.PI * 2); ctx.fill();
  // 灯座
  ctx.fillStyle = '#b9c2c8';
  ctx.fillRect(-6, 14, 12, 7);
  ctx.fillStyle = '#8f9aa2';
  for (let i = 0; i < 3; i++) ctx.fillRect(-6, 15 + i * 2, 12, 1);
  // 光线
  ctx.strokeStyle = '#f0bf1c'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI * 0.85 + i * Math.PI * 0.28;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 20, -2 + Math.sin(a) * 20);
    ctx.lineTo(Math.cos(a) * 27, -2 + Math.sin(a) * 27);
    ctx.stroke();
  }
  ctx.restore();
}

function drawScene(t) {
  // 背景（比画面略大，配合缓慢推拉）
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#f2f7fa');
  bg.addColorStop(1, K32.bg);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.strokeStyle = 'rgba(120,150,170,.10)'; ctx.lineWidth = 1;
  for (let x = -20; x <= W + 20; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();

  // 缓慢推拉与平移：整段都在动，循环回到原位
  const ph = t / 6 * Math.PI * 2;
  const zoom = 1.015 + 0.022 * Math.sin(ph);
  const panX = 7 * Math.sin(ph + 0.6);
  const panY = 3 * Math.cos(ph);
  ctx.save();
  ctx.translate(320, 190); ctx.scale(zoom, zoom); ctx.translate(-320 + panX, -190 + panY);

  // 底板
  const px0 = 54, pw = 486, ph2 = 22, pd = 74;
  k32Brick(px0, 330, pw, ph2, pd, K32.plate, 13, 2, t);
  // 底板上的散件：一块轻轻起伏
  k32Brick(88, 308 + Math.sin(t * 3) * 1.6, 52, 24, 26, K32.blue, 2, 2, t);
  k32Brick(146, 308, 52, 24, 26, K32.white, 2, 2, t);
  // 一块在原地慢慢转
  ctx.save();
  ctx.translate(226, 302);
  ctx.rotate(Math.sin(t * 0.9) * 0.12);
  k32Brick(-18, 6, 36, 16, 18, K32.green, 2, 1, t);
  ctx.restore();

  // 塔：三层已在，其余逐块落下
  const towerX = 372, baseY = 308;
  const bh = 22;
  const cols = [K32.red, K32.blue, K32.green];
  for (let i = 0; i < 3; i++) k32Brick(towerX, baseY - bh * i, 54, bh, 30, cols[i], 2, 2, t);
  const drops = [
    { at: 0.35, c: K32.yellow },
    { at: 1.15, c: K32.red },
    { at: 1.95, c: K32.blue },
    { at: 2.75, c: K32.green },
    { at: 3.55, c: K32.yellow },
  ];
  drops.forEach((d, i) => {
    const p = k32seg(t, d.at, d.at + 0.62);
    if (p <= 0) return;
    const yy = lerp(baseY - bh * (3 + i) - 260, baseY - bh * (3 + i), k32ease(p));
    const squash = p >= 1 ? Math.max(0, 1 - (t - d.at - 0.62) * 6) : 0;
    ctx.save();
    ctx.translate(towerX + 27, yy);
    ctx.scale(1 + squash * 0.04, 1 - squash * 0.06);
    ctx.translate(-towerX - 27, -yy);
    k32Brick(towerX, yy, 54, bh, 30, d.c, 2, 2, t);
    ctx.restore();
  });
  // 顶部灯砖
  const topY = baseY - bh * 8;
  const dropTop = k32seg(t, 4.25, 4.85);
  if (dropTop > 0) {
    const yy = lerp(topY - 240, topY, k32ease(dropTop));
    k32Brick(towerX + 8, yy, 38, bh, 22, K32.white, 2, 1, t);
  }
  // 灯泡
  const bulbP = k32ease(k32seg(t, 4.9, 5.5));
  k32Bulb(towerX + 27, topY - bh - 14, bulbP);

  // 小人：先走到塔边，再抬手
  const walkIn = k32ease(k32seg(t, 0.0, 1.0));
  const walkOn = k32ease(k32seg(t, 4.1, 5.5));
  const fx = lerp(150, 302, walkIn * 0.22 + walkOn * 0.55);
  const walking = (t < 1.1) || (t > 4.1 && t < 5.5);
  const armUp = k32ease(k32seg(t, 2.0, 2.9)) * (1 - 0.45 * k32seg(t, 5.0, 5.8));
  k32Minifig(fx, 308, armUp, t, walking);

  // 星屑与彩纸
  const sp = k32seg(t, 4.9, 6.0);
  if (sp > 0) {
    ctx.save();
    for (let i = 0; i < 9; i++) {
      const a = i * 0.7 + 0.3, d = 34 + sp * (34 + (i % 3) * 14);
      const x = towerX + 27 + Math.cos(a) * d, y = topY - bh - 22 + Math.sin(a) * d * 0.8;
      ctx.globalAlpha = (1 - sp * 0.6) * 0.9;
      ctx.fillStyle = i % 2 ? '#f0bf1c' : '#ffffff';
      ctx.save(); ctx.translate(x, y); ctx.rotate(sp * 2 + i);
      ctx.fillRect(-4, -1.4, 8, 2.8); ctx.fillRect(-1.4, -4, 2.8, 8);
      ctx.restore();
    }
    ctx.restore();
  }
  // 彩纸持续下落
  const confP = k32seg(t, 4.4, 6.0);
  if (confP > 0) {
    ctx.save();
    for (const c of K32_CONF) {
      const y = ((c.y0 + t * c.sp) % 380) - 10;
      if (y < 60 || y > 320) continue;
      const x = c.x + Math.sin(t * 1.3 + c.ph) * 12;
      ctx.globalAlpha = 0.9 * confP;
      ctx.fillStyle = c.c;
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * 2 + c.ph);
      ctx.fillRect(-c.s / 2, -c.s / 3, c.s, c.s * 0.66);
      ctx.restore();
    }
    ctx.restore();
  }
  // 浮尘
  ctx.save();
  for (const d of K32_DUST) {
    const x = d.x + Math.sin(t * d.sp + d.ph) * 14;
    const y = d.y - ((t * 7 * d.sp) % 300);
    const yy = y < 0 ? y + 300 : y;
    ctx.globalAlpha = 0.18 + 0.12 * Math.sin(t * 1.4 + d.ph);
    ctx.fillStyle = '#8fa6b6';
    ctx.beginPath(); ctx.arc(x, yy, d.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  ctx.restore(); // 相机

  // 文字（不随相机移动）
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = K32.ink;
  ctx.font = `800 25px ${FONT}`;
  ctx.fillText('一块块搭起来', 26, 46);
  ctx.fillStyle = '#5d6b78';
  ctx.font = `600 13px ${FONT}`;
  ctx.fillText('积木 · 每一块都能扣住上一块', 27, 66);
  const chips = [K32.red, K32.yellow, K32.blue, K32.green];
  chips.forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.roundRect(28 + i * 22, 78, 16, 10, 3); ctx.fill();
  });
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

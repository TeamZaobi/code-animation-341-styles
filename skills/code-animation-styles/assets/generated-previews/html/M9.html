<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M9 情绪弧线：混乱、掌控、清晰 · DeepSeek Harness 生成示例</title>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>M9 · 情绪弧线：混乱、掌控、清晰</h1>
    <p>一条情绪弧线：碎掉的圆弧先乱飞，再一格一格归位成环，最后收成一圈干净的光和一句话。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="情绪弧线：混乱、掌控、清晰 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 一条情绪弧线：碎掉的圆弧先乱飞，再一格一格归位成环，最后收成一圈干净的光和一句话。
// M9 情绪弧线：混乱、掌控、清晰 · DeepSeek Harness 生成示例
const M9_BG = '#0d1015';

function m9p(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function m9lerp3(a, b, c, k) {
  // k: 0→1→2 三段色
  if (k <= 1) return [
    lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)
  ];
  return [lerp(b[0], c[0], k - 1), lerp(b[1], c[1], k - 1), lerp(b[2], c[2], k - 1)];
}
function m9rgb(c, a) { return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a + ')'; }

const M9_N = 16;
const M9_ARCS = (() => {
  const r = rng(9109);
  return Array.from({ length: M9_N }, (_, i) => {
    const base = (i / M9_N) * Math.PI * 2 - Math.PI / 2;
    return {
      base,
      dx: (r() - 0.5) * 130,
      dy: (r() - 0.5) * 100,
      dr: (r() - 0.5) * 34,
      rot: (r() - 0.5) * 1.5,
      w: 1.4 + r() * 2.6,
      delay: r() * 0.45,
      alpha: 0.32 + r() * 0.5
    };
  });
})();

function m9bg(light, chaos) {
  ctx.fillStyle = M9_BG; ctx.fillRect(0, 0, W, H);
  // 顶部左侧的一束光，最后变亮
  const g = ctx.createRadialGradient(250, 40, 10, 250, 60, 520);
  g.addColorStop(0, 'rgba(255,236,206,' + (0.05 + light * 0.16).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(255,236,206,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 一点底部的冷光，制造景深
  const b = ctx.createRadialGradient(430, 360, 30, 430, 360, 380);
  b.addColorStop(0, 'rgba(120,150,180,' + (0.10 - chaos * 0.05).toFixed(3) + ')');
  b.addColorStop(1, 'rgba(120,150,180,0)');
  ctx.fillStyle = b; ctx.fillRect(0, 0, W, H);
}

function m9caption(text, p, color, size, x, y) {
  if (p <= 0) return;
  const e = 1 - Math.pow(1 - clamp(p, 0, 1), 3);
  ctx.save();
  ctx.beginPath();
  ctx.rect(x - 12, y - size * 1.4, 460, size * 1.8);
  ctx.clip();
  ctx.globalAlpha = clamp(p * 1.6, 0, 1);
  ctx.fillStyle = color;
  ctx.font = `500 ${size}px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, x, y + (1 - e) * 10);
  ctx.restore();
}

function drawScene(t) {
  // 阶段：0 混乱 → 1 掌控 → 2 清晰
  const order = smooth(clamp((t - 2.15) / 2.0, 0, 1));
  const close = smooth(clamp((t - 3.9) / 0.95, 0, 1));
  const chaos = 1 - order;
  const light = close;

  m9bg(light, chaos);

  // 后层：一圈极淡的辅环，提供景深
  ctx.save();
  ctx.globalAlpha = 0.24 + 0.2 * order;
  ctx.strokeStyle = 'rgba(214,196,168,.20)';
  ctx.lineWidth = 34;
  ctx.beginPath();
  ctx.arc(320, 166, 104 + 46 * (1 - close), 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  const col = m9lerp3([104, 120, 140], [214, 160, 96], [242, 233, 214], close > 0 ? 1 + close : order);
  const cx = 320, cy = 166;

  // 16 段圆弧：各自有延迟地从“乱”走到“环”上
  for (let i = 0; i < M9_N; i++) {
    const a = M9_ARCS[i];
    const local = smooth(clamp((t - 2.15 - a.delay * 1.3) / 1.35, 0, 1));
    const k = local;
    const offx = a.dx * (1 - k), offy = a.dy * (1 - k);
    const rad = 104 + a.dr * (1 - k);
    const rot = a.rot * (1 - k);
    const gap = lerp(0.62, 0.008, close);
    const span = Math.PI * 2 / M9_N;
    const a0 = a.base + rot + gap / 2;
    const a1 = a.base + rot + span - gap / 2;
    // 呼吸：清晰之后几乎不动
    const breathe = Math.sin(t * 2.2 + i * 0.7) * (0.02 + 0.06 * chaos);
    ctx.save();
    ctx.globalAlpha = (a.alpha * (0.55 + 0.45 * k)) * (1 - close * 0.15);
    ctx.strokeStyle = m9rgb(col, 1);
    ctx.lineWidth = lerp(a.w, 2.6, k) * (1 + close * 0.25);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx + offx, cy + offy, rad, a0 + breathe, a1 + breathe);
    ctx.stroke();
    ctx.restore();
  }

  // 收束：中心一圈干净的实线 + 内圈淡光
  if (close > 0) {
    ctx.save();
    ctx.globalAlpha = close;
    const g = ctx.createRadialGradient(cx, cy, 20, cx, cy, 108);
    g.addColorStop(0, 'rgba(255,238,210,.15)');
    g.addColorStop(.72, 'rgba(255,238,210,.03)');
    g.addColorStop(1, 'rgba(255,238,210,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, 108, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(246,238,222,.85)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(cx, cy, 104, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * close); ctx.stroke();
    ctx.restore();
  }

  // 三段文案：混乱 → 掌控 → 清晰
  if (t < 2.35) {
    m9caption('脑子里同时有十件事', m9p(t, 0.06, 0.7), 'rgba(226,214,196,.82)', 21, 44, 312);
  } else if (t < 4.2) {
    m9caption('一件，一件来', m9p(t, 2.3, 2.75), 'rgba(232,210,180,.9)', 21, 44, 312);
  } else {
    m9caption('慢下来，就清楚了', m9p(t, 4.25, 4.95), 'rgba(248,240,226,.96)', 27, 44, 314);
  }

  // 左上角标识
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = 'rgba(226,214,196,.7)';
  ctx.font = `500 13px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('情绪弧线 · 一条不断线', 44, 40);
  ctx.restore();

  // 极轻的呼吸，接回开头
  const endP = m9p(t, 5.9, 6.0);
  if (endP > 0) {
    ctx.save(); ctx.globalAlpha = easeIn(endP) * 0.28;
    ctx.fillStyle = M9_BG; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>M38 · 一个形状变到底</h1>
    <p>同一个圆角形状按鼠标的点击与拖动一路变：按钮→加载圈→播放键→滑杆→开关→再变回按钮，镜头跟着放大，结尾回到第一帧。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="一个形状变到底 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 同一个圆角形状按鼠标的点击与拖动一路变：按钮→加载圈→播放键→滑杆→开关→再变回按钮，镜头跟着放大，结尾回到第一帧。
// M38 一个形状变到底 · DeepSeek Harness 生成示例
const M38_BG0 = '#f4f1ea', M38_BG1 = '#ded8cc', M38_INK = '#1d2027';
const M38_ST = [
  { t: 0.00, w: 196, h: 60, r: 30, a: '#f0603f', b: '#bf2f18' },
  { t: 0.85, w: 126, h: 126, r: 63, a: '#f0603f', b: '#bf2f18' },
  { t: 1.72, w: 126, h: 126, r: 63, a: '#4b86ff', b: '#1c49b8' },
  { t: 2.62, w: 286, h: 22, r: 11, a: '#9fb0c8', b: '#65758c' },
  { t: 3.72, w: 152, h: 40, r: 20, a: '#a3acbb', b: '#6d7787' },
  { t: 4.58, w: 152, h: 40, r: 20, a: '#3fc57e', b: '#1e8a51' },
  { t: 4.98, w: 196, h: 60, r: 30, a: '#f0603f', b: '#bf2f18' },
];
const M38_LABELS = ['01 / 按钮', '02 / 加载', '03 / 播放', '04 / 拖拽', '05 / 开关', '05 / 开关', '01 / 按钮'];

function m38seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function m38e(t) { return 1 - Math.pow(1 - t, 3); }
function m38spring(p) {
  if (p <= 0) return 0;
  if (p >= 1) return 1;
  return 1 - Math.exp(-7 * p) * Math.cos(11 * p) * (1 - p * 0.45);
}
function m38hex(c) {
  return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
}
function m38mix(c1, c2, p) {
  const a = m38hex(c1), b = m38hex(c2);
  return `rgb(${Math.round(lerp(a[0], b[0], p))},${Math.round(lerp(a[1], b[1], p))},${Math.round(lerp(a[2], b[2], p))})`;
}
function m38stateAt(t) {
  let k = 0;
  for (let i = 0; i < M38_ST.length; i++) if (t >= M38_ST[i].t) k = i;
  if (k === 0) return { w: M38_ST[0].w, h: M38_ST[0].h, r: M38_ST[0].r, a: M38_ST[0].a, b: M38_ST[0].b, k };
  const A = M38_ST[k - 1], B = M38_ST[k];
  const p = m38spring(m38seg(t, B.t, B.t + 0.36));
  return {
    w: lerp(A.w, B.w, p), h: lerp(A.h, B.h, p), r: lerp(A.r, B.r, p),
    a: m38mix(A.a, B.a, clamp(k === 6 ? p * 2.6 : p, 0, 1)),
    b: m38mix(A.b, B.b, clamp(k === 6 ? p * 2.6 : p, 0, 1)), k,
  };
}
function m38RR(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}

const M38_CURSOR = [
  [0.05, 566, 300], [0.55, 400, 228], [0.8, 356, 196], [1.55, 356, 196],
  [2.45, 350, 196], [2.8, 262, 200], [3.45, 410, 200], [3.62, 386, 182],
  [4.15, 420, 182], [4.55, 470, 176], [5.9, 566, 300],
];
function m38CursorPos(t) {
  for (let i = 1; i < M38_CURSOR.length; i++) {
    const a = M38_CURSOR[i - 1], b = M38_CURSOR[i];
    if (t <= b[0]) {
      const p = m38e(m38seg(t, a[0], b[0]));
      return [lerp(a[1], b[1], p), lerp(a[2], b[2], p)];
    }
  }
  const last = M38_CURSOR[M38_CURSOR.length - 1];
  return [last[1], last[2]];
}

function drawScene(t) {
  const st = m38stateAt(t);
  const z = clamp(400 / Math.max(st.w, st.h), 1.15, 2.6);

  // 背景
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, M38_BG0);
  bg.addColorStop(1, M38_BG1);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.fillStyle = 'rgba(29,32,39,.055)';
  for (let y = 30; y < H; y += 26) {
    for (let x = 24; x < W; x += 26) {
      ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();

  // 镜头：形状越大，画面推得越近
  ctx.save();
  ctx.translate(320, 180);
  ctx.scale(z, z);
  ctx.translate(-320, -180);

  // 投影
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#4a3f2f';
  ctx.beginPath();
  ctx.ellipse(320, 180 + st.h * 0.58 + 22, st.w * 0.40, st.h * 0.10 + 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 主体形状
  const g = ctx.createLinearGradient(320 - st.w / 2, 180 - st.h / 2, 320 - st.w / 2, 180 + st.h / 2);
  g.addColorStop(0, st.a);
  g.addColorStop(1, st.b);
  ctx.fillStyle = g;
  m38RR(320 - st.w / 2, 180 - st.h / 2, st.w, st.h, Math.min(st.r, Math.min(st.w, st.h) / 2));
  ctx.fill();

  // 内高光
  ctx.save();
  m38RR(320 - st.w / 2, 180 - st.h / 2, st.w, st.h, Math.min(st.r, Math.min(st.w, st.h) / 2));
  ctx.clip();
  const hg = ctx.createLinearGradient(0, 180 - st.h / 2, 0, 180);
  hg.addColorStop(0, 'rgba(255,255,255,.28)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(320 - st.w / 2, 180 - st.h / 2, st.w, st.h / 2);
  ctx.restore();

  // 按钮字
  const btnA = clamp(1 - m38seg(t, 0.72, 0.95) + m38seg(t, 4.95, 5.2) * 1, 0, 1);
  if (btnA > 0.01) {
    ctx.save();
    ctx.globalAlpha = btnA;
    ctx.fillStyle = '#fff6ee';
    ctx.font = `800 22px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('开始', 320, 181);
    // 右侧小箭头
    ctx.strokeStyle = 'rgba(255,246,238,.75)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(364, 181); ctx.lineTo(372, 181); ctx.moveTo(368, 177); ctx.lineTo(372, 181); ctx.lineTo(368, 185); ctx.stroke();
    ctx.restore();
  }

  // 加载圈
  const loadA = m38seg(t, 0.9, 1.1) * (1 - m38seg(t, 1.72, 1.9));
  if (loadA > 0.01) {
    ctx.save();
    ctx.globalAlpha = loadA;
    ctx.strokeStyle = 'rgba(255,255,255,.20)';
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(320, 180, Math.min(st.w, st.h) / 2 - 15, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#fff6ee';
    ctx.lineWidth = 9; ctx.lineCap = 'round';
    const spin = t * 4.4;
    ctx.beginPath(); ctx.arc(320, 180, Math.min(st.w, st.h) / 2 - 15, spin, spin + 1.7); ctx.stroke();
    ctx.restore();
  }

  // 播放三角
  const playA = m38seg(t, 1.78, 1.95) * (1 - m38seg(t, 2.62, 2.8));
  if (playA > 0.01) {
    ctx.save();
    ctx.globalAlpha = playA;
    ctx.fillStyle = '#fff6ee';
    ctx.beginPath();
    ctx.moveTo(310, 158);
    ctx.lineTo(310, 202);
    ctx.lineTo(348, 180);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 滑杆
  const sliderA = m38seg(t, 2.72, 2.9) * (1 - m38seg(t, 3.78, 3.9));
  if (sliderA > 0.01) {
    const dragP = m38spring(m38seg(t, 2.95, 3.5));
    ctx.save();
    ctx.globalAlpha = sliderA;
    // 已拖过的段
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.fillRect(320 - st.w / 2 + 2, 180 - 3, (st.w - 4) * (0.12 + dragP * 0.78), 6);
    const knobX = 320 - st.w / 2 + 12 + (st.w - 24) * (0.12 + dragP * 0.78);
    ctx.fillStyle = '#fff6ee';
    ctx.beginPath(); ctx.arc(knobX, 180, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(29,32,39,.25)';
    ctx.beginPath(); ctx.arc(knobX, 181.5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // 开关
  const toggleA = m38seg(t, 3.82, 4.0) * (1 - m38seg(t, 4.9, 5.0));
  if (toggleA > 0.01) {
    const onP = m38spring(m38seg(t, 4.12, 4.45));
    ctx.save();
    ctx.globalAlpha = toggleA;
    const knobR = st.h / 2 - 5;
    const kx = lerp(320 - st.w / 2 + knobR + 5, 320 + st.w / 2 - knobR - 5, onP);
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath(); ctx.arc(kx, 180, knobR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(29,32,39,.18)';
    ctx.beginPath(); ctx.arc(kx, 181, knobR * 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // 点击涟漪（屏幕坐标）
  for (const ct of [0.8, 2.56, 3.9]) {
    const p = m38seg(t, ct, ct + 0.3);
    if (p > 0 && p < 1) {
      ctx.save();
      ctx.globalAlpha = (1 - p) * 0.55;
      ctx.strokeStyle = M38_INK; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ct === 2.56 ? 320 : ct === 0.8 ? 348 : 320, 180, 12 + p * 34, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  // 鼠标
  const [mx, my] = m38CursorPos(t);
  ctx.save();
  ctx.translate(mx, my);
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = M38_INK; ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 22);
  ctx.lineTo(6.4, 16.4);
  ctx.lineTo(10.6, 25);
  ctx.lineTo(14.4, 23);
  ctx.lineTo(10.4, 14.6);
  ctx.lineTo(18, 14.4);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();

  // 状态标签与提示（屏幕坐标，避开右下署名区）
  const k = st.k;
  ctx.save();
  ctx.fillStyle = 'rgba(29,32,39,.55)';
  ctx.font = `600 13px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(M38_LABELS[k], 34, 34);
  ctx.fillStyle = 'rgba(29,32,39,.30)';
  ctx.font = `500 13px ${FONT}`;
  ctx.fillText('同一个形状，一直是它。', 34, 54);
  // 五个状态点
  for (let i = 0; i < 5; i++) {
    const active = Math.min(4, Math.max(0, k - 1));
    ctx.fillStyle = i === active ? 'rgba(29,32,39,.72)' : 'rgba(29,32,39,.18)';
    ctx.beginPath(); ctx.arc(34 + i * 14, 76, i === active ? 3.6 : 2.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(29,32,39,.34)';
  ctx.font = `500 13px ${FONT}`;
  ctx.fillText('点一下 / 拖一下，它才变', 34, 322);
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K5 孟菲斯扁平人 · DeepSeek Harness 生成示例</title>

  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>K5 · 孟菲斯扁平人</h1>
    <p>孟菲斯风格的长手长脚扁平小人抬起大手掌，一颗几何灯泡在他手心上方亮起。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="孟菲斯扁平人 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 孟菲斯风格的长手长脚扁平小人抬起大手掌，一颗几何灯泡在他手心上方亮起。
// K5 孟菲斯扁平人 · DeepSeek Harness 生成示例
const K5_BG = '#f4efe3', K5_NAVY = '#26415e', K5_CORAL = '#ef6f5e', K5_MUSTARD = '#e9b24b';
const K5_TEAL = '#3f9e94', K5_PINK = '#e2a0b5', K5_SKIN = '#e8b48f', K5_CREAM = '#fdfaf2';
const K5_CONFETTI = (() => {
  const r = rng(20261105);
  const cols = [K5_CORAL, K5_TEAL, K5_MUSTARD, K5_PINK];
  return Array.from({ length: 9 }, (_, i) => ({
    x: r() * W, y: 158 + r() * 172, sz: 4 + r() * 5, vx: 8 + r() * 14,
    c: cols[i % 4], kind: i % 3, ph: r() * 6.28,
  }));
})();

function k5seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function k5ease(p) { return 1 - Math.pow(1 - p, 3); }
function k5pop(p) { const q = clamp(p, 0, 1); const c = 2.1; const u = q - 1; return 1 + (c + 1) * u * u * u + c * u * u; }
function k5rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}
function k5Squiggle(x, y, w, amp, color, lw, phase) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) {
    const px = x + (i / 40) * w;
    const py = y + Math.sin(i / 40 * Math.PI * 4 + (phase || 0)) * amp;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.stroke(); ctx.restore();
}

// 长手长脚的扁平人：无五官，靠大手掌和大鞋子说话
function k5Person(x, y, s, armA) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  const navy = K5_NAVY, skin = K5_SKIN, coral = K5_CORAL;

  // 腿：两条长直线
  ctx.strokeStyle = navy; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-13, 70); ctx.lineTo(-20, 126); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(13, 70); ctx.lineTo(20, 126); ctx.stroke();
  // 大鞋子
  ctx.fillStyle = coral;
  ctx.beginPath(); ctx.ellipse(-27, 133, 18, 9, -0.08, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(27, 133, 18, 9, 0.08, 0, Math.PI * 2); ctx.fill();

  // 躯干
  ctx.fillStyle = navy;
  k5rr(-30, -12, 60, 86, 22); ctx.fill();
  // 领口色块
  ctx.fillStyle = K5_CREAM;
  k5rr(-12, -12, 24, 18, 8); ctx.fill();
  ctx.fillStyle = K5_TEAL;
  k5rr(-30, 34, 60, 10, 5); ctx.fill();

  // 左臂：自然下垂，手很大
  ctx.strokeStyle = skin; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-28, 4); ctx.quadraticCurveTo(-48, 36, -44, 68); ctx.stroke();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(-45, 76, 12, 0, Math.PI * 2); ctx.fill();

  // 右臂：绕肩旋转，最后举向灯泡
  ctx.save();
  ctx.translate(28, 2);
  ctx.rotate(armA);
  ctx.strokeStyle = skin; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(12, 62); ctx.stroke();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(14, 70, 12, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 头
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, -44, 26, 0, Math.PI * 2); ctx.fill();
  // 发型：一块圆角矩形 + 发髻
  ctx.fillStyle = navy;
  ctx.beginPath();
  ctx.arc(0, -46, 27, Math.PI * 1.02, Math.PI * 1.98);
  ctx.lineTo(26, -38);
  ctx.quadraticCurveTo(0, -52, -26, -38);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(2, -72, 11, 0, Math.PI * 2); ctx.fill();
  // 耳朵
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(-26, -42, 6, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function drawScene(t) {
  ctx.fillStyle = K5_BG; ctx.fillRect(0, 0, W, H);

  // —— 背景几何：孟菲斯色块、波浪线、圆点、三角 ——
  const s1 = k5pop(k5seg(t + 0.4, 0, 0.7));
  if (s1 > 0.02) {
    ctx.save(); ctx.translate(566, 62); ctx.scale(s1 * (1 + Math.sin(t * 1.5) * 0.04), s1 * (1 + Math.sin(t * 1.5) * 0.04)); ctx.fillStyle = K5_CORAL;
    ctx.beginPath(); ctx.arc(0, 0, 42, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  const s2 = k5seg(t + 0.4, 0.2, 0.8);
  if (s2 > 0) {
    ctx.save(); ctx.globalAlpha = k5ease(s2); k5Squiggle(452, 32, 92, 8, K5_NAVY, 4.5, t * 2.2); ctx.restore();
  }
  const s3 = k5pop(k5seg(t + 0.4, 0.35, 1.0));
  if (s3 > 0.02) {
    ctx.save(); ctx.translate(58, 208); ctx.scale(s3, s3);
    ctx.fillStyle = K5_TEAL;
    ctx.beginPath(); ctx.moveTo(-34, 34); ctx.lineTo(34, 34); ctx.lineTo(-34, -30); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const s4 = k5pop(k5seg(t + 0.4, 0.5, 1.15));
  if (s4 > 0.02) {
    ctx.save(); ctx.translate(586, 262); ctx.scale(s4, s4);
    ctx.fillStyle = K5_MUSTARD;
    ctx.beginPath(); ctx.arc(0, 0, 26, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = K5_NAVY; ctx.fillRect(-3, 2, 6, 18);
    ctx.restore();
  }
  // 圆点阵
  ctx.save(); ctx.fillStyle = K5_NAVY; ctx.globalAlpha = 0.85 * k5ease(k5seg(t + 0.4, 0.55, 1.2));
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
    ctx.beginPath(); ctx.arc(486 + c * 14, 214 + r * 14 + Math.sin(t * 2.4 + c * 0.5) * 1.6, 3.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  // 十字 / 方块
  const s6 = k5ease(k5seg(t + 0.35, 0.7, 1.35));
  ctx.save(); ctx.globalAlpha = s6; ctx.strokeStyle = K5_CORAL; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(120, 148); ctx.lineTo(140, 148); ctx.moveTo(130, 138); ctx.lineTo(130, 158); ctx.stroke();
  ctx.fillStyle = K5_PINK; ctx.fillRect(558, 308, 16, 16);
  ctx.fillStyle = K5_NAVY; ctx.fillRect(88, 300, 11, 11);
  ctx.restore();
  // 背景细线圆
  ctx.save(); ctx.strokeStyle = K5_NAVY; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.28 * s6;
  ctx.beginPath(); ctx.arc(462, 296, 34, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // 持续飘过的小色块，让画面一直没有停住
  for (const c of K5_CONFETTI) {
    const x = ((c.x + t * c.vx) % (W + 40)) - 20;
    const y = c.y + Math.sin(t * 1.3 + c.ph) * 9;
    ctx.save();
    ctx.globalAlpha = 0.8; ctx.fillStyle = c.c;
    if (c.kind === 0) {
      ctx.beginPath(); ctx.arc(x, y, c.sz, 0, Math.PI * 2); ctx.fill();
    } else if (c.kind === 1) {
      ctx.beginPath(); ctx.moveTo(x, y - c.sz); ctx.lineTo(x + c.sz, y + c.sz * 0.7); ctx.lineTo(x - c.sz, y + c.sz * 0.7); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(x - c.sz * 0.7, y - c.sz * 0.7, c.sz * 1.4, c.sz * 1.4);
    }
    ctx.restore();
  }

  // —— 人物 ——
  const pIn = k5seg(t + 0.45, 0, 0.8);
  const ps = k5pop(pIn) * 0.95;
  const idleSway = Math.sin(t * 2.1) * 0.06;
  const armA = lerp(0.06 + idleSway, -2.15 + Math.sin(t * 1.6) * 0.03, k5ease(k5seg(t, 1.75, 2.75)));
  const px = 306, py = 196 + Math.sin(t * 2.3) * 2.4;
  if (ps > 0.02) {
    ctx.save();
    ctx.globalAlpha = clamp(pIn * 2, 0, 1);
    k5Person(px, py, ps, armA);
    ctx.restore();
  }

  // 手掌位置 → 灯泡从这里升起
  const shoulderX = px + 28 * ps, shoulderY = py + 2 * ps;
  const handX = shoulderX + (14 * Math.cos(armA) - 70 * Math.sin(armA)) * ps;
  const handY = shoulderY + (14 * Math.sin(armA) + 70 * Math.cos(armA)) * ps;

  const bulbP = k5seg(t, 2.85, 3.5);
  if (bulbP > 0) {
    const rise = k5ease(bulbP);
    const bx = handX + 22 + Math.sin(t * 2) * 2;
    const by = handY - 38 - 14 * rise;
    ctx.save();
    ctx.translate(bx, by);
    ctx.scale(k5pop(bulbP), k5pop(bulbP));

    // 光晕：同心几何圆
    ctx.save(); ctx.globalAlpha = 0.22 + 0.10 * Math.sin(t * 3);
    ctx.fillStyle = K5_MUSTARD;
    ctx.beginPath(); ctx.arc(0, 0, 46 + Math.sin(t * 3) * 5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // 玻璃
    ctx.fillStyle = K5_MUSTARD;
    ctx.beginPath(); ctx.arc(0, -4, 23, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = K5_NAVY; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, -4, 23, 0, Math.PI * 2); ctx.stroke();
    // 灯座
    ctx.fillStyle = K5_NAVY; k5rr(-11, 18, 22, 10, 3); ctx.fill();
    // 灯丝
    ctx.strokeStyle = K5_NAVY; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8, 12); ctx.lineTo(-3, -2); ctx.lineTo(1, 10); ctx.lineTo(5, -2); ctx.lineTo(9, 12); ctx.stroke();

    // 几何光芒
    const rayP = k5ease(k5seg(t, 3.1, 3.8));
    if (rayP > 0) {
      ctx.strokeStyle = K5_CORAL; ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const a = -Math.PI * 0.9 + i * Math.PI * 0.26 + Math.sin(t * 1.2) * 0.1;
        const r0 = 34, r1 = 34 + 14 * rayP;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0 - 4);
        ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1 - 4);
        ctx.stroke();
      }
    }
    ctx.restore();

    // 手心到灯泡的一条细虚线
    ctx.save();
    ctx.strokeStyle = 'rgba(38,65,94,.45)'; ctx.lineWidth = 2; ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(handX, handY - 10); ctx.lineTo(bx, by + 22); ctx.stroke();
    ctx.restore();
  }

  // —— 文字 ——
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = K5_NAVY; ctx.font = `800 32px ${FONT}`;
  ctx.fillText('把点子举高', 36, 74);
  ctx.fillStyle = K5_TEAL; ctx.font = `600 14px ${FONT}`;
  ctx.fillText('长手长脚 · 扁平色块', 36, 98);
  ctx.restore();

  const capP = k5seg(t, 3.6, 4.4);
  if (capP > 0) {
    ctx.save(); ctx.globalAlpha = capP;
    ctx.fillStyle = K5_NAVY; ctx.font = `700 16px ${FONT}`;
    ctx.fillText('手伸出去，灯就亮了', 36, 330);
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = 0.5; ctx.fillStyle = K5_NAVY; ctx.font = `500 13px ${FONT}`;
  ctx.fillText('K5 · 孟菲斯扁平 / corporate memphis', 36, 30);
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

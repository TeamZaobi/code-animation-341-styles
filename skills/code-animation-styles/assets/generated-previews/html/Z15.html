<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>Z15 · 温暖水彩科普卡</h1>
    <p>温暖水彩科普卡：水彩晕开的三格卡片，讲一片茶叶「采摘—炒青—冲泡」，热气轻轻飘。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="温暖水彩科普卡 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 温暖水彩科普卡：水彩晕开的三格卡片，讲一片茶叶「采摘—炒青—冲泡」，热气轻轻飘。
// Z15 温暖水彩科普卡 · DeepSeek Harness 生成示例

const Z15_PAPER = '#fbf5e5';
const Z15_GREEN = '92,124,86', Z15_DEEP = '63,92,62', Z15_OCHRE = '194,152,92', Z15_ROSE = '196,132,116';

const Z15_TEX = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = Z15_PAPER; g.fillRect(0, 0, W, H);
  const r = rng(1515);
  for (let i = 0; i < 900; i++) {
    const x = r() * W, y = r() * H, len = 4 + r() * 22, a = r() * Math.PI;
    g.strokeStyle = `rgba(150,130,96,${0.012 + r() * 0.03})`;
    g.lineWidth = 0.6;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); g.stroke();
  }
  const vg = g.createRadialGradient(W * 0.5, H * 0.42, 150, W * 0.5, H * 0.42, 430);
  vg.addColorStop(0, 'rgba(255,255,255,0)');
  vg.addColorStop(1, 'rgba(160,130,88,0.14)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return c;
})();

function z15seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

// 水彩团：不规则边、两层晕
function z15blob(cx, cy, r, col, alpha, seed, t, wob) {
  if (alpha <= 0) return;
  const rd = rng(seed);
  const pts = [];
  const N = 30;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const rr = r * (1 + 0.10 * Math.sin(a * 3 + seed) + 0.06 * Math.sin(a * 5 + 1.2) + 0.05 * (rd() - 0.5));
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.94]);
  }
  ctx.save();
  ctx.globalAlpha = alpha;
  // 外圈淡晕（水痕）
  ctx.fillStyle = `rgba(${col},0.30)`;
  ctx.beginPath();
  pts.forEach(([x, y], i) => {
    const px = cx + (x - cx) * 1.12, py = cy + (y - cy) * 1.12;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath();
  ctx.fill();
  // 主体
  const grd = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.25, r * 0.1, cx, cy, r);
  grd.addColorStop(0, `rgba(${col},0.82)`);
  grd.addColorStop(0.62, `rgba(${col},0.55)`);
  grd.addColorStop(1, `rgba(${col},0.12)`);
  ctx.fillStyle = grd;
  ctx.beginPath();
  pts.forEach(([x, y], i) => { if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
  ctx.closePath();
  ctx.fill();
  // 边缘积色
  ctx.strokeStyle = `rgba(${col},0.35)`;
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.restore();
}

function z15leaf(x, y, s, ang, p, col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(s, s);
  ctx.globalAlpha = p;
  ctx.fillStyle = `rgba(${col},0.85)`;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(11, -11, 24, -2);
  ctx.quadraticCurveTo(12, 11, 0, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(250,246,234,0.7)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(2, -1);
  ctx.quadraticCurveTo(12, -2, 21, -2);
  ctx.stroke();
  ctx.restore();
}

// 三格
function z15step1(x, y, s, p0, p1, t) {
  z15blob(x, y, 50 * s, Z15_GREEN, p0 * 0.75, 31, t);
  if (p1 > 0) {
    const e = easeOut(p1);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.globalAlpha = e;
    // 嫩芽：两根叶 + 茎
    ctx.strokeStyle = 'rgba(63,92,62,0.9)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 26); ctx.quadraticCurveTo(2, 4, 0, -10);
    ctx.stroke();
    ctx.save();
    ctx.translate(0, -8);
    ctx.rotate(-0.9 + Math.sin(t * 1.4) * 0.04);
    z15leaf(0, 0, 1.0, 0, 1, '108,140,96');
    ctx.restore();
    ctx.save();
    ctx.translate(0, 4);
    ctx.rotate(2.5 - Math.sin(t * 1.4) * 0.04);
    z15leaf(0, 0, 0.9, 0, 1, '122,150,102');
    ctx.restore();
    // 山影
    ctx.strokeStyle = 'rgba(92,124,86,0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-26, 26); ctx.lineTo(-10, 12); ctx.lineTo(0, 22); ctx.lineTo(12, 10); ctx.lineTo(28, 26);
    ctx.stroke();
    ctx.restore();
  }
}

function z15step2(x, y, s, p0, p1, t) {
  z15blob(x, y, 50 * s, Z15_OCHRE, p0 * 0.68, 32, t);
  if (p1 > 0) {
    const e = easeOut(p1);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.globalAlpha = e;
    // 炒锅
    ctx.strokeStyle = 'rgba(92,70,44,0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 2, 26, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-26, 6); ctx.lineTo(26, 6);
    ctx.stroke();
    // 锅把
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(26, 4); ctx.quadraticCurveTo(42, 2, 48, -8);
    ctx.stroke();
    // 锅里的茶叶
    ctx.save();
    ctx.translate(0, 2);
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.rotate(-0.5 + i * 0.5 + Math.sin(t * 2 + i) * 0.06);
      z15leaf(-6 + i * 7, -2 - (i % 2) * 4, 0.55, 0, 1, i % 2 ? '108,140,96' : '63,92,62');
      ctx.restore();
    }
    ctx.restore();
    // 热气
    ctx.strokeStyle = 'rgba(160,150,128,0.55)';
    ctx.lineWidth = 1.6;
    for (let k = 0; k < 2; k++) {
      const ph = t * 1.2 + k * 1.8;
      ctx.beginPath();
      for (let i = 0; i <= 10; i++) {
        const u = i / 10;
        const yy = -8 - u * 26;
        const xx = -6 + k * 14 + Math.sin(u * 4 + ph) * 4;
        if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}

function z15step3(x, y, s, p0, p1, t) {
  z15blob(x, y, 50 * s, Z15_ROSE, p0 * 0.62, 33, t);
  if (p1 > 0) {
    const e = easeOut(p1);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.globalAlpha = e;
    // 茶杯
    ctx.fillStyle = 'rgba(250,246,236,0.9)';
    ctx.beginPath();
    ctx.moveTo(-18, -4);
    ctx.quadraticCurveTo(-16, 20, 0, 22);
    ctx.quadraticCurveTo(16, 20, 18, -4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(92,70,44,0.85)';
    ctx.lineWidth = 2.4;
    ctx.stroke();
    // 茶汤
    ctx.fillStyle = 'rgba(196,152,92,0.55)';
    ctx.beginPath();
    ctx.ellipse(0, 4, 16, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    // 碟
    ctx.strokeStyle = 'rgba(92,70,44,0.7)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-24, 24); ctx.quadraticCurveTo(0, 30, 24, 24);
    ctx.stroke();
    // 热气
    ctx.strokeStyle = 'rgba(150,140,120,0.5)';
    ctx.lineWidth = 1.6;
    for (let k = 0; k < 3; k++) {
      const ph = t * 1.4 + k * 1.5;
      ctx.beginPath();
      for (let i = 0; i <= 12; i++) {
        const u = i / 12;
        const yy = -8 - u * 34;
        const xx = -10 + k * 10 + Math.sin(u * 4.4 + ph) * 4.5;
        if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}

function z15arrow(x, y, p, dir) {
  if (p <= 0) return;
  const e = easeOut(p);
  ctx.save();
  ctx.globalAlpha = e * 0.8;
  ctx.strokeStyle = 'rgba(120,104,74,0.75)';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(x - 16 * e, y);
  ctx.lineTo(x + 12 * e, y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(x + 4 * e, y - 5);
  ctx.lineTo(x + 13 * e, y);
  ctx.lineTo(x + 4 * e, y + 5);
  ctx.stroke();
  ctx.restore();
}

function drawScene(t) {
  ctx.drawImage(Z15_TEX, 0, 0);

  // 卡片
  const cp = z15seg(t, -0.3, 0.45);
  if (cp > 0) {
    const e = easeOut(cp);
    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate(0, (1 - e) * 10);
    ctx.shadowColor = 'rgba(120,96,60,0.22)';
    ctx.shadowBlur = 22;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#fdf8ec';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(26, 18, 588, 324, 20); else ctx.rect(26, 18, 588, 324);
    ctx.fill();
    ctx.restore();
    // 水彩边：卡片四角的淡晕
    ctx.save();
    ctx.globalAlpha = e;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(26, 18, 588, 324, 20); else ctx.rect(26, 18, 588, 324);
    ctx.clip();
    z15blob(70, 40, 70, '150,170,140', 0.20, 41, t);
    z15blob(590, 330, 86, '196,170,126', 0.18, 42, t);
    z15blob(560, 26, 60, '186,160,140', 0.14, 43, t);
    z15blob(60, 330, 64, '160,178,150', 0.13, 44, t);
    ctx.restore();
  }

  // 标题
  const tp = z15seg(t, 0.35, 1.0);
  if (tp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(tp);
    ctx.fillStyle = 'rgba(58,66,52,0.92)';
    ctx.font = `600 27px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('一片叶子的旅程', 320, 54);
    ctx.font = `400 14px ${FONT}`;
    ctx.fillStyle = 'rgba(90,100,80,0.8)';
    ctx.fillText('茶的三次转身', 320, 82);
    ctx.restore();
  }

  // 三格
  const p1 = z15seg(t, 0.9, 2.0), i1 = z15seg(t, 1.2, 1.9);
  z15step1(150, 182, 1.22, p1, i1, t);
  const p2 = z15seg(t, 1.5, 2.6), i2 = z15seg(t, 1.8, 2.5);
  z15step2(320, 182, 1.22, p2, i2, t);
  const p3 = z15seg(t, 2.1, 3.2), i3 = z15seg(t, 2.4, 3.1);
  z15step3(490, 182, 1.22, p3, i3, t);

  // 标签
  const lp = z15seg(t, 1.9, 3.0);
  if (lp > 0) {
    ctx.save();
    ctx.globalAlpha = lp;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const labels = [['采摘', 150], ['炒青', 320], ['冲泡', 490]];
    ctx.font = `600 16px ${FONT}`;
    ctx.fillStyle = 'rgba(58,66,52,0.9)';
    labels.forEach(([s, x]) => ctx.fillText(s, x, 262));
    ctx.font = `400 13px ${FONT}`;
    ctx.fillStyle = 'rgba(110,110,88,0.8)';
    const tips = ['晨露未干', '锅里定香', '一杯春色'];
    tips.forEach((s, i) => ctx.fillText(s, labels[i][1], 284));
    ctx.restore();
  }

  // 箭头
  z15arrow(235, 186, z15seg(t, 2.6, 3.3), 1);
  z15arrow(405, 186, z15seg(t, 2.8, 3.5), 1);

  // 页脚
  const fp = z15seg(t, 3.4, 4.1);
  if (fp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(fp) * 0.85;
    ctx.fillStyle = 'rgba(96,100,80,0.85)';
    ctx.font = `400 13px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText('水彩 · 科普卡 · 一片叶子从山间到杯中', 320, 314);
    ctx.restore();
  }

  // 飘落的小叶：持续动
  const dp = z15seg(t, 3.0, 4.0);
  if (dp > 0) {
    ctx.save();
    ctx.globalAlpha = dp * 0.75;
    for (let i = 0; i < 4; i++) {
      const x = 90 + i * 150 + Math.sin(t * 0.7 + i * 1.4) * 26;
      const y = 108 + ((t * 16 + i * 57) % 180);
      z15leaf(x, y, 0.42, Math.sin(t * 0.9 + i) * 1.2 + 0.6, 0.7, '132,158,112');
    }
    ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 俯拍桌面上的平铺整理，一格格工具按对齐线摆好；右手放进最后一支笔，左手压住本子，全部归位。
// K31 平铺整理 · DeepSeek Harness 生成示例
const K31 = {
  desk: '#e6dfd2', deskDark: '#d3c9b8', ink: '#332f29', inkSoft: '#6e665a',
  cream: '#fbf7ee', paper: '#f4ede1', terra: '#c4694f', terraDark: '#a2533d',
  sage: '#8fa088', sageDark: '#6d7f68', navy: '#3c4a58', mustard: '#d9a441',
  steel: '#9aa4ab', skin: '#eec0a0', skinDark: '#cf9a78', chambray: '#8b9dab',
};
const K31_ITEMS = [
  { id: 'note', x: 108, y: 134 },
  { id: 'ruler', x: 248, y: 134 },
  { id: 'penSlot', x: 390, y: 132 },
  { id: 'headphones', x: 526, y: 134 },
  { id: 'mug', x: 108, y: 220 },
  { id: 'scissors', x: 248, y: 220 },
  { id: 'tape', x: 390, y: 220 },
  { id: 'keys', x: 526, y: 220 },
  { id: 'sticky', x: 108, y: 305 },
  { id: 'clips', x: 250, y: 305 },
  { id: 'eraser', x: 392, y: 305 },
  { id: 'plant', x: 528, y: 305 },
];
// 桌面木纹：加载时预计算
const K31_GRAIN = (() => {
  const r = rng(3107);
  return Array.from({ length: 60 }, () => ({
    y: r() * H, x: r() * W, len: 60 + r() * 220, a: 0.015 + r() * 0.03,
  }));
})();
const K31_SPECKS = (() => {
  const r = rng(3121);
  return Array.from({ length: 240 }, () => ({ x: r() * W, y: r() * H, a: 0.02 + r() * 0.05, s: 0.6 + r() * 1.4 }));
})();
const k31seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const k31ease = p => 1 - Math.pow(1 - p, 3);
const k31back = p => {
  const c = 1.70158, q = clamp(p, 0, 1) - 1;
  return 1 + (c + 1) * q * q * q + c * q * q;
};

function k31Shadow(blur, dy, alpha) {
  ctx.shadowColor = `rgba(70,58,44,${alpha || 0.2})`;
  ctx.shadowBlur = blur || 9;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = dy || 4;
}
function k31NoShadow() {
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
}
function k31Round(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.4; ctx.stroke(); }
}

function k31Item(id, x, y, t, p) {
  const I = K31.ink;
  ctx.save();
  ctx.translate(x, y);
  const pop = k31back(p);
  ctx.scale(0.85 + 0.15 * pop, 0.85 + 0.15 * pop);
  ctx.globalAlpha = clamp(p * 1.4, 0, 1);
  if (id === 'note') {
    // 笔记本
    const tilt = (1 - k31ease(clamp(t / 1.5, 0, 1))) * 0.07;
    ctx.rotate(tilt);
    k31Shadow(10, 5, 0.22);
    k31Round(-42, -30, 84, 60, 4, K31.cream, I);
    k31NoShadow();
    ctx.strokeStyle = K31.inkSoft; ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(-32, -18 + i * 8); ctx.lineTo(24, -18 + i * 8); ctx.stroke(); }
    ctx.fillStyle = K31.terra;
    ctx.fillRect(-42, -2, 84, 9);
    k31Round(-14, -8, 28, 7, 2, K31.cream, null);
  } else if (id === 'ruler') {
    ctx.rotate(-0.1);
    k31Shadow(8, 4, 0.18);
    k31Round(-58, -9, 116, 18, 3, K31.paper, I);
    k31NoShadow();
    for (let i = 0; i <= 10; i++) {
      const gx = -52 + i * 10.4;
      ctx.strokeStyle = K31.inkSoft; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(gx, 9); ctx.lineTo(gx, 9 - (i % 5 === 0 ? 7 : 4)); ctx.stroke();
    }
  } else if (id === 'penSlot') {
    // 笔：一开始不在，3s 后落位
    const pp = k31seg(t, 3.5, 3.85);
    if (pp > 0) {
      ctx.rotate(-0.12);
      ctx.globalAlpha = clamp(pp, 0, 1);
      k31Shadow(7, 3, 0.2);
      k31Round(-50, -5, 100, 10, 4, K31.navy, null);
      k31NoShadow();
      ctx.fillStyle = K31.mustard;
      ctx.beginPath(); ctx.moveTo(50, -5); ctx.lineTo(60, 0); ctx.lineTo(50, 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = K31.steel;
      ctx.fillRect(-50, -5, 12, 10);
      ctx.strokeStyle = K31.cream; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-46, 0); ctx.lineTo(28, 0); ctx.stroke();
    }
  } else if (id === 'headphones') {
    k31Shadow(9, 4, 0.2);
    ctx.strokeStyle = K31.ink; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(0, 4, 30, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
    k31NoShadow();
    ctx.strokeStyle = K31.navy; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 4, 30, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
    k31Round(-40, -2, 18, 30, 8, K31.ink, null);
    k31Round(-38, 1, 14, 24, 6, K31.terra, null);
    k31Round(22, -2, 18, 30, 8, K31.ink, null);
    k31Round(24, 1, 14, 24, 6, K31.terra, null);
  } else if (id === 'mug') {
    k31Shadow(10, 5, 0.22);
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fillStyle = K31.cream; ctx.fill();
    ctx.strokeStyle = K31.ink; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.beginPath(); ctx.arc(30, 0, 13, -1.1, 1.1); ctx.lineWidth = 8; ctx.strokeStyle = K31.cream; ctx.stroke();
    ctx.lineWidth = 1.4; ctx.strokeStyle = K31.ink;
    ctx.beginPath(); ctx.arc(30, 0, 13, -1.1, 1.1); ctx.stroke();
    k31NoShadow();
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fillStyle = '#6b4a34'; ctx.fill();
    ctx.beginPath(); ctx.arc(-4, -4, 22, 0, Math.PI * 2);
    ctx.fillStyle = '#7d5740'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.strokeStyle = K31.ink; ctx.lineWidth = 1.4; ctx.stroke();
    // 杯口高光
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 26, 2.4, 3.4); ctx.stroke();
  } else if (id === 'scissors') {
    ctx.rotate(0.12);
    k31Shadow(8, 4, 0.18);
    ctx.strokeStyle = K31.ink; ctx.lineWidth = 1.4;
    // 刀刃
    ctx.fillStyle = K31.steel;
    ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(58, -9); ctx.lineTo(58, -4); ctx.lineTo(-2, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4, 4); ctx.lineTo(58, 9); ctx.lineTo(58, 4); ctx.lineTo(-2, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = K31.ink; ctx.beginPath(); ctx.arc(2, 0, 2.4, 0, Math.PI * 2); ctx.fill();
    k31NoShadow();
    // 指环
    ctx.lineWidth = 5; ctx.strokeStyle = K31.terra;
    ctx.beginPath(); ctx.arc(-24, -14, 11, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(-24, 14, 11, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.4; ctx.strokeStyle = K31.ink;
    ctx.beginPath(); ctx.arc(-24, -14, 11, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(-24, 14, 11, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = K31.ink;
    ctx.beginPath(); ctx.arc(-8, 0, 2.6, 0, Math.PI * 2); ctx.fill();
  } else if (id === 'tape') {
    k31Shadow(8, 4, 0.18);
    ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI * 2); ctx.fillStyle = K31.terra; ctx.fill();
    ctx.strokeStyle = K31.ink; ctx.lineWidth = 1.4; ctx.stroke();
    k31NoShadow();
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fillStyle = K31.desk; ctx.fill();
    ctx.strokeStyle = K31.ink; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1.4; ctx.stroke();
    // 撕口
    ctx.fillStyle = K31.terraDark;
    ctx.beginPath(); ctx.moveTo(32, -4); ctx.lineTo(44, 2); ctx.lineTo(32, 8); ctx.closePath(); ctx.fill();
  } else if (id === 'keys') {
    ctx.rotate(-0.16);
    k31Shadow(7, 3, 0.2);
    ctx.strokeStyle = K31.ink; ctx.lineWidth = 5.5;
    ctx.beginPath(); ctx.arc(-30, 0, 13, 0, Math.PI * 2); ctx.stroke();
    k31NoShadow();
    ctx.strokeStyle = K31.mustard; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.arc(-30, 0, 13, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = K31.steel;
    ctx.fillRect(-18, -4, 52, 8);
    ctx.strokeStyle = K31.ink; ctx.lineWidth = 1.4;
    ctx.strokeRect(-18, -4, 52, 8);
    ctx.beginPath(); ctx.moveTo(20, 4); ctx.lineTo(20, 14); ctx.lineTo(28, 14); ctx.lineTo(28, 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, 4); ctx.lineTo(6, 11); ctx.lineTo(13, 11); ctx.lineTo(13, 4); ctx.stroke();
  } else if (id === 'sticky') {
    const lift = k31ease(k31seg(t, 0.3, 1.3));
    ctx.rotate(-0.04);
    for (let i = 2; i >= 0; i--) {
      k31Shadow(7, 3 + i, 0.16);
      k31Round(-34 + i * 3, -30 + i * 4 - (i === 2 ? 4 * lift : 0), 68, 60, 2, i === 0 ? '#f7e6b8' : '#fbf0cf', K31.ink);
      k31NoShadow();
    }
    ctx.strokeStyle = K31.inkSoft; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-20, -14); ctx.lineTo(18, -14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-20, -4); ctx.lineTo(12, -4); ctx.stroke();
  } else if (id === 'clips') {
    const ks = [[-26, 4], [0, -12], [24, 10]];
    for (let i = 0; i < ks.length; i++) {
      ctx.save();
      ctx.translate(ks[i][0], ks[i][1]);
      ctx.rotate(0.3 - i * 0.35);
      k31Shadow(4, 2, 0.18);
      ctx.strokeStyle = K31.ink; ctx.lineWidth = 1.5;
      k31Round(-19, -6, 38, 12, 6, null, K31.ink);
      ctx.strokeStyle = K31.steel; ctx.lineWidth = 1.2;
      k31Round(-13, -3, 30, 6, 3, null, K31.steel);
      ctx.strokeStyle = K31.ink; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-8, -5); ctx.lineTo(-8, 5); ctx.stroke();
      ctx.restore();
    }
  } else if (id === 'eraser') {
    ctx.rotate(0.1);
    k31Shadow(8, 4, 0.2);
    k31Round(-26, -14, 52, 28, 3, K31.cream, K31.ink);
    k31NoShadow();
    ctx.fillStyle = K31.navy;
    k31Round(-26, -14, 52, 9, 3, K31.navy, null);
    ctx.fillStyle = K31.terra;
    ctx.fillRect(-26, 4, 52, 10);
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-20, 7); ctx.lineTo(20, 7); ctx.stroke();
  } else if (id === 'plant') {
    k31Shadow(10, 5, 0.22);
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.fillStyle = '#c7b49a'; ctx.fill();
    ctx.strokeStyle = K31.ink; ctx.lineWidth = 1.4; ctx.stroke();
    k31NoShadow();
    const leaves = 7;
    for (let i = 0; i < leaves; i++) {
      const a = (i / leaves) * Math.PI * 2 + 0.3;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(0, -12, 6.4, 13, 0, 0, Math.PI * 2);
      ctx.fillStyle = i % 2 ? '#6f8a63' : '#87a179';
      ctx.fill();
      ctx.strokeStyle = '#4f6a48'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#e9e2d2'; ctx.fill();
    ctx.strokeStyle = K31.ink; ctx.lineWidth = 1.2; ctx.stroke();
  }
  ctx.restore();
}

// 俯拍的手：从画面上方伸入，掌与手指朝下
function k31Hand(wx, wy, angle, grip) {
  ctx.save();
  ctx.translate(wx, wy);
  ctx.rotate(angle);
  const line = K31.ink;
  // 袖子
  k31Shadow(12, 6, 0.24);
  k31Round(-24, -170, 48, 118, 16, K31.chambray, null);
  k31NoShadow();
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-18, -110); ctx.lineTo(18, -110); ctx.stroke();
  ctx.strokeStyle = line; ctx.lineWidth = 1.2;
  ctx.strokeRect(-24, -170, 48, 118);
  // 手腕 / 掌
  k31Shadow(9, 5, 0.2);
  k31Round(-22, -62, 44, 74, 16, K31.skin, line);
  k31NoShadow();
  // 手指
  const fx = [-16, -5, 6, 17];
  for (let i = 0; i < 4; i++) {
    const len = 34 - Math.abs(i - 1.5) * 5 + (grip || 0) * 6;
    k31Round(fx[i] - 3.4, 6, 7, len, 3.4, K31.skin, line);
    ctx.beginPath();
    ctx.arc(fx[i], 6 + len - 4, 3.2, 0, Math.PI);
    ctx.strokeStyle = 'rgba(180,120,95,.55)'; ctx.lineWidth = 1; ctx.stroke();
  }
  // 拇指
  ctx.save();
  ctx.rotate(-0.42);
  k31Round(-34, -34, 9, 32, 4.5, K31.skin, line);
  ctx.restore();
  // 掌心纹
  ctx.strokeStyle = 'rgba(180,120,95,.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-14, -18); ctx.quadraticCurveTo(0, -10, 14, -18); ctx.stroke();
  ctx.restore();
}

function baseScene(t) {
  // 桌面
  ctx.fillStyle = K31.desk; ctx.fillRect(0, 0, W, H);
  ctx.save();
  for (const g of K31_GRAIN) {
    ctx.strokeStyle = `rgba(140,120,95,${g.a})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(g.x + g.len, g.y + 2); ctx.stroke();
  }
  for (const s of K31_SPECKS) {
    ctx.fillStyle = `rgba(120,102,80,${s.a})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  // 四角压暗
  const vg = ctx.createRadialGradient(330, 170, 130, 330, 170, 420);
  vg.addColorStop(0, 'rgba(90,74,56,0)');
  vg.addColorStop(1, 'rgba(90,74,56,.2)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // 对齐参考：极淡的编排线
  ctx.save();
  ctx.strokeStyle = 'rgba(90,80,66,.10)'; ctx.lineWidth = 1;
  for (const x of [108, 248, 390, 526]) {
    ctx.beginPath(); ctx.moveTo(x, 96); ctx.lineTo(x, 322); ctx.stroke();
  }
  for (const y of [134, 220, 305]) {
    ctx.beginPath(); ctx.moveTo(62, y); ctx.lineTo(574, y); ctx.stroke();
  }
  ctx.restore();

  // 摆放物件：先落位、再微调
  K31_ITEMS.forEach(it => k31Item(it.id, it.x, it.y, t, 1));

  // 左手：压住本子一角，轻轻摆正
  const lp = k31seg(t, 0.7, 1.5);
  const lOut = k31seg(t, 3.9, 4.7);
  if (lp > 0 && lOut < 1) {
    const x = lerp(-80, 62, k31ease(lp));
    const y = 152 + Math.sin(t * 2.2) * 1.2;
    ctx.save();
    ctx.globalAlpha = 1 - k31ease(lOut);
    k31Hand(x - (k31ease(lOut)) * 120, y, -Math.PI / 2 + 0.14, 0);
    ctx.restore();
  }

  // 右手：把最后一支笔放进空位
  const rp = k31seg(t, 1.5, 2.6);
  const rOut = k31seg(t, 3.9, 4.9);
  if (rp > 0 && rOut < 1) {
    const down = k31ease(rp);
    const back = k31ease(rOut);
    const handY = lerp(-150, 96, down) - back * 190;
    const handX = 392 + Math.sin(t * 1.6) * 2;
    ctx.save();
    // 手里握着的笔：落位前是斜的
    const penP = 1 - k31seg(t, 3.0, 3.45);
    if (penP > 0 && t < 3.55) {
      ctx.save();
      ctx.translate(handX, handY + 36);
      ctx.rotate(-0.12 + 0.67 * penP);
      k31Shadow(8, 4, 0.2);
      k31Round(-46, -4, 92, 8, 4, K31.navy, null);
      k31NoShadow();
      ctx.fillStyle = K31.mustard;
      ctx.beginPath(); ctx.moveTo(46, -4); ctx.lineTo(56, 0); ctx.lineTo(46, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = K31.steel; ctx.fillRect(-46, -4, 10, 8);
      ctx.restore();
    }
    k31Hand(handX, handY, 0.1, 0.4);
    ctx.restore();
  }

  // 完成后：落位高亮与文字
  const done = k31seg(t, 4.6, 5.3);
  if (done > 0) {
    ctx.save();
    ctx.globalAlpha = done * 0.9;
    ctx.strokeStyle = K31.terra; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(390, 132, 46 + Math.sin(t * 3) * 2, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = done * 0.45;
    ctx.strokeStyle = 'rgba(196,105,79,.5)';
    ctx.beginPath(); ctx.arc(390, 132, 54, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // 文案
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = K31.ink;
  ctx.font = `800 26px ${FONT}`;
  ctx.fillText('我的工具箱', 26, 46);
  ctx.fillStyle = K31.inkSoft;
  ctx.font = `600 13px ${FONT}`;
  ctx.fillText('KNOLLING · 俯拍 90° · 一物一位', 27, 66);
  ctx.strokeStyle = 'rgba(60,50,40,.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(26, 78); ctx.lineTo(196, 78); ctx.stroke();

  const cap = k31seg(t, 4.5, 4.95);
  if (cap > 0) {
    ctx.globalAlpha = cap;
    ctx.fillStyle = K31.cream;
    const w = 92, h = 24;
    ctx.fillRect(26, 74, w, h);
    ctx.strokeStyle = 'rgba(60,50,40,.2)'; ctx.lineWidth = 1; ctx.strokeRect(26.5, 74.5, w - 1, h - 1);
    ctx.fillStyle = K31.terra;
    ctx.fillRect(26, 74, 4, h);
    ctx.fillStyle = K31.ink;
    ctx.font = `600 13px ${FONT}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('都归位了 ✓', 40, 86.5);
  }
  ctx.restore();
}


// 极轻的镜头呼吸：整段画面持续有变化，循环回到起点
function drawScene(t) {
  const a = t / 6 * Math.PI * 2;
  ctx.save();
  ctx.translate(320, 180);
  const z = 1.022 + 0.012 * Math.sin(a + 2.4);
  ctx.scale(z, z);
  ctx.translate(-320 + 2.6 * Math.sin(a), -180 + 2.0 * Math.cos(a + 0.4));
  baseScene(t);
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>

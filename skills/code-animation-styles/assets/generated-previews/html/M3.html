<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>M3 · 文字建筑（口播金句专用）</h1>
    <p>深色图纸上，词句被钢索吊进画面当建筑构件，一层层搭成楼，最后一句站到梁上。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="文字建筑（口播金句专用） 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 深色图纸上，词句被钢索吊进画面当建筑构件，一层层搭成楼，最后一句站到梁上。
// M3 文字建筑（口播金句专用） · DeepSeek Harness 生成示例
const M3_BG = '#12141c', M3_PAPER = '#f0e7d3', M3_GOLD = '#e6b34c';
const M3_STEEL = 'rgba(240,231,211,.55)', M3_FILL = 'rgba(240,231,211,.10)', M3_DIM = 'rgba(240,231,211,.42)';

function m3p(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function m3e(p) { return 1 - Math.pow(1 - p, 3); }

function m3Bg() {
  ctx.fillStyle = M3_BG; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(240,231,211,.045)'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 32) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 32) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
  // 地平线与地面排线
  ctx.strokeStyle = 'rgba(240,231,211,.5)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(52, 318.5); ctx.lineTo(588, 318.5); ctx.stroke();
  ctx.strokeStyle = 'rgba(240,231,211,.14)'; ctx.lineWidth = 1;
  for (let x = 62; x < 588; x += 12) { ctx.beginPath(); ctx.moveTo(x, 319); ctx.lineTo(x - 7, 329); ctx.stroke(); }
}

// 构件：从左/下揭示；内部由 draw 回调画（会被同一裁切区裁掉）
function m3Member(x, y, w, h, p, dir, draw) {
  const ee = m3e(p);
  if (ee <= 0.002) return;
  ctx.save();
  ctx.beginPath();
  if (dir === 'v') ctx.rect(x, y + h * (1 - ee), w, h * ee);
  else ctx.rect(x, y, w * ee, h);
  ctx.clip();
  ctx.fillStyle = M3_FILL; ctx.fillRect(x, y, w, h);
  // 斜向排线，像钢材剖面
  ctx.strokeStyle = 'rgba(240,231,211,.10)'; ctx.lineWidth = 1;
  for (let i = -h; i < w + h; i += 9) {
    ctx.beginPath(); ctx.moveTo(x + i, y); ctx.lineTo(x + i - h, y + h); ctx.stroke();
  }
  ctx.strokeStyle = M3_STEEL; ctx.lineWidth = 1.6;
  ctx.strokeRect(x + .8, y + .8, w - 1.6, h - 1.6);
  draw(ee);
  ctx.restore();
}

function m3Text(text, cx, cy, size, color, weight, align) {
  ctx.fillStyle = color;
  ctx.font = `${weight || 700} ${size}px ${FONT}`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, cx, cy);
}

function m3VText(chars, cx, y0, size, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `700 ${size}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  chars.split('').forEach((ch, i) => ctx.fillText(ch, cx, y0 + size * 1.05 + i * size * 1.32));
  ctx.restore();
}

function m3Cable(x, yTo, p) {
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha = 0.75 * p;
  ctx.strokeStyle = 'rgba(240,231,211,.5)'; ctx.lineWidth = 1;
  ctx.setLineDash([4, 5]);
  ctx.beginPath(); ctx.moveTo(x, -4); ctx.lineTo(x, yTo); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = M3_GOLD;
  ctx.fillRect(x - 3, yTo - 3, 6, 6);
  ctx.restore();
}

function m3Figure(x, footY, p, color) {
  if (p <= 0) return;
  const s = m3e(clamp(p, 0, 1));
  ctx.save();
  ctx.globalAlpha = clamp(p * 1.4, 0, 1);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.1; ctx.lineCap = 'round';
  const h = 30 * s, head = 6.4 * s;
  ctx.beginPath();
  ctx.arc(x, footY - h + head, head, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x, footY - h + head * 2);
  ctx.lineTo(x, footY - 12 * s);
  ctx.moveTo(x, footY - 12 * s); ctx.lineTo(x - 7 * s, footY);
  ctx.moveTo(x, footY - 12 * s); ctx.lineTo(x + 7 * s, footY);
  ctx.moveTo(x, footY - h + head * 2 + 6 * s); ctx.lineTo(x - 9 * s, footY - 16 * s);
  ctx.moveTo(x, footY - h + head * 2 + 6 * s); ctx.lineTo(x + 9 * s, footY - 15 * s);
  ctx.stroke();
  ctx.restore();
}

function drawScene(t) {
  m3Bg();

  // 图纸抬头
  ctx.save();
  ctx.fillStyle = M3_GOLD;
  ctx.fillRect(36, 36, 18, 2.4);
  ctx.fillStyle = M3_DIM; ctx.font = `500 13px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('文字建筑 · 一层一层来', 62, 42);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(240,231,211,.34)';
  ctx.fillText('ELEVATION  03', 604, 42);
  ctx.restore();

  // 主标题
  const tp = m3e(m3p(t, 0.05, 0.7));
  ctx.save();
  ctx.globalAlpha = 0.62 + 0.38 * tp;
  m3Text('把话搭成楼', 36, 74, 26, M3_PAPER, 800, 'left');
  ctx.restore();

  // 吊装钢索：地基与横梁
  m3Cable(140, 262 + 24, m3p(t, -0.4, -0.25) * (1 - m3p(t, 0.55, 0.85)));
  m3Cable(500, 262 + 24, m3p(t, -0.4, -0.25) * (1 - m3p(t, 0.55, 0.85)));
  m3Cable(168, 92, m3p(t, 2.5, 2.62) * (1 - m3p(t, 3.4, 3.7)));
  m3Cable(452, 92, m3p(t, 2.5, 2.62) * (1 - m3p(t, 3.4, 3.7)));

  // 1. 地基：落下来
  const slabY = 286 - 26 * (1 - m3e(m3p(t, -0.4, 0.6)));
  m3Member(112, slabY, 416, 32, m3p(t, -0.4, 0.35), 'h', () => {
    m3Text('先做', 132, slabY + 16, 26, M3_PAPER, 800, 'left');
    m3Text('地 基', 508, slabY + 17, 13, M3_GOLD, 500, 'right');
  });

  // 2. 两根柱子：从地基里升起来
  const collP = m3p(t, 0.85, 2.2);
  m3Member(182, 160, 36, 126, collP, 'v', () => {
    m3VText('坚持', 200, 160, 25, M3_PAPER);
  });
  const collP2 = m3p(t, 1.5, 2.75);
  m3Member(402, 160, 36, 126, collP2, 'v', () => {
    m3VText('相信', 420, 160, 25, M3_PAPER);
  });
  if (collP > 0.6) {
    ctx.save(); ctx.globalAlpha = 0.5 * m3p(t, 1.6, 2.0);
    m3Text('柱', 232, 226, 13, M3_DIM, 500, 'left');
    m3Text('柱', 452, 226, 13, M3_DIM, 500, 'left');
    ctx.restore();
  }

  // 3. 横梁：吊下来，压在两根柱子上
  const beamY = 118 - 22 * (1 - m3e(m3p(t, 2.45, 3.25)));
  m3Member(150, beamY, 320, 40, m3p(t, 2.4, 2.7), 'h', () => {
    m3Text('积累', 310, beamY + 21, 27, M3_PAPER, 800, 'center');
  });
  if (m3p(t, 3.0, 3.4) > 0) {
    ctx.save(); ctx.globalAlpha = 0.5 * m3p(t, 3.0, 3.4);
    m3Text('梁', 478, 138, 13, M3_DIM, 500, 'left');
    ctx.restore();
  }

  // 4. 最后一句话：搭在梁上，站住
  const topP = m3p(t, 3.45, 4.35);
  if (topP > 0) {
    const ty = 78 + 18 * (1 - m3e(topP));
    ctx.save();
    ctx.globalAlpha = clamp(topP * 1.6, 0, 1);
    ctx.fillStyle = 'rgba(230,179,76,.12)';
    ctx.fillRect(186, ty, 218, 40);
    ctx.strokeStyle = M3_GOLD; ctx.lineWidth = 1.8;
    ctx.strokeRect(186.5, ty + .5, 217, 39);
    m3Text('相信自己', 295, ty + 21, 27, M3_PAPER, 800, 'center');
    // 支撑短柱
    ctx.strokeStyle = 'rgba(230,179,76,.75)'; ctx.lineWidth = 2;
    const sp = m3e(m3p(t, 4.15, 4.45));
    if (sp > 0) {
      ctx.beginPath();
      ctx.moveTo(220, ty + 40); ctx.lineTo(220, ty + 40 + 18 * sp);
      ctx.moveTo(372, ty + 40); ctx.lineTo(372, ty + 40 + 18 * sp);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 5. 一个小人走上来，站在梁上（“自己”）
  const walkP = m3e(m3p(t, 4.5, 5.3));
  if (walkP > 0) {
    const fx = lerp(590, 438, walkP);
    const bob = Math.abs(Math.sin(walkP * Math.PI * 3)) * 3;
    m3Figure(fx, 118 - bob, m3p(t, 4.45, 4.75), M3_GOLD);
  }

  // 6. 尺寸标注
  const dimP = m3p(t, 3.2, 3.9);
  if (dimP > 0) {
    ctx.save(); ctx.globalAlpha = 0.55 * m3e(dimP);
    ctx.strokeStyle = 'rgba(240,231,211,.6)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(558, 118); ctx.lineTo(558, 318);
    ctx.moveTo(552, 118); ctx.lineTo(564, 118);
    ctx.moveTo(552, 318); ctx.lineTo(564, 318);
    ctx.stroke();
    ctx.save();
    ctx.translate(566, 232); ctx.rotate(-Math.PI / 2);
    m3Text('从一句话到一栋楼', 0, 0, 13, M3_DIM, 500, 'center');
    ctx.restore();
    ctx.restore();
  }

  // 7. 收尾：快门一眨，接回开头
  const blink = m3p(t, 5.78, 5.98);
  if (blink > 0) {
    ctx.save(); ctx.globalAlpha = easeIn(blink) * 0.92;
    ctx.fillStyle = M3_BG; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

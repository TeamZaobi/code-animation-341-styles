<body>
<div id="app">
  <div id="head">
    <h1>M31 · 粘土定格 MV</h1>
    <p>粘土定格 MV：手作质感的粘土小人踩着八分之一秒的顿帧摇摆，粘土太阳与音符一起一停一顿，画面带轻微走片。</p>

  <div id="stage"><canvas id="c" width="640" height="360" aria-label="粘土定格 MV 风格动画示例"></canvas></div>

</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 粘土定格 MV：手作质感的粘土小人踩着八分之一秒的顿帧摇摆，粘土太阳与音符一起一停一顿，画面带轻微走片。
// M31 粘土定格 MV · DeepSeek Harness 生成示例
const M31_WALL0 = '#4c7b74', M31_WALL1 = '#2f5a56';
const M31_FLOOR0 = '#b96a49', M31_FLOOR1 = '#8e4a34';
const M31_SKIN = '#f0d3ab', M31_SHIRT = '#d9714e', M31_SUN = '#e9b24e', M31_CLOUD = '#e9ded0';
const M31_SPECKS = (() => {
  const r = rng(3131);
  return Array.from({ length: 520 }, () => ({ x: r() * W, y: r() * H, s: 0.7 + r() * 1.8, a: 0.03 + r() * 0.08, dark: r() > 0.45 }));
})();

// 定格：整场按 8 格/秒推进，动作是一顿一顿的
const M31_FPS = 8;
function m31step(t) { return Math.floor(t * M31_FPS + 0.0001); }
function m31st(t) { return m31step(t) / M31_FPS; }
// 每格走片的确定性抖动
function m31jitter(step, salt) {
  const x = Math.sin(step * 12.9898 + salt * 78.233) * 43758.5453;
  return (x - Math.floor(x)) - 0.5;
}
function m31seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

function m31Clay(x, y, w, h, r, fill, dark) {
  ctx.save();
  ctx.fillStyle = dark ? 'rgba(40,20,12,.22)' : 'rgba(255,255,255,.16)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x + 1.6, y + 2.4, w, h, r); else ctx.rect(x + 1.6, y + 2.4, w, h);
  ctx.fill();
  const g = ctx.createLinearGradient(x, y, x + w * 0.4, y + h);
  g.addColorStop(0, fill);
  g.addColorStop(1, dark ? '#c9a888' : fill);
  ctx.fillStyle = fill;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.fill();
  // 顶部柔光
  ctx.save();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.clip();
  const hg = ctx.createLinearGradient(x, y, x, y + h * 0.7);
  hg.addColorStop(0, 'rgba(255,255,255,.30)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
  ctx.restore();
}

// 指压纹：粘土表面的手作痕迹
function m31Print(cx, cy, r, rot, alpha) {
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.strokeStyle = `rgba(60,32,20,${alpha})`;
  ctx.lineWidth = 1.1;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(0, 0, r * (0.55 + i * 0.2), -0.9, 0.9);
    ctx.stroke();
  }
  ctx.restore();
}

function m31Backdrop(step) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, M31_WALL0);
  g.addColorStop(0.68, M31_WALL1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 墙上的手抹痕：横向黏土块
  ctx.save();
  ctx.globalAlpha = 0.18;
  for (let i = 0; i < 6; i++) {
    const y = 34 + i * 38;
    ctx.fillStyle = i % 2 ? '#6d9a90' : '#3f6b64';
    ctx.beginPath();
    ctx.ellipse(80 + (i * 97) % 520, y, 120, 14, 0.02, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  // 地毯台
  const fg = ctx.createLinearGradient(0, 300, 0, H);
  fg.addColorStop(0, M31_FLOOR0);
  fg.addColorStop(1, M31_FLOOR1);
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(0, 314);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 308 + Math.sin(x / 90) * 5);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,224,200,.14)';
  ctx.fillRect(0, 306, W, 2);
}

function m31Hills(step) {
  // 背后三坨粘土山，压住远处
  const bump = Math.sin(step * 0.4) * 1.2;
  const hill = (x, w, h, color) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, 316, w, h, 0, Math.PI, Math.PI * 2);
    ctx.fill();
  };
  hill(120, 130, 54 + bump, '#3c6b63');
  hill(330, 170, 74 + bump, '#356059');
  hill(548, 140, 58 + bump, '#3c6b63');
  m31Print(126, 276, 22, -0.4, 0.05);
  m31Print(548, 280, 18, 0.5, 0.05);
}

function m31Sun(step, t) {
  const x = 520, y = 84;
  const s = 1 + (step % 4 === 0 ? 0.05 : 0);
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = M31_SUN;
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
  // 泥点高光
  ctx.fillStyle = '#f4cf82';
  ctx.beginPath(); ctx.arc(-9, -10, 12, 0, Math.PI * 2); ctx.fill();
  m31Print(6, 4, 26, 0.3, 0.09);
  m31Print(-4, 12, 18, -0.6, 0.07);
  ctx.restore();
  // 光芒：一段一段的粘土条
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = 'rgba(244,207,130,.75)';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 + (step % 2) * 0.06;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 44, Math.sin(a) * 44);
    ctx.lineTo(Math.cos(a) * 54, Math.sin(a) * 54);
    ctx.stroke();
  }
  ctx.restore();
}

function m31Cloud(x, y, s, step) {
  const bob = Math.sin(step * 0.5) * 2;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.scale(s, s);
  ctx.fillStyle = M31_CLOUD;
  const puffs = [[-26, 6, 20], [0, -4, 25], [26, 6, 18], [4, 12, 20]];
  for (const p of puffs) {
    ctx.beginPath(); ctx.arc(p[0], p[1], p[2], 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.arc(-2, -8, 13, 0, Math.PI * 2); ctx.fill();
  m31Print(2, 4, 18, 0.2, 0.07);
  ctx.restore();
}

function m31Figure(step, t) {
  const phase = step % 6;
  const swayArr = [-12, -5, 5, 12, 5, -5];
  const hopArr = [0, 13, 0, 0, 11, 0];
  const armLArr = [1.0, 0.55, 0.15, -0.25, -0.7, 0.1];
  const armRArr = [-0.25, 0.6, 0.25, 1.0, 0.55, 0.1];
  const tiltArr = [0.06, -0.03, -0.05, -0.07, 0.0, 0.03];
  const drift = Math.sin(t * 0.62) * 22;
  const cx = 248 + drift;
  const floorY = 302;
  const sway = swayArr[phase], hop = hopArr[phase];
  const armL = armLArr[phase], armR = armRArr[phase];
  ctx.save();
  ctx.translate(cx + sway, floorY - hop);
  ctx.rotate(tiltArr[phase]);
  // 影子
  ctx.save();
  ctx.rotate(-tiltArr[phase]);
  ctx.fillStyle = `rgba(60,24,16,${0.30 - hop * 0.007})`;
  ctx.beginPath(); ctx.ellipse(0, 6 + hop, 50 - hop * 0.8, 9 - hop * 0.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  const squash = 1 + hop * 0.0025;
  ctx.scale(squash, 1 / squash);

  // 腿：两根粗泥条
  ctx.fillStyle = '#c98a5e';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-22, -38, 17, 40, 8); else ctx.rect(-22, -38, 17, 40);
  ctx.fill();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(5, -38, 17, 40, 8); else ctx.rect(5, -38, 17, 40);
  ctx.fill();
  // 身体
  m31Clay(-34, -104, 68, 76, 26, M31_SHIRT, true);
  // 围裙
  ctx.fillStyle = 'rgba(246,224,196,.9)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-18, -84, 36, 44, 10); else ctx.rect(-18, -84, 36, 44);
  ctx.fill();
  m31Print(-2, -64, 17, 0.4, 0.11);
  // 手臂：从肩膀甩出去，一格一个姿势
  ctx.strokeStyle = M31_SKIN; ctx.lineWidth = 13; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-28, -90);
  ctx.lineTo(-28 - 8 - armL * 8, -90 - armL * 34);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(28, -90);
  ctx.lineTo(28 + 8 + armR * 8, -90 - armR * 34);
  ctx.stroke();
  // 手掌：小泥球
  ctx.fillStyle = M31_SKIN;
  ctx.beginPath(); ctx.arc(-28 - 8 - armL * 8, -90 - armL * 34, 7.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(28 + 8 + armR * 8, -90 - armR * 34, 7.5, 0, Math.PI * 2); ctx.fill();
  // 头
  m31Clay(-33, -172, 66, 66, 30, M31_SKIN, true);
  // 头发：一团压扁的泥
  ctx.fillStyle = '#4b3029';
  ctx.beginPath();
  ctx.ellipse(0, -162, 34, 20, 0, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(-2, -170, 26, 16, -0.15, Math.PI, Math.PI * 2.2);
  ctx.fill();
  // 眼睛：豆子眼，偶尔眨一下
  const blink = (step % 14 === 9) ? 0.22 : 1;
  ctx.fillStyle = '#3b241d';
  ctx.beginPath(); ctx.ellipse(-11, -142, 3.6, 4.6 * blink, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(11, -142, 3.6, 4.6 * blink, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.beginPath(); ctx.arc(-12.4, -143.4, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(9.6, -143.4, 1.1, 0, Math.PI * 2); ctx.fill();
  // 腮红与嘴
  ctx.fillStyle = 'rgba(214,110,86,.38)';
  ctx.beginPath(); ctx.ellipse(-21, -130, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(21, -130, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3b241d'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, -134, 8, 0.25, Math.PI - 0.25); ctx.stroke();
  m31Print(-16, -154, 14, 0.7, 0.07);
  ctx.restore();
}

function m31Notes(step, t) {
  // 每一拍冒一个粘土音符，位置一格一格跳
  for (let i = 0; i < 4; i++) {
    const born = 1 + i * 1.1;
    const age = t - born;
    if (age < 0 || age > 2.4) continue;
    const st = Math.floor(age * M31_FPS) / M31_FPS;
    const x = 340 + i * 26 + Math.sin(i * 2.1) * 22;
    const y = 220 - st * 34 + Math.sin(st * 2 + i) * 4;
    ctx.save();
    ctx.globalAlpha = clamp(1 - (age - 1.8) / 0.6, 0, 1) * 0.95;
    ctx.translate(x, y);
    ctx.rotate(-0.2 + Math.sin(i) * 0.2);
    ctx.strokeStyle = '#f7e6c8'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -18); ctx.stroke();
    ctx.fillStyle = M31_SUN;
    ctx.beginPath(); ctx.ellipse(-4, 0, 6, 4.6, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.quadraticCurveTo(9, -16, 8, -10); ctx.stroke();
    ctx.restore();
  }
}

function drawScene(t) {
  const step = m31step(t);
  const ts = m31st(t);
  // 走片：整帧轻微位移，像手摇的定格
  ctx.save();
  ctx.translate(m31jitter(step, 1) * 2.2, m31jitter(step, 2) * 1.8);
  m31Backdrop(step);
  m31Hills(step);
  m31Sun(step, ts);
  m31Cloud(146, 96, 1, step);
  m31Cloud(420, 66, 0.72, step);
  m31Figure(step, ts);
  m31Notes(step, ts);
  ctx.restore();

  // 粘土颗粒（预计算）
  ctx.save();
  for (const s of M31_SPECKS) {
    ctx.fillStyle = s.dark ? `rgba(52,28,18,${s.a})` : `rgba(255,244,228,${s.a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // 四角暗一点，像拍小模型的台灯
  const vg = ctx.createRadialGradient(300, 190, 150, 300, 190, 420);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(24,10,6,.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // 顶部标识与歌词小字
  ctx.save();
  ctx.fillStyle = 'rgba(255,238,214,.42)';
  ctx.font = `600 10px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('CLAY  ·  8 FPS  ·  STOP MOTION', 24, 28);
  ctx.restore();
  const cp = clamp(m31seg(t, 0.9, 1.6), 0, 1);
  if (cp > 0) {
    ctx.save();
    ctx.globalAlpha = cp * 0.85;
    ctx.fillStyle = 'rgba(255,240,220,.9)';
    ctx.font = `600 14px ${FONT}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('一点一点，捏成我。', 24, 340);
    ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');

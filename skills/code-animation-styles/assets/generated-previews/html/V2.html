<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 等距 2.5D 微缩小城从地砖波浪里长出来：楼房立面 scaleY 拉起、顶面延迟盖上，窗户依次点亮，小车与风机开始运转。
// V2 等距 2.5D · DeepSeek Harness 生成示例
// 30° 等轴测：x 轴向右下 (cos30, sin30)，y 轴向左下 (-cos30, sin30)，无灭点、2:1 斜率。
const V2_U = 29;                       // 一格地砖的等距单位
const V2_BG_TOP = '#b3a6e6', V2_BG_BOT = '#f0e3f6';
let V2_CX = 312, V2_CY = 180, V2_SHX = 0, V2_SHY = 0;

function v2seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function v2ease(p) { return 1 - Math.pow(1 - p, 3); }
function v2back(p) { const c = 1.9, q = p - 1; return 1 + (c + 1) * q * q * q + c * q * q; }
function v2iso(x, y, z) {
  return [V2_CX + V2_SHX + (x - y) * 0.8660 * V2_U,
          V2_CY + V2_SHY + (x + y) * 0.5 * V2_U - z * V2_U];
}
function v2poly(pts, fill, stroke, lw) {
  ctx.beginPath();
  pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}

// 一座等距盒子：顶面 + 左前脸(y+d) + 右前脸(x+w)
function v2box(x, y, z, w, d, h, top, left, right, alpha) {
  const H = Math.max(0.001, h);
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  v2poly([v2iso(x, y + d, z), v2iso(x + w, y + d, z), v2iso(x + w, y + d, z + H), v2iso(x, y + d, z + H)], left);
  v2poly([v2iso(x + w, y + d, z), v2iso(x + w, y, z), v2iso(x + w, y, z + H), v2iso(x + w, y + d, z + H)], right);
  if (top) v2poly([v2iso(x, y + d, z + H), v2iso(x + w, y + d, z + H), v2iso(x + w, y, z + H), v2iso(x, y, z + H)], top);
  ctx.restore();
}

function v2Tile(gx, gy, z, top, left, right) {
  const th = 0.18;
  v2poly([v2iso(gx, gy + 1, z - th), v2iso(gx + 1, gy + 1, z - th), v2iso(gx + 1, gy + 1, z), v2iso(gx, gy + 1, z)], left);
  v2poly([v2iso(gx + 1, gy + 1, z - th), v2iso(gx + 1, gy, z - th), v2iso(gx + 1, gy, z), v2iso(gx + 1, gy + 1, z)], right);
  v2poly([v2iso(gx, gy, z), v2iso(gx + 1, gy, z), v2iso(gx + 1, gy + 1, z), v2iso(gx, gy + 1, z)], top, 'rgba(255,255,255,.6)', 0.8);
}

const V2_TILES = (() => {
  const a = [], pal = [
    ['#e3d8fb', '#a291cc', '#bfb0e2'],
    ['#d3f4e7', '#8ac7b5', '#aadfd0'],
    ['#ffe0c4', '#d69f7f', '#efc0a3'],
    ['#d2e8ff', '#8fb6d9', '#aecfe9'],
  ];
  // 街道：tile 行 y=0 与列 x=1 铺成路
  for (let x = -2; x < 3; x++) for (let y = -2; y < 3; y++) {
    const d = Math.abs(x) + Math.abs(y);
    const road = (y === 0 || x === 1);
    a.push({ x, y, d, road, c: road ? ['#e7e1f7', '#a89cc9', '#c1b6dd'] : pal[(x + 2 + (y + 2) * 3) % pal.length] });
  }
  return a;
})();

const V2_BLD = [
  { x: -1, y: -2, w: 2, d: 1, h: 3.2, t0: -0.22, top: '#fffdf9', l: '#a992d9', r: '#d3c5f4', win: '#ffc94f' },
  { x: 2, y: -2, w: 1, d: 1, h: 2.2, t0: 0.46, top: '#d6f5ea', l: '#86c2b2', r: '#a9dfd1', win: '#fff1a6' },
  { x: -2, y: -1, w: 1, d: 1, h: 1.9, t0: 0.70, top: '#ffdcc8', l: '#dca588', r: '#f3c2a9', win: '#7fd8c4' },
  { x: 2, y: 1, w: 1, d: 1, h: 1.35, t0: 0.92, top: '#dcecff', l: '#9bb9de', r: '#bcd4f0', win: '#ffe08c' },
  { x: 0, y: 2, w: 1, d: 1, h: 1.6, t0: 1.12, top: '#fff8e2', l: '#d3c094', r: '#eddfb9', win: '#9fdfd0' },
  { x: -2, y: 2, w: 1, d: 1, h: 1.1, t0: 1.30, top: '#f4e7ff', l: '#b2a2d4', r: '#d4c6ec', win: '#ffd27a' },
  { x: -1, y: 2, w: 1, d: 1, h: 1.55, t0: 1.48, top: '#e9f7ff', l: '#9dc4d4', r: '#c2e2ee', win: '#ffbd6b' },
];

const V2_TREES = [
  { x: -0.5, y: 1.5, t0: 1.66 }, { x: 0.5, y: 1.5, t0: 1.80 }, { x: 2.5, y: -0.5, t0: 1.94 },
];

const V2_CLOUDS = (() => {
  const r = rng(2211);
  return Array.from({ length: 6 }, (_, i) => ({
    x: r() * 760 - 60, y: 26 + r() * 180, s: 0.55 + r() * 0.75, z: i % 2 ? 0.6 : 1.0, ph: r() * 6.28,
  }));
})();

function v2Tree(x, y, p) {
  if (p <= 0) return;
  const s = v2back(clamp(p, 0, 1));
  const base = v2iso(x, y, 0);
  ctx.save();
  ctx.globalAlpha = clamp(p * 2.2, 0, 1);
  ctx.fillStyle = 'rgba(120,100,170,.16)';
  ctx.beginPath(); ctx.ellipse(base[0] + 1, base[1] + 1, 12 * s, 5.4 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#b98d6a'; ctx.lineWidth = 2.4 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(base[0], base[1]); ctx.lineTo(base[0], base[1] - 13 * s); ctx.stroke();
  const cc = [[0, -23, 10.5], [-7, -17, 7.6], [7, -17, 7.6]];
  cc.forEach(([ox, oy, rr], i) => {
    const g = ctx.createRadialGradient(base[0] + ox - rr * 0.3, base[1] + oy * s - rr * 0.4, 1, base[0] + ox, base[1] + oy * s, rr * s);
    g.addColorStop(0, i ? '#b6ecd5' : '#cdf7e4');
    g.addColorStop(1, i ? '#6cc2a3' : '#7ed0b1');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(base[0] + ox, base[1] + oy * s, rr * s, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

// 立面上的窗：u 沿立面向、v 沿高度，画等距平行四边形
function v2win(b, face, z0, u, v, du, dv, color) {
  const P = (uu, vv) => face === 'L'
    ? v2iso(b.x + b.w * uu, b.y + b.d, z0 + vv)
    : v2iso(b.x + b.w, b.y + b.d * (1 - uu), z0 + vv);
  v2poly([P(u, v), P(u + du, v), P(u + du, v + dv), P(u, v + dv)], color);
}

function faceCenter(b, face, z0, u, v) {
  return face === 'L' ? v2iso(b.x + b.w * u, b.y + b.d, z0 + v) : v2iso(b.x + b.w, b.y + b.d * (1 - u), z0 + v);
}

function v2Building(b, t) {
  const p = v2seg(t, b.t0, b.t0 + 0.22);
  if (p <= 0) return;
  const wall = v2seg(t, b.t0 + 0.06, b.t0 + 0.44);
  const roof = v2seg(t, b.t0 + 0.26, b.t0 + 0.46);
  const drop = (1 - v2ease(p)) * 1.5;
  const z0 = -drop;
  const c0 = v2iso(b.x + b.w / 2, b.y + b.d / 2, 0);
  ctx.save();
  ctx.globalAlpha = 0.15 * v2ease(p);
  ctx.fillStyle = '#6c559e';
  ctx.beginPath();
  const rw = (b.w + b.d) * 0.5;
  ctx.ellipse(c0[0], c0[1] + 1, rw * 0.866 * V2_U * 0.98, rw * 0.5 * V2_U * 0.82, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  v2box(b.x - 0.07, b.y - 0.07, z0 - 0.07, b.w + 0.14, b.d + 0.14, 0.09, '#ffffff', '#e7def6', '#f4eeff');
  if (wall <= 0) return;
  const H = Math.max(0.02, v2back(clamp(wall, 0, 1)) * b.h);
  v2box(b.x, b.y, z0, b.w, b.d, H, null, b.l, b.r);
  // 棱线高光：等距转角的那根竖线
  const e0 = v2iso(b.x + b.w, b.y + b.d, z0), e1 = v2iso(b.x + b.w, b.y + b.d, z0 + H);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(e0[0], e0[1]); ctx.lineTo(e1[0], e1[1]); ctx.stroke();
  // 窗格：列 × 行，依次点亮
  const rows = Math.max(1, Math.round(H / 0.62));
  const cols = 2;
  const dv = 0.17, du = 0.2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = 0.28 + r * 0.58;
      if (v + dv > H) continue;
      const u = 0.14 + c * 0.42;
      const idx = r * cols + c;
      const on = v2ease(v2seg(t, b.t0 + 0.55 + idx * 0.09, b.t0 + 0.72 + idx * 0.09));
      const col = on > 0.35 ? b.win : 'rgba(112,92,158,.30)';
      ctx.save();
      ctx.globalAlpha = 0.62 + 0.38 * on;
      v2win(b, 'L', z0, u, v, du, dv, col);
      v2win(b, 'R', z0, u, v, du, dv, col);
      // 亮窗的辉光
      if (on > 0.55) {
        const gp = faceCenter(b, 'L', z0, u + du / 2, v + dv / 2);
        ctx.globalAlpha = 0.22 * on;
        ctx.fillStyle = b.win;
        ctx.beginPath(); ctx.arc(gp[0], gp[1], 7, 0, Math.PI * 2); ctx.fill();
        const gq = faceCenter(b, 'R', z0, u + du / 2, v + dv / 2);
        ctx.beginPath(); ctx.arc(gq[0], gq[1], 7, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }
  if (roof > 0) {
    const capH = 0.15 * v2back(clamp(roof, 0, 1));
    v2box(b.x, b.y, z0 + H, b.w, b.d, capH, b.top, '#e9e1fa', '#f7f2ff');
    // 顶面高光线
    v2poly([v2iso(b.x + 0.1, b.y + 0.1, z0 + H + capH + 0.002), v2iso(b.x + b.w - 0.1, b.y + 0.1, z0 + H + capH + 0.002),
            v2iso(b.x + b.w - 0.1, b.y + b.d - 0.1, z0 + H + capH + 0.002)], null, 'rgba(255,255,255,.75)', 1);
  }
}

function v2Turbine(t) {
  const base = v2iso(2.5, 2.5, 0);
  const top = v2iso(2.5, 2.5, 2.55);
  ctx.save();
  ctx.strokeStyle = '#cfc6ea'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(base[0], base[1]); ctx.lineTo(top[0], top[1]); ctx.stroke();
  const spin = t * 2.2;
  for (let i = 0; i < 3; i++) {
    const a = spin + i * Math.PI * 2 / 3;
    const p2 = v2iso(2.5 + Math.cos(a) * 0.8, 2.5 + Math.sin(a) * 0.8, 2.55 + 0.24);
    ctx.strokeStyle = '#fffdf7'; ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.moveTo(top[0], top[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
  }
  ctx.fillStyle = '#fffdf7';
  ctx.beginPath(); ctx.arc(top[0], top[1], 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function v2Car(x, y, col, dir) {
  ctx.save();
  const sh = v2iso(x + 0.1, y + 0.05, 0.02);
  ctx.fillStyle = 'rgba(110,92,160,.18)';
  ctx.beginPath(); ctx.ellipse(sh[0], sh[1], 11, 4, 0, 0, Math.PI * 2); ctx.fill();
  v2poly([v2iso(x, y, 0.08), v2iso(x + 0.5, y, 0.08), v2iso(x + 0.5, y, 0.13), v2iso(x, y, 0.13)], '#8d82ad');
  v2poly([v2iso(x, y, 0.13), v2iso(x + 0.5, y, 0.13), v2iso(x + 0.5, y, 0.4), v2iso(x, y, 0.4)], col);
  v2poly([v2iso(x + 0.5, y, 0.13), v2iso(x + 0.5, y + 0.28, 0.13), v2iso(x + 0.5, y + 0.28, 0.4), v2iso(x + 0.5, y, 0.4)], '#ffffff');
  v2poly([v2iso(x, y, 0.4), v2iso(x + 0.5, y, 0.4), v2iso(x + 0.42, y + 0.28, 0.4), v2iso(x, y + 0.28, 0.4)], '#fff1d4');
  const lp = v2iso(x + (dir > 0 ? 0.5 : 0), y + 0.14, 0.3);
  ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(lp[0], lp[1], 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawScene(t) {
  const w6 = t * Math.PI * 2 / 6;
  V2_SHX = Math.sin(w6) * 10;
  V2_SHY = Math.sin(w6 * 2) * 2.6;

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, V2_BG_TOP); bg.addColorStop(1, V2_BG_BOT);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(300, 150, 20, 300, 150, 320);
  glow.addColorStop(0, 'rgba(255,247,255,.9)'); glow.addColorStop(1, 'rgba(255,247,255,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  // 远景云（0.6 视差）
  for (const c of V2_CLOUDS) {
    const px = ((c.x + t * 8 * c.z) % 780) - 70;
    const py = c.y + Math.sin(w6 + c.ph) * 3;
    ctx.save();
    ctx.globalAlpha = c.z > 0.8 ? 0.45 : 0.72;
    ctx.fillStyle = c.z > 0.8 ? '#ffffff' : '#f7f0ff';
    [[0, 0, 25], [19, -7, 19], [-19, 3, 16]].forEach(([ox, oy, r]) => {
      ctx.beginPath(); ctx.ellipse(px + ox * c.s, py + oy * c.s, r * c.s, r * 0.62 * c.s, 0, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  // 悬浮岛投影
  const sh = v2iso(0, 0, 0);
  const sg = ctx.createRadialGradient(sh[0], sh[1] + 58, 10, sh[0], sh[1] + 58, 180);
  sg.addColorStop(0, 'rgba(116,92,172,.28)'); sg.addColorStop(1, 'rgba(116,92,172,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.ellipse(sh[0], sh[1] + 56, 196, 46, 0, 0, Math.PI * 2); ctx.fill();

  // 岛体侧面：让悬浮岛有厚度
  {
    const ins = 0.06, zt = -0.85;
    ctx.save();
    const pIn = v2seg(t, 0.05, 0.5);
    ctx.globalAlpha = 0.4 + 0.6 * pIn;
    v2poly([v2iso(-2, 3, 0), v2iso(3, 3, 0), v2iso(3 - ins, 3 + ins, zt), v2iso(-2 - ins, 3 + ins, zt)], '#cdc1ec');
    v2poly([v2iso(3, 3, 0), v2iso(3, -2, 0), v2iso(3 + ins, -2 + ins, zt), v2iso(3 + ins, 3 + ins, zt)], '#b6a8dd');
    ctx.restore();
  }

  // 地砖：从中心向外波浪落下（t=0 已有内 3 圈就位）
  for (const g of [...V2_TILES].sort((a, b) => (a.x + a.y) - (b.x + b.y))) {
    const p = v2seg(t, -0.9 + g.d * 0.16, -0.5 + g.d * 0.16);
    if (p <= 0) continue;
    const drop = (1 - v2ease(p)) * 2.0;
    v2Tile(g.x, g.y, -drop, g.c[0], g.c[1], g.c[2]);
    // 街道白虚线
    if (g.road && p > 0.9) {
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.4;
      const a1 = v2iso(g.x + 0.12, g.y + (g.y === 0 ? 0.5 : 0.05), 0.002);
      const a2 = v2iso(g.x + (g.y === 0 ? 0.42 : 0.05), g.y + (g.y === 0 ? 0.5 : 0.5), 0.002);
      ctx.beginPath(); ctx.moveTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]); ctx.stroke();
    }
  }

  // 建筑 + 树 + 风机，按 x+y 决定 Z 序
  const objs = V2_BLD.map(b => ({ k: b.x + b.y, draw: () => v2Building(b, t) }));
  V2_TREES.forEach(tr => objs.push({ k: tr.x + tr.y, draw: () => v2Tree(tr.x, tr.y, v2seg(t, tr.t0, tr.t0 + 0.28)) }));
  objs.push({ k: 6.8, draw: () => { if (t > 2.1) v2Turbine(t); } });
  objs.sort((a, b) => a.k - b.k);
  objs.forEach(o => o.draw());

  // 车流（6 秒整数圈，循环无缝）
  if (t > 1.9) {
    v2Car(-2.2 + ((t / 6) * 2 % 1) * 4.4, 0.36, '#ff9f8c', 1);
    v2Car(-2.2 + ((t / 6) * 3 + 0.45) % 1 * 4.4, 0.36, '#8fb8ff', 1);
    v2Car(1.28, -2.2 + ((t / 6) * 2 + 0.7) % 1 * 4.4, '#ffd166', 1);
  }

  // 无人机绕岛
  if (t > 2.8) {
    const a = w6 * 1.5 + 0.4;
    const dr = v2iso(Math.cos(a) * 3.4, Math.sin(a) * 3.4, 2.5 + Math.sin(a * 2) * 0.22);
    ctx.save();
    ctx.globalAlpha = v2seg(t, 2.8, 3.2);
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.ellipse(dr[0], dr[1] + 8, 7, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fffdf8';
    ctx.beginPath(); ctx.ellipse(dr[0], dr[1], 6.5, 3.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(dr[0] - 2.6, dr[1] + 2.6, 5.2, 4.4);
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(dr[0], dr[1]); ctx.lineTo(dr[0] - 7, dr[1] - 5); ctx.stroke();
    ctx.restore();
  }

  // 近景云（1.0 视差）
  ctx.save();
  ctx.globalAlpha = 0.94;
  const ncx = -30 + ((t * 24) % 760);
  ctx.fillStyle = '#ffffff';
  [[0, 0, 36], [28, -11, 25], [-28, 4, 23]].forEach(([ox, oy, r]) => {
    ctx.beginPath(); ctx.ellipse(ncx + ox, 330 + oy, r, r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();

  // 顶部小标 + 底部标题（平放，保证中文可读）
  ctx.save();
  ctx.fillStyle = 'rgba(74,58,124,.55)';
  ctx.font = `600 11px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('ISOMETRIC 2.5D  /  NO.02', 28, 28);
  ctx.restore();

  const tp = v2seg(t, 2.7, 3.3);
  if (tp > 0) {
    const e = v2ease(tp);
    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate(0, (1 - e) * 12);
    ctx.fillStyle = '#3d2d69';
    ctx.font = `800 30px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('小世界，慢慢长', 36, 312);
    ctx.fillStyle = 'rgba(61,45,105,.6)';
    ctx.font = `500 13px ${FONT}`;
    ctx.fillText('一格一格，就有了样子。', 38, 332);
    // 标题左侧的等距菱形标记
    ctx.save();
    ctx.translate(18, 300); ctx.rotate(0.5);
    ctx.fillStyle = '#ffcd6b'; ctx.fillRect(-7, -7, 14, 14);
    ctx.restore();
    ctx.restore();
  }

  const endP = v2seg(t, 5.75, 6) * 0.08;
  if (endP > 0) { ctx.fillStyle = `rgba(255,255,255,${endP})`; ctx.fillRect(0, 0, W, H); }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

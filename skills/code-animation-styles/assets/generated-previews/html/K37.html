<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 黑紫暗红的哥特尖拱窗前，一个细长身影提着灯，蜡烛摇晃，蝙蝠掠过，雾从地面升起。
// K37 哥特 · DeepSeek Harness 生成示例
const K37 = {
  bg0: '#07040c', bg1: '#120a1e', stone: '#1b1226', stoneEdge: '#2c1c3e',
  crimson: '#a01a34', deepRed: '#5c0f22', violet: '#4b2866', pale: '#c9b8d6', gold: '#9a7b3f', ink: '#050308',
};
const k37seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const k37ease = p => 1 - Math.pow(1 - p, 3);
const K37_STONES = (() => {
  const r = rng(3701);
  const rows = [];
  for (let y = -10; y < 370; y += 22) {
    const off = (Math.floor(y / 22) % 2) * 26;
    const row = [];
    for (let x = -20 + off; x < 660; x += 54) row.push({ x: x + (r() - 0.5) * 4, w: 46 + r() * 8, y: y + (r() - 0.5) * 3 });
    rows.push(row);
  }
  return rows;
})();
const K37_BATS = (() => {
  const r = rng(3711);
  return Array.from({ length: 6 }, (_, i) => ({ y: 40 + r() * 120, ph: r() * 6, sp: 0.5 + r() * 0.5, s: 0.6 + r() * 0.7, dir: i % 2 ? 1 : -1 }));
})();
const K37_MIST = (() => {
  const r = rng(3721);
  return Array.from({ length: 4 }, (_, i) => ({ y: 250 + i * 26, h: 26 + r() * 20, sp: 6 + r() * 10, ph: r() * 400, a: 0.05 + r() * 0.05 }));
})();

function k37Stone(t) {
  ctx.fillStyle = K37.stone;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.strokeStyle = 'rgba(12,8,18,.55)'; ctx.lineWidth = 1.2;
  for (const row of K37_STONES) {
    for (const s of row) {
      ctx.strokeRect(s.x, s.y, s.w, 20);
      ctx.fillStyle = 'rgba(40,26,56,.22)';
      ctx.fillRect(s.x, s.y, s.w, 2);
    }
  }
  ctx.restore();
}

function k37Arch(cx, yTop, halfW, yBottom) {
  ctx.beginPath();
  ctx.moveTo(cx - halfW, yBottom);
  ctx.lineTo(cx - halfW, yTop + 96);
  ctx.quadraticCurveTo(cx - halfW, yTop + 26, cx, yTop);
  ctx.quadraticCurveTo(cx + halfW, yTop + 26, cx + halfW, yTop + 96);
  ctx.lineTo(cx + halfW, yBottom);
  ctx.closePath();
}

function k37Window(t) {
  const cx = 398, yTop = 26, halfW = 86, yBottom = 338;
  const glowP = k37ease(k37seg(t, 0.0, 1.4));
  const pulse = 0.85 + 0.15 * Math.sin(t * 1.6);
  ctx.save();
  k37Arch(cx, yTop, halfW, yBottom);
  ctx.clip();
  const g = ctx.createLinearGradient(0, yTop, 0, yBottom);
  g.addColorStop(0, `rgba(92,26,58,${0.75 * glowP})`);
  g.addColorStop(0.5, `rgba(52,18,66,${0.85 * glowP})`);
  g.addColorStop(1, `rgba(24,10,30,${0.95 * glowP})`);
  ctx.fillStyle = g; ctx.fillRect(cx - halfW, yTop, halfW * 2, yBottom - yTop);
  // 彩色玻璃：竖向长条
  for (let i = 0; i < 6; i++) {
    const x = cx - halfW + 8 + i * 27;
    ctx.fillStyle = i % 2
      ? `rgba(160,26,52,${0.42 * glowP * pulse})`
      : `rgba(75,40,102,${0.42 * glowP * pulse})`;
    ctx.fillRect(x, yTop + 30, 18, yBottom - yTop - 40);
  }
  // 玫瑰窗
  ctx.strokeStyle = `rgba(201,184,214,${0.55 * glowP})`; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(cx, yTop + 82, 26, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * 8, yTop + 82 + Math.sin(a) * 8);
    ctx.lineTo(cx + Math.cos(a) * 26, yTop + 82 + Math.sin(a) * 26);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, yTop + 82, 8, 0, Math.PI * 2); ctx.stroke();
  // 尖拱内的竖向窗棂
  ctx.strokeStyle = 'rgba(12,7,18,.9)'; ctx.lineWidth = 6;
  for (const dx of [-44, 0, 44]) {
    ctx.beginPath();
    ctx.moveTo(cx + dx, yBottom);
    ctx.lineTo(cx + dx, yTop + 40 + Math.abs(dx) * 0.6);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(cx - halfW + 6, yTop + 150); ctx.lineTo(cx + halfW - 6, yTop + 150);
  ctx.stroke();
  ctx.restore();
  // 窗框
  ctx.save();
  k37Arch(cx, yTop, halfW, yBottom);
  ctx.strokeStyle = K37.stoneEdge; ctx.lineWidth = 9; ctx.stroke();
  ctx.strokeStyle = 'rgba(201,184,214,.22)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.restore();
  // 窗口投出的光
  ctx.save();
  ctx.globalAlpha = 0.16 * glowP * pulse;
  const halo = ctx.createRadialGradient(cx, 190, 40, cx, 190, 240);
  halo.addColorStop(0, 'rgba(160,26,52,.9)');
  halo.addColorStop(0.5, 'rgba(75,40,102,.4)');
  halo.addColorStop(1, 'rgba(75,40,102,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx, 190, 240, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  return glowP;
}

function k37Candle(x, y, s, t, seed) {
  const flick = 0.7 + 0.3 * (0.5 + 0.5 * Math.sin(t * 12 + seed) * Math.sin(t * 5.7 + seed * 2));
  ctx.save();
  // 蜡身
  ctx.fillStyle = '#d9cbb4';
  ctx.fillRect(x - 4 * s, y - 66 * s, 8 * s, 66 * s);
  ctx.fillStyle = 'rgba(90,60,80,.35)';
  ctx.fillRect(x + 1.5 * s, y - 66 * s, 2.5 * s, 66 * s);
  // 蜡泪
  ctx.fillStyle = '#cbbca4';
  ctx.beginPath(); ctx.ellipse(x, y - 66 * s, 4 * s, 1.6 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(x - 4 * s, y - 66 * s, 1.6 * s, 6 * s);
  // 火焰
  const fx = x + Math.sin(t * 8 + seed) * 1.4 * s;
  const fy = y - 76 * s + Math.sin(t * 11 + seed) * 1.6 * s;
  const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, 22 * s);
  fg.addColorStop(0, `rgba(255,214,140,${0.5 * flick})`);
  fg.addColorStop(1, 'rgba(255,214,140,0)');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.arc(fx, fy, 22 * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,226,160,.95)';
  ctx.beginPath();
  ctx.moveTo(fx, fy - 13 * s);
  ctx.quadraticCurveTo(fx + 5 * s, fy - 2 * s, fx + 2 * s, fy + 4 * s);
  ctx.quadraticCurveTo(fx, fy + 7 * s, fx - 2 * s, fy + 4 * s);
  ctx.quadraticCurveTo(fx - 5 * s, fy - 2 * s, fx, fy - 13 * s);
  ctx.fill();
  ctx.fillStyle = 'rgba(201,26,52,.8)';
  ctx.beginPath(); ctx.ellipse(fx, fy + 1 * s, 1.6 * s, 3 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function k37Figure(t) {
  const rise = k37ease(k37seg(t, 0.35, 1.9));
  if (rise <= 0.01) return;
  const cx = 232;
  const baseY = 372 - (1 - rise) * 70;
  const headY = baseY - 250;
  ctx.save();
  ctx.translate(0, (1 - rise) * 40);
  ctx.globalAlpha = clamp(rise * 1.4, 0, 1);
  // 长袍
  ctx.beginPath();
  ctx.moveTo(cx - 62, baseY);
  ctx.bezierCurveTo(cx - 56, baseY - 70, cx - 40, baseY - 150, cx - 30, baseY - 196);
  ctx.lineTo(cx - 34, baseY - 214);
  ctx.lineTo(cx - 12, baseY - 222);
  ctx.lineTo(cx + 12, baseY - 222);
  ctx.lineTo(cx + 34, baseY - 214);
  ctx.lineTo(cx + 30, baseY - 196);
  ctx.bezierCurveTo(cx + 40, baseY - 150, cx + 54, baseY - 70, cx + 60, baseY);
  // 破碎下摆
  ctx.lineTo(cx + 40, baseY - 10);
  ctx.lineTo(cx + 24, baseY);
  ctx.lineTo(cx + 6, baseY - 12);
  ctx.lineTo(cx - 12, baseY);
  ctx.lineTo(cx - 30, baseY - 9);
  ctx.closePath();
  ctx.fillStyle = '#0b0712'; ctx.fill();
  ctx.strokeStyle = 'rgba(160,26,52,.5)'; ctx.lineWidth = 1.2; ctx.stroke();
  // 袍上的褶皱
  ctx.strokeStyle = 'rgba(201,184,214,.16)'; ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(cx - 32 + i * 18, baseY - 200);
    ctx.bezierCurveTo(cx - 38 + i * 20, baseY - 140, cx - 30 + i * 22, baseY - 70, cx - 34 + i * 24, baseY);
    ctx.stroke();
  }
  // 高领：尖角
  ctx.beginPath();
  ctx.moveTo(cx - 34, baseY - 214);
  ctx.lineTo(cx - 56, baseY - 262);
  ctx.lineTo(cx - 22, baseY - 232);
  ctx.lineTo(cx - 8, baseY - 224);
  ctx.closePath();
  ctx.fillStyle = '#120b1c'; ctx.fill();
  ctx.strokeStyle = 'rgba(160,26,52,.65)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + 34, baseY - 214);
  ctx.lineTo(cx + 56, baseY - 262);
  ctx.lineTo(cx + 22, baseY - 232);
  ctx.lineTo(cx + 8, baseY - 224);
  ctx.closePath();
  ctx.fillStyle = '#120b1c'; ctx.fill();
  ctx.strokeStyle = 'rgba(160,26,52,.65)'; ctx.stroke();
  // 脖子
  ctx.fillStyle = '#20141f';
  ctx.fillRect(cx - 7, baseY - 248, 14, 30);
  // 长发（先画，作为头部后层）
  ctx.beginPath();
  ctx.moveTo(cx - 20, headY - 34);
  ctx.bezierCurveTo(cx - 30, headY - 60, cx + 30, headY - 60, cx + 20, headY - 34);
  ctx.bezierCurveTo(cx + 30, headY + 10, cx + 26, headY + 46, cx + 16, headY + 54);
  ctx.lineTo(cx + 8, headY + 22);
  ctx.lineTo(cx + 2, headY + 50);
  ctx.lineTo(cx - 8, headY + 20);
  ctx.lineTo(cx - 16, headY + 52);
  ctx.bezierCurveTo(cx - 28, headY + 40, cx - 30, headY + 4, cx - 20, headY - 34);
  ctx.closePath();
  ctx.fillStyle = K37.ink; ctx.fill();
  // 脸：细长、尖下巴
  ctx.beginPath();
  ctx.moveTo(cx - 14, headY - 18);
  ctx.bezierCurveTo(cx - 15, headY - 34, cx + 15, headY - 34, cx + 14, headY - 18);
  ctx.bezierCurveTo(cx + 13, headY, cx + 6, headY + 12, cx, headY + 15);
  ctx.bezierCurveTo(cx - 6, headY + 12, cx - 13, headY, cx - 14, headY - 18);
  ctx.closePath();
  ctx.fillStyle = '#ded0dc'; ctx.fill();
  // 额发：尖形刘海
  ctx.beginPath();
  ctx.moveTo(cx - 15, headY - 16);
  ctx.quadraticCurveTo(cx - 12, headY - 34, cx, headY - 36);
  ctx.quadraticCurveTo(cx + 12, headY - 34, cx + 15, headY - 16);
  ctx.lineTo(cx + 8, headY - 24);
  ctx.lineTo(cx + 3, headY - 12);
  ctx.lineTo(cx - 3, headY - 24);
  ctx.lineTo(cx - 9, headY - 13);
  ctx.closePath();
  ctx.fillStyle = K37.ink; ctx.fill();
  // 眼：暗红
  const eyeGlow = 0.5 + 0.5 * Math.sin(t * 2.2);
  ctx.save();
  ctx.shadowColor = K37.crimson; ctx.shadowBlur = 9;
  ctx.fillStyle = `rgba(228,48,80,${0.65 + eyeGlow * 0.35})`;
  ctx.beginPath(); ctx.ellipse(cx - 5.5, headY - 5, 2.3, 3, -0.15, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 5.5, headY - 5, 2.3, 3, 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 嘴：一点暗红
  ctx.strokeStyle = 'rgba(110,22,44,.85)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(cx - 3, headY + 7); ctx.lineTo(cx + 3, headY + 6); ctx.stroke();
  // 手臂：提灯
  const armLift = Math.sin(t * 0.9) * 3;
  const lampX = cx + 96, lampY = baseY - 150 + armLift;
  ctx.strokeStyle = '#0b0712'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + 30, baseY - 200);
  ctx.quadraticCurveTo(cx + 74, baseY - 190, lampX, lampY - 22);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(160,26,52,.4)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(cx + 30, baseY - 200);
  ctx.quadraticCurveTo(cx + 74, baseY - 190, lampX, lampY - 22);
  ctx.stroke();
  // 细长手指
  ctx.strokeStyle = '#e0d2dd'; ctx.lineWidth = 2.2;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(lampX - 2, lampY - 24 + i * 2);
    ctx.lineTo(lampX + 6, lampY - 20 + i * 3);
    ctx.stroke();
  }
  // 提灯
  ctx.save();
  ctx.strokeStyle = K37.gold; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(lampX + 4, lampY - 26, 5, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = 'rgba(255,214,140,.16)';
  ctx.beginPath(); ctx.roundRect(lampX - 7, lampY - 20, 24, 28, 4); ctx.fill();
  ctx.strokeStyle = K37.gold; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.roundRect(lampX - 7, lampY - 20, 24, 28, 4); ctx.stroke();
  const lg = ctx.createRadialGradient(lampX + 5, lampY - 6, 1, lampX + 5, lampY - 6, 46);
  lg.addColorStop(0, 'rgba(255,205,130,.55)');
  lg.addColorStop(1, 'rgba(255,205,130,0)');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.arc(lampX + 5, lampY - 6, 46, 0, Math.PI * 2); ctx.fill();
  const lf = 0.75 + 0.25 * Math.sin(t * 13);
  ctx.fillStyle = `rgba(255,228,170,${lf})`;
  ctx.beginPath(); ctx.ellipse(lampX + 5, lampY - 6, 3.2, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function k37Bats(t) {
  ctx.save();
  for (const b of K37_BATS) {
    const x = ((b.ph * 120 + t * 34 * b.sp * b.dir) % 760 + 760) % 760 - 60;
    const y = b.y + Math.sin(t * 1.7 + b.ph) * 12;
    const flap = Math.sin(t * 9 + b.ph) * 0.6;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(b.s * b.dir, b.s);
    ctx.fillStyle = 'rgba(5,3,8,.85)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-14, -6 - flap * 6);
    ctx.lineTo(-9, 1);
    ctx.lineTo(-3, -2);
    ctx.lineTo(0, 3);
    ctx.lineTo(3, -2);
    ctx.lineTo(9, 1);
    ctx.lineTo(14, -6 - flap * 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function k37Thorns(t) {
  ctx.save();
  ctx.strokeStyle = '#0a0610'; ctx.lineWidth = 3;
  const sides = [-1, 1];
  for (const s of sides) {
    const x0 = s < 0 ? 10 : W - 10;
    ctx.beginPath();
    ctx.moveTo(x0, 360);
    ctx.bezierCurveTo(x0 + s * 26, 260, x0 - s * 12, 170, x0 + s * 18, 40);
    ctx.stroke();
    for (let i = 0; i < 9; i++) {
      const yy = 340 - i * 36;
      const xx = x0 + s * (10 + Math.sin(i) * 12);
      ctx.beginPath();
      ctx.moveTo(xx, yy);
      ctx.lineTo(xx - s * 12, yy - 10);
      ctx.lineTo(xx - s * 4, yy - 2);
      ctx.closePath();
      ctx.fillStyle = '#0a0610'; ctx.fill();
    }
  }
  ctx.restore();
}

function k37Mist(t) {
  ctx.save();
  for (const m of K37_MIST) {
    const x = ((m.ph + t * m.sp) % 900) - 130;
    const g = ctx.createRadialGradient(x, m.y, 10, x, m.y, 200);
    g.addColorStop(0, `rgba(140,120,160,${m.a})`);
    g.addColorStop(1, 'rgba(140,120,160,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(x, m.y, 200, m.h, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function baseScene(t) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, K37.bg0);
  bg.addColorStop(0.6, K37.bg1);
  bg.addColorStop(1, '#0a0510');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  k37Stone(t);
  const glow = k37Window(t);
  k37Mist(t);
  k37Figure(t);
  k37Bats(t);
  k37Candle(84, 344, 1.05, t, 1.2);
  k37Candle(148, 350, 0.9, t, 3.7);
  k37Thorns(t);
  // 底部雾
  const fog = ctx.createLinearGradient(0, 290, 0, 360);
  fog.addColorStop(0, 'rgba(12,7,18,0)');
  fog.addColorStop(1, 'rgba(12,7,18,.92)');
  ctx.fillStyle = fog; ctx.fillRect(0, 290, W, 70);
  // 暗角
  const vg = ctx.createRadialGradient(320, 180, 120, 320, 180, 400);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // 文字
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const tp = k37seg(t, 0.6, 1.3);
  if (tp > 0) {
    ctx.globalAlpha = tp;
    ctx.fillStyle = K37.pale;
    ctx.font = `700 34px Georgia, "Songti SC", "STSong", serif`;
    ctx.save();
    ctx.shadowColor = K37.crimson; ctx.shadowBlur = 14;
    ctx.fillText('哥', 42, 96);
    ctx.fillText('特', 42, 144);
    ctx.restore();
    ctx.fillStyle = K37.crimson;
    ctx.fillRect(48, 158, 2, 60);
    ctx.fillStyle = 'rgba(201,184,214,.72)';
    ctx.font = `500 10px Georgia, serif`;
    ctx.fillText('G O T H I C', 60, 176);
    ctx.fillStyle = 'rgba(201,184,214,.55)';
    ctx.font = `500 13px ${FONT}`;
    ctx.fillText('细长 · 尖 · 黑紫暗红', 60, 200);
  }
  ctx.restore();
  return glow;
}

function drawScene(t) {
  const a = t / 6 * Math.PI * 2;
  ctx.save();
  ctx.translate(320, 180);
  const z = 1.022 + 0.012 * Math.sin(a + 2.6);
  ctx.scale(z, z);
  ctx.translate(-320 + 2.6 * Math.sin(a), -180 + 2.0 * Math.cos(a + 0.4));
  baseScene(t);
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

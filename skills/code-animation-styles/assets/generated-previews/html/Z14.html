<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 彩铅手绘：纸上先起淡铅笔稿，青瓷瓶与折枝梅用一层层斜排线上色，笔尖一路移到最后。
// Z14 彩铅手绘 · DeepSeek Harness 生成示例

const Z14_PAPER = '#f7f1e3';

const Z14_TEX = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = Z14_PAPER; g.fillRect(0, 0, W, H);
  const r = rng(1414);
  // 纸纹：细小的凹凸与纤维
  for (let i = 0; i < 5200; i++) {
    const x = r() * W, y = r() * H;
    g.fillStyle = r() < 0.5 ? `rgba(150,132,100,${0.03 + r() * 0.05})` : `rgba(255,252,244,${0.05 + r() * 0.08})`;
    g.beginPath();
    g.arc(x, y, 0.4 + r() * 1.1, 0, Math.PI * 2);
    g.fill();
  }
  for (let i = 0; i < 200; i++) {
    const x = r() * W, y = r() * H, len = 6 + r() * 30, a = r() * Math.PI;
    g.strokeStyle = `rgba(150,128,92,${0.02 + r() * 0.04})`;
    g.lineWidth = 0.6;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); g.stroke();
  }
  const vg = g.createRadialGradient(W * 0.5, H * 0.4, 140, W * 0.5, H * 0.4, 430);
  vg.addColorStop(0, 'rgba(255,255,255,0)');
  vg.addColorStop(1, 'rgba(150,124,82,0.16)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return c;
})();

// 纸齿：上色后压一层，让排线露出纸的颗粒
const Z14_TOOTH = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const r = rng(2424);
  for (let i = 0; i < 4200; i++) {
    const x = r() * W, y = r() * H;
    g.fillStyle = `rgba(247,241,227,${0.10 + r() * 0.16})`;
    g.beginPath();
    g.arc(x, y, 0.4 + r() * 0.9, 0, Math.PI * 2);
    g.fill();
  }
  return c;
})();

function z14seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

// ---- 物件形状 ----
const Z14_VASE = { cx: 292, cy: 252, rx: 42, ry: 46, neckY0: 184, neckY1: 214 };
const Z14_VASE_PTS = [
  [276, 182], [308, 182], [305, 196], [300, 208], [318, 222], [330, 246],
  [328, 272], [314, 292], [304, 300], [280, 300], [270, 292], [256, 272],
  [254, 246], [266, 222], [284, 208], [279, 196],
];
const Z14_BRANCH = [[316, 258], [344, 226], [372, 190], [400, 154], [424, 118]];
const Z14_TWIGS = [[[372, 190], [356, 158], [350, 138]], [[400, 154], [424, 154], [446, 148]], [[344, 226], [318, 210], [304, 196]]];
const Z14_FLOWERS = [[424, 112, 17], [396, 142, 15], [448, 156, 13], [350, 132, 12], [454, 124, 11]];

function z14inPoly(x, y, pts) {
  let hit = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) hit = !hit;
  }
  return hit;
}

function z14vaseInside(x, y) {
  return z14inPoly(x, y, Z14_VASE_PTS);
}

function z14clipVase() {
  ctx.beginPath();
  Z14_VASE_PTS.forEach(([x, y], i) => { if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
  ctx.closePath();
  ctx.clip();
}

function z14distSeg(px, py, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len2 = dx * dx + dy * dy || 1;
  const u = clamp(((px - a[0]) * dx + (py - a[1]) * dy) / len2, 0, 1);
  const x = a[0] + dx * u, y = a[1] + dy * u;
  return Math.hypot(px - x, py - y);
}

function z14branchInside(x, y) {
  for (let i = 0; i < Z14_BRANCH.length - 1; i++) {
    if (z14distSeg(x, y, Z14_BRANCH[i], Z14_BRANCH[i + 1]) <= 4.6) return true;
  }
  for (const T of Z14_TWIGS) {
    for (let i = 0; i < T.length - 1; i++) {
      if (z14distSeg(x, y, T[i], T[i + 1]) <= 3.2) return true;
    }
  }
  return false;
}

function z14flowerInside(x, y) {
  for (const [fx, fy, fr] of Z14_FLOWERS) {
    const d = Math.hypot(x - fx, y - fy);
    if (d > fr * 0.32 && d < fr * 1.05) return true;
  }
  return false;
}

function z14shadowInside(x, y) {
  const nx = (x - 300) / 58, ny = (y - 302) / 11;
  return nx * nx + ny * ny <= 1;
}

function z14hatch(bbox, inside, color, count, seed, ang, len, w) {
  const r = rng(seed);
  const out = [];
  let guard = 0;
  while (out.length < count && guard < count * 50) {
    guard++;
    const x = bbox[0] + r() * (bbox[2] - bbox[0]);
    const y = bbox[1] + r() * (bbox[3] - bbox[1]);
    if (!inside(x, y)) continue;
    const a = ang + (r() - 0.5) * 0.4;
    const L = len * (0.5 + r() * 0.7);
    const x2 = x + Math.cos(a) * L, y2 = y + Math.sin(a) * L;
    if (!inside(x2, y2)) continue;
    out.push({
      x1: x, y1: y, x2, y2,
      w: w * (0.65 + r() * 0.6), a: 0.28 + r() * 0.45,
    });
  }
  return out;
}

const Z14_REGIONS = [
  {
    key: 'vase', color: '111,159,138', t0: 0.5, t1: 2.0,
    segs: z14hatch([250, 178, 336, 306], z14vaseInside, '111,159,138', 430, 61, -0.7, 7, 1.6),
  },
  {
    key: 'vase2', color: '63,110,96', t0: 1.1, t1: 2.4,
    segs: z14hatch([250, 178, 336, 306], z14vaseInside, '63,110,96', 240, 62, 0.9, 6.4, 1.4),
  },
  {
    key: 'branch', color: '120,80,54', t0: 1.4, t1: 2.9,
    segs: z14hatch([296, 112, 460, 262], z14branchInside, '120,80,54', 330, 63, -0.9, 6, 1.7),
  },
  {
    key: 'flowerA', color: '199,86,106', t0: 2.4, t1: 3.6,
    segs: z14hatch([336, 96, 470, 176], z14flowerInside, '199,86,106', 320, 64, -0.55, 5.4, 1.6),
  },
  {
    key: 'flowerB', color: '156,48,70', t0: 3.0, t1: 4.0,
    segs: z14hatch([336, 96, 470, 176], z14flowerInside, '156,48,70', 200, 65, 0.75, 5, 1.4),
  },
  {
    key: 'shadow', color: '108,92,74', t0: 4.5, t1: 5.9,
    segs: z14hatch([244, 292, 358, 316], z14shadowInside, '108,92,74', 150, 66, -0.35, 8, 1.5),
  },
];

function z14drawHatch(segs, n, color) {
  for (let i = 0; i < n; i++) {
    const s = segs[i];
    ctx.strokeStyle = `rgba(${color},${s.a})`;
    ctx.lineWidth = s.w;
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
  }
}

// 铅笔
function z14pencil(x, y, ang, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(s, s);
  // 笔杆
  ctx.fillStyle = '#3f6a58';
  ctx.fillRect(6, -4, 62, 8);
  ctx.fillStyle = '#2f5044';
  ctx.fillRect(6, 1, 62, 3);
  // 金属箍
  ctx.fillStyle = '#c9b489';
  ctx.fillRect(2, -4.4, 6, 8.8);
  // 削出的木
  ctx.fillStyle = '#e8cba0';
  ctx.beginPath();
  ctx.moveTo(2, -4); ctx.lineTo(-10, -1.6); ctx.lineTo(-10, 1.6); ctx.lineTo(2, 4);
  ctx.closePath();
  ctx.fill();
  // 铅芯
  ctx.fillStyle = '#5c6b5e';
  ctx.beginPath();
  ctx.moveTo(-10, -1.6); ctx.lineTo(-15, 0); ctx.lineTo(-10, 1.6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawScene(t) {
  ctx.drawImage(Z14_TEX, 0, 0);
  ctx.lineCap = 'round';

  // 淡铅笔起稿
  const sk = z14seg(t, -0.25, 0.75);
  if (sk > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.42, sk * 0.5);
    ctx.strokeStyle = 'rgba(90,84,74,0.7)';
    ctx.lineWidth = 1.1;
    // 瓶
    ctx.beginPath();
    Z14_VASE_PTS.forEach(([x, y], i) => { if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath(); ctx.ellipse(292, 183, 16, 4, 0, 0, Math.PI * 2); ctx.stroke();
    // 枝
    ctx.beginPath();
    Z14_BRANCH.forEach(([x, y], i) => { if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
    ctx.stroke();
    Z14_TWIGS.forEach(T => {
      ctx.beginPath();
      T.forEach(([x, y], i) => { if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.stroke();
    });
    // 花
    Z14_FLOWERS.forEach(([fx, fy, fr]) => {
      ctx.beginPath();
      ctx.arc(fx, fy, fr, 0, Math.PI * 2);
      ctx.stroke();
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * Math.PI * 2 - Math.PI / 2;
        ctx.beginPath();
        ctx.ellipse(fx + Math.cos(a) * fr * 0.62, fy + Math.sin(a) * fr * 0.62, fr * 0.34, fr * 0.5, a, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
    ctx.restore();
  }

  // 排线上色
  let lastSeg = null;
  let lastRegion = null;
  Z14_REGIONS.forEach(R => {
    const p = z14seg(t, R.t0, R.t1);
    if (p <= 0) return;
    const n = Math.floor(p * R.segs.length);
    if (n <= 0) return;
    if (R.key === 'vase' || R.key === 'vase2') {
      ctx.save();
      z14clipVase();
      z14drawHatch(R.segs, n, R.color);
      ctx.restore();
    } else {
      z14drawHatch(R.segs, n, R.color);
    }
    lastSeg = R.segs[n - 1];
    lastRegion = R;
  });

  // 花蕊与高光
  const hp = z14seg(t, 3.8, 4.4);
  if (hp > 0) {
    ctx.save();
    ctx.globalAlpha = hp;
    Z14_FLOWERS.forEach(([fx, fy, fr]) => {
      ctx.fillStyle = 'rgba(233,189,92,0.85)';
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * Math.PI * 2 + 0.3;
        ctx.beginPath();
        ctx.arc(fx + Math.cos(a) * fr * 0.26, fy + Math.sin(a) * fr * 0.26, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
      // 花瓣分隔与描边，让花形读得出来
      ctx.strokeStyle = 'rgba(250,247,238,0.85)';
      ctx.lineWidth = 2.4;
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * Math.PI * 2 - Math.PI / 2 + Math.PI / 5;
        ctx.beginPath();
        ctx.moveTo(fx + Math.cos(a) * fr * 0.18, fy + Math.sin(a) * fr * 0.18);
        ctx.lineTo(fx + Math.cos(a) * fr * 1.02, fy + Math.sin(a) * fr * 1.02);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(150,52,72,0.55)';
      ctx.lineWidth = 1.3;
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * Math.PI * 2 - Math.PI / 2;
        ctx.beginPath();
        ctx.ellipse(fx + Math.cos(a) * fr * 0.6, fy + Math.sin(a) * fr * 0.6, fr * 0.36, fr * 0.52, a, 0, Math.PI * 2);
        ctx.stroke();
      }
      // 白色提亮
      ctx.strokeStyle = 'rgba(250,247,238,0.7)';
      ctx.lineWidth = 1.4;
      for (let k = 0; k < 4; k++) {
        const a = (k / 4) * Math.PI * 2 - 0.6;
        ctx.beginPath();
        ctx.moveTo(fx + Math.cos(a) * fr * 0.4, fy + Math.sin(a) * fr * 0.4);
        ctx.lineTo(fx + Math.cos(a) * fr * 0.85, fy + Math.sin(a) * fr * 0.85);
        ctx.stroke();
      }
    });
    // 瓶口高光
    ctx.strokeStyle = 'rgba(250,247,238,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(278, 210); ctx.quadraticCurveTo(286, 214, 292, 212);
    ctx.stroke();
    ctx.restore();
  }

  // 纸齿压一层，让颜色有颗粒
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.drawImage(Z14_TOOTH, 0, 0);
  ctx.restore();

  // 铅笔：跟着最后画到的地方走
  let px = 470, py = 240, pa = -0.9;
  if (lastSeg) {
    px = lastSeg.x2 + 8;
    py = lastSeg.y2 - 4;
    pa = Math.atan2(lastSeg.y2 - lastSeg.y1, lastSeg.x2 - lastSeg.x1) + 0.35;
  } else {
    px = 320 + Math.sin(t) * 6;
    py = 300;
  }
  // 画完后笔悬着轻移
  const done = t > 5.9;
  z14pencil(px + Math.sin(t * 1.7) * 2, py + Math.cos(t * 1.3) * 2, pa + (done ? Math.sin(t) * 0.03 : 0), 0.7);

  // 题字（彩铅写的感觉：错位一层淡影）
  const tp = z14seg(t, 4.2, 4.9);
  if (tp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(tp);
    ctx.font = `600 30px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(150,120,104,0.30)';
    ctx.fillText('彩', 566, 84);
    ctx.fillText('铅', 566, 122);
    ctx.fillStyle = 'rgba(62,52,48,0.92)';
    ctx.fillText('彩', 564, 82);
    ctx.fillText('铅', 564, 120);
    ctx.font = `400 15px ${FONT}`;
    ctx.fillStyle = 'rgba(62,52,48,0.82)';
    ctx.fillText('一枝春', 566, 160);
    ctx.restore();
  }
  const sp = z14seg(t, 4.75, 5.2);
  if (sp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(sp) * 0.8;
    ctx.fillStyle = 'rgba(62,52,48,0.7)';
    ctx.font = `400 13px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText('排线 · 纸纹', 566, 190);
    ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

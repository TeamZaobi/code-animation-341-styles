<title>M20 时间线/历史 · DeepSeek Harness 生成示例</title>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>M20 · 时间线/历史</h1>
    <p>一条旧纸上的时间轴往前走，镜头每到一个节点就推近讲这一件事，再缩回去接着走。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="时间线/历史 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 一条旧纸上的时间轴往前走，镜头每到一个节点就推近讲这一件事，再缩回去接着走。
// M20 时间线/历史 · DeepSeek Harness 生成示例
const M20_PAPER = '#e9dcc0', M20_INK = '#4a3823', M20_RED = '#a8402c', M20_DIM = 'rgba(74,56,35,.55)';

function m20p(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

const M20_FIBERS = (() => {
  const r = rng(2020);
  return Array.from({ length: 520 }, () => ({
    x: r() * W, y: r() * H, a: 0.03 + r() * 0.06, w: 2 + r() * 12
  }));
})();

const M20_NODES = [
  { x: 148, date: '三月', title: '一个念头', line: '在便签上写下第一句', tag: '01' },
  { x: 320, date: '六月', title: '第一次动手', line: '做出来能跑的最简版', tag: '02' },
  { x: 492, date: '十月', title: '它跑起来了', line: '开始有人每天在用', tag: '03' }
];

// 镜头：广角 → 推近节点 → 拉回 → 推近下一个
const M20_KEYS = [
  [0.00, 1.00, 320, 200],
  [1.05, 1.00, 320, 200],
  [1.65, 2.20, 148, 196],
  [2.20, 2.20, 148, 196],
  [2.70, 1.00, 320, 200],
  [3.25, 2.60, 320, 196],
  [3.80, 2.60, 320, 196],
  [4.30, 1.00, 320, 200],
  [4.85, 2.60, 492, 196],
  [5.35, 2.60, 492, 196],
  [5.80, 1.00, 320, 200],
  [6.00, 1.00, 320, 200]
];

function m20cam(t) {
  for (let i = 1; i < M20_KEYS.length; i++) {
    const a = M20_KEYS[i - 1], b = M20_KEYS[i];
    if (t <= b[0]) {
      const k = smooth(clamp((t - a[0]) / (b[0] - a[0]), 0, 1));
      return { s: lerp(a[1], b[1], k), cx: lerp(a[2], b[2], k), cy: lerp(a[3], b[3], k) };
    }
  }
  return { s: 1, cx: 320, cy: 200 };
}

function m20paper() {
  ctx.fillStyle = M20_PAPER; ctx.fillRect(0, 0, W, H);
  for (const f of M20_FIBERS) {
    ctx.fillStyle = 'rgba(120,96,62,' + f.a.toFixed(3) + ')';
    ctx.fillRect(f.x, f.y, f.w, 1);
  }
  const g = ctx.createRadialGradient(320, 160, 80, 320, 200, 430);
  g.addColorStop(0, 'rgba(255,250,232,.55)');
  g.addColorStop(1, 'rgba(140,108,68,.42)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 装订线
  ctx.strokeStyle = 'rgba(74,56,35,.16)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(30.5, 22); ctx.lineTo(30.5, H - 22); ctx.stroke();
  for (let y = 40; y < H - 30; y += 26) {
    ctx.fillStyle = 'rgba(74,56,35,.18)';
    ctx.beginPath(); ctx.arc(30, y, 2.2, 0, Math.PI * 2); ctx.fill();
  }
}

function drawScene(t) {
  m20paper();
  const cam = m20cam(t);

  ctx.save();
  ctx.translate(320, 180);
  ctx.scale(cam.s, cam.s);
  ctx.translate(-cam.cx, -cam.cy);

  // 标题
  ctx.save();
  ctx.fillStyle = M20_INK;
  ctx.font = `800 26px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('它是怎么走过来的', 56, 60);
  ctx.fillStyle = M20_DIM;
  ctx.font = `400 13px ${FONT}`;
  ctx.fillText('一条时间轴 · 三个节点', 56, 82);
  ctx.restore();

  // 轴线
  const lineP = 1 - Math.pow(1 - m20p(t, -0.3, 0.7), 3);
  ctx.save();
  ctx.strokeStyle = M20_INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(72, 250); ctx.lineTo(72 + 500 * lineP, 250); ctx.stroke();
  // 走过的部分：红
  const walkP = m20p(t, 0.2, 5.8);
  ctx.strokeStyle = M20_RED; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(72, 250); ctx.lineTo(72 + 500 * walkP, 250); ctx.stroke();
  // 刻度
  ctx.strokeStyle = 'rgba(74,56,35,.35)'; ctx.lineWidth = 1.2;
  for (let x = 72; x <= 572; x += 25) {
    const long = (x - 72) % 100 === 0;
    ctx.beginPath(); ctx.moveTo(x, 250); ctx.lineTo(x, 250 + (long ? 10 : 5)); ctx.stroke();
  }
  ctx.restore();

  // 节点
  M20_NODES.forEach((n, i) => {
    const on = 1;
    // 竖线 + 圆点
    ctx.save();
    ctx.globalAlpha = on;
    ctx.strokeStyle = 'rgba(74,56,35,.45)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(n.x, 250); ctx.lineTo(n.x, 206); ctx.stroke();
    ctx.fillStyle = M20_RED;
    ctx.beginPath(); ctx.arc(n.x, 250, 6.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = M20_PAPER;
    ctx.beginPath(); ctx.arc(n.x, 250, 2.6, 0, Math.PI * 2); ctx.fill();
    // 日期（推近时淡出，改由卡片承载）
    ctx.globalAlpha = clamp((1.55 - cam.s) / 0.45, 0, 1);
    ctx.fillStyle = M20_INK;
    ctx.font = `700 15px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(n.date, n.x, 278);
    // 广角时的短标题
    ctx.globalAlpha = clamp((1.55 - cam.s) / 0.45, 0, 1);
    ctx.fillStyle = M20_DIM;
    ctx.font = `500 15px ${FONT}`;
    ctx.fillText(n.title, n.x, 202);
    ctx.restore();
  });

  // 每个节点被推近时，才展开这件事的卡片
  M20_NODES.forEach((n, i) => {
    const z = i === 0 ? m20p(t, 1.3, 1.72) * (1 - m20p(t, 2.1, 2.5))
      : i === 1 ? m20p(t, 2.9, 3.3) * (1 - m20p(t, 3.7, 4.1))
        : m20p(t, 4.5, 4.9) * (1 - m20p(t, 5.25, 5.65));
    if (z <= 0.01) return;
    const e = 1 - Math.pow(1 - z, 3);
    ctx.save();
    ctx.globalAlpha = clamp(z * 1.8, 0, 1);
    const w = 132, h = 62;
    const bx = n.x - w / 2, by = 142 - (1 - e) * 10;
    ctx.fillStyle = 'rgba(74,56,35,.18)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx + 4, by + 5, w, h, 4); else ctx.rect(bx + 4, by + 5, w, h);
    ctx.fill();
    ctx.fillStyle = '#f7efd9';
    ctx.strokeStyle = M20_INK; ctx.lineWidth = 1.6;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, w, h, 4); else ctx.rect(bx, by, w, h);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = M20_RED;
    ctx.font = `800 13px ${FONT}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(n.date + '  ·  ' + n.tag, bx + 10, by + 18);
    ctx.fillStyle = M20_INK;
    ctx.font = `700 19px ${FONT}`;
    ctx.fillText(n.title, bx + 10, by + 40);
    ctx.fillStyle = M20_DIM;
    ctx.font = `400 13px ${FONT}`;
    ctx.fillText(n.line, bx + 10, by + 55);
    // 连到节点的短引线
    ctx.strokeStyle = 'rgba(74,56,35,.4)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(n.x, by + h); ctx.lineTo(n.x, 206); ctx.stroke();
    ctx.restore();
  });

  // 现在走到哪：一个小三角
  const mx = 72 + 500 * walkP;
  ctx.save();
  ctx.fillStyle = M20_RED;
  ctx.beginPath();
  ctx.moveTo(mx, 250 - 16); ctx.lineTo(mx - 5, 250 - 24); ctx.lineTo(mx + 5, 250 - 24);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.restore();

  // 右下角的说明（避开署名）
  ctx.save();
  ctx.fillStyle = 'rgba(74,56,35,.45)';
  ctx.font = `500 13px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('推近讲一件事，再缩回去接着走', 56, 336);
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<style>

  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;

<body>
<div id="app">
  <div id="head">
    <h1>M24 · 四段式发布片</h1>
    <p>深色发布片四段：为什么、麻烦、怎么解决、好处，文字弹簧逐词进场，最后几何标志拼合收尾。</p>

<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 深色发布片四段：为什么、麻烦、怎么解决、好处，文字弹簧逐词进场，最后几何标志拼合收尾。
// M24 四段式发布片 · DeepSeek Harness 生成示例
const M24_BG0 = '#080b14', M24_BG1 = '#151c33';
const M24_TEXT = '#f2f5ff', M24_LIME = '#c9f24a', M24_BLUE = '#7b8cff', M24_RED = '#ff6f61';
const M24_T = [0, 1.2, 2.4, 3.6, 4.72];

function m24seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function m24e(t) { return 1 - Math.pow(1 - t, 3); }
// 弹簧：略微回弹
function m24spring(p) {
  if (p <= 0) return 0;
  if (p >= 1) return 1;
  return 1 - Math.exp(-6.5 * p) * Math.cos(10.5 * p) * (1 - p * 0.55);
}
function m24Glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace('ALPHA', String(a)));
  g.addColorStop(1, color.replace('ALPHA', '0'));
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function m24Bg(phase, t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, M24_BG0);
  g.addColorStop(1, phase === 1 ? '#1b1320' : M24_BG1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 底部网格
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 12; i++) {
    const x = i * 56 + (t * 6) % 56;
    ctx.beginPath(); ctx.moveTo(x, 240); ctx.lineTo(x + 60, 360); ctx.stroke();
  }
  for (let j = 0; j < 5; j++) {
    const y = 268 + j * 22;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
  m24Glow(phase === 1 ? 460 : 300, 150, 260, 'rgba(123,140,255,ALPHA)', 0.16);
  if (phase === 3) m24Glow(190, 200, 240, 'rgba(201,242,74,ALPHA)', 0.14);
}

// 逐词弹簧进场
function m24Words(words, x, y, size, color, phaseT, start, stagger, weight) {
  ctx.save();
  ctx.font = `${weight || 800} ${size}px ${FONT}`;
  ctx.textBaseline = 'alphabetic';
  let cx = x;
  const gap = size * 0.06;
  words.forEach((wd, i) => {
    const p = m24spring(m24seg(phaseT, start + i * stagger, start + i * stagger + 0.42));
    const w = ctx.measureText(wd).width;
    if (p > 0.001) {
      ctx.save();
      ctx.globalAlpha = clamp(p * 1.6, 0, 0.98);
      ctx.translate(cx, y + (1 - p) * 26);
      ctx.scale(1 + (1 - clamp(p, 0, 1)) * 0.08, 1 + (1 - clamp(p, 0, 1)) * 0.08);
      ctx.fillStyle = color;
      ctx.fillText(wd, 0, 0);
      ctx.restore();
    }
    cx += w + gap;
  });
  ctx.restore();
}
function m24Small(str, x, y, color, phaseT, start) {
  const p = m24e(m24seg(phaseT, start, start + 0.3));
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha = p * 0.72;
  ctx.fillStyle = color || M24_TEXT;
  ctx.font = `500 13px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(str, x, y);
  ctx.restore();
}

// ---- 第一段：为什么是现在 ----
function m24P1(lt) {
  m24Small('01 / 为什么是现在', 56, 96, 'rgba(242,245,255,.6)', lt, 0.04);
  m24Words(['现在，'], 56, 176, 40, M24_TEXT, lt, -0.12, 0.1);
  m24Words(['动手'], 56, 232, 40, M24_LIME, lt, -0.07, 0.1);
  m24Words(['最容易。'], 56, 288, 40, M24_TEXT, lt, 0.07, 0.1);
  // 右侧上升的柱
  for (let i = 0; i < 4; i++) {
    const p = m24spring(m24seg(lt, -0.1 + i * 0.09, 0.42 + i * 0.09));
    const h = (52 + i * 34) * clamp(p, 0, 1.15);
    const x = 388 + i * 52;
    ctx.save();
    ctx.globalAlpha = 0.9;
    const g = ctx.createLinearGradient(0, 300 - h, 0, 300);
    g.addColorStop(0, 'rgba(201,242,74,.95)');
    g.addColorStop(1, 'rgba(123,140,255,.22)');
    ctx.fillStyle = g;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, 300 - h, 30, h, 6); else ctx.rect(x, 300 - h, 30, h);
    ctx.fill();
    ctx.restore();
  }
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(372, 300); ctx.lineTo(608, 300); ctx.stroke(); ctx.restore();
}

// ---- 第二段：麻烦 ----
function m24P2(lt) {
  m24Small('02 / 大家现在的麻烦', 56, 96, 'rgba(242,245,255,.6)', lt, 0.04);
  m24Words(['一改，'], 56, 176, 40, M24_TEXT, lt, 0.08, 0.1);
  m24Words(['就全乱了。'], 56, 234, 40, '#ffb1a8', lt, 0.24, 0.1);
  m24Small('版本、备份、再来一次', 58, 272, 'rgba(242,245,255,.45)', lt, 0.5);
  // 右侧缠绕的线
  const p = m24e(m24seg(lt, 0.12, 1.0));
  ctx.save();
  ctx.strokeStyle = M24_RED; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const y0 = 120 + i * 26;
    const wob = Math.sin(lt * 3 + i) * 8;
    ctx.globalAlpha = 0.36 + (i % 3) * 0.12;
    ctx.beginPath();
    ctx.moveTo(372, y0);
    ctx.bezierCurveTo(430, y0 + 60 + wob, 500, y0 - 56 + wob, 604, y0 + 12);
    ctx.stroke();
  }
  ctx.restore();
  // 漂着的小标签
  const tags = [['v3', 398, 130], ['v7', 500, 206], ['final?', 442, 286]];
  tags.forEach((tg, i) => {
    const tp = m24spring(m24seg(lt, 0.4 + i * 0.12, 0.75 + i * 0.12));
    if (tp <= 0.01) return;
    ctx.save();
    ctx.globalAlpha = clamp(tp, 0, 1) * 0.9;
    ctx.translate(tg[1], tg[2] + Math.sin(lt * 3 + i * 2) * 4);
    ctx.fillStyle = 'rgba(8,11,20,.85)';
    ctx.strokeStyle = 'rgba(255,111,97,.7)'; ctx.lineWidth = 1.2;
    ctx.font = `600 12px ${FONT}`;
    const w = ctx.measureText(tg[0]).width + 14;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(0, -10, w, 22, 11); else ctx.rect(0, -10, w, 22);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffb1a8'; ctx.textBaseline = 'middle';
    ctx.fillText(tg[0], 7, 1);
    ctx.restore();
  });
}

// ---- 第三段：怎么解决 ----
function m24P3(lt) {
  m24Small('03 / 怎么解决', 56, 96, 'rgba(242,245,255,.6)', lt, 0.04);
  m24Words(['一条线，'], 56, 176, 40, M24_TEXT, lt, 0.08, 0.1);
  m24Words(['从头到尾。'], 56, 234, 40, M24_BLUE, lt, 0.24, 0.1);
  m24Small('不再来回搬', 58, 272, 'rgba(242,245,255,.45)', lt, 0.52);
  // 右侧管线：线先长出来，节点再弹出
  const lp = m24e(m24seg(lt, 0.16, 0.9));
  const x0 = 372, x1 = 604, y = 200;
  ctx.save();
  ctx.strokeStyle = 'rgba(123,140,255,.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(lerp(x0, x1, lp), y); ctx.stroke();
  ctx.restore();
  for (let i = 0; i < 4; i++) {
    const p = m24spring(m24seg(lt, 0.3 + i * 0.1, 0.62 + i * 0.1));
    if (p <= 0.01) continue;
    const x = x0 + i * 64 + 16;
    ctx.save();
    ctx.translate(x, y); ctx.scale(p, p);
    ctx.fillStyle = i === 3 ? M24_LIME : '#0e1424';
    ctx.strokeStyle = i === 3 ? M24_LIME : 'rgba(123,140,255,.9)';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = i === 3 ? '#0b0f1a' : 'rgba(242,245,255,.8)';
    ctx.font = `700 12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), 0, 1);
    ctx.restore();
  }
}

// ---- 第四段：好处 ----
function m24P4(lt) {
  m24Small('04 / 用了以后', 56, 96, 'rgba(242,245,255,.6)', lt, 0.04);
  m24Words(['少点来回，'], 56, 172, 36, M24_TEXT, lt, 0.08, 0.1);
  m24Words(['多点做完。'], 56, 246, 44, M24_TEXT, lt, 0.26, 0.1);
  // 荧光笔块扫过第二行
  const hp = m24e(m24seg(lt, 0.52, 0.86));
  if (hp > 0) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = M24_LIME;
    ctx.fillRect(56, 264, 300 * hp, 9);
    ctx.restore();
  }
  // 右侧勾选清单，逐条弹入
  const rows = ['改一处，别处不动', '回头还能找到', '交出去就完事'];
  rows.forEach((r, i) => {
    const p = m24spring(m24seg(lt, 0.2 + i * 0.14, 0.55 + i * 0.14));
    if (p <= 0.01) return;
    const y = 120 + i * 42;
    ctx.save();
    ctx.globalAlpha = clamp(p * 1.4, 0, 0.95);
    ctx.translate(-(1 - clamp(p, 0, 1)) * 16, 0);
    ctx.strokeStyle = M24_LIME; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(372, y, 8, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(368, y); ctx.lineTo(371, y + 4); ctx.lineTo(377, y - 4); ctx.stroke();
    ctx.fillStyle = 'rgba(242,245,255,.82)'; ctx.font = `500 13px ${FONT}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(r, 390, y + 1);
    ctx.restore();
  });
}

// ---- 第五段：标志收尾 ----
function m24Logo(lt) {
  const cx = 320, cy = 148;
  // 光晕
  const gp = m24e(m24seg(lt, 0, 0.5));
  m24Glow(cx, cy, 150, 'rgba(201,242,74,ALPHA)', 0.2 * gp);
  // 三块碎片拼成标志
  const parts = [
    { x: -30, y: -6, r: -0.62, fx: -250, fy: 210, fr: -2.6 },
    { x: 30, y: -6, r: 0.62, fx: 268, fy: -170, fr: 2.4 },
    { x: 0, y: 28, r: 0, fx: 40, fy: 300, fr: -1.6 },
  ];
  ctx.save();
  ctx.translate(cx, cy);
  parts.forEach((pt, i) => {
    const p = m24spring(m24seg(lt, 0.06 + i * 0.08, 0.5 + i * 0.08));
    if (p <= 0.001) return;
    ctx.save();
    const cp = clamp(p, 0, 1);
    ctx.translate(lerp(pt.fx, pt.x, cp), lerp(pt.fy, pt.y, cp));
    ctx.rotate(lerp(pt.fr, pt.r, cp));
    ctx.globalAlpha = clamp(p * 2, 0, 1);
    ctx.fillStyle = i === 2 ? M24_LIME : M24_BLUE;
    ctx.beginPath();
    const w = 48, h = 13;
    if (ctx.roundRect) ctx.roundRect(-w / 2, -h / 2, w, h, 6); else ctx.rect(-w / 2, -h / 2, w, h);
    ctx.fill();
    ctx.restore();
  });
  // 拼合后的一道亮线
  const sp = m24seg(lt, 0.72, 0.95);
  if (sp > 0) {
    ctx.save();
    ctx.globalAlpha = (1 - sp) * 0.8;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-70, -2, 140, 2);
    ctx.restore();
  }
  ctx.restore();
  // 字标
  const wp = m24spring(m24seg(lt, 0.48, 0.8));
  ctx.save();
  ctx.globalAlpha = clamp(wp, 0, 1);
  ctx.fillStyle = M24_TEXT;
  ctx.font = `800 30px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('成 形', cx, 250 + (1 - wp) * 10);
  ctx.fillStyle = 'rgba(242,245,255,.55)';
  ctx.font = `400 14px ${FONT}`;
  ctx.fillText('把想法推出去。', cx, 278 + (1 - wp) * 10);
  ctx.restore();
}

// 顶部进度轨（固定，不随段落移动）
function m24Rail(t) {
  const p = clamp(t / 6, 0, 1);
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  ctx.fillRect(56, 34, 320, 2);
  ctx.fillStyle = M24_LIME;
  ctx.fillRect(56, 34, 320 * p, 2);
  for (let i = 0; i < 5; i++) {
    const x = 56 + 320 * (M24_T[i] / 6);
    ctx.fillStyle = t >= M24_T[i] ? M24_LIME : 'rgba(255,255,255,.28)';
    ctx.beginPath(); ctx.arc(x, 35, 2.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(242,245,255,.4)';
  ctx.font = `600 10px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('RELEASE  /  4 SHOTS', 56, 22);
  ctx.restore();
}

function drawScene(t) {
  let phase = 0;
  for (let i = 0; i < M24_T.length; i++) if (t >= M24_T[i]) phase = i;
  const lt = t - M24_T[phase];
  m24Bg(phase, lt);
  // 段落切换：暗场快速抬起，元素不会硬冒出来
  if (phase === 0) m24P1(lt);
  else if (phase === 1) m24P2(lt);
  else if (phase === 2) m24P3(lt);
  else if (phase === 3) m24P4(lt);
  else m24Logo(lt);
  m24Rail(t);
  // 切点短暗幕
  if (lt < 0.14 && phase > 0) {
    ctx.save();
    ctx.globalAlpha = (1 - lt / 0.14) * 0.42;
    ctx.fillStyle = '#060810'; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  // 结尾压暗，接回开头
  const end = m24seg(t, 5.84, 6.0);
  if (end > 0) {
    ctx.save(); ctx.globalAlpha = end * 0.5; ctx.fillStyle = '#05070d';
    ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K17 几何 · DeepSeek Harness 生成示例</title>
<!--

  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>K17 · 几何</h1>
    <p>几何拼装：圆形头、三角身体、长方形四肢从四周飞入合体，套上辅助线与「想法」气泡。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="几何 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 几何拼装：圆形头、三角身体、长方形四肢从四周飞入合体，套上辅助线与「想法」气泡。
const K17_BG = '#f1eee5';
const K17_INK = '#1c1c22';
const K17_RED = '#dd4a3c';
const K17_BLUE = '#2f6fb2';
const K17_YELLOW = '#f2b93b';
const K17_CREAM = '#fbf6e9';

function k17seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function k17ease(p) { return 1 - Math.pow(1 - p, 3); }
function k17back(p) {
  p = clamp(p, 0, 1);
  const c1 = 1.5, c3 = c1 + 1;
  return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
}
function k17Arrive(t, a, dur, ox, oy, rot) {
  const raw = k17seg(t, a, a + dur);
  const p = k17back(raw);
  return { p: k17ease(raw), dx: ox * (1 - p), dy: oy * (1 - p), rot: (rot || 0) * (1 - p) };
}
function k17Shape(fn, x, y, rot, fill, stroke) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  fn();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke !== false) { ctx.lineWidth = 5; ctx.strokeStyle = K17_INK; ctx.lineJoin = 'round'; ctx.stroke(); }
  ctx.restore();
}

function drawScene(t) {
  ctx.fillStyle = K17_BG; ctx.fillRect(0, 0, W, H);

  // 网格与辅助线
  ctx.save();
  ctx.strokeStyle = 'rgba(28,28,34,.07)'; ctx.lineWidth = 1;
  for (let x = 20; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 20; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(28,28,34,.16)'; ctx.setLineDash([7, 7]);
  ctx.beginPath(); ctx.moveTo(300, 40); ctx.lineTo(300, 316); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  // 四角定位十字
  ctx.save();
  ctx.strokeStyle = 'rgba(28,28,34,.35)'; ctx.lineWidth = 1.4;
  for (const [x, y] of [[26, 26], [614, 26], [26, 334], [614, 334]]) {
    ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y); ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 6); ctx.stroke();
  }
  ctx.restore();

  // 标题
  ctx.save();
  ctx.fillStyle = K17_INK;
  ctx.font = `800 30px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('圆 · 方 · 三角', 34, 62);
  ctx.font = `700 13px ${FONT}`;
  ctx.fillStyle = 'rgba(28,28,34,.62)';
  ctx.fillText('几何拼装  /  BUILD A THOUGHT', 34, 84);
  ctx.restore();

  const bob = Math.sin(t * 2.2) * 2;
  const waveP = k17ease(k17seg(t, 4.2, 4.9));

  // 手臂（先画，压在身体后面）
  let a = k17Arrive(t, 0.75, 0.55, -90, 60, -0.5);
  k17Shape(() => { ctx.beginPath(); ctx.roundRect(-9, 0, 18, 74, 9); }, 284 + a.dx, 192 + a.dy + bob, 0.55 + a.rot, K17_BLUE);
  a = k17Arrive(t, 0.95, 0.55, 110, 70, 0.6);
  const armAngle = lerp(-0.5, -2.6, waveP);
  k17Shape(() => { ctx.beginPath(); ctx.roundRect(-9, 0, 18, 74, 9); }, 316 + a.dx, 192 + a.dy + bob, armAngle + a.rot, K17_BLUE);
  // 手掌（圆）
  a = k17Arrive(t, 1.2, 0.45, -90, 60, 0);
  k17Shape(() => { ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); }, 250 + a.dx, 262 + a.dy + bob, 0, K17_YELLOW);
  a = k17Arrive(t, 1.35, 0.45, 120, 80, 0);
  const hx = 316 - Math.sin(armAngle) * 74 + a.dx;
  const hy = 192 + Math.cos(armAngle) * 74 + a.dy + bob;
  k17Shape(() => { ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); }, hx, hy, 0, K17_YELLOW);

  // 腿
  a = k17Arrive(t, 1.15, 0.5, -30, 120, -0.15);
  k17Shape(() => { ctx.beginPath(); ctx.roundRect(-8, 0, 16, 64, 6); }, 282 + a.dx, 238 + a.dy + bob, a.rot, K17_INK);
  a = k17Arrive(t, 1.3, 0.5, 30, 120, 0.15);
  k17Shape(() => { ctx.beginPath(); ctx.roundRect(-8, 0, 16, 64, 6); }, 318 + a.dx, 238 + a.dy + bob, a.rot, K17_INK);

  // 脚：半圆
  a = k17Arrive(t, 1.55, 0.45, -70, 40, 0);
  k17Shape(() => { ctx.beginPath(); ctx.arc(0, 0, 20, Math.PI, Math.PI * 2); ctx.closePath(); }, 278 + a.dx, 303 + a.dy + bob, 0, K17_RED);
  a = k17Arrive(t, 1.65, 0.45, 70, 40, 0);
  k17Shape(() => { ctx.beginPath(); ctx.arc(0, 0, 20, Math.PI, Math.PI * 2); ctx.closePath(); }, 322 + a.dx, 303 + a.dy + bob, 0, K17_BLUE);

  // 身体：三角
  a = k17Arrive(t, 0.32, 0.6, 0, 110, 0.12);
  ctx.save();
  ctx.translate(a.dx, a.dy + bob);
  ctx.beginPath();
  ctx.moveTo(300, 166);
  ctx.lineTo(352, 240);
  ctx.lineTo(248, 240);
  ctx.closePath();
  ctx.fillStyle = K17_RED; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = K17_INK; ctx.lineJoin = 'round'; ctx.stroke();
  // 胸前蓝色横带
  ctx.save(); ctx.clip();
  ctx.fillStyle = K17_BLUE; ctx.fillRect(240, 208, 120, 12);
  ctx.restore();
  ctx.restore();

  // 头：圆
  a = k17Arrive(t, -0.15, 0.62, 0, -130, -0.25);
  k17Shape(() => { ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); }, 300 + a.dx, 126 + a.dy + bob, a.rot, K17_YELLOW);

  // 五官
  const fp = k17ease(k17seg(t, 1.9, 2.45));
  if (fp > 0) {
    ctx.save();
    ctx.globalAlpha = fp;
    ctx.fillStyle = K17_INK;
    ctx.beginPath(); ctx.arc(286, 118 + bob, 4.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(314, 118 + bob, 4.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = K17_INK; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(300, 132 + bob, 10, 0.2, Math.PI - 0.2); ctx.stroke();
    // 腮红小三角
    ctx.fillStyle = 'rgba(221,74,60,.55)';
    ctx.beginPath(); ctx.moveTo(270, 128 + bob); ctx.lineTo(284, 128 + bob); ctx.lineTo(277, 140 + bob); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 落下时的小尺寸标注
  const mp = 1 - k17seg(t, 2.2, 3.0);
  if (mp > 0) {
    ctx.save();
    ctx.globalAlpha = mp * 0.7;
    ctx.strokeStyle = 'rgba(28,28,34,.6)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(244, 88); ctx.lineTo(244, 166); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(239, 88); ctx.lineTo(249, 88); ctx.moveTo(239, 166); ctx.lineTo(249, 166); ctx.stroke();
    ctx.fillStyle = 'rgba(28,28,34,.75)';
    ctx.font = `600 12px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('R40', 236, 127);
    ctx.restore();
  }

  // 想法气泡
  const bp = k17back(k17seg(t, 3.0, 3.65));
  if (bp > 0.01) {
    ctx.save();
    ctx.translate(500, 100);
    ctx.scale(bp, bp);
    ctx.translate(-500, -100);
    ctx.fillStyle = K17_CREAM; ctx.strokeStyle = K17_INK; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.arc(500, 100, 44, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = K17_INK;
    ctx.font = `800 21px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('想法', 500, 101);
    // 小气泡
    for (const [x, y, r] of [[458, 150, 9], [442, 168, 6], [432, 181, 3.6]]) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = K17_CREAM; ctx.fill(); ctx.lineWidth = 3.2; ctx.stroke();
    }
    ctx.restore();
  }

  // 飘浮基本形
  const shapes = [
    [80, 150, 0, 'circle'], [118, 252, 1, 'tri'], [520, 280, 2, 'square'],
  ];
  shapes.forEach((s, i) => {
    const p = k17ease(k17seg(t, 0.8 + i * 0.3, 1.4 + i * 0.3));
    if (p <= 0) return;
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.35 * p;
    ctx.translate(s[0], s[1] + Math.sin(t * 1.7 + i) * 5);
    ctx.rotate(Math.sin(t * 1.1 + i) * 0.14);
    ctx.strokeStyle = [K17_RED, K17_BLUE, K17_YELLOW][i];
    ctx.lineWidth = 4;
    if (s[3] === 'circle') { ctx.beginPath(); ctx.arc(0, 0, 20 * p, 0, Math.PI * 2); ctx.stroke(); }
    else if (s[3] === 'tri') {
      ctx.beginPath(); ctx.moveTo(0, -20 * p); ctx.lineTo(18 * p, 14 * p); ctx.lineTo(-18 * p, 14 * p); ctx.closePath(); ctx.stroke();
    } else {
      ctx.strokeRect(-17 * p, -17 * p, 34 * p, 34 * p);
    }
    ctx.restore();
  });

  // 字幕
  const tp = k17ease(k17seg(t, 3.7, 4.3));
  if (tp > 0) {
    ctx.save();
    ctx.globalAlpha = tp;
    ctx.fillStyle = K17_INK;
    ctx.font = `600 15px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('拼起来，就是一个想法。', 34, 330);
    ctx.restore();
  }

  // 收口
  const fp2 = k17seg(t, 5.72, 5.98);
  if (fp2 > 0) {
    ctx.save(); ctx.globalAlpha = fp2 * 0.5; ctx.fillStyle = K17_CREAM; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

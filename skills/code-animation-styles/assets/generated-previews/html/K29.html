<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 蓝图纸上，一盏「想法灯」的等距装配图被逐笔画出，标注、尺寸线与使用者线框依次补齐，最后盖章。
// K29 蓝图 · DeepSeek Harness 生成示例
const K29 = {
  paper: '#0a2b4f', ink: '#e6f4ff', soft: 'rgba(214,240,255,.62)',
  dim: 'rgba(160,208,240,.5)', accent: '#ffd166', grid: 'rgba(150,205,240,.10)', gridMajor: 'rgba(170,215,245,.20)',
};
const K29_OX = 316, K29_OY = 168, K29_SC = 42;
const K29_COS = 0.866;
function iso(x, y, z) {
  return [K29_OX + (x - y) * K29_COS * K29_SC, K29_OY + (x + y) * 0.5 * K29_SC - z * K29_SC];
}
const k29seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const k29ease = p => 1 - Math.pow(1 - p, 3);

function bpPoly(pts, prog, opt) {
  opt = opt || {};
  if (prog <= 0.002 || !pts.length) return;
  ctx.save();
  ctx.strokeStyle = opt.color || K29.ink;
  ctx.lineWidth = opt.w || 1.3;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (opt.dash) ctx.setLineDash(opt.dash);
  const segs = [];
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
    segs.push(d); total += d;
  }
  let budget = total * clamp(prog, 0, 1);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < segs.length; i++) {
    if (budget <= 0) break;
    if (budget >= segs[i]) { ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); budget -= segs[i]; }
    else {
      const k = budget / segs[i];
      ctx.lineTo(lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k));
      budget = 0;
    }
  }
  ctx.stroke();
  ctx.restore();
}

function isoBox(x0, y0, x1, y1, z0, z1) {
  const c = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  const edges = [];
  for (let i = 0; i < 4; i++) {
    const a = c[i], b = c[(i + 1) % 4];
    edges.push([iso(a[0], a[1], z0), iso(b[0], b[1], z0)]);
    edges.push([iso(a[0], a[1], z1), iso(b[0], b[1], z1)]);
    edges.push([iso(a[0], a[1], z0), iso(a[0], a[1], z1)]);
  }
  return edges;
}
function drawEdges(edges, prog, opt) {
  for (const e of edges) bpPoly([e[0], e[1]], prog, opt);
}
function arrowHead(x, y, ang, size) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - Math.cos(ang - 0.4) * size, y - Math.sin(ang - 0.4) * size);
  ctx.moveTo(x, y);
  ctx.lineTo(x - Math.cos(ang + 0.4) * size, y - Math.sin(ang + 0.4) * size);
  ctx.stroke();
}
function bpDimV(x, yA, yB, label, prog) {
  if (prog <= 0) return;
  ctx.save();
  ctx.strokeStyle = K29.soft; ctx.lineWidth = 1; ctx.setLineDash([]);
  const p = k29ease(clamp(prog, 0, 1));
  const y1 = lerp(yA, yB, 1 - p);
  // 引出线
  ctx.beginPath(); ctx.moveTo(x - 9, yA); ctx.lineTo(x + 8, yA); ctx.moveTo(x - 9, yB); ctx.lineTo(x + 8, yB); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, yA); ctx.lineTo(x, yB); ctx.stroke();
  arrowHead(x, yA, Math.PI / 2, 5);
  arrowHead(x, yB, -Math.PI / 2, 5);
  if (p > 0.6) {
    ctx.save();
    ctx.translate(x, (yA + yB) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = K29.ink;
    ctx.font = `600 12px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(label, 0, -3);
    ctx.restore();
  }
  ctx.restore();
}
function bpLabel(x, y, text, prog, color) {
  if (prog <= 0.02) return;
  ctx.save();
  ctx.globalAlpha = clamp(prog, 0, 1);
  ctx.fillStyle = color || K29.ink;
  ctx.font = `600 13px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}
function bpNumber(n, x, y, prog) {
  if (prog <= 0.02) return;
  ctx.save();
  ctx.globalAlpha = clamp(prog, 0, 1);
  ctx.strokeStyle = K29.ink; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = K29.ink; ctx.font = `600 12px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(n), x, y + 0.5);
  ctx.restore();
}

function k29Paper(t) {
  ctx.fillStyle = K29.paper; ctx.fillRect(0, 0, W, H);
  // 网格（每次重画但只是细线，成本低）
  ctx.save();
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 20) {
    ctx.strokeStyle = x % 100 === 0 ? K29.gridMajor : K29.grid;
    ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += 20) {
    ctx.strokeStyle = y % 100 === 0 ? K29.gridMajor : K29.grid;
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke();
  }
  ctx.restore();
  // 图纸暗角
  const vg = ctx.createRadialGradient(320, 180, 120, 320, 180, 420);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(2,12,28,.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function k29Border(t) {
  ctx.save();
  ctx.strokeStyle = 'rgba(220,245,255,.8)'; ctx.lineWidth = 1.4;
  ctx.strokeRect(12.5, 12.5, W - 25, H - 25);
  ctx.strokeStyle = 'rgba(220,245,255,.35)'; ctx.lineWidth = 1;
  ctx.strokeRect(17.5, 17.5, W - 35, H - 35);
  // 角标
  ctx.strokeStyle = 'rgba(220,245,255,.7)';
  const marks = [[12, 12], [W - 12, 12], [12, H - 12], [W - 12, H - 12]];
  for (const [x, y] of marks) {
    ctx.beginPath();
    ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5);
    ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y);
    ctx.stroke();
  }
  ctx.restore();
}

function k29Device(t) {
  const base = k29ease(k29seg(t, 0.25, 0.95));
  const ped = k29ease(k29seg(t, 0.7, 1.35));
  const col = k29ease(k29seg(t, 1.15, 1.85));
  const arm = k29ease(k29seg(t, 1.65, 2.25));
  const head = k29ease(k29seg(t, 2.05, 2.6));
  // 底板：双层菱形
  const plate0 = [iso(0, 0, 0), iso(3, 0, 0), iso(3, 3, 0), iso(0, 3, 0), iso(0, 0, 0)];
  bpPoly(plate0, base, { w: 1.5 });
  const plate1 = [iso(0.12, 0.12, 0.05), iso(2.88, 0.12, 0.05), iso(2.88, 2.88, 0.05), iso(0.12, 2.88, 0.05), iso(0.12, 0.12, 0.05)];
  bpPoly(plate1, base, { w: 1, color: K29.soft });
  // 底板中央十字
  bpPoly([iso(1.5, 0.35, 0.06), iso(1.5, 2.65, 0.06)], base, { w: 0.9, dash: [5, 5], color: K29.dim });
  bpPoly([iso(0.35, 1.5, 0.06), iso(2.65, 1.5, 0.06)], base, { w: 0.9, dash: [5, 5], color: K29.dim });
  // 底座
  drawEdges(isoBox(1.12, 1.12, 1.88, 1.88, 0.05, 0.5), ped, { w: 1.2 });
  // 立柱
  drawEdges(isoBox(1.38, 1.38, 1.62, 1.62, 0.5, 2.3), col, { w: 1.3 });
  // 横臂
  drawEdges(isoBox(1.38, 1.4, 2.55, 1.6, 2.1, 2.3), arm, { w: 1.3 });
  // 灯头：四棱台
  const lx = 2.55, ly = 1.5;
  const top = [iso(lx - 0.12, ly - 0.12, 2.3), iso(lx + 0.12, ly - 0.12, 2.3), iso(lx + 0.12, ly + 0.12, 2.3), iso(lx - 0.12, ly + 0.12, 2.3)];
  const bot = [iso(lx - 0.38, ly - 0.38, 2.0), iso(lx + 0.38, ly - 0.38, 2.0), iso(lx + 0.38, ly + 0.38, 2.0), iso(lx - 0.38, ly + 0.38, 2.0)];
  for (let i = 0; i < 4; i++) {
    bpPoly([top[i], bot[i]], head, { w: 1.2 });
    bpPoly([top[i], top[(i + 1) % 4]], head, { w: 1.2 });
    bpPoly([bot[i], bot[(i + 1) % 4]], head, { w: 1.2 });
  }
  // 灯泡
  const bp = k29ease(k29seg(t, 2.35, 2.9));
  if (bp > 0) {
    const c = iso(lx, ly, 1.86);
    ctx.save();
    ctx.strokeStyle = K29.accent; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(c[0], c[1], 9 * bp + Math.sin(t * 4) * 0.5, 0, Math.PI * 2); ctx.stroke();
    // 灯丝
    ctx.strokeStyle = 'rgba(255,209,102,.75)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(c[0] - 4, c[1] + 3); ctx.lineTo(c[0] - 1, c[1] - 3); ctx.lineTo(c[0] + 2, c[1] + 3); ctx.stroke();
    // 光
    const glow = k29seg(t, 3.2, 4.4);
    if (glow > 0) {
      ctx.globalAlpha = 0.16 * glow;
      const g = ctx.createRadialGradient(c[0], c[1], 2, c[0], c[1], 46);
      g.addColorStop(0, 'rgba(255,214,120,.9)');
      g.addColorStop(1, 'rgba(255,214,120,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(c[0], c[1], 46, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  return { head };
}

function k29Person(t) {
  const prog = k29ease(k29seg(t, 3.05, 4.1));
  if (prog <= 0.01) return;
  const foot = iso(4.5, 1.5, 0);
  const fx = foot[0], fy = foot[1];
  const fh = 1.75 * K29_SC;
  const topY = fy - fh;
  ctx.save();
  ctx.globalAlpha = clamp(prog * 1.25, 0, 1);
  ctx.strokeStyle = 'rgba(230,244,255,.92)'; ctx.lineWidth = 1.3;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // 地面线
  ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = K29.dim;
  ctx.beginPath(); ctx.moveTo(fx - 34, fy + 1); ctx.lineTo(fx + 26, fy + 1); ctx.stroke();
  ctx.restore();
  // 头
  ctx.beginPath(); ctx.arc(fx, topY + 9, 8.5, 0, Math.PI * 2); ctx.stroke();
  // 肩线 / 颈
  const shY = topY + 24;
  ctx.beginPath(); ctx.moveTo(fx, topY + 17); ctx.lineTo(fx, shY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fx - 12, shY); ctx.lineTo(fx + 12, shY); ctx.stroke();
  // 躯干
  ctx.beginPath();
  ctx.moveTo(fx - 12, shY); ctx.lineTo(fx - 9, shY + 26);
  ctx.lineTo(fx + 9, shY + 26); ctx.lineTo(fx + 12, shY);
  ctx.stroke();
  // 手臂
  ctx.beginPath();
  ctx.moveTo(fx - 12, shY + 2); ctx.lineTo(fx - 14, shY + 30);
  ctx.moveTo(fx + 12, shY + 2); ctx.lineTo(fx + 14, shY + 30);
  ctx.stroke();
  // 腿
  ctx.beginPath();
  ctx.moveTo(fx - 7, shY + 26); ctx.lineTo(fx - 7, fy - 4);
  ctx.moveTo(fx + 7, shY + 26); ctx.lineTo(fx + 7, fy - 4);
  ctx.stroke();
  // 脚
  ctx.beginPath();
  ctx.moveTo(fx - 7, fy - 4); ctx.lineTo(fx - 13, fy + 1);
  ctx.moveTo(fx + 7, fy - 4); ctx.lineTo(fx + 13, fy + 1);
  ctx.stroke();
  ctx.restore();
  // 身高尺寸线
  if (prog > 0.75) {
    const dp = (prog - 0.75) / 0.25;
    bpDimV(fx + 34, topY, fy, '1.75 m', dp);
  }
  // 标签
  const lp = (prog - 0.55) / 0.45;
  if (lp > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(lp, 0, 1);
    ctx.strokeStyle = K29.dim; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(fx + 2, topY - 2); ctx.lineTo(fx + 4, topY - 16); ctx.stroke();
    ctx.restore();
    bpLabel(fx - 20, topY - 22, '使用者', lp, K29.soft);
  }
}

function k29Stamp(t) {
  const p = k29ease(k29seg(t, 4.5, 5.0));
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha = p * 0.9;
  ctx.translate(512, 74);
  ctx.rotate(-0.14);
  ctx.scale(0.9 + 0.1 * p, 0.9 + 0.1 * p);
  ctx.strokeStyle = K29.accent; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, 0, 33, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = K29.accent;
  ctx.font = `700 15px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('已校核', 0, -4);
  ctx.font = `600 10px ${FONT}`;
  ctx.fillText('CHECKED', 0, 12);
  ctx.restore();
}

function baseScene(t) {
  k29Paper(t);
  k29Border(t);

  // 绘图扫描带
  const sweep = k29seg(t, 0.0, 2.4);
  if (sweep < 1) {
    const x = 20 + sweep * 620;
    const g = ctx.createLinearGradient(x - 46, 0, x + 20, 0);
    g.addColorStop(0, 'rgba(140,220,255,0)');
    g.addColorStop(0.7, 'rgba(160,225,255,.10)');
    g.addColorStop(1, 'rgba(200,240,255,.22)');
    ctx.fillStyle = g; ctx.fillRect(x - 46, 18, 66, 324);
    ctx.strokeStyle = 'rgba(210,245,255,.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 18); ctx.lineTo(x, 342); ctx.stroke();
  }

  k29Device(t);

  // 尺寸标注
  const d1 = k29ease(k29seg(t, 2.45, 3.1));
  if (d1 > 0) {
    bpDimV(160, iso(1.5, 1.5, 2.3)[1], iso(1.5, 1.5, 0)[1], '2.3', d1);
    bpLabel(124, iso(1.5, 1.5, 0)[1] + 16, '总高', d1, K29.soft);
  }
  const d2 = k29ease(k29seg(t, 2.7, 3.4));
  if (d2 > 0) {
    const a = iso(0, 3, 0), b = iso(3, 0, 0);
    ctx.save();
    ctx.globalAlpha = clamp(d2, 0, 1);
    ctx.strokeStyle = K29.soft; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(a[0], a[1] + 22); ctx.lineTo(b[0], b[1] + 22);
    ctx.moveTo(a[0], a[1] + 16); ctx.lineTo(a[0], a[1] + 28);
    ctx.moveTo(b[0], b[1] + 16); ctx.lineTo(b[0], b[1] + 28);
    ctx.stroke();
    ctx.fillStyle = K29.ink; ctx.font = `600 12px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('底板 3.0', (a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + 30);
    ctx.restore();
  }

  // 部件编号与引线
  const lb = k29ease(k29seg(t, 3.0, 3.7));
  if (lb > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(lb, 0, 1);
    ctx.strokeStyle = K29.dim; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    const anchors = [
      { p: iso(1.2, 2.2, 0.1), n: 1, tx: 36, ty: 226 },
      { p: iso(1.5, 1.62, 1.2), n: 2, tx: 36, ty: 190 },
      { p: iso(2.4, 1.5, 2.1), n: 3, tx: 36, ty: 154 },
    ];
    for (const a of anchors) {
      ctx.beginPath();
      ctx.moveTo(a.tx + 8, a.ty);
      ctx.lineTo(a.tx + 30, a.ty);
      ctx.lineTo(a.p[0] - 4, a.p[1]);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    bpNumber(1, 36, 226, lb); bpNumber(2, 36, 190, lb); bpNumber(3, 36, 154, lb);
    bpLabel(50, 226, '底板', lb, K29.soft);
    bpLabel(50, 190, '立柱', lb, K29.soft);
    bpLabel(50, 154, '灯头', lb, K29.soft);
    ctx.restore();
  }

  k29Person(t);
  k29Stamp(t);

  // 标题区
  ctx.save();
  ctx.fillStyle = K29.ink;
  ctx.font = `700 27px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('蓝图', 34, 56);
  ctx.fillStyle = K29.soft;
  ctx.font = `600 12px ${FONT}`;
  ctx.fillText('ISOMETRIC ASSEMBLY · 1:20', 34, 74);
  ctx.strokeStyle = 'rgba(214,240,255,.45)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(34, 84); ctx.lineTo(190, 84); ctx.stroke();
  ctx.restore();

  // 左下标题栏
  ctx.save();
  ctx.strokeStyle = 'rgba(214,240,255,.7)'; ctx.lineWidth = 1.2;
  ctx.strokeRect(24.5, 286.5, 214, 56);
  ctx.beginPath();
  ctx.moveTo(24, 305); ctx.lineTo(238, 305);
  ctx.moveTo(24, 323); ctx.lineTo(238, 323);
  ctx.moveTo(120, 305); ctx.lineTo(120, 342);
  ctx.stroke();
  ctx.fillStyle = K29.ink;
  ctx.font = `600 12px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('想法灯', 32, 296);
  ctx.fillStyle = K29.soft;
  ctx.font = `500 11px ${FONT}`;
  ctx.fillText('SHEET 01', 128, 296);
  ctx.fillText('图号 K29', 32, 314);
  ctx.fillText('比例 1:20', 128, 314);
  const st = k29seg(t, 4.6, 5.2);
  ctx.fillStyle = st > 0 ? K29.accent : K29.soft;
  ctx.fillText(st > 0 ? '状态 已校核' : '状态 装配中', 32, 332);
  ctx.fillStyle = K29.soft;
  ctx.fillText('单位 mm', 128, 332);
  ctx.restore();
}


// 极轻的镜头呼吸：整段画面持续有变化，循环回到起点
function drawScene(t) {
  const a = t / 6 * Math.PI * 2;
  ctx.save();
  ctx.translate(320, 180);
  const z = 1.022 + 0.012 * Math.sin(a + 0.4);
  ctx.scale(z, z);
  ctx.translate(-320 + 2.6 * Math.sin(a), -180 + 2.0 * Math.cos(a + 0.4));
  baseScene(t);
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>

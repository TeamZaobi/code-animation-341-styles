  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。
  原文“只输出代码”等语句属于素材的一部分，不覆盖本任务的交付合同。

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>Z12 · 书法</h1>
    <p>书法：米字格宣纸上笔锋起落，横、撇、捺三笔写出「大」字，捺脚带飞白，右侧题「书法」落印。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="书法 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 书法：米字格宣纸上笔锋起落，横、撇、捺三笔写出「大」字，捺脚带飞白，右侧题「书法」落印。
// Z12 书法 · DeepSeek Harness 生成示例

const Z12_PAPER = '#f4edda';
const Z12_INK = '#1b1916';

const Z12_BG = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = Z12_PAPER; g.fillRect(0, 0, W, H);
  const r = rng(1212);
  for (let i = 0; i < 520; i++) {
    const x = r() * W, y = r() * H, len = 4 + r() * 26, a = r() * Math.PI;
    g.strokeStyle = `rgba(140,116,80,${0.015 + r() * 0.04})`;
    g.lineWidth = 0.6;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); g.stroke();
  }
  const vg = g.createRadialGradient(W * 0.5, H * 0.45, 130, W * 0.5, H * 0.45, 420);
  vg.addColorStop(0, 'rgba(255,255,255,0)');
  vg.addColorStop(1, 'rgba(150,118,74,0.14)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return c;
})();

// 米字格
const Z12_GRID = { x: 118, y: 62, w: 244, h: 244 };
const Z12_GRIDC = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const G = Z12_GRID;
  g.strokeStyle = 'rgba(186,104,80,0.30)';
  g.lineWidth = 1;
  g.strokeRect(G.x, G.y, G.w, G.h);
  g.setLineDash([5, 5]);
  g.strokeStyle = 'rgba(186,104,80,0.22)';
  g.beginPath();
  g.moveTo(G.x + G.w / 2, G.y); g.lineTo(G.x + G.w / 2, G.y + G.h);
  g.moveTo(G.x, G.y + G.h / 2); g.lineTo(G.x + G.w, G.y + G.h / 2);
  g.moveTo(G.x, G.y); g.lineTo(G.x + G.w, G.y + G.h);
  g.moveTo(G.x + G.w, G.y); g.lineTo(G.x, G.y + G.h);
  g.stroke();
  return c;
})();

const Z12_CX = 240, Z12_CY = 184;

function z12seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

function z12quadPts(p0, pc, p1, n) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, v = 1 - u;
    out.push([
      v * v * p0[0] + 2 * v * u * pc[0] + u * u * p1[0],
      v * v * p0[1] + 2 * v * u * pc[1] + u * u * p1[1],
    ]);
  }
  return out;
}

// 笔画：宽度剖面 + 飞白 + 边缘积墨
function z12stroke(pts, p, wFn, dry) {
  if (p <= 0.005) return;
  const n = pts.length - 1;
  const np = Math.max(2, Math.round(p * n));
  const L = [], R = [];
  for (let i = 0; i <= np; i++) {
    const u = i / n;
    const [x, y] = pts[i];
    const [x2, y2] = pts[Math.min(i + 1, n)];
    const [x0, y0] = pts[Math.max(i - 1, 0)];
    let dx = x2 - x0, dy = y2 - y0;
    const dl = Math.hypot(dx, dy) || 1;
    dx /= dl; dy /= dl;
    const nx = -dy, ny = dx;
    const hw = wFn(u) * 0.5;
    L.push([x + nx * hw, y + ny * hw]);
    R.push([x - nx * hw, y - ny * hw]);
  }
  ctx.save();
  ctx.fillStyle = 'rgba(27,25,22,0.94)';
  ctx.beginPath();
  ctx.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < L.length; i++) ctx.lineTo(L[i][0], L[i][1]);
  for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
  ctx.closePath();
  ctx.fill();
  // 边缘稍浓
  ctx.strokeStyle = 'rgba(18,16,14,0.5)';
  ctx.lineWidth = 0.8;
  ctx.stroke();
  // 飞白：收笔处刷出纸色细缝
  if (dry && p > 0.55) {
    const r = rng(1771);
    ctx.strokeStyle = 'rgba(244,237,218,0.75)';
    for (let k = 0; k < 9; k++) {
      const start = 0.62 + r() * 0.3;
      const a = Math.round(start * np);
      if (a >= np - 2) continue;
      ctx.lineWidth = 0.6 + r() * 1.2;
      ctx.beginPath();
      ctx.moveTo((L[a][0] + R[a][0]) / 2, (L[a][1] + R[a][1]) / 2);
      for (let i = a; i <= np; i++) {
        const f = (i - a) / (np - a);
        ctx.lineTo((L[i][0] + R[i][0]) / 2 + (L[i][0] - R[i][0]) * 0.12 * (r() - 0.5),
          (L[i][1] + R[i][1]) / 2 + (L[i][1] - R[i][1]) * 0.12 * (r() - 0.5));
      }
      ctx.stroke();
    }
  }
  ctx.restore();
}

// 笔：杆 + 笔肚 + 笔锋
function z12brush(x, y, ang, lift, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(s, s);
  ctx.translate(0, -lift);
  // 杆
  ctx.strokeStyle = '#6d4a2c';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(6, 4); ctx.lineTo(56, -64); ctx.stroke();
  ctx.strokeStyle = 'rgba(226,214,188,0.9)';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(7, 2); ctx.lineTo(54, -60); ctx.stroke();
  // 笔肚
  ctx.fillStyle = '#2c241c';
  ctx.beginPath();
  ctx.moveTo(2, 2);
  ctx.quadraticCurveTo(-10, 8, -13, 16);
  ctx.quadraticCurveTo(-4, 14, 2, 8);
  ctx.closePath();
  ctx.fill();
  // 笔锋
  ctx.beginPath();
  ctx.moveTo(-12, 15);
  ctx.quadraticCurveTo(-16, 24, -6, 30);
  ctx.quadraticCurveTo(2, 22, 1, 10);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

const Z12_STROKES = [
  { // 横
    pts: z12quadPts([Z12_CX - 78, Z12_CY - 56], [Z12_CX + 4, Z12_CY - 70], [Z12_CX + 82, Z12_CY - 60], 40),
    w: u => 6.5 + 10 * Math.pow(Math.sin(Math.PI * Math.min(1, u * 0.9 + 0.05)), 0.5) + (u > 0.9 ? 7 * (u - 0.9) / 0.1 : 0),
    t0: -0.25, t1: 1.5, dry: false,
  },
  { // 撇
    pts: z12quadPts([Z12_CX + 8, Z12_CY - 54], [Z12_CX - 26, Z12_CY + 18], [Z12_CX - 78, Z12_CY + 80], 40),
    w: u => 14 * (1 - 0.82 * Math.pow(u, 0.8)) + 2.4,
    t0: 1.55, t1: 2.95, dry: true,
  },
  { // 捺
    pts: z12quadPts([Z12_CX - 2, Z12_CY - 50], [Z12_CX + 30, Z12_CY + 14], [Z12_CX + 84, Z12_CY + 76], 40),
    w: u => {
      if (u < 0.6) return 6 + 13 * Math.pow(u / 0.6, 0.85);
      return 19 * Math.pow(1 - (u - 0.6) / 0.4, 1.35) + 2.2;
    },
    t0: 2.9, t1: 4.45, dry: true,
  },
];

function drawScene(t) {
  ctx.drawImage(Z12_BG, 0, 0);
  ctx.drawImage(Z12_GRIDC, 0, 0);

  let activeBrush = null;
  Z12_STROKES.forEach((S, si) => {
    const p = z12seg(t, S.t0, S.t1);
    if (p <= 0) return;
    z12stroke(S.pts, p, S.w, S.dry && p > 0.55);
    // 起笔墨点
    if (p < 0.16) {
      ctx.save();
      ctx.globalAlpha = (1 - p / 0.16) * 0.5;
      ctx.fillStyle = 'rgba(27,25,22,0.7)';
      ctx.beginPath();
      ctx.ellipse(S.pts[0][0], S.pts[0][1], 7, 5, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    if (p < 1) {
      const idx = Math.min(S.pts.length - 1, Math.max(1, Math.round(p * (S.pts.length - 1))));
      const [bx, by] = S.pts[idx];
      const [ax, ay] = S.pts[Math.max(0, idx - 2)];
      const ang = Math.atan2(by - ay, bx - ax) - Math.PI * 0.5;
      activeBrush = { x: bx, y: by, ang, lift: 0, s: 1 };
    }
  });

  if (activeBrush) z12brush(activeBrush.x, activeBrush.y, activeBrush.ang, 0, 1);
  else if (t > 4.5) {
    // 写完之后笔还悬在纸上，轻轻起伏
    const hover = 6 + Math.sin(t * 1.4) * 3;
    const hx = Z12_CX + 92 + Math.sin(t * 0.8) * 3;
    const hy = Z12_CY + 78 + Math.cos(t * 1.1) * 2;
    z12brush(hx, hy, -0.6 + Math.sin(t * 0.9) * 0.05, hover, 1);
  }

  // 题字
  const tp = z12seg(t, 4.35, 5.0);
  if (tp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(tp);
    ctx.fillStyle = 'rgba(27,25,22,0.9)';
    ctx.font = `400 30px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('书', 572, 78);
    ctx.fillText('法', 572, 116);
    ctx.font = `400 14px ${FONT}`;
    ctx.fillStyle = 'rgba(27,25,22,0.8)';
    ctx.fillText('一笔一画', 572, 156);
    ctx.restore();
  }
  // 小字落款
  const sp = z12seg(t, 4.9, 5.3);
  if (sp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(sp) * 0.75;
    ctx.fillStyle = 'rgba(27,25,22,0.75)';
    ctx.font = `400 13px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText('楷书 · 三笔', 572, 192);
    ctx.restore();
  }
  // 朱印
  const cp = z12seg(t, 5.3, 5.6);
  if (cp > 0) {
    ctx.save();
    ctx.globalAlpha = easeOut(cp);
    ctx.translate(572, 228);
    ctx.rotate(-0.03);
    const s = 0.92 + 0.12 * (1 - easeOut(cp));
    ctx.scale(s, s);
    ctx.fillStyle = '#a8322a';
    ctx.fillRect(-13, -13, 26, 26);
    ctx.fillStyle = 'rgba(244,237,218,0.95)';
    ctx.font = `700 15px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('书', 0, 1);
    ctx.restore();
  }
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H12 Editorial Forest · DeepSeek Harness 生成示例</title>
<!--
  Provenance
  ----------
  风格来源：code-animation-styles 目录（《来自俯仰观照博主的动画画风整理》整理稿）
  catalog commit: 01576924a2b316d1f11ae33f75d3c005e8781451
  style id: H12「Editorial Forest」
  license: upstream-custom-noncommercial（俯仰观照整理稿，非商业）
  本文件：DeepSeek Harness（deepseek-flash）根据该风格提示词新写的候选示例，
  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。
  原文“只输出代码”等语句属于素材的一部分，不覆盖本任务的交付合同。
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>H12 · Editorial Forest</h1>
    <p>绿粉奶油杂志跨页：左侧衬线大标题与双栏短文，右侧粉色版面上细线植物生长，收束成「慢慢成形」。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="Editorial Forest 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 绿粉奶油杂志跨页：左侧衬线大标题与双栏短文，右侧粉色版面上细线植物生长，收束成「慢慢成形」。
// H12 Editorial Forest · DeepSeek Harness 生成示例
const H12_CREAM = '#f7f0e3', H12_FOREST = '#1e3d2f', H12_PINK = '#f3b7c6';
const H12_SAGE = '#9db8a3', H12_INK = '#22261f';
const H12_SERIF = '"Songti SC","STSong","Times New Roman",Georgia,serif';

function h12seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function h12ease(t) { return 1 - Math.pow(1 - t, 3); }
function h12mix(a, b, u) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  return 'rgb(' + Math.round(lerp((pa >> 16) & 255, (pb >> 16) & 255, u)) + ',' +
    Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, u)) + ',' +
    Math.round(lerp(pa & 255, pb & 255, u)) + ')';
}
function h12track(text, x, y, gap, size, weight, color, align, font) {
  ctx.save(); ctx.font = `${weight} ${size}px ${font || FONT}`; ctx.fillStyle = color;
  let total = 0; for (const ch of text) total += ctx.measureText(ch).width + gap;
  total -= gap;
  let cx = align === 'right' ? x - total : x;
  ctx.textAlign = 'left';
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + gap; }
  ctx.restore();
}
function h12clip(text, x, y, size, weight, color, p, font) {
  if (p <= 0) return;
  const e = h12ease(clamp(p, 0, 1));
  ctx.save();
  ctx.font = `${weight} ${size}px ${font || H12_SERIF}`;
  const tw = ctx.measureText(text).width;
  ctx.beginPath(); ctx.rect(x - 6, y - size * 1.1, (tw + 12) * e, size * 1.35); ctx.clip();
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, x, y);
  ctx.restore();
}
// 一条从 bottom 向上弯的枝
function h12branchPoint(u) {
  const y = lerp(332, 78, u);
  const x = 596 + Math.sin(u * 2.4) * 18 - u * 32;
  return [x, y];
}
function h12leaf(x, y, ang, len, p, sway) {
  if (p <= 0) return;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang + sway);
  ctx.scale(p, p);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.45, -len * 0.3, len, 0);
  ctx.quadraticCurveTo(len * 0.5, len * 0.24, 0, 0);
  ctx.fillStyle = 'rgba(157,184,163,.55)'; ctx.fill();
  ctx.strokeStyle = H12_FOREST; ctx.lineWidth = 1.2; ctx.stroke();
  // 叶脉
  ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(len * 0.9, 0); ctx.strokeStyle = 'rgba(30,61,47,.6)'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.restore();
}

function drawScene(t) {
  const bu = 0.5 - 0.5 * Math.cos(t * Math.PI * 2 / 6);
  ctx.fillStyle = h12mix(H12_CREAM, '#eedfcb', bu); ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(Math.sin(t * 0.65) * 1.6, Math.cos(t * 0.5) * 1.2);

  // 右侧粉色版面：从上落下展开
  const panelP = h12ease(h12seg(t, -0.35, 0.75));
  if (panelP > 0) {
    ctx.save();
    ctx.beginPath(); ctx.rect(400, 0, 240, 360 * panelP); ctx.clip();
    ctx.fillStyle = h12mix(H12_PINK, '#edaec0', bu); ctx.fillRect(400, 0, 240, 360);
    // 版面上极淡的竖条
    ctx.fillStyle = 'rgba(30,61,47,.05)';
    for (let i = 0; i < 4; i++) ctx.fillRect(424 + i * 52, 0, 1, 360);
    ctx.restore();
    // 版面左缘细线
    ctx.save(); ctx.strokeStyle = H12_FOREST; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(400, 0); ctx.lineTo(400, 360); ctx.stroke(); ctx.restore();
  }

  // 页眉
  h12track('EDITORIAL FOREST — 12', 40, 34, 2, 9.5, 700, H12_FOREST);
  h12track('慢慢长出来', 360, 34, 1.6, 9, 600, 'rgba(34,38,31,.6)', 'right');
  const rp = h12ease(h12seg(t, -0.1, 0.5));
  if (rp > 0) {
    ctx.save(); ctx.strokeStyle = H12_FOREST; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(40, 44); ctx.lineTo(40 + 320 * rp, 44); ctx.stroke(); ctx.restore();
  }

  // 左页眉小字
  h12track('封面专题  /  冬', 40, 76, 1.8, 9, 700, '#b06d80');

  // 标题
  h12clip('在深处', 40, 138, 46, 700, H12_FOREST, 0.62 + 0.38 * h12seg(t, -0.2, 0.5));
  h12clip('长出来', 40, 190, 46, 700, H12_FOREST, 0.35 + 0.65 * h12seg(t, 0.05, 0.75));
  // 标题右侧细线
  h12track('NO.12', 368, 190, 1.6, 9, 700, 'rgba(30,61,47,.5)', 'right');

  // 副题
  const sp = h12seg(t, 0.7, 1.25);
  if (sp > 0) {
    ctx.save(); ctx.globalAlpha = h12ease(sp);
    ctx.fillStyle = 'rgba(34,38,31,.75)'; ctx.font = `italic 400 14px ${H12_SERIF}`; ctx.textAlign = 'left';
    ctx.fillText('a quiet editorial about growing', 40, 214);
    ctx.restore();
  }

  // 双栏正文
  const cols = [
    { x: 40, lines: ['先让念头', '在土里待一会儿。', '不急着解释，', '也不急着成形。'] },
    { x: 210, lines: ['等它自己', '冒出一点绿。', '再顺着光，', '把轮廓长开。'] },
  ];
  // 两栏之间的细线
  const lp = h12ease(h12seg(t, 0.85, 1.4));
  if (lp > 0) {
    ctx.save(); ctx.strokeStyle = 'rgba(30,61,47,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(196, 230); ctx.lineTo(196, 230 + 78 * lp); ctx.stroke(); ctx.restore();
  }
  cols.forEach((col, ci) => {
    col.lines.forEach((s, i) => {
      const p = h12ease(h12seg(t, 0.95 + ci * 0.12 + i * 0.16, 1.5 + ci * 0.12 + i * 0.16));
      if (p <= 0) return;
      ctx.save(); ctx.globalAlpha = p;
      ctx.fillStyle = H12_INK; ctx.font = `400 13px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      const y = 242 + i * 20;
      ctx.fillText(s, col.x, y + (1 - p) * 4);
      ctx.restore();
    });
  });
  // 首字粉色强调
  const fp = h12seg(t, 1.0, 1.5);
  if (fp > 0) {
    ctx.save(); ctx.globalAlpha = h12ease(fp);
    ctx.fillStyle = '#c46f85'; ctx.font = `700 13px ${H12_SERIF}`; ctx.textAlign = 'left';
    ctx.fillText('先', 40, 242);
    ctx.restore();
  }

  // 左页脚
  h12track('第 12 期 · 森林刊', 40, 330, 1.2, 8, 600, 'rgba(34,38,31,.55)');
  h12track('640 × 360', 360, 330, 1.2, 8, 600, 'rgba(34,38,31,.4)', 'right');

  // 粉色版面内：页眉与植物
  const ip = h12seg(t, 0.8, 1.4);
  if (ip > 0) {
    ctx.save(); ctx.globalAlpha = h12ease(ip);
    h12track('FIELD NOTES / 12', 432, 34, 1.8, 9, 700, 'rgba(30,61,47,.8)');
    ctx.strokeStyle = 'rgba(30,61,47,.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(432, 44); ctx.lineTo(608, 44); ctx.stroke();
    ctx.restore();
  }
  // 植物枝干：逐段生长
  const bp = h12ease(h12seg(t, 0.9, 4.4));
  if (bp > 0) {
    ctx.save();
    ctx.strokeStyle = H12_FOREST; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath();
    const N = 60;
    for (let i = 0; i <= N * bp; i++) {
      const u = i / N;
      const [x, y] = h12branchPoint(u);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
    // 叶子：随着枝干依次长出
    const leaves = [
      [0.2, -0.9, 30, 1], [0.34, 0.75, 27, -1], [0.47, -1.05, 32, 1],
      [0.6, 0.8, 26, -1], [0.72, -0.85, 28, 1], [0.84, 0.7, 24, -1], [0.93, -0.6, 20, 1],
    ];
    leaves.forEach(([u, ang, len, dir], i) => {
      const lp2 = h12ease(h12seg(t, 1.2 + u * 2.8, 1.55 + u * 2.8));
      if (lp2 <= 0) return;
      const [x, y] = h12branchPoint(u);
      const sway = Math.sin(t * 1.1 + i * 1.7) * 0.035;
      h12leaf(x + dir * 2, y, ang, len, lp2, sway);
    });
    // 枝顶的小芽
    const tipP = h12ease(h12seg(t, 4.2, 4.6));
    if (tipP > 0) {
      const [tx, ty] = h12branchPoint(1);
      ctx.save(); ctx.globalAlpha = tipP;
      ctx.fillStyle = H12_SAGE; ctx.strokeStyle = H12_FOREST; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(tx + 2, ty - 6, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  // 粉色版面底部题字
  const capP = h12seg(t, 2.3, 2.95);
  if (capP > 0) {
    ctx.save(); ctx.globalAlpha = h12ease(capP);
    ctx.fillStyle = H12_FOREST; ctx.font = `400 20px ${H12_SERIF}`; ctx.textAlign = 'left';
    ctx.fillText('像植物一样，', 432, 296);
    ctx.fillText('慢慢成形。', 432, 320);
    ctx.strokeStyle = 'rgba(30,61,47,.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(432, 330); ctx.lineTo(432 + 92 * h12ease(capP), 330); ctx.stroke();
    ctx.restore();
  }
  // 版面内漂浮的孢子点
  ctx.save();
  for (let i = 0; i < 7; i++) {
    const x = 446 + (i * 37) % 150 + Math.sin(t * 0.6 + i) * 6;
    const y = 70 + (i * 53) % 180 + Math.cos(t * 0.45 + i) * 5;
    ctx.globalAlpha = 0.25 + 0.2 * Math.sin(t + i);
    ctx.fillStyle = H12_CREAM;
    ctx.beginPath(); ctx.arc(x, y, 1.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>V7 · 贴纸讲解</h1>
    <p>贴纸讲解：超宽画布上，粗白描边的水滴、分子与 71% 圆环被镜头平移缩放串起来，配数字滚动与水平对比条。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="贴纸讲解 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：MIT（mg-styles-15，Copyright (c) 2026 Vincentwei1021） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 贴纸讲解：超宽画布上，粗白描边的水滴、分子与 71% 圆环被镜头平移缩放串起来，配数字滚动与水平对比条。
// V7 贴纸讲解 · DeepSeek Harness 生成示例
const V7_BG = '#EEF0F2', V7_INK = '#26405C', V7_BLUE = '#4A90C2';
const V7_CREAM = '#FAF7EC', V7_YELLOW = '#F2C14E', V7_CORAL = '#E8735A';

function v7seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function v7ease(p) { return p * p * (3 - 2 * p); }
function v7out(p) { return 1 - Math.pow(1 - p, 3); }

// 半调网点贴图（预计算一次）
const V7_HALFTONE = (() => {
  const c = document.createElement('canvas'); c.width = 12; c.height = 12;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,.20)';
  g.beginPath(); g.arc(3, 3, 1.7, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(9, 9, 1.7, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(0,0,0,.06)';
  g.beginPath(); g.arc(9, 3, 1.2, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(3, 9, 1.2, 0, Math.PI * 2); g.fill();
  return c;
})();
let V7_PAT = null;

// 贴纸：先描粗白边（带投影）再填色，做出「剪下来贴上去」的厚度
function v7Sticker(pathFn, fill, edge) {
  const w = edge === undefined ? 11 : edge;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.save();
  ctx.shadowColor = 'rgba(32,52,76,.28)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 7;
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = w * 2;
  ctx.beginPath(); pathFn(); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = w * 2;
  ctx.beginPath(); pathFn(); ctx.stroke();
  ctx.fillStyle = fill;
  ctx.beginPath(); pathFn(); ctx.fill();
  if (V7_PAT) {
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = V7_PAT;
    ctx.beginPath(); pathFn(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function v7DropPath(cx, cy, r) {
  ctx.moveTo(cx, cy - r * 1.12);
  ctx.bezierCurveTo(cx + r * 0.62, cy - r * 0.3, cx + r, cy + r * 0.16, cx + r, cy + r * 0.4);
  ctx.bezierCurveTo(cx + r, cy + r * 0.92, cx + r * 0.55, cy + r * 1.14, cx, cy + r * 1.14);
  ctx.bezierCurveTo(cx - r * 0.55, cy + r * 1.14, cx - r, cy + r * 0.92, cx - r, cy + r * 0.4);
  ctx.bezierCurveTo(cx - r, cy + r * 0.16, cx - r * 0.62, cy - r * 0.3, cx, cy - r * 1.12);
  ctx.closePath();
}

function v7Molecule(cx, cy, p) {
  const R = 50, r = 28;
  const g1 = [cx - 80, cy + 40], g2 = [cx + 80, cy + 40];
  ctx.save();
  ctx.globalAlpha = clamp(p * 2, 0, 1);
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 18; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy + 6); ctx.lineTo(g1[0], g1[1]); ctx.moveTo(cx, cy + 6); ctx.lineTo(g2[0], g2[1]); ctx.stroke();
  ctx.strokeStyle = '#9FB4C6'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(cx, cy + 6); ctx.lineTo(g1[0], g1[1]); ctx.moveTo(cx, cy + 6); ctx.lineTo(g2[0], g2[1]); ctx.stroke();
  [[g1, 'H'], [g2, 'H']].forEach(([g, lab]) => {
    v7Sticker(() => { ctx.arc(g[0], g[1], r, 0, Math.PI * 2); }, V7_CREAM, 9);
    ctx.fillStyle = V7_INK; ctx.font = `700 24px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(lab, g[0], g[1] + 1);
  });
  v7Sticker(() => { ctx.arc(cx, cy, R, 0, Math.PI * 2); }, V7_BLUE, 11);
  ctx.fillStyle = '#FFFFFF'; ctx.font = `700 38px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('O', cx, cy + 2);
  ctx.restore();
}

function drawScene(t) {
  if (!V7_PAT) V7_PAT = ctx.createPattern(V7_HALFTONE, 'repeat');
  ctx.fillStyle = V7_BG; ctx.fillRect(0, 0, W, H);

  // 镜头关键帧：平移 + 缩放串起三个信息点，最后一秒拉远成整版
  const keys = [
    { t: 0.0, x: 336, y: 400, z: 1.00 },
    { t: 1.40, x: 400, y: 396, z: 0.94 },
    { t: 2.20, x: 806, y: 392, z: 0.90 },
    { t: 3.40, x: 840, y: 390, z: 0.94 },
    { t: 4.20, x: 1196, y: 380, z: 0.90 },
    { t: 5.15, x: 1224, y: 378, z: 0.94 },
    { t: 5.85, x: 770, y: 392, z: 0.56 },
  ];
  let k = 0;
  for (let i = 0; i < keys.length; i++) if (t >= keys[i].t) k = i;
  const a = keys[k], b = keys[Math.min(keys.length - 1, k + 1)];
  const cp = k >= keys.length - 1 ? 1 : v7ease(clamp((t - a.t) / Math.max(0.001, b.t - a.t), 0, 1));
  const camX = lerp(a.x, b.x, cp), camY = lerp(a.y, b.y, cp), camZ = lerp(a.z, b.z, cp);

  ctx.save();
  ctx.translate(320, 180);
  ctx.scale(camZ, camZ);
  ctx.translate(-camX, -camY);

  // 大画布
  ctx.fillStyle = V7_CREAM;
  ctx.fillRect(-100, -80, 1720, 980);
  ctx.save();
  ctx.fillStyle = 'rgba(38,64,92,.10)';
  for (let x = -80; x < 1620; x += 26) for (let y = -60; y < 880; y += 26) ctx.fillRect(x, y, 1.7, 1.7);
  ctx.restore();

  // 顶部标题带
  ctx.save();
  ctx.fillStyle = V7_INK;
  ctx.fillRect(-100, -80, 1720, 46);
  ctx.fillStyle = V7_CREAM;
  ctx.font = `700 18px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('一滴水里有什么', 18, -57);
  ctx.fillStyle = 'rgba(250,247,236,.55)';
  ctx.font = `500 12px ${FONT}`;
  ctx.fillText('STICKER EXPLAINER  /  NO.07', 216, -56);
  ctx.restore();

  // 虚线连接三个信息点
  ctx.save();
  ctx.strokeStyle = 'rgba(38,64,92,.32)'; ctx.lineWidth = 2.4; ctx.setLineDash([7, 9]);
  ctx.beginPath(); ctx.moveTo(452, 404); ctx.lineTo(660, 400); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(930, 396); ctx.lineTo(1058, 392); ctx.stroke();
  ctx.restore();

  /* ---- 信息点 1：大水滴贴纸 ---- */
  if (t < 2.7) {
    const p = v7out(v7seg(t, -0.55, 0.35)) * (1 - v7seg(t, 2.35, 2.7));
    const bob = Math.sin(t * 1.6) * 5;
    ctx.save();
    ctx.globalAlpha = p;
    ctx.translate(0, (1 - p) * 22);
    v7Sticker(() => v7DropPath(330, 398 + bob, 108), V7_BLUE, 13);
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.ellipse(296, 372 + bob, 21, 36, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = V7_INK;
    ctx.font = `700 26px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('一滴水', 470, 318);
    ctx.font = `500 17px ${FONT}`;
    ctx.fillStyle = 'rgba(38,64,92,.72)';
    ctx.fillText('大约 1.5 万亿亿个水分子', 470, 346);
    ctx.strokeStyle = V7_CORAL; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(462, 310); ctx.quadraticCurveTo(430, 318, 418, 352); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(418, 352); ctx.lineTo(424, 336); ctx.moveTo(418, 352); ctx.lineTo(435, 347); ctx.stroke();
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = V7_YELLOW;
    ctx.fillRect(466, 326, 196 * v7out(v7seg(t, 0.55, 1.15)), 8);
    ctx.restore();
    ctx.restore();
  }

  /* ---- 信息点 2：分子贴纸 ---- */
  {
    const p = v7out(v7seg(t, 1.95, 2.7)) * (1 - v7seg(t, 3.95, 4.35));
    if (p > 0) {
      ctx.save();
      ctx.globalAlpha = p;
      v7Molecule(800, 372, v7seg(t, 2.05, 2.6));
      ctx.fillStyle = V7_INK;
      ctx.font = `700 26px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('两个氢，一个氧', 800, 510);
      ctx.font = `500 17px ${FONT}`;
      ctx.fillStyle = 'rgba(38,64,92,.72)';
      ctx.fillText('H₂O —— 就这么简单', 800, 538);
      ctx.restore();
    }
  }

  /* ---- 信息点 3：71% 圆环 + 数字滚动 + 对比条 ---- */
  {
    const p = v7out(v7seg(t, 3.75, 4.5));
    if (p > 0) {
      ctx.save();
      ctx.globalAlpha = p;
      const cx = 1188, cy = 352, R = 92;
      const ring = v7out(v7seg(t, 4.15, 5.1));
      ctx.save();
      ctx.lineWidth = 28; ctx.lineCap = 'butt';
      ctx.strokeStyle = 'rgba(38,64,92,.12)';
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = V7_BLUE;
      ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * 0.71 * ring); ctx.stroke();
      ctx.lineWidth = 8; ctx.strokeStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(cx, cy, R + 14, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, R - 14, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      const val = Math.round(71 * v7out(v7seg(t, 4.2, 5.05)));
      ctx.fillStyle = V7_INK;
      ctx.font = `800 52px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(val + '%', cx, cy - 2);
      ctx.font = `500 15px ${FONT}`;
      ctx.fillStyle = 'rgba(38,64,92,.66)';
      ctx.fillText('地表被水覆盖', cx, cy + 38);
      const bx = 1030, by = 486;
      ctx.fillStyle = 'rgba(38,64,92,.10)';
      ctx.fillRect(bx, by, 316, 24);
      ctx.fillStyle = V7_BLUE;
      ctx.fillRect(bx, by, 316 * 0.71 * v7out(v7seg(t, 4.35, 5.05)), 24);
      ctx.fillStyle = V7_INK; ctx.font = `600 14px ${FONT}`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('水 71%', bx, by + 46);
      ctx.textAlign = 'right';
      ctx.fillText('陆地 29%', bx + 316, by + 46);
      ctx.restore();
    }
  }

  // 胶带装饰
  ctx.save();
  ctx.globalAlpha = 0.85;
  [[600, 214, -0.32], [1030, 250, 0.22], [1460, 360, -0.18]].forEach(([x, y, r]) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(r);
    ctx.fillStyle = 'rgba(242,193,78,.62)';
    ctx.fillRect(-42, -12, 84, 24);
    ctx.restore();
  });
  ctx.restore();

  ctx.restore(); // 结束镜头

  /* ---- 屏幕空间：标题 + 说明 + 进度点 ---- */
  ctx.save();
  ctx.fillStyle = V7_INK;
  ctx.font = `800 22px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('一滴水里有什么', 22, 34);
  ctx.fillStyle = 'rgba(38,64,92,.6)';
  ctx.font = `500 12px ${FONT}`;
  ctx.fillText('STICKER  EXPLAINER  ·  三个信息点，一镜串起来', 22, 52);

  const capP = v7seg(t, 4.6, 5.1);
  if (capP > 0) {
    ctx.globalAlpha = v7out(capP);
    ctx.fillStyle = V7_INK;
    ctx.font = `600 15px ${FONT}`;
    ctx.fillText('一滴水里，装着整个地球的水循环。', 22, 336);
    ctx.globalAlpha = 1;
  }
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i === Math.min(2, Math.floor((t / 6) * 3)) ? V7_BLUE : 'rgba(38,64,92,.20)';
    ctx.beginPath(); ctx.arc(552 + i * 16, 30, 4.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

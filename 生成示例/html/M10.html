<title>M10 把一个抽象概念、一种情绪做成画面 · DeepSeek Harness 生成示例</title>

  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。
  原文“只输出代码”等语句属于素材的一部分，不覆盖本任务的交付合同。

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>M10 · 把一个抽象概念、一种情绪做成画面</h1>
    <p>没有人和物，只有一团缠住的细线和三个字：越缠越紧的「想太多」，慢慢松开成一片平缓的线。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="把一个抽象概念、一种情绪做成画面 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 没有人和物，只有一团缠住的细线和三个字：越缠越紧的「想太多」，慢慢松开成一片平缓的线。
// M10 把一个抽象概念做成画面 · DeepSeek Harness 生成示例
const M10_A = [23, 16, 15], M10_B = [14, 25, 24];
const M10_LINE_A = [122, 59, 52], M10_LINE_B = [127, 167, 155];
const M10_TEXT_A = [238, 226, 210], M10_TEXT_B = [233, 242, 236];

function m10p(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function m10mix(a, b, k) {
  return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
}
function m10rgb(c, al) {
  return 'rgba(' + Math.round(clamp(c[0], 0, 255)) + ',' + Math.round(clamp(c[1], 0, 255)) + ',' + Math.round(clamp(c[2], 0, 255)) + ',' + al + ')';
}

// 每条线两个状态：缠住 / 松开；都在文件加载时算好
const M10_LINES = (() => {
  const r = rng(1013);
  return Array.from({ length: 44 }, (_, i) => {
    const row = i / 43;
    const tangled = [], calm = [];
    const cy = 60 + row * 240;
    for (let k = 0; k < 6; k++) {
      const x = 40 + (k / 5) * 560;
      // 缠：挤在中间、上下翻
      tangled.push([
        x + (r() - 0.5) * 40,
        178 + Math.sin(k * 1.7 + i) * (70 - row * 40) + (r() - 0.5) * 46
      ]);
      // 松：一排很缓的波
      calm.push([
        x,
        cy + Math.sin(k * 0.9 + i * 0.22) * 7
      ]);
    }
    return { tangled, calm, delay: r() * 0.9, alpha: 0.22 + r() * 0.45, w: 0.7 + r() * 1.1 };
  });
})();

function drawScene(t) {
  // 全片：0 缠住 → 1 松开（缓慢、一次到底）
  const k = smooth(clamp((t - 0.4) / 4.4, 0, 1));
  const bg = m10mix(M10_A, M10_B, k);
  const lc = m10mix(M10_LINE_A, M10_LINE_B, k);
  const tc = m10mix(M10_TEXT_A, M10_TEXT_B, k);

  ctx.fillStyle = m10rgb(bg, 1);
  ctx.fillRect(0, 0, W, H);

  // 极轻的一团中心光，缠得越紧越暗
  const g = ctx.createRadialGradient(320, 186, 20, 320, 186, 340);
  g.addColorStop(0, m10rgb(lc, 0.10 * (1 - k) + 0.04));
  g.addColorStop(1, m10rgb(lc, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 44 根细线：错开地松开来
  for (let i = 0; i < M10_LINES.length; i++) {
    const L = M10_LINES[i];
    const local = smooth(clamp((t - 0.5 - L.delay * 1.7) / 3.4, 0, 1));
    const wob = Math.sin(t * 1.7 + i) * (1 - local) * 9;
    ctx.save();
    ctx.strokeStyle = m10rgb(lc, L.alpha * (0.7 + 0.3 * local));
    ctx.lineWidth = lerp(L.w, L.w * 0.8, local);
    ctx.lineCap = 'round';
    ctx.beginPath();
    let px = 0, py = 0;
    for (let j = 0; j < 6; j++) {
      const x = lerp(L.tangled[j][0], L.calm[j][0], local);
      const y = lerp(L.tangled[j][1], L.calm[j][1], local) + wob * Math.sin(j * 1.3 + i);
      if (j === 0) { ctx.moveTo(x, y); px = x; py = y; }
      else {
        const x2 = x, y2 = y;
        ctx.quadraticCurveTo((px + x2) / 2, (py + y2) / 2 + (1 - local) * 10, x2, y2);
        px = x2; py = y2;
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  // 三个字：先散着，再站到一条线上
  const chars = ['想', '太', '多'];
  const baseY = 196;
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.font = `800 52px ${FONT}`;
  ctx.textAlign = 'center';
  const startX = [252, 320, 388];
  chars.forEach((ch, i) => {
    const jx = Math.sin(i * 2.3 + 1) * 26 * (1 - k) + Math.sin(t * 3.1 + i * 1.7) * 5 * (1 - k);
    const jy = Math.cos(i * 1.9 + 0.6) * 22 * (1 - k) + Math.sin(t * 2.6 + i) * 4 * (1 - k);
    const rot = (0.16 - i * 0.1) * (1 - k);
    ctx.save();
    ctx.translate(startX[i] + jx, baseY + jy);
    ctx.rotate(rot);
    ctx.globalAlpha = 0.55 + 0.45 * k;
    // 字后面的细线影，像想太多时的重影
    if (k < 0.85) {
      ctx.globalAlpha = 0.16 * (1 - k);
      ctx.fillStyle = m10rgb(lc, 1);
      ctx.fillText(ch, 3.5, 2.5);
      ctx.globalAlpha = 0.55 + 0.45 * k;
    }
    ctx.fillStyle = m10rgb(tc, 1);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  });
  ctx.restore();

  // 底部一行：从“缠住”到“松开一点”
  if (t < 2.9) {
    const p = m10p(t, 0.5, 1.1) * (1 - m10p(t, 2.5, 2.9));
    if (p > 0) {
      ctx.save(); ctx.globalAlpha = p * 0.9;
      ctx.fillStyle = m10rgb(tc, 1);
      ctx.font = `400 14px ${FONT}`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('同一件事，想了十七遍', 48, 328);
      ctx.restore();
    }
  } else {
    const p = m10p(t, 3.9, 4.6);
    if (p > 0) {
      ctx.save(); ctx.globalAlpha = p * 0.95;
      ctx.fillStyle = m10rgb(tc, 1);
      ctx.font = `400 14px ${FONT}`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('松开一点，就看得见了', 48, 328);
      ctx.restore();
    }
  }

  // 角落小标记
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = m10rgb(tc, 1);
  ctx.font = `500 13px ${FONT}`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('一种情绪 · 两种状态', 596, 40);
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>

<body>
<div id="app">
  <div id="head">
    <h1>M21 · 原理拆解（它是怎么工作的）</h1>
    <p>蓝图上把一台小机器拆成四段：定时、抓取、筛选、提醒，每步的产物就是下一步的输入。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="原理拆解（它是怎么工作的） 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 蓝图上把一台小机器拆成四段：定时、抓取、筛选、提醒，每步的产物就是下一步的输入。
// M21 原理拆解（它是怎么工作的） · DeepSeek Harness 生成示例
const M21_BG = '#0b1a2a', M21_CYAN = '#6fd3e8', M21_LINE = 'rgba(111,211,232,.32)', M21_WARM = '#ffb347', M21_PAPER = '#dfeaf2';

function m21p(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

const M21_STEPS = [
  { name: '定时', note: '每天 8:00', icon: 'clock' },
  { name: '抓取', note: '把页面拉下来', icon: 'scan' },
  { name: '筛选', note: '只留要的那几条', icon: 'filter' },
  { name: '提醒', note: '推到你手机上', icon: 'bell' }
];

function m21bg() {
  ctx.fillStyle = M21_BG; ctx.fillRect(0, 0, W, H);
  // 蓝图网格
  ctx.strokeStyle = 'rgba(111,211,232,.07)'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 20) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 20) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(111,211,232,.14)';
  for (let x = 0; x <= W; x += 100) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 100) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
  const g = ctx.createRadialGradient(320, 170, 40, 320, 190, 420);
  g.addColorStop(0, 'rgba(20,48,70,.2)');
  g.addColorStop(1, 'rgba(4,10,18,.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// 一个"模块"：正面 + 顶面，像拆开的零件
function m21module(cx, cy, w, h, active, step, p) {
  const d = 12;
  ctx.save();
  // 投影
  ctx.fillStyle = 'rgba(2,8,14,.5)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + h / 2 + 8, w * 0.52, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  // 侧面
  ctx.fillStyle = active ? 'rgba(111,211,232,.20)' : 'rgba(111,211,232,.08)';
  ctx.beginPath();
  ctx.moveTo(cx + w / 2, cy - h / 2);
  ctx.lineTo(cx + w / 2 + d, cy - h / 2 - d);
  ctx.lineTo(cx + w / 2 + d, cy + h / 2 - d);
  ctx.lineTo(cx + w / 2, cy + h / 2);
  ctx.closePath(); ctx.fill();
  // 顶面
  ctx.beginPath();
  ctx.moveTo(cx - w / 2 + d, cy - h / 2 - d);
  ctx.lineTo(cx + w / 2 + d, cy - h / 2 - d);
  ctx.lineTo(cx + w / 2, cy - h / 2);
  ctx.lineTo(cx - w / 2, cy - h / 2);
  ctx.closePath();
  ctx.fillStyle = active ? 'rgba(111,211,232,.30)' : 'rgba(111,211,232,.13)';
  ctx.fill();
  // 正面
  ctx.fillStyle = active ? 'rgba(13,42,60,.96)' : 'rgba(10,32,48,.94)';
  ctx.strokeStyle = active ? M21_CYAN : M21_LINE;
  ctx.lineWidth = active ? 2 : 1.4;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(cx - w / 2, cy - h / 2, w, h, 6); else ctx.rect(cx - w / 2, cy - h / 2, w, h);
  ctx.fill(); ctx.stroke();

  // 编号与名字
  ctx.fillStyle = active ? M21_CYAN : 'rgba(111,211,232,.6)';
  ctx.font = `600 13px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('0' + step, cx - w / 2 + 10, cy - h / 2 + 18);
  ctx.fillStyle = active ? M21_PAPER : 'rgba(223,234,242,.72)';
  ctx.font = `700 18px ${FONT}`;
  ctx.fillText(M21_STEPS[step - 1].name, cx - w / 2 + 10, cy - h / 2 + 40);

  // 图标
  const ix = cx + 24, iy = cy + 14;
  ctx.strokeStyle = active ? M21_WARM : 'rgba(255,179,71,.45)';
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  const ic = M21_STEPS[step - 1].icon;
  if (ic === 'clock') {
    ctx.beginPath(); ctx.arc(ix, iy, 13, 0, Math.PI * 2); ctx.stroke();
    const a = active ? -Math.PI / 2 + (p % 1) * Math.PI * 2 : -Math.PI / 2 + 0.9;
    ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(ix + Math.cos(a) * 9, iy + Math.sin(a) * 9); ctx.stroke();
  } else if (ic === 'scan') {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(ix - 14, iy - 11, 28, 22, 3); else ctx.rect(ix - 14, iy - 11, 28, 22);
    ctx.stroke();
    const sy = iy - 11 + 22 * ((p * 1.6) % 1);
    ctx.strokeStyle = active ? M21_WARM : 'rgba(255,179,71,.3)';
    ctx.beginPath(); ctx.moveTo(ix - 14, sy); ctx.lineTo(ix + 14, sy); ctx.stroke();
  } else if (ic === 'filter') {
    ctx.beginPath();
    ctx.moveTo(ix - 13, iy - 10); ctx.lineTo(ix + 13, iy - 10);
    ctx.lineTo(ix + 3, iy + 2); ctx.lineTo(ix + 3, iy + 11);
    ctx.lineTo(ix - 3, iy + 8); ctx.lineTo(ix - 3, iy + 2);
    ctx.closePath(); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(ix, iy + 2, 11, Math.PI * 0.15, Math.PI * 0.85, true);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(ix, iy + 14, 2.4, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

function m21chip(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = M21_PAPER;
  ctx.strokeStyle = M21_CYAN; ctx.lineWidth = 1.4;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-7 * s, -5 * s, 14 * s, 10 * s, 2); else ctx.rect(-7 * s, -5 * s, 14 * s, 10 * s);
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = M21_CYAN; ctx.lineWidth = 1.2;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(i * 4 * s, -5 * s); ctx.lineTo(i * 4 * s, -8 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i * 4 * s, 5 * s); ctx.lineTo(i * 4 * s, 8 * s); ctx.stroke();
  }
  ctx.restore();
}

function drawScene(t) {
  m21bg();

  // 镜头：一开始就整条都在，最后轻轻拉远
  const camS = 1 - 0.05 * smooth(clamp((t - 4.6) / 1.4, 0, 1));
  ctx.save();
  ctx.translate(320, 180); ctx.scale(camS, camS); ctx.translate(-320, -180);

  // 标题
  ctx.save();
  ctx.fillStyle = M21_PAPER;
  ctx.font = `800 26px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('它是怎么工作的', 44, 56);
  ctx.fillStyle = 'rgba(111,211,232,.75)';
  ctx.font = `500 13px ${FONT}`;
  ctx.fillText('一条线拆成四步 · 上一步的产物就是下一步的输入', 44, 76);
  ctx.restore();

  const cx0 = 120, gap = 135, cy = 196;
  // 管道
  for (let i = 0; i < 3; i++) {
    const x1 = cx0 + i * gap + 46, x2 = cx0 + (i + 1) * gap - 46;
    const on = m21p(t, -0.4 + i * 0.12, 0.4 + i * 0.12);
    ctx.save();
    ctx.globalAlpha = clamp(on * 1.2, 0, 1);
    ctx.strokeStyle = 'rgba(111,211,232,.5)'; ctx.lineWidth = 2;
    ctx.setLineDash([7, 6]);
    ctx.beginPath();
    ctx.moveTo(x1, cy); ctx.lineTo(x1 + (x2 - x1) * 1, cy);
    ctx.stroke();
    ctx.setLineDash([]);
    // 箭头
    ctx.fillStyle = 'rgba(111,211,232,.6)';
    ctx.beginPath(); ctx.moveTo(x2, cy); ctx.lineTo(x2 - 9, cy - 5); ctx.lineTo(x2 - 9, cy + 5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 四个模块：一个接一个亮起来
  for (let i = 0; i < 4; i++) {
    const idx = i + 1;
    const active = t >= -0.35 + i * 1.35 && t < -0.35 + (i + 1) * 1.35;
    const appear = 1 - Math.pow(1 - m21p(t, -0.55 + i * 0.1, -0.1 + i * 0.1), 3);
    ctx.save();
    ctx.globalAlpha = appear;
    ctx.translate(0, (1 - appear) * 14);
    m21module(cx0 + i * gap, cy, 96, 96, active, idx, (t + 0.35 - i * 1.35) / 1.35);
    // 说明
    ctx.fillStyle = 'rgba(223,234,242,' + (active ? 0.95 : 0.55) + ')';
    ctx.font = `400 13px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(M21_STEPS[i].note, cx0 + i * gap, cy + 72);
    ctx.restore();
  }

  // 小芯片：沿着流水线走
  const flow = m21p(t, 0.5, 5.4) * 3;
  const seg = Math.min(2, Math.floor(flow));
  const f = clamp(flow - seg, 0, 1);
  const chx = cx0 + seg * gap + (gap - 0) * smooth(f);
  const chy = cy - 58;
  if (t > 0.4) {
    ctx.save();
    // 芯片在上方一条线里走
    ctx.strokeStyle = 'rgba(255,179,71,.40)'; ctx.lineWidth = 1.2;
    ctx.setLineDash([3, 6]);
    ctx.beginPath(); ctx.moveTo(cx0, chy); ctx.lineTo(cx0 + 3 * gap, chy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    m21chip(chx, chy, 1.5);
    // 落下来的引线
    ctx.save();
    ctx.strokeStyle = 'rgba(255,179,71,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(chx, chy + 8); ctx.lineTo(chx, cy - 48); ctx.stroke();
    ctx.restore();
  }

  // 结尾：整条线连成一个环
  const lp = m21p(t, 5.0, 5.6);
  if (lp > 0) {
    ctx.save();
    ctx.globalAlpha = lp * 0.8;
    ctx.strokeStyle = M21_WARM; ctx.lineWidth = 1.6;
    ctx.setLineDash([5, 6]);
    ctx.beginPath();
    ctx.moveTo(cx0 + 3 * gap + 48, cy + 30);
    ctx.bezierCurveTo(cx0 + 3 * gap + 90, cy + 92, cx0 - 60, cy + 92, cx0 - 48, cy + 30);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = M21_WARM;
    ctx.beginPath();
    ctx.moveTo(cx0 - 48, cy + 26); ctx.lineTo(cx0 - 54, cy + 38); ctx.lineTo(cx0 - 42, cy + 38);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = M21_WARM;
    ctx.font = `500 13px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('第二天，从头再来一次', cx0 + gap * 1.5, cy + 92);
    ctx.restore();
  }

  ctx.restore();

  // 右下角小字（避开署名区）
  ctx.save();
  ctx.fillStyle = 'rgba(111,211,232,.5)';
  ctx.font = `500 13px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('原理拆解 · 四步', 44, 336);
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H6 Capsule · DeepSeek Harness 生成示例</title>
<!--

  不是原作者样片，也不是原项目演示；仅用于风格挑选预览。共享的只有时间轴、
  尺寸、导出接口与页脚署名，画面与动作按本风格重新设计。

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>H6 · Capsule</h1>
    <p>奶油纸上的胶囊排版：糖果色胶囊一层层撑开，衬线标题「一颗想法」在胶囊里慢慢发酵。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="Capsule 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 奶油纸上的胶囊排版：糖果色胶囊一层层撑开，衬线标题「一颗想法」在胶囊里慢慢发酵。
// H6 Capsule · DeepSeek Harness 生成示例
const H6_CREAM = '#fbf1e0', H6_INK = '#3b2f33', H6_PINK = '#f6a9c0';
const H6_MINT = '#9fdcc3', H6_LEMON = '#ffe08a', H6_LAV = '#c7b3ec', H6_MUTED = '#8a7a76';
const H6_SERIF = '"Bodoni 72","Didot","Songti SC","STSong",Georgia,serif';
const H6_DOTS = (() => {
  const r = rng(606);
  return Array.from({ length: 46 }, () => ({
    x: 18 + r() * 604, y: 18 + r() * 288, r: 1.4 + r() * 3.2,
    c: [H6_PINK, H6_MINT, H6_LEMON, H6_LAV][Math.floor(r() * 4)],
    at: 0.3 + r() * 2.4,
  }));
})();
const H6_BUBBLES = (() => {
  const r = rng(66);
  return Array.from({ length: 5 }, () => ({ x: 320 + r() * 72, y0: r(), r: 2 + r() * 3.4, sp: 0.35 + r() * 0.5 }));
})();

function h6seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function h6ease(t) { return 1 - Math.pow(1 - t, 3); }
function h6pop(p) { // 轻柔回弹
  if (p <= 0) return 0;
  if (p >= 1) return 1;
  return 1 + 0.22 * Math.sin(p * Math.PI) * (1 - p);
}
function h6track(text, x, y, gap, size, weight, color, align) {
  ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color;
  let total = 0; for (const ch of text) total += ctx.measureText(ch).width + gap;
  total -= gap;
  let cx = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
  ctx.textAlign = 'left';
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + gap; }
  ctx.restore();
}
function h6capsule(x, y, w, h, fill, p, shadow) {
  if (p <= 0) return;
  const cx = x + w / 2, cy = y + h / 2;
  const ww = w * h6pop(clamp(p, 0, 1)), hh = h;
  ctx.save();
  if (shadow) { ctx.fillStyle = 'rgba(59,47,51,.10)'; ctx.beginPath(); ctx.ellipse(cx, y + hh + 7, ww * 0.44, 5, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(cx - ww / 2, cy - hh / 2, ww, hh, hh / 2);
  else { ctx.arc(cx - ww / 2 + hh / 2, cy, hh / 2, Math.PI / 2, Math.PI * 1.5); ctx.arc(cx + ww / 2 - hh / 2, cy, hh / 2, -Math.PI / 2, Math.PI / 2); }
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = H6_INK; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.restore();
}

function h6mix(a, b, u) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  return 'rgb(' + Math.round(lerp((pa >> 16) & 255, (pb >> 16) & 255, u)) + ',' +
    Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, u)) + ',' +
    Math.round(lerp(pa & 255, pb & 255, u)) + ')';
}

function drawScene(t) {
  // 奶油纸色调极缓呼吸
  const bu = 0.5 - 0.5 * Math.cos(t * Math.PI * 2 / 6);
  ctx.fillStyle = h6mix(H6_CREAM, '#f6e7cf', bu * 0.9); ctx.fillRect(0, 0, W, H);
  // 极轻视差
  ctx.save();
  ctx.translate(Math.sin(t * 0.75) * 2, Math.cos(t * 0.5) * 1.5);
  // 极淡的纸面斑驳
  ctx.save();
  for (let i = 0; i < 60; i++) {
    const x = (i * 97) % W, y = (i * 53) % H;
    ctx.fillStyle = 'rgba(150,120,90,.035)'; ctx.fillRect(x, y, 3, 3);
  }
  ctx.restore();

  // 页眉
  h6track('CAPSULE / 慢发酵', 56, 46, 2, 10, 700, H6_MUTED);
  h6track('NO.06', 584, 46, 2, 10, 700, H6_MUTED, 'right');
  ctx.save(); ctx.strokeStyle = 'rgba(59,47,51,.22)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(56, 56); ctx.lineTo(584, 56); ctx.stroke(); ctx.restore();

  // 背景大圆
  ctx.save();
  ctx.globalAlpha = 0.30; ctx.fillStyle = H6_MINT;
  ctx.beginPath(); ctx.arc(92 + Math.sin(t * 0.6) * 14, 112 + Math.cos(t * 0.45) * 8, 54, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.22; ctx.fillStyle = H6_LEMON;
  ctx.beginPath(); ctx.arc(600 + Math.sin(t * 0.5 + 1) * 10, 300 + Math.cos(t * 0.4) * 12, 46, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 散点糖果
  H6_DOTS.forEach(d => {
    const p = h6ease(h6seg(t, d.at, d.at + 0.35));
    if (p <= 0) return;
    ctx.save(); ctx.globalAlpha = 0.85 * p;
    ctx.fillStyle = d.c;
    ctx.beginPath();
    ctx.arc(d.x + Math.sin(t * 0.6 + d.at) * 2.4, d.y + Math.cos(t * 0.45 + d.at) * 2.4, d.r * p, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 主胶囊
  const mp = h6seg(t, -0.35, 0.65);
  h6capsule(56, 84, 356, 112, '#fff8ec', mp, true);
  // 胶囊内标题
  const tp = h6seg(t, -0.4, 0.35);
  if (tp > 0) {
    ctx.save(); ctx.globalAlpha = h6ease(tp);
    ctx.fillStyle = H6_INK; ctx.font = `italic 700 44px ${H6_SERIF}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('一颗想法', 86, 148);
    ctx.fillStyle = '#d97f9c'; ctx.font = `italic 400 14px ${H6_SERIF}`;
    ctx.fillText('a small idea, kept warm', 88, 174);
    ctx.restore();
  }
  // 主胶囊里的小气泡：慢慢往上冒
  if (mp > 0.6) {
    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(56, 84, 356, 112, 56); else ctx.rect(56, 84, 356, 112);
    ctx.clip();
    H6_BUBBLES.forEach(b => {
      const rise = ((t * b.sp + b.y0) % 1);
      const y = 188 - rise * 92;
      ctx.globalAlpha = 0.5 * Math.sin(rise * Math.PI);
      ctx.strokeStyle = H6_INK; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(b.x, y, b.r, 0, Math.PI * 2); ctx.stroke();
    });
    ctx.restore();
  }

  // 粉色小胶囊
  const sp = h6seg(t, 0.95, 1.75);
  const floatY = Math.sin(t * 1.55) * 3.2;
  h6capsule(250, 218 + floatY, 326, 74, H6_PINK, sp, true);
  const sp2 = h6seg(t, 1.45, 2.05);
  if (sp2 > 0) {
    ctx.save(); ctx.globalAlpha = h6ease(sp2);
    ctx.fillStyle = H6_INK; ctx.font = `italic 700 28px ${H6_SERIF}`; ctx.textAlign = 'center';
    ctx.fillText('慢慢成形', 413, 264 + floatY);
    ctx.restore();
  }

  // 右侧三颗小胶囊
  const pills = [
    [470, 84, 104, 32, H6_MINT, '收集'],
    [470, 124, 104, 32, H6_LEMON, '发酵'],
    [470, 164, 104, 32, H6_LAV, '取出'],
  ];
  pills.forEach((p, i) => {
    const pp = h6seg(t, 1.35 + i * 0.28, 1.85 + i * 0.28);
    if (pp <= 0) return;
    const bob = Math.sin(t * 1.7 + i * 1.3) * 1.6;
    h6capsule(p[0], p[1] + bob, p[2], p[3], p[4], pp, false);
    ctx.save(); ctx.globalAlpha = h6ease(pp);
    ctx.fillStyle = H6_INK; ctx.font = `600 13px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p[5], p[0] + p[2] / 2, p[1] + p[3] / 2 + 1 + bob);
    ctx.restore();
  });

  // 说明
  const capP = h6seg(t, 2.35, 2.95);
  if (capP > 0) {
    ctx.save(); ctx.globalAlpha = h6ease(capP);
    ctx.fillStyle = H6_MUTED; ctx.font = `400 14px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText('把念头收进胶囊，等它自己长大。', 56, 316);
    ctx.strokeStyle = 'rgba(59,47,51,.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(56, 327); ctx.lineTo(56 + 240 * h6ease(capP), 327); ctx.stroke();
    ctx.restore();
  }

  // 右下角小字（避开署名区）
  h6track('640 × 360 · 6S LOOP', 584, 316, 1.4, 8, 600, 'rgba(138,122,118,.75)', 'right');

  // 小印章
  const markP = h6ease(h6seg(t, 2.9, 3.3));
  if (markP > 0) {
    ctx.save(); ctx.globalAlpha = markP;
    ctx.translate(418, 306); ctx.rotate(-0.08);
    ctx.strokeStyle = H6_INK; ctx.lineWidth = 1.3;
    ctx.strokeRect(-21, -13, 42, 26);
    ctx.fillStyle = H6_INK; ctx.font = `400 12px ${H6_SERIF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('开盖', 0, 1);
    ctx.restore();
  }

  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>

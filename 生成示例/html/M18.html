<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0c0c10; color: #e9e9ee;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 20px; }
  #stage { width: min(94vw, 1000px); aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #head, #ui { width: min(94vw, 1000px); }
  #head h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #head p { margin: 0; font-size: 12px; line-height: 1.5; color: #9a9aa8; }
  #ui { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ui button { background: #1d1d26; color: #f2f2f6; border: 1px solid #343444;
    border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #ui button:hover { background: #272734; }
  #ui input[type=range] { flex: 1 1 220px; min-width: 150px; accent-color: #7c8cff; }
  #clock { font-variant-numeric: tabular-nums; font-size: 12px; color: #a9a9ba; min-width: 78px; }
  #credit { width: min(94vw, 1000px); font-size: 11px; line-height: 1.6; color: #6f6f80; }
  #credit b { color: #9c9cae; font-weight: 500; }
  body.export, body.export #app { display: block; width: 640px; height: 360px; min-height: 0;
    padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.export #stage { width: 640px; height: 360px; box-shadow: none; }
  body.export #head, body.export #ui, body.export #credit { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>M18 · 数学/科学讲解（3Blue1Brown 那种）</h1>
    <p>深色黑板风：正弦曲线一笔笔画出来，切点带着切线一路滑，切线的斜率跟着变，公式在最后成形。</p>
  </div>
  <div id="stage"><canvas id="c" width="640" height="360" aria-label="数学/科学讲解（3Blue1Brown 那种） 风格动画示例"></canvas></div>
  <div id="ui">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="6" step="0.01" value="0" aria-label="时间轴">
    <span id="clock">0.00 / 6.00s</span>
  </div>
  <div id="credit">
    <b>DeepSeek Harness 生成示例</b>（非原项目样片）· 来源：来自俯仰观照博主的动画画风整理 ·
    许可：upstream-custom-noncommercial（俯仰观照整理稿，非商业） · 画面与文字均由代码绘制，静音。
  </div>
</div>
<script>
(() => {
  'use strict';
  // ===== 共享脚手架（可改，但导出合同不要破坏）=================================
  const W = 640, H = 360, DURATION = 6;
  const EXPORT = new URLSearchParams(location.search).get('export') === '1';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ===== 场景（每个 ID 独立设计；下面的注释区由构建器替换）===================
  // DESC: 深色黑板风：正弦曲线一笔笔画出来，切点带着切线一路滑，切线的斜率跟着变，公式在最后成形。
// M18 数学/科学讲解（3Blue1Brown 那种） · DeepSeek Harness 生成示例
const M18_BG = '#0d1016', M18_CREAM = '#e9e3d3', M18_BLUE = '#58c4dd', M18_GOLD = '#f0c040', M18_GREY = '#7c8697';
const M18_MATH = 'Georgia, "Times New Roman", "Songti SC", serif';

function m18p(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function m18f(x) { return 230 - 92 * Math.sin((x - 320) / 74); }
function m18d(x) { return -92 * Math.cos((x - 320) / 74) / 74; }

function m18axes(p) {
  // 坐标轴
  ctx.save();
  ctx.globalAlpha = clamp(p * 1.4, 0, 1);
  ctx.strokeStyle = 'rgba(233,227,211,.55)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(70, 230.5); ctx.lineTo(562, 230.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(320, 78); ctx.lineTo(320, 306); ctx.stroke();
  // 箭头
  ctx.fillStyle = 'rgba(233,227,211,.55)';
  ctx.beginPath(); ctx.moveTo(568, 230.5); ctx.lineTo(558, 226); ctx.lineTo(558, 235); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(320, 72); ctx.lineTo(315.5, 82); ctx.lineTo(324.5, 82); ctx.closePath(); ctx.fill();
  // 刻度
  ctx.strokeStyle = 'rgba(233,227,211,.28)'; ctx.lineWidth = 1;
  for (let i = -3; i <= 3; i++) {
    if (i === 0) continue;
    const x = 320 + i * 74;
    ctx.beginPath(); ctx.moveTo(x, 226); ctx.lineTo(x, 234); ctx.stroke();
  }
  // 网格
  ctx.strokeStyle = 'rgba(233,227,211,.055)'; ctx.lineWidth = 1;
  for (let i = -4; i <= 4; i++) {
    const x = 320 + i * 74;
    ctx.beginPath(); ctx.moveTo(x, 78); ctx.lineTo(x, 306); ctx.stroke();
  }
  for (let i = -2; i <= 2; i++) {
    const y = 230 - i * 92;
    ctx.beginPath(); ctx.moveTo(70, y); ctx.lineTo(562, y); ctx.stroke();
  }
  ctx.restore();
}

function drawScene(t) {
  ctx.fillStyle = M18_BG; ctx.fillRect(0, 0, W, H);
  // 黑板的一点不均匀的光
  const bg = ctx.createRadialGradient(320, 150, 40, 320, 180, 460);
  bg.addColorStop(0, 'rgba(40,52,66,.55)');
  bg.addColorStop(1, 'rgba(10,12,16,0)');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  m18axes(m18p(t, -0.5, 0.12));

  // 曲线：一笔一笔画出来
  const cp = 1 - Math.pow(1 - m18p(t, -0.18, 1.3), 2);
  if (cp > 0) {
    ctx.save();
    ctx.strokeStyle = M18_BLUE;
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const xEnd = lerp(74, 560, cp);
    for (let x = 74; x <= xEnd; x += 2) {
      const y = m18f(x);
      if (x === 74) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // 画到的笔尖
    if (cp < 0.999) {
      ctx.fillStyle = M18_BLUE;
      ctx.beginPath(); ctx.arc(xEnd, m18f(xEnd), 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // 切点：从左边滑到右边
  const tp = m18p(t, 1.35, 5.5);
  const x0 = lerp(150, 500, smooth(tp));
  if (cp > 0.35 && t > 1.2) {
    const y0 = m18f(x0);
    const k = m18d(x0);

    // 切线与割线的小三角形
    ctx.save();
    ctx.strokeStyle = M18_GOLD;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x0 - 110, y0 - k * 110);
    ctx.lineTo(x0 + 110, y0 + k * 110);
    ctx.stroke();

    // 斜率三角形：dx = 44
    const dx = 44, dy = k * dx;
    ctx.strokeStyle = 'rgba(240,192,64,.75)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0 + dx, y0);
    ctx.lineTo(x0 + dx, y0 + dy);
    ctx.stroke();
    ctx.fillStyle = 'rgba(240,192,64,.14)';
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x0 + dx, y0); ctx.lineTo(x0 + dx, y0 + dy); ctx.closePath(); ctx.fill();

    // 垂线
    ctx.strokeStyle = 'rgba(233,227,211,.28)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, 230); ctx.stroke();

    // 点
    ctx.fillStyle = M18_CREAM;
    ctx.beginPath(); ctx.arc(x0, y0, 5.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = M18_BLUE; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x0, y0, 9.5, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    // 右侧读数：斜率
    ctx.save();
    ctx.font = `500 15px "SF Mono", Menlo, monospace`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = M18_GREY;
    ctx.fillText('斜率', 438, 108);
    ctx.fillStyle = M18_GOLD;
    ctx.font = `600 22px "SF Mono", Menlo, monospace`;
    ctx.fillText((-k).toFixed(2), 486, 108);
    ctx.restore();
  }

  // 公式：先出现 f(x) = sin x，最后换成导数
  const fp = m18p(t, 0.3, 1.0);
  if (fp > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(fp * 1.3, 0, 1);
    ctx.font = `italic 27px ${M18_MATH}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = M18_BLUE;
    ctx.fillText('f(x) = sin x', 84, 62);
    if (t > 4.4) {
      ctx.globalAlpha = clamp((t - 4.4) / 0.5, 0, 1);
      ctx.font = `italic 27px ${M18_MATH}`;
      ctx.fillStyle = M18_GOLD;
      ctx.fillText("f '(x) = cos x", 300, 62);
    }
    ctx.restore();
  }

  // 中文说明
  const np = m18p(t, 4.9, 5.5);
  if (np > 0) {
    ctx.save();
    ctx.globalAlpha = np;
    ctx.fillStyle = M18_CREAM;
    ctx.font = `500 18px ${FONT}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('切点每挪一点，切线的斜率就变一点', 84, 326);
    ctx.restore();
  }

  // 左上角标识
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = M18_GREY;
  ctx.font = `500 13px ${FONT}`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('一步一步，推到看得懂', 580, 40);
  ctx.restore();
}

  // ===== 共享渲染与署名 =======================================================
  function watermark() {
    const text = 'DeepSeek Harness 生成示例';
    ctx.save();
    ctx.font = '11px ' + FONT;
    const w = ctx.measureText(text).width + 14;
    const x = W - w - 8, y = H - 24;
    ctx.fillStyle = 'rgba(0,0,0,.46)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, 18, 4); else ctx.rect(x, y, w, 18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 7, y + 9.5);
    ctx.restore();
  }

  function paint(t) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    try { drawScene(t); } catch (err) { console.error(err); }
    ctx.restore();
    watermark();
  }

  function renderAt(seconds) {
    const t = ((Number(seconds) % DURATION) + DURATION) % DURATION;
    paint(t);
    syncUI(t);
    return t;
  }
  window.renderAt = renderAt;

  // ===== 播放、控制、减少动态 =================================================
  const playBtn = document.getElementById('play');
  const timeline = document.getElementById('timeline');
  const clock = document.getElementById('clock');
  let playing = false, base = 0, start = 0, current = 0;
  let animationFrame = 0;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function syncUI(t) {
    if (EXPORT) return;
    current = t;
    if (timeline) timeline.value = String(t.toFixed(2));
    if (clock) clock.textContent = t.toFixed(2) + ' / ' + DURATION.toFixed(2) + 's';
  }
  function frame(now) {
    animationFrame = 0;
    if (!playing) return;
    const t = ((now - start) / 1000 + base) % DURATION;
    paint(t);
    syncUI(t);
    animationFrame = requestAnimationFrame(frame);
  }
  function play() {
    if (playing) return;
    playing = true;
    start = performance.now();
    base = current;
    if (playBtn) playBtn.textContent = '暂停';
    animationFrame = requestAnimationFrame(frame);
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (playBtn) playBtn.textContent = '播放';
  }
  if (playBtn) playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('replay')?.addEventListener('click', () => {
    base = 0; start = performance.now(); paint(0); syncUI(0); play();
  });
  timeline?.addEventListener('input', () => {
    pause(); paint(Number(timeline.value)); syncUI(Number(timeline.value));
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') { base = 0; start = performance.now(); paint(0); syncUI(0); play(); }
  });

  if (EXPORT) {
    document.body.classList.add('export');
    renderAt(0);
  } else if (reduced) {
    renderAt(2.4);
    pause();
  } else {
    renderAt(0);
    play();
  }
})();
</script>
</body>
</html>
